 tu_rim_ev.1.t:0 "원석의 땅"
 tu_rim_ev.1.d:0 "갱도 입구에서 교대하는 광부들이 기침을 한다. 회사 깃발 아래 광석 열차가 쉬지 않고 달린다."
 tu_rim_ev.1.a:0 "더 깊이 판다."
 tu_rim_ev.1.b:0 "광부부터 돌본다."
 tu_rim_ev.20.t:0 "광부 조합 결성"
 tu_rim_ev.20.d:0 "광부들이 조합을 만들고 회사에 요구서를 냈다."
 tu_rim_ev.20.a:0 "요구를 받아들인다."
 tu_rim_ev.20.b:0 "회사 편을 든다."
 tu_rim_ev.21.t:0 "광산 파업"
 tu_rim_ev.21.d:0 "감염된 광부들이 갱도에서 나오기를 거부한다."
 tu_rim_ev.21.a:0 "요구를 들어준다."
 tu_rim_ev.21.b:0 "경비대를 보낸다."
 tu_rim_ev.22.t:0 "집단 감염"
 tu_rim_ev.22.d:0 "한 광산 마을에서 광석병이 한꺼번에 번졌다."
 tu_rim_ev.22.a:0 "마을을 봉쇄한다."
 tu_rim_ev.22.b:0 "의료진을 보낸다."
 TU_RIM_ore_80_tt:0 "§G광석§! +80"
 tu_rim_ev.23.t:0 "새 광맥"
 tu_rim_ev.23.d:0 "지질 조사단이 엄청난 원석 광맥을 찾았다."
 tu_rim_ev.23.a:0 "즉시 판다."
 tu_rim_ev.24.t:0 "갱도 붕괴"
 tu_rim_ev.24.d:0 "갱도 하나가 무너져 광부들이 갇혔다."
 tu_rim_ev.24.a:0 "구조에 나선다."
 tu_rim_ev.24.b:0 "갱도를 버린다."
 tu_rim_ev.25.t:0 "피난민 행렬"
 tu_rim_ev.25.d:0 "감염자 피난민들이 국경에 몰려왔다."
 tu_rim_ev.25.a:0 "받아들인다."
 tu_rim_ev.25.b:0 "돌려보낸다."
 tu_rim_ev.26.t:0 "약탈자 습격"
