 TU_YAN_idea_sui_devour:0 "모든 것을 삼키는 쉐이"
 TU_YAN_idea_sui_devour_desc:0 "쉐이는 이제 염국을 넘어 대지 전체를 삼키려 한다."
 TU_YAN_idea_hand_in_hand:0 "손에 손잡고"
