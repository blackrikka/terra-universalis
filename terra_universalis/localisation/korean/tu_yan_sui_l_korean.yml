 TU_YAN_p1_nian_forge:0 "대장간의 불"
 TU_YAN_p1_nian_forge_desc:0 "니엔의 대장간은 밤에도 불이 꺼지지 않는다."
 TU_YAN_p1_nian_craft:0 "명장의 솜씨"
 TU_YAN_p1_nian_craft_desc:0 "명장의 망치 아래에서 쇠가 무기가 된다."
 TU_YAN_p1_jun_coin:0 "금과 은의 흐름"
 TU_YAN_p1_jun_coin_desc:0 "쥔의 손을 거치면 돈이 돌기 시작한다."
 TU_YAN_p1_jun_merchant:0 "상인의 길"
