 TU_YAN_p1_chongyue_way:0 "무인의 도"
 TU_YAN_p1_chongyue_way_desc:0 "총웨가 무인의 도를 다시 세운다. 병사들은 싸우는 법보다 지키는 법을 먼저 배운다."
 TU_YAN_p1_chongyue_duty:0 "맏형의 책임"
 TU_YAN_p1_chongyue_duty_desc:0 "맏형은 떠난 동생들의 몫까지 짊어진다."
 TU_YAN_p1_ling_poem:0 "취중의 시"
 TU_YAN_p1_ling_poem_desc:0 "링이 술잔을 들고 시를 읊으면 백성들이 따라 부른다."
 TU_YAN_p1_ling_dream:0 "꿈의 정원"
 TU_YAN_p1_ling_dream_desc:0 "링의 아츠가 꿈과 현실의 경계를 흐린다. 정원에 앉은 이들은 근심을 잊는다."
 TU_YAN_p1_wang_stars:0 "천문을 살피다"
 TU_YAN_p1_wang_stars_desc:0 "왕이 별을 읽어 때를 가늠한다."
 TU_YAN_p1_wang_far:0 "멀리 내다보다"
 TU_YAN_p1_wang_far_desc:0 "열 수 앞을 내다보는 형제는 서두르지 않는다."
 TU_YAN_p1_dusk_painting:0 "그림 속의 세계"
 TU_YAN_p1_dusk_painting_desc:0 "더스크의 그림 속에는 또 하나의 산하가 있다."
 TU_YAN_p1_dusk_canvas:0 "화폭 밖으로"
 TU_YAN_p1_dusk_canvas_desc:0 "그림 속의 것들이 화폭 밖으로 걸어 나온다."
 TU_YAN_p1_shu_fields:0 "들판의 풍요"
