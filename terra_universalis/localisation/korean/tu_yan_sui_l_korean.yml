 TU_YAN_p1_path_of_ruin:0 "파멸의 길로..."
 TU_YAN_p1_path_of_ruin_desc:0 "어느 형제도 염국을 하나로 묶지 못했다. 형제들이 흩어진 틈으로, 잠들어 있던 쉐이가 몸을 일으킨다."
 TU_YAN_p1_ruin_awaken:0 "쉐이의 각성"
 TU_YAN_p1_ruin_awaken_desc:0 "쉐이가 완전히 깨어났다. 형제들의 이름은 이제 쉐이의 일부일 뿐이다."
 TU_YAN_p1_hand_in_hand:0 "손에 손잡고"
 TU_YAN_p1_hand_in_hand_desc:0 "갈라섰던 형제들이 다시 한자리에 모였다. 맏형 종예가 내민 손을 모두가 잡았다."
 TU_YAN_p1_twelve_feast:0 "열두 형제의 잔치"
 TU_YAN_p1_twelve_feast_desc:0 "위가 차린 식탁에 열두 형제가 둘러앉았다."
