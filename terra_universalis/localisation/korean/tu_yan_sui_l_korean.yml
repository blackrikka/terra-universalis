 TU_YAN_p1_fang_walls:0 "성벽의 수호자"
 TU_YAN_p1_fang_walls_desc:0 "팡은 성벽을 쌓는 일을 누구에게도 맡기지 않는다."
 TU_YAN_p1_fang_stand:0 "물러서지 않는다"
