 tu_yan_dragon.1.t:0 "용의 시대"
 tu_yan_dragon.1.d:0 "형제 회의가 무너지고 열두 형제가 염국을 나눠 가졌다. 염국 조정은 누구를 중심으로 뭉칠 것인가? 고른 형제의 나라가 우리 나라가 되고, 나머지 형제들은 각자 나라를 세워 우리와 싸운다."
 tu_yan_dragon.1.a:0 "형제라도 물러설 수 없다."
 tu_yan_dragon.2.t:0 "염국 내전"
 tu_yan_dragon.2.d:0 "염국의 쉐이 열두 형제가 나라를 나눠 서로 전쟁을 시작했다. 동쪽의 거대한 나라가 열두 조각으로 갈라졌다."
 tu_yan_dragon.2.a:0 "용들이 싸우는구나."
 tu_yan_dragon.3.t:0 "손에 손잡고"
 tu_yan_dragon.3.d:0 "전쟁에서 이긴 종예는 형제들을 벌하지 않았다. 굴복시킨 형제들을 다시 놓아준 뒤, 이번에는 스스로 돌아오기를 청했다. 갈라섰던 형제들이 하나둘 그 손을 잡았다."
 tu_yan_dragon.3.a:0 "다시 함께."
 TU_YAN_sibling_category:0 "쉐이 형제"
 TU_YAN_sibling_category_desc:0 "종예는 갈라선 형제들을 다시 부르려 한다. 굴복시킨 형제를 놓아주면 그들이 스스로 돌아올지도 모른다."
 TU_YAN_free_sibling:0 "형제를 놓아주다"
 TU_YAN_free_sibling_desc:0 "괴뢰로 묶어 둔 형제 분파를 다시 독립시킨다."
 TU_YAN_hand_in_hand_decision:0 "손에 손잡고"
 TU_YAN_hand_in_hand_decision_desc:0 "놓아준 형제들에게 돌아오라고 청한다. 모든 분파가 염국에 합쳐지고 그 땅은 우리의 핵심주가 된다."
