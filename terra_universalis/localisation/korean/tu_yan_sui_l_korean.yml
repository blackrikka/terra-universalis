 TU_YAN_p1_jie_harbor:0 "나루터의 수호"
 TU_YAN_p1_jie_harbor_desc:0 "강을 건너는 나루터를 지켜 군대의 길을 연다."
 TU_YAN_p1_ji_wind:0 "하늘의 바람"
 TU_YAN_p1_ji_wind_desc:0 "바람을 타는 형제는 하늘을 두려워하지 않는다."
 TU_YAN_p1_ji_cloud:0 "구름 위의 눈"
