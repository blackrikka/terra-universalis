 TU_YAN_sibling_council:0 "쉐이 형제 회의"
 TU_YAN_sui_true:0 "쉐이"
 TU_YAN_sui_true_desc:0 "거대한 쉐이 본체. 형제들이 갈라지기 전의 모습이다."
 TU_YAN_p1_depose_root:0 "황제 축출"
 TU_YAN_p1_depose_root_desc:0 "우리는 황제를 몰아내고 새로운 지도자를 뽑아야 할 때입니다."
 TU_YAN_p1_sui_seize:0 "쉐이 집권"
 TU_YAN_p1_sui_seize_desc:0 "황제가 물러난 자리에 쉐이 형제들이 앉았다. 형제 회의가 염국을 다스린다."
 TU_YAN_p1_power_struggle:0 "권력 다툼"
 TU_YAN_p1_power_struggle_desc:0 "형제 회의는 오래가지 못했다. 열두 형제는 저마다 염국의 앞날을 다르게 그린다."
 TU_YAN_p1_age_of_dragons:0 "용의 시대"
 TU_YAN_p1_age_of_dragons_desc:0 "말로는 끝나지 않았다. 형제 몇이 자기 땅을 들고 염국을 떠나 칼을 겨눈다. 내전이 시작된다."
 TU_YAN_p1_rule_chongyue:0 "총웨 집권"
 TU_YAN_p1_rule_chongyue_desc:0 "쉐이 형제 총웨(이)가 갈라진 염국을 이끈다. 분파로 떠난 형제는 고를 수 없다."
