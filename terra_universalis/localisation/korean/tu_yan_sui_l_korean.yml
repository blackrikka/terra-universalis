l_korean:
 TU_YAN_idea_imperial_protection:0 "황제께서 우리를 지켜주시리라"
 TU_YAN_idea_imperial_protection_desc:0 "황실을 향한 믿음이 조정을 하나로 묶는다. 황제 일가 지지도가 매주 0.1 오르고 다른 이념은 매주 0.5 내려간다."
 TU_YAN_idea_depose:0 "새 지도자를 뽑을 때"
 TU_YAN_idea_depose_desc:0 "우리는 황제를 몰아내고 새로운 지도자를 뽑아야 할 때입니다. 황제 일가 지지도가 매주 0.5 내려가고 쉐이 지지도가 매주 0.5 오른다."
 TU_YAN_idea_power_struggle:0 "형제 간의 권력 다툼"
 TU_YAN_idea_power_struggle_desc:0 "쉐이 형제들이 서로 다른 길을 고집하며 조정이 갈라졌다."
 TU_YAN_idea_age_of_dragons:0 "용의 시대"
 TU_YAN_idea_age_of_dragons_desc:0 "형제들이 칼을 뽑았다. 염국의 주인은 싸움으로 정해진다."
 TU_YAN_idea_rule_chongyue:0 "총웨의 치세"
 TU_YAN_idea_rule_chongyue_desc:0 "쉐이 형제 총웨(이)가 염국을 이끈다."
 TU_YAN_idea_rule_ling:0 "링의 치세"
