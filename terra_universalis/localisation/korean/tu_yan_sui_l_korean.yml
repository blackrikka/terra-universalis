 tu_yan_dragon.1.nian:0 "니엔에게 염국을 맡긴다."
 tu_yan_dragon.1.jun:0 "쥔에게 염국을 맡긴다."
 tu_yan_dragon.1.jie:0 "지에에게 염국을 맡긴다."
 tu_yan_dragon.1.ji:0 "지에게 염국을 맡긴다."
 tu_yan_dragon.1.yi:0 "이에게 염국을 맡긴다."
 tu_yan_dragon.1.fang:0 "팡에게 염국을 맡긴다."
 tu_yan_dragon.1.yu:0 "위에게 염국을 맡긴다."
 tu_yan_dragon.1.ruin:0 "누구도 아니다. 쉐이가 깨어날 것이다."
 TU_YAN_p1_dragons_end:0 "용의 시대의 끝"
 TU_YAN_p1_dragons_end_desc:0 "형제들의 전쟁이 끝났다. 더 이상 염국에 칼을 겨누는 형제는 없다. (형제 분파와의 전쟁이 모두 끝나야 한다)"
 TU_YAN_p1_new_era:0 "새 시대의 염국"
 TU_YAN_p1_new_era_desc:0 "용의 시대를 지나 염국은 새로운 시대를 맞는다."
 TU_YAN_idea_new_era:0 "새 시대의 염국"
 TU_YAN_idea_new_era_desc:0 "형제들의 다툼은 끝났다. 염국은 다시 하나로 움직인다."
