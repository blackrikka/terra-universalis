l_korean:
 TU_SAM_sacred_forest:0 "성스러운 숲"
 TU_SAM_sacred_forest_desc:0 "숲은 사미를 지키지만, 나무 한 그루 베는 것도 허락을 받아야 한다."
 TU_SAM_scattered_tribes:0 "흩어진 부족"
 TU_SAM_scattered_tribes_desc:0 "부족들은 저마다의 숲에서 산다."
 TU_SAM_forest_theocracy:0 "숲의 신정"
 TU_SAM_forest_theocracy_desc:0 "무녀들이 숲의 뜻으로 다스린다. (숲의 은총 80 이상)"
 TU_SAM_tribal_federation:0 "사미 부족 연방"
 TU_SAM_tribal_federation_desc:0 "모든 부족이 하나의 연방이 된다. (부족 회의 3번)"
 TU_SAM_open_sami:0 "열린 사미"
 TU_SAM_open_sami_desc:0 "사미는 숲 밖으로 나간다. (바깥과의 접촉 60 이상)"
 TU_SAM_spirit_warriors:0 "정령 전사단"
 TU_SAM_spirit_warriors_desc:0 ""
 TU_SAM_forest_wrath:0 "숲의 분노"
 TU_SAM_forest_wrath_desc:0 "은총을 잃은 숲이 사미를 외면한다. 은총이 40 이상이 되면 사라진다."
 TU_SAM_spirit_bear:0 "곰 정령과의 계약"
 TU_SAM_spirit_bear_desc:0 "곰 정령이 사미와 함께한다. 매달 숲의 은총 -1."
 TU_SAM_spirit_wolf:0 "늑대 정령과의 계약"
 TU_SAM_spirit_wolf_desc:0 "늑대 정령이 사미와 함께한다. 매달 숲의 은총 -1."
 TU_SAM_spirit_raven:0 "까마귀 정령과의 계약"
 TU_SAM_spirit_raven_desc:0 "까마귀 정령이 사미와 함께한다. 매달 숲의 은총 -1."
 TU_SAM_spirit_reindeer:0 "순록 정령과의 계약"
 TU_SAM_spirit_reindeer_desc:0 "순록 정령이 사미와 함께한다. 매달 숲의 은총 -1."
 TU_SAM_root:0 "숲의 수호자"
 TU_SAM_root_desc:0 "눈과 숲의 땅. 무녀들은 정령의 목소리를 듣고, 부족들은 숲의 허락 아래 산다."
