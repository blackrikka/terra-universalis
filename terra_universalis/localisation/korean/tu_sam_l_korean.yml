 tu_sam_ev.1.t:0 "숲의 목소리"
 tu_sam_ev.1.d:0 "무녀가 숲에서 돌아와 말했다. 정령들이 바깥 사람들의 발소리를 듣고 있다고."
 tu_sam_ev.1.a:0 "숲을 지킨다."
 tu_sam_ev.1.b:0 "바깥을 살펴본다."
 tu_sam_ev.20.t:0 "숲의 분노"
 tu_sam_ev.20.d:0 "눈보라가 그치지 않고, 사냥감이 사라졌다. 무녀들은 숲이 화났다고 한다."
 tu_sam_ev.20.a:0 "제물을 바친다."
 tu_sam_ev.20.b:0 "견딘다."
 tu_sam_ev.21.t:0 "숲이 누그러지다"
 tu_sam_ev.21.d:0 "숲의 은총이 돌아오자 눈보라가 걷혔다."
 tu_sam_ev.21.a:0 "감사를."
 tu_sam_ev.22.t:0 "우르수스 개척민"
 tu_sam_ev.22.d:0 "우르수스 개척민들이 숲 가장자리에 마을을 세웠다."
 tu_sam_ev.22.a:0 "쫓아낸다."
 tu_sam_ev.22.b:0 "교역한다."
 tu_sam_ev.22.c:0 "숲에 맡긴다."
 tu_sam_ev.23.t:0 "카시미어 상인"
 tu_sam_ev.23.d:0 "카시미어 상인들이 모피를 사러 왔다."
 tu_sam_ev.23.a:0 "판다."
 tu_sam_ev.24.t:0 "정령의 출현"
 tu_sam_ev.24.d:0 "거대한 정령이 마을 앞에 나타났다가 사라졌다."
 tu_sam_ev.24.a:0 "길조다."
 tu_sam_ev.25.t:0 "부족 간 다툼"
 tu_sam_ev.25.d:0 "두 부족이 사냥터를 두고 다툰다."
 tu_sam_ev.25.a:0 "중재한다."
 tu_sam_ev.25.b:0 "내버려 둔다."
 tu_sam_ev.26.t:0 "극야"
 tu_sam_ev.26.d:0 "해가 뜨지 않는 겨울이 왔다. 무녀들은 오로라 아래서 의례를 연다."
 tu_sam_ev.26.a:0 "의례에 참여한다."
 TU_SAM_grace_3_tt:0 "§G숲의 은총§! +3"
 tu_sam_ev.27.t:0 "외국 학자의 방문"
 tu_sam_ev.27.d:0 "외국 학자가 정령 아츠를 배우고 싶어 한다."
 tu_sam_ev.27.a:0 "가르친다."
 tu_sam_ev.27.b:0 "거절한다."
 tu_sam_ev.28.t:0 "숲의 신정"
 tu_sam_ev.28.d:0 "무녀들이 사미를 이끈다."
 tu_sam_ev.28.a:0 "숲의 뜻대로."
 tu_sam_ev.29.t:0 "사미 부족 연방"
 tu_sam_ev.29.d:0 "모든 부족이 한자리에 모였다."
 tu_sam_ev.29.a:0 "하나의 사미."
 tu_sam_ev.30.t:0 "열린 사미"
 tu_sam_ev.30.d:0 "사미의 젊은이들이 바깥 세계로 떠난다."
 tu_sam_ev.30.a:0 "세상을 향해."
 tu_sam_ev.31.t:0 "늑대 무리의 습격"
 tu_sam_ev.31.d:0 "굶주린 늑대 무리가 순록 떼를 덮쳤다."
 tu_sam_ev.31.a:0 "사냥꾼을 보낸다."
 tu_sam_ev.32.t:0 "숲에서 길을 잃은 군대"
 tu_sam_ev.32.d:0 "숲에 들어온 외국 부대가 길을 잃고 헤매다 돌아갔다."
 tu_sam_ev.32.a:0 "숲이 지켜 주었다."
