l_korean:
 TU_URS_w3_kaz_entry:0 "카시미어 접촉"
 TU_URS_w3_kaz_entry_desc:0 "기사 경기의 나라 카시미어와 처음으로 연락한다. 정치력이 조금 늘어난다."
 TU_URS_w3_kaz_envoy:0 "기사단 사절단"
 TU_URS_w3_kaz_envoy_desc:0 "카시미어에 사절단을 보내 관계를 다진다. 관계가 좋아지고 정치력이 늘어난다."
 TU_URS_w3_kaz_claims:0 "카시미어 영유권 주장"
 TU_URS_w3_kaz_claims_desc:0 "카시미어 주들에 우르수스의 권리를 선언한다. 전쟁 지지도가 오른다."
 TU_URS_w3_kaz_trade:0 "상업 협정 체결"
 TU_URS_w3_kaz_trade_desc:0 "카시미어 상업연합회와 불가침 협정을 맺는다. 정치력이 늘어난다."
 TU_URS_w3_kaz_wargoal:0 "카시미어 전쟁 명분"
 TU_URS_w3_kaz_wargoal_desc:0 "주장한 영토를 되찾기 위한 전쟁 목표를 세운다."
 TU_URS_w3_kaz_access:0 "통행권 협상"
 TU_URS_w3_kaz_access_desc:0 "카시미어 영토의 군사 통행권을 얻는다. 정치력이 늘어난다."
 TU_URS_w3_kaz_offensive:0 "은창 페가수스 출진"
 TU_URS_w3_kaz_offensive_desc:0 "기동 타격대를 전선에 보내 육군 경험치를 쌓는다. 전쟁 지지도가 조금 오른다."
 TU_URS_w3_kaz_guarantee:0 "카시미어 보장 조약"
 TU_URS_w3_kaz_guarantee_desc:0 "카시미어의 독립을 보장하는 조약을 맺는다. 황제의 재가가 필요하다. 정치력이 크게 늘어난다."
 TU_URS_w3_kaz_annex:0 "카시미어 강제 편입 조약"
 TU_URS_w3_kaz_annex_desc:0 "무력 앞에서 카시미어의 항복을 받아낸다. 육군 경험치와 인력이 늘어난다."
 TU_URS_w3_kaz_protectorate:0 "카시미어 보호령"
 TU_URS_w3_kaz_protectorate_desc:0 "카시미어를 보호령으로 편입한다. 안정도가 오르고 전용 아이디어를 얻는다."
 TU_URS_w3_kaz_occupation:0 "카시미어 점령 행정"
 TU_URS_w3_kaz_occupation_desc:0 "점령한 카시미어 주들을 행정 체제에 묶는다. 육군 경험치가 오르고 안정도는 떨어진다."
 TU_URS_w3_kje_entry:0 "쉐라그 접촉"
 TU_URS_w3_kje_entry_desc:0 "산맥의 나라 쉐라그와 연락 통로를 연다. 정치력이 조금 늘어난다."
 TU_URS_w3_kje_pact:0 "산맥 불가침 조약"
 TU_URS_w3_kje_pact_desc:0 "쉐라그와 불가침 조약을 맺어 국경을 안정시킨다. 정치력이 늘어난다."
 TU_URS_w3_kje_claims:0 "산맥 영유권 주장"
 TU_URS_w3_kje_claims_desc:0 "쉐라그 산맥 주들에 대한 권리를 선언한다. 전쟁 지지도가 조금 오른다. 황제 친정이 필요하다."
 TU_URS_w3_kje_trade:0 "쉐라그 교역로"
 TU_URS_w3_kje_trade_desc:0 "산맥을 넘는 교역로를 연다. 정치력이 크게 늘고 교역로 아이디어를 얻는다."
 TU_URS_w3_kje_wargoal:0 "산맥 전쟁 명분"
 TU_URS_w3_kje_wargoal_desc:0 "주장한 산맥 주들을 차지할 전쟁 목표를 세운다."
 TU_URS_w3_kje_access:0 "산길 통행권"
 TU_URS_w3_kje_access_desc:0 "쉐라그 산길의 군사 통행권을 얻는다. 정치력이 늘어난다."
 TU_URS_w3_kje_offensive:0 "산맥 돌파 작전"
 TU_URS_w3_kje_offensive_desc:0 "산악 부대를 투입해 쉐라그 산맥을 돌파한다. 육군 경험치와 인력을 얻는다. 군부 독재 노선이 필요하다."
 TU_URS_w3_kje_union:0 "쉐라그 연합 보장"
 TU_URS_w3_kje_union_desc:0 "쉐라그와 방위 보장 조약을 맺는다. 산악 수비대 아이디어를 얻는다."
 TU_URS_w3_kje_occupation:0 "산맥 점령 주둔"
 TU_URS_w3_kje_occupation_desc:0 "점령한 산맥 주들에 주둔군을 세운다. 육군 경험치와 인력이 늘어난다."
 TU_URS_w3_sami_entry:0 "사미 접촉"
 TU_URS_w3_sami_entry_desc:0 "툰드라의 생존자 사미와 처음으로 연락한다. 정치력이 조금 늘어난다."
 TU_URS_w3_sami_aid:0 "사미 구호 물자"
 TU_URS_w3_sami_aid_desc:0 "얼음벌판의 사미 주민에게 식량과 의약품을 보낸다. 관계가 좋아지고 안정도가 조금 오른다."
 TU_URS_w3_sami_annex_plan:0 "사미 영토 계획"
 TU_URS_w3_sami_annex_plan_desc:0 "사미의 설원을 우르수스 영토로 편입하는 계획을 세운다. 전쟁 지지도가 오른다. 군부 독재 노선이 필요하다."
 TU_URS_w3_sami_ski:0 "설원 스키 보병대"
 TU_URS_w3_sami_ski_desc:0 "사미의 스키 보병을 편성한다. 전용 아이디어를 얻고 육군 경험치가 오른다."
 TU_URS_w3_sami_puppet:0 "사미 괴뢰화 명분"
 TU_URS_w3_sami_puppet_desc:0 "사미를 괴뢰국으로 만들 전쟁 목표를 세운다."
 TU_URS_w3_sami_protocol:0 "사미 통행 협정"
 TU_URS_w3_sami_protocol_desc:0 "사미 설원의 군사 통행권을 얻는다. 정치력이 늘어난다."
 TU_URS_w3_sami_control:0 "설원 점령 통제"
 TU_URS_w3_sami_control_desc:0 "사미 설원의 주들을 점령해 통제한다. 육군 경험치와 전쟁 지지도가 오른다."
 TU_URS_w3_sami_autonomy:0 "사미 자치 보장"
 TU_URS_w3_sami_autonomy_desc:0 "사미 자치구를 보장하는 조약을 맺는다. 정치력과 안정도가 오른다."
 TU_URS_w3_sami_administration:0 "설원 행정 체제"
 TU_URS_w3_sami_administration_desc:0 "점령한 설원을 행정 체제에 편입한다. 전용 아이디어와 인력을 얻는다."
 TU_URS_w3_infi_entry:0 "인피 빙원 탐사 개시"
 TU_URS_w3_infi_entry_desc:0 "인피 빙원 북부의 미지 영역을 탐사할 준비를 한다. 정치력이 늘어난다."
 TU_URS_w3_infi_survey:0 "빙원 측량 연구"
 TU_URS_w3_infi_survey_desc:0 "빙원의 지형을 측량한다. 전자 기술 보너스를 얻고 정치력이 늘어난다."
 TU_URS_w3_infi_drilling:0 "빙원 시추"
 TU_URS_w3_infi_drilling_desc:0 "빙원 아래의 자원을 시추한다. 핵심 영토 중 한 주에서 텅스텐이 나온다."
 TU_URS_w3_infi_cold_lab:0 "극저온 연구소"
 TU_URS_w3_infi_cold_lab_desc:0 "극저온 환경에서 버티는 장비를 연구한다. 전용 아이디어를 얻고 정치력이 늘어난다."
 TU_URS_w3_infi_mining:0 "빙하 광산"
 TU_URS_w3_infi_mining_desc:0 "핵심 영토 중 한 주에서 알루미늄이 나온다."
 TU_URS_w3_infi_frost_gear:0 "빙원 방한 장비"
 TU_URS_w3_infi_frost_gear_desc:0 "병사들에게 방한 장비를 보급한다. 혹한에 따른 소모가 줄고 육군 경험치가 오른다. 개혁파 노선이 필요하다."
 TU_URS_w3_infi_pipeline:0 "빙하 수송로"
 TU_URS_w3_infi_pipeline_desc:0 "빙하를 가로지르는 수송로를 놓는다. 보급 소모가 줄고 정치력이 늘어난다."
 TU_URS_w3_infi_polar_theory:0 "극지 전술 이론"
 TU_URS_w3_infi_polar_theory_desc:0 "극지 전술 이론을 정리해 육군 교리 연구를 돕는다. 연구 보너스를 얻는다."
 TU_URS_w3_infi_mine_vein:0 "지하 광맥"
 TU_URS_w3_infi_mine_vein_desc:0 "핵심 영토 중 한 주에서 강철이 나온다. 정치력이 늘어난다."
 TU_URS_w3_infi_arctic_expedition:0 "북극 원정"
 TU_URS_w3_infi_arctic_expedition_desc:0 "북극 원정대를 꾸린다. 육군 경험치와 정치력을 얻는다."
 TU_URS_w3_infi_resource_mobilization:0 "빙원 자원 총동원"
 TU_URS_w3_infi_resource_mobilization_desc:0 "핵심 영토 중 한 주에서 석유가 나온다. 전쟁 지지도가 조금 오른다."
 TU_URS_w3_infi_survey_station:0 "빙원 관측소"
 TU_URS_w3_infi_survey_station_desc:0 "빙원에 관측소를 세운다. 정치력과 안정도가 조금 오른다."
 TU_URS_w3_infi_ice_wall:0 "얼음 성벽"
 TU_URS_w3_infi_ice_wall_desc:0 "빙원 가장자리에 얼음 성벽을 세운다. 육군 경험치와 인력이 늘어난다."
 TU_URS_w3_infi_final_report:0 "인피 빙원 종합 보고서"
 TU_URS_w3_infi_final_report_desc:0 "인피 빙원 탐사를 마무리하는 보고서를 올린다. 정치력과 안정도가 크게 오른다."
 TU_URS_w3_infi_survey_bonus:0 "빙원 측량 보너스"
 TU_URS_w3_infi_polar_bonus:0 "극지 전술 보너스"
 TU_URS_w4_northern_pact:0 "북방 협약"
 TU_URS_w4_pact_entry:0 "북방 협약 구상"
 TU_URS_w4_pact_entry_desc:0 "북쪽 나라들을 묶는 협약을 구상한다. 정치력이 늘어난다."
 TU_URS_alliance_search:0 "동맹 탐색"
 TU_URS_alliance_search_desc:0 "다른 나라와 동맹을 맺을 길을 열어 둔다. 정치력이 늘어난다."
 TU_URS_w4_pact_charter:0 "북방 협약 결성"
 TU_URS_w4_pact_charter_desc:0 "북방 협약을 세우고 가까운 나라들을 가입시킨다. 아직 진영이 없는 이웃은 자동으로 들어온다."
 TU_URS_w4_pact_neutral:0 "동토 중립 협정"
 TU_URS_w4_pact_neutral_desc:0 "협약을 세우지 않고 이웃과 불가침 조약만 맺는다. 안정도가 조금 오른다."
 TU_URS_w4_pact_defence:0 "협약 방위선"
 TU_URS_w4_pact_defence_desc:0 "협약 가입국끼리 방위를 나눈다. 북방 결속 아이디어를 얻는다."
 TU_URS_w4_pact_army:0 "협약 합동 훈련"
 TU_URS_w4_pact_army_desc:0 "협약 가입국과 합동 훈련을 한다. 육군 경험치와 인력이 늘어난다."
 TU_URS_w4_pact_summit:0 "북방 정상회담"
 TU_URS_w4_pact_summit_desc:0 "북방 지도자들이 모인다. 정치력과 안정도가 오른다."
 TU_URS_w4_pact_trade:0 "북방 교역 협정"
 TU_URS_w4_pact_trade_desc:0 "협약 가입국과의 교역을 연다. 정치력과 안정도가 오른다."
 TU_URS_w4_pact_common_army:0 "협약 공동군"
 TU_URS_w4_pact_common_army_desc:0 "협약 가입국과 공동군을 편성한다. 육군 경험치와 전쟁 지지도가 오른다. 군부 독재 노선이 필요하다."
 TU_URS_w4_pact_secretariat:0 "협약 사무국"
 TU_URS_w4_pact_secretariat_desc:0 "협약의 사무국을 세운다. 정치력과 안정도가 늘어난다. 개혁파 노선이 필요하다."
 TU_URS_w4_order_entry:0 "테라 질서 구상"
 TU_URS_w4_order_entry_desc:0 "테라 전체의 질서를 세울 방향을 정한다. 정치력이 늘어난다."
 TU_URS_w4_order_doctrine:0 "질서의 무력 교리"
 TU_URS_w4_order_doctrine_desc:0 "무력으로 질서를 세우는 교리를 정립한다. 전쟁 지지도와 육군 경험치가 오른다. 황제 친정이 필요하다."
 TU_URS_w4_order_council:0 "질서 회의체"
 TU_URS_w4_order_council_desc:0 "여러 나라를 회의체로 묶어 질서를 세운다. 정치력과 안정도가 오른다."
 TU_URS_w4_order_mandate:0 "테라 질서 명령"
 TU_URS_w4_order_mandate_desc:0 "질서를 해치는 나라를 응징할 명령을 내린다. 전용 아이디어를 얻는다."
 TU_URS_w4_order_charter:0 "질서 헌장"
 TU_URS_w4_order_charter_desc:0 "테라 질서 헌장을 공표한다. 정치력이 크게 늘어난다."
 TU_URS_w4_order_enforcement:0 "질서 집행"
 TU_URS_w4_order_enforcement_desc:0 "질서를 거스르는 카즈델에 괴뢰화 전쟁 목표를 세운다. 군부 독재 노선이 필요하다."
 TU_URS_w4_order_mobilization:0 "전시 질서 동원"
 TU_URS_w4_order_mobilization_desc:0 "질서를 위해 전국을 동원한다. 인력과 전쟁 지지도가 오른다."
 TU_URS_w4_order_hegemony:0 "테라 패권"
 TU_URS_w4_order_hegemony_desc:0 "빅토리아를 굴복시킬 전면전 명분을 세운다. 정치력이 늘어난다."
 TU_URS_w4_rho_entry:0 "로도스 아일랜드 접촉"
 TU_URS_w4_rho_entry_desc:0 "육상함을 이끄는 로도스 아일랜드와 처음으로 연락한다. 정치력이 늘어난다."
 TU_URS_w4_rho_coop:0 "로도스 협력"
 TU_URS_w4_rho_coop_desc:0 "로도스와 협력 관계를 맺는다. 관계가 좋아지고 군사 통행권을 얻는다. 정치력이 늘어난다."
 TU_URS_w4_rho_hostile:0 "로도스 압박"
 TU_URS_w4_rho_hostile_desc:0 "로도스에 강경한 외교 압박을 가한다. 관계가 나빠지고 정치력과 전쟁 지지도가 조금 오른다."
 TU_URS_w4_rho_trade_pact:0 "로도스 상단 협정"
 TU_URS_w4_rho_trade_pact_desc:0 "로도스 상단과 교역 협정을 맺는다. 전용 아이디어를 얻고 정치력이 늘어난다."
 TU_URS_w4_rho_blockade:0 "로도스 봉쇄선"
 TU_URS_w4_rho_blockade_desc:0 "로도스 주변에 봉쇄선을 세운다. 육군 경험치와 전쟁 지지도가 오른다."
 TU_URS_w4_rho_joint_op:0 "로도스 공동 작전"
 TU_URS_w4_rho_joint_op_desc:0 "로도스와 공동 작전을 펼친다. 보장 조약을 맺고 정치력이 늘어난다."
 TU_URS_w4_reu_entry:0 "리유니온 사태 대응"
 TU_URS_w4_reu_entry_desc:0 "체르노보그 사태 이후 리유니온과 마주한다. 정치력이 늘어난다."
 TU_URS_w4_reu_crush:0 "리유니온 진압"
