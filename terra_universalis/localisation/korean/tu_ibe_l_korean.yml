 tu_ibe_ev.1.t:0 "침묵한 해안"
 tu_ibe_ev.1.d:0 "해안 도시의 창문은 모두 닫혀 있다. 심판관들은 오늘도 바다를 등지고 서서 사람들을 지켜본다."
 tu_ibe_ev.1.a:0 "바다를 경계하라."
 tu_ibe_ev.20.t:0 "심해의 침식"
 tu_ibe_ev.20.d:0 "해안 마을 하나가 하룻밤 사이에 텅 비었다. 남은 것은 바다 냄새와 이상한 발자국뿐이다."
 tu_ibe_ev.20.a:0 "심판관을 보낸다."
 tu_ibe_ev.20.b:0 "마을을 봉쇄한다."
 TU_IBE_threat_5_tt:0 "§R바다의 위협§! +5"
 tu_ibe_ev.21.t:0 "숭배자들의 지하실"
 tu_ibe_ev.21.d:0 "심판관들이 바다를 숭배하는 비밀 집회 장소를 찾아냈다."
 tu_ibe_ev.21.a:0 "모두 체포한다."
 tu_ibe_ev.21.b:0 "감시만 한다."
 tu_ibe_ev.22.t:0 "왕실의 후계자"
 tu_ibe_ev.22.d:0 "오랫동안 숨어 지내던 왕가의 후계자가 모습을 드러냈다."
 tu_ibe_ev.22.a:0 "왕관을 지지한다."
 tu_ibe_ev.22.b:0 "심판소의 판단을 따른다."
 tu_ibe_ev.23.t:0 "바닷가의 이방인"
 tu_ibe_ev.23.d:0 "바닷가에서 이상한 차림의 사냥꾼들을 봤다는 보고가 들어왔다. 그들은 바다의 것들을 사냥한다고 한다."
 tu_ibe_ev.23.a:0 "찾아본다."
 TU_IBE_threat_m15_tt:0 "§R바다의 위협§! -15"
 tu_ibe_ev.25.t:0 "아비살 사냥꾼"
 tu_ibe_ev.25.d:0 "에기르의 사냥꾼들과 만났다. 그들은 바다에서 올라오는 것들과 싸워 왔다고 했다."
 tu_ibe_ev.25.a:0 "협력한다."
 tu_ibe_ev.25.b:0 "의심한다."
 tu_ibe_ev.24.t:0 "라테라노와의 분열"
 tu_ibe_ev.24.d:0 "라테라노 교회는 이베리아 심판소의 방식을 오래전부터 비판해 왔다. 라테라노의 사절이 대화를 청했다."
 tu_ibe_ev.24.a:0 "대화에 응한다."
 tu_ibe_ev.24.b:0 "거절한다."
 tu_ibe_ev.26.t:0 "밀려온 표류물"
 tu_ibe_ev.26.d:0 "해변에 정체를 알 수 없는 생물의 사체가 밀려왔다."
 tu_ibe_ev.26.a:0 "연구한다."
 tu_ibe_ev.26.b:0 "태워 버린다."
 tu_ibe_ev.27.t:0 "어부들의 귀환"
 tu_ibe_ev.27.d:0 "위협이 줄자 어부들이 다시 먼바다로 나가기 시작했다."
 tu_ibe_ev.27.a:0 "좋은 징조다."
 tu_ibe_ev.28.t:0 "심판관의 나라"
 tu_ibe_ev.28.d:0 "심판소가 이베리아의 모든 것을 맡았다."
 tu_ibe_ev.28.a:0 "경계를 늦추지 않는다."
 tu_ibe_ev.29.t:0 "왕관의 부활"
 tu_ibe_ev.29.d:0 "대관식이 열렸다. 이베리아에 다시 왕이 섰다."
 tu_ibe_ev.29.a:0 "국왕 만세!"
 tu_ibe_ev.30.t:0 "바다와의 화해"
 tu_ibe_ev.30.d:0 "이베리아는 바다를 두려워하는 대신 이해하기로 했다."
 tu_ibe_ev.30.a:0 "바다를 향해."
 tu_ibe_ev.31.t:0 "심판관의 과잉 진압"
 tu_ibe_ev.31.d:0 "심판관들이 무고한 어민들을 이단으로 몰았다는 원성이 높다."
 tu_ibe_ev.31.a:0 "심판관을 문책한다."
 tu_ibe_ev.31.b:0 "심판은 옳았다."
