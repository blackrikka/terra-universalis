 tu_ibe_ev.40.t:0 "11월 11일"
 tu_ibe_ev.40.d:0 "해가 저무는 바닷가, 스카디가 한참을 말없이 파도를 보다가 고개를 돌렸다.\n\n\"박사 사랑해\""
 tu_ibe_ev.40.a:0 "뭐...?"
 tu_ibe_ev.40.b:0 "그래, 나도 사랑해"
 tu_ibe_ev.41.t:0 "혈족"
 tu_ibe_ev.41.d:0 "한 달 뒤, 스카디가 다시 바닷가에서 기다리고 있었다. 그런데 그 눈빛이 어딘가 달랐다.\n\n\"자, 박사...나와 혈족이 되자..\""
 tu_ibe_ev.41.a:0 "파도가 발목을 적신다."
