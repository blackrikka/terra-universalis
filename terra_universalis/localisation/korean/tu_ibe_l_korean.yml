l_korean:
 TU_IBE_bop:0 "심판소 대 왕관"
 TU_IBE_bop_desc:0 "대침묵 이후 이베리아를 쥔 것은 심판소다. 잊혀 가던 왕관이 다시 목소리를 낸다."
 TU_IBE_great_silence:0 "대침묵의 상흔"
 TU_IBE_great_silence_desc:0 "바다에서 무언가가 올라왔고, 이베리아의 해안은 침묵했다."
 TU_IBE_fear_of_the_sea:0 "바다의 공포"
 TU_IBE_fear_of_the_sea_desc:0 "어부들은 더 이상 먼바다로 나가지 않는다."
 TU_IBE_watchful_coast:0 "깨어 있는 해안"
 TU_IBE_watchful_coast_desc:0 ""
 TU_IBE_inquisitor_state:0 "심판관의 나라"
 TU_IBE_inquisitor_state_desc:0 "심판소가 이베리아를 영원히 지킨다. (심판소 쪽 세력 균형 2단계 이상)"
 TU_IBE_crown_restored:0 "왕관의 부활"
 TU_IBE_crown_restored_desc:0 "왕이 다시 이베리아를 다스린다. (왕관 쪽 세력 균형 2단계 이상)"
 TU_IBE_sea_reconciliation:0 "바다와의 화해"
 TU_IBE_sea_reconciliation_desc:0 "바다의 것들과 공존할 길을 찾는다. (위협 20 이하, 아비살 사냥꾼과 만나야 함)"
