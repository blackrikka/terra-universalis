 TU_YAN_p1_shu_reign:0 "풍요의 치세"
 TU_YAN_p1_shu_reign_desc:0 "슈의 염국에서는 굶는 이가 없다."
 TU_YAN_idea_rule_shu_2:0 "풍요의 치세"
 TU_YAN_idea_rule_shu_2_desc:0 "슈의 치세가 무르익었다. 슈의 염국에서는 굶는 이가 없다."
 TU_YAN_p1_nian_alloys:0 "새 합금"
