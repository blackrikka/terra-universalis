l_korean:
 TU_YAN_p1_chongyue_halls:0 "무도관"
 TU_YAN_p1_chongyue_halls_desc:0 "성마다 무도관을 열어 젊은이들에게 창과 주먹을 가르친다."
 TU_YAN_p1_chongyue_spear:0 "지키는 창"
 TU_YAN_p1_chongyue_spear_desc:0 "창은 형제의 땅을 지키는 데만 쓴다."
 TU_YAN_p1_chongyue_open_hand:0 "펼친 손바닥"
 TU_YAN_p1_chongyue_open_hand_desc:0 "칼을 거두고 손을 내민다. 떠난 형제들도 돌아올 수 있다."
 TU_YAN_p1_chongyue_reign:0 "무(武)의 치세"
 TU_YAN_p1_chongyue_reign_desc:0 "총웨의 염국은 무예로 서고 무예로 지킨다."
 TU_YAN_idea_rule_chongyue_2:0 "무(武)의 치세"
 TU_YAN_idea_rule_chongyue_2_desc:0 "총웨의 치세가 무르익었다. 총웨의 염국은 무예로 서고 무예로 지킨다."
 TU_YAN_p1_ling_tavern:0 "천하의 주막"
 TU_YAN_p1_ling_tavern_desc:0 "곳곳의 주막이 소식과 민심이 모이는 곳이 된다."
 TU_YAN_p1_ling_wanderer:0 "떠도는 시인"
 TU_YAN_p1_ling_wanderer_desc:0 "링이 직접 길을 떠나 마을마다 민심을 살핀다."
 TU_YAN_p1_ling_dream_army:0 "꿈속의 군세"
 TU_YAN_p1_ling_dream_army_desc:0 "꿈의 정원에서 깨어난 이들이 링을 위해 싸우겠다고 나선다."
 TU_YAN_p1_ling_reign:0 "취선(醉仙)의 치세"
 TU_YAN_p1_ling_reign_desc:0 "술과 시와 꿈. 링의 염국은 느긋하지만 흔들리지 않는다."
 TU_YAN_idea_rule_ling_2:0 "취선(醉仙)의 치세"
 TU_YAN_idea_rule_ling_2_desc:0 "링의 치세가 무르익었다. 술과 시와 꿈. 링의 염국은 느긋하지만 흔들리지 않는다."
 TU_YAN_p1_wang_board:0 "천하라는 바둑판"
 TU_YAN_p1_wang_board_desc:0 "왕에게 천하는 한 판의 바둑이다."
 TU_YAN_p1_wang_academy:0 "관측소와 학당"
 TU_YAN_p1_wang_academy_desc:0 "별을 보는 관측소 옆에 학당을 세운다."
 TU_YAN_p1_wang_records:0 "전장의 기보"
 TU_YAN_p1_wang_records_desc:0 "지난 싸움을 바둑 기보처럼 한 수씩 되짚는다."
 TU_YAN_p1_wang_reign:0 "국수(國手)의 치세"
 TU_YAN_p1_wang_reign_desc:0 "왕의 염국은 언제나 상대보다 한 수 앞에 있다."
 TU_YAN_idea_rule_wang_2:0 "국수(國手)의 치세"
 TU_YAN_idea_rule_wang_2_desc:0 "왕의 치세가 무르익었다. 왕의 염국은 언제나 상대보다 한 수 앞에 있다."
 TU_YAN_p1_dusk_studio:0 "화방 선전국"
 TU_YAN_p1_dusk_studio_desc:0 "그림 한 장이 백 마디 말보다 멀리 간다."
 TU_YAN_p1_dusk_soldiers:0 "화중(畵中) 병사"
 TU_YAN_p1_dusk_soldiers_desc:0 "붓으로 그린 병사들이 전열에 선다."
 TU_YAN_p1_dusk_retreat:0 "그림 속 은거"
 TU_YAN_p1_dusk_retreat_desc:0 "싸움에 지친 이들이 그림 속 마을에서 쉬어 간다."
 TU_YAN_p1_dusk_reign:0 "화폭의 치세"
