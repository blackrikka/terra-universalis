 TU_YAN_p1_yi_horizontal:0 "연횡책"
 TU_YAN_p1_yi_horizontal_desc:0 "강한 쪽과 손잡고 나머지를 하나씩 상대한다."
 TU_YAN_p1_yi_vertical:0 "합종책"
