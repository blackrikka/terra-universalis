 TU_YAN_idea_rule_dusk_2:0 "화폭의 치세"
 TU_YAN_idea_rule_dusk_2_desc:0 "더스크의 치세가 무르익었다. 더스크의 염국은 한 폭의 그림처럼 고요하고 단단하다."
 TU_YAN_p1_shu_canals:0 "관개 수로"
 TU_YAN_p1_shu_canals_desc:0 "마른 땅까지 물길을 낸다."
 TU_YAN_p1_shu_farmer_soldiers:0 "둔전병"
