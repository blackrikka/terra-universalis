 TU_YAN_p1_yi_reign:0 "화친의 치세"
 TU_YAN_p1_yi_reign_desc:0 "이의 염국은 말로 이기고 말로 지킨다."
 TU_YAN_idea_rule_yi_2:0 "화친의 치세"
 TU_YAN_idea_rule_yi_2_desc:0 "이의 치세가 무르익었다. 이의 염국은 말로 이기고 말로 지킨다."
 TU_YAN_p1_fang_passes:0 "철벽 관문"
