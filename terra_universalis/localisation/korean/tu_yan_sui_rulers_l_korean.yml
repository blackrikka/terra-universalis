 TU_YAN_p1_jie_reign:0 "질풍의 치세"
 TU_YAN_p1_jie_reign_desc:0 "지에의 염국은 멈추지 않는다."
 TU_YAN_idea_rule_jie_2:0 "질풍의 치세"
