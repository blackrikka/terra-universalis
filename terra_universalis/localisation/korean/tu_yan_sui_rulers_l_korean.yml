 TU_YAN_p1_ji_reign:0 "창공의 치세"
 TU_YAN_p1_ji_reign_desc:0 "지의 염국의 하늘에는 용의 날개만 난다."
 TU_YAN_idea_rule_ji_2:0 "창공의 치세"
