 TU_YAN_p1_fang_militia:0 "수성 민병"
 TU_YAN_p1_fang_militia_desc:0 "성 안의 백성이 모두 병사가 된다."
 TU_YAN_p1_fang_reign:0 "철옹성의 치세"
 TU_YAN_p1_fang_reign_desc:0 "팡의 염국은 아무도 넘지 못한다."
 TU_YAN_idea_rule_fang_2:0 "철옹성의 치세"
 TU_YAN_idea_rule_fang_2_desc:0 "팡의 치세가 무르익었다. 팡의 염국은 아무도 넘지 못한다."
 TU_YAN_p1_yu_field_kitchens:0 "야전 주방"
