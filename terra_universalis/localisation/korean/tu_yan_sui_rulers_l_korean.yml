 TU_YAN_p1_yu_reign:0 "만찬의 치세"
 TU_YAN_p1_yu_reign_desc:0 "위의 염국에서는 병사도 백성도 배곯지 않는다."
 TU_YAN_idea_rule_yu_2:0 "만찬의 치세"
 TU_YAN_idea_rule_yu_2_desc:0 "위의 치세가 무르익었다. 위의 염국에서는 병사도 백성도 배곯지 않는다."
