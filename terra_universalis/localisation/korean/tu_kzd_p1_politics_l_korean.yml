 TU_KZD_contract_dividend:0 "계약 배당"
 TU_KZD_contract_dividend_desc:0 "계약 수익을 나라와 용병이 나눠 가진다."
 TU_KZD_merc_capital:0 "용병 수도"
 TU_KZD_merc_capital_desc:0 "용병 왕국의 수도를 새로 정한다."
 TU_KZD_merc_seal:0 "용병 인장"
 TU_KZD_merc_seal_desc:0 "용병 왕국의 인장을 새겨 공식 문서에 찍는다."
 TU_KZD_merc_guild_levy:0 "용병 길드 과세"
 TU_KZD_merc_guild_levy_desc:0 "길드 수입에 세금을 매긴다. 효과는 120일 동안 이어지며 정치력 획득이 10% 늘어난다."
 TU_KZD_merc_clan_council:0 "사르카즈 씨족 회의"
 TU_KZD_merc_clan_council_desc:0 "씨족장들이 모여 정책을 정한다. 한 번만 열 수 있다."
 TU_KZD_merc_recruit_proclaim:0 "용병 모집 포고"
 TU_KZD_merc_recruit_proclaim_desc:0 "용병을 모집하는 포고를 내려 인력 1만을 얻는다. 다시 쓰려면 기다려야 한다."
 TU_KZD_merc_pay_bonus:0 "성과급 지급"
 TU_KZD_merc_pay_bonus_desc:0 "전투에 나선 용병에게 성과급을 준다. 60일 동안 공격력이 오른다."
 TU_KZD_merc_insurance:0 "전쟁 보험 계약"
 TU_KZD_merc_insurance_desc:0 "전쟁 중 계약 용병의 손실을 보험으로 메운다. 180일 동안 전쟁 지지가 오른다."
 TU_KZD_merc_guild_charter_revision:0 "용병 길드 헌장 개정"
 TU_KZD_merc_guild_charter_revision_desc:0 "길드 헌장을 고쳐 정치력 획득과 안정도를 함께 높인다. 한 번만 할 수 있다."
 TU_KZD_merc_black_banner:0 "검은 깃발 임대"
 TU_KZD_merc_black_banner_desc:0 "전쟁 중 검은 깃발 용병단을 임대한다. 90일 동안 전쟁 지지와 경험치가 늘어난다."
 TU_KZD_merc_veterans_pension:0 "퇴역 용병 연금"
 TU_KZD_merc_veterans_pension_desc:0 "퇴역 용병에게 연금을 지급한다. 사기가 오르고 민심이 조금 안정된다."
 TU_KZD_merc_war_profit:0 "전시 계약 특수"
 TU_KZD_merc_war_profit_desc:0 "전쟁 중 계약이 몰린다. 120일 동안 정치력 획득이 15% 늘지만 안정도가 떨어진다."
 TU_KZD_merc_reserve_call:0 "예비 용병 편성"
