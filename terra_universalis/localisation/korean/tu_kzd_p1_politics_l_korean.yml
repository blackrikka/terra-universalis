 TU_KZD_clan_fortress:0 "씨족 요새 축성"
 TU_KZD_clan_fortress_desc:0 "씨족들이 함께 쌓는 요새에 공장 1단계를 세운다."
 TU_KZD_babel_arsenal:0 "바벨 병기고"
