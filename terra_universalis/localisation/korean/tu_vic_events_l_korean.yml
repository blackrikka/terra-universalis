l_korean:
 tu_vic_ev.1.t:0 "공석의 왕좌"
 tu_vic_ev.1.d:0 "시즈 국왕이 자리를 비운 뒤 왕좌는 여전히 비어 있다. 대공들은 회의장에서 서로를 견제하고, 글래스고에서는 아슬란의 이름이 나돌고 있다. 누가 왕관을 쥘지 이제 정해야 한다."
 tu_vic_ev.1.a:0 "대공 회의에 권력을 맡긴다"
 tu_vic_ev.1.b:0 "아슬란의 복위를 준비한다"
 tu_vic_ev.1.c:0 "왕좌를 비워 둔 채 버틴다"
 tu_vic_ev.2.t:0 "대공 회의의 선택"
 tu_vic_ev.2.d:0 "대공 회의가 귀족 자치를 공식 노선으로 택했다. 주요 가문들은 지방 세와 사병을 돌려받는 대가로 중앙 권력을 내놓는다. 귀족의 시대가 이렇게 시작된다."
 tu_vic_ev.2.a:0 "귀족 자치를 공식화한다"
 tu_vic_ev.2.b:0 "가문들과 협상해 조건을 줄인다"
 tu_vic_ev.3.t:0 "글래스고의 왕관"
 tu_vic_ev.3.d:0 "아슬란이 글래스고 광장에서 왕위 복위를 선언했다. 갱단과 교회가 그 뒤에 섰지만 귀족들은 아직 침묵하고 있다. 왕실의 옛 깃발이 다시 항만 위로 올라간다."
 tu_vic_ev.3.a:0 "왕실 의식을 치러 권위를 세운다"
 tu_vic_ev.3.b:0 "갱단의 힘을 빌려 밀어붙인다"
 tu_vic_ev.4.t:0 "타라의 불꽃"
 tu_vic_ev.4.d:0 "타라의 봉기군이 더블린의 불길을 이어받아 불꽃 노선을 선언했다. 거리 행진과 청년단 소집이 시작되었고 온건파는 자리를 잃었다. 이 노선을 어디까지 밀고 갈지 정해야 한다."
 tu_vic_ev.4.a:0 "불꽃 노선을 국가 기조로 받아들인다"
 tu_vic_ev.4.b:0 "온건파를 달래며 속도를 늦춘다"
 tu_vic_ev.5.t:0 "의회의 깃발"
 tu_vic_ev.5.d:0 "의회는 왕실의 공백을 틈타 헌법과 자유 선거의 복원을 요구했다. 런던 거래소와 자유 언론이 그 편에 섰다. 의회 정치가 돌아올지 또 다른 권력 다툼이 될지 가늠해야 한다."
 tu_vic_ev.5.a:0 "의회 노선을 공식화한다"
 tu_vic_ev.5.b:0 "권한을 넘기되 왕실 예우는 남긴다"
 tu_vic_ev.6.t:0 "더블린·타라 봉기"
 tu_vic_ev.6.d:0 "더블린 항만 노동자와 타라 농민이 함께 일어섰다. 봉기군은 세관을 점거하고 관청의 문을 닫았다. 진압할지 협상할지 지금 결정해야 한다."
 tu_vic_ev.6.a:0 "병력을 보내 진압한다"
 tu_vic_ev.6.b:0 "대표단과 협상한다"
 tu_vic_ev.6.c:0 "사태를 방관한다"
 tu_vic_ev.7.t:0 "스팀 나이트 창설식"
 tu_vic_ev.7.d:0 "첫 스팀 나이트 기갑 소대가 수도 광장에서 창설식을 치렀다. 증기 엔진의 굉음이 도시를 뒤흔들었고 시민들이 몰려나와 구경했다. 이 강철 기사단을 어디에 쓸지 정해야 한다."
 tu_vic_ev.7.a:0 "수도 방어에 배치한다"
 tu_vic_ev.7.b:0 "해외 원정 부대로 편성한다"
 tu_vic_ev.8.t:0 "글래스고의 귀환"
 tu_vic_ev.8.d:0 "글래스고 갱단이 도시로 돌아와 항만 길드를 되찾았다. 거리에는 환호와 불안이 함께 흐른다. 갱단과 손을 잡을지 조례로 묶을지 선택해야 한다."
 tu_vic_ev.8.a:0 "갱단과 손을 잡는다"
 tu_vic_ev.8.b:0 "조례로 묶는다"
 tu_vic_ev.9.t:0 "론디니움 수복 명분"
 tu_vic_ev.9.d:0 "카즈델이 론디니움을 점령한 채 버티고 있다. 빅토리아의 법률가와 외교관들은 되찾을 명분을 정리하는 중이다. 공식 요구로 압박할지 무력 수복을 준비할지 정해야 한다."
 tu_vic_ev.9.a:0 "카즈델에 공식 요구를 보낸다"
 tu_vic_ev.9.b:0 "무력 수복을 준비한다"
 tu_vic_ev.10.t:0 "론디니움 개선식"
 tu_vic_ev.10.d:0 "론디니움의 점령지 행정이 자리 잡자 개선식 준비가 시작되었다. 시민들은 되찾은 도시의 깃발을 보며 환호한다. 개선식을 성대하게 치를지 조용히 치를지 정해야 한다."
 tu_vic_ev.10.a:0 "개선식을 성대하게 연다"
 tu_vic_ev.10.b:0 "조용히 치르고 민심을 살핀다"
 tu_vic_ev.11.t:0 "더블린 숙청"
 tu_vic_ev.11.d:0 "드라코 지도자는 더블린의 반대파를 숙청하라 명했다. 체포 명단이 돌고 항만에는 깊은 침묵이 내려앉았다. 공포가 질서를 가져올지 반발을 부를지 판단해야 한다."
 tu_vic_ev.11.a:0 "숙청을 계속한다"
 tu_vic_ev.11.b:0 "숙청을 멈추고 사면한다"
 tu_vic_ev.12.t:0 "자유 언론법"
 tu_vic_ev.12.d:0 "자유 언론법이 공포되자 신문들이 왕실과 대공들의 흥정을 낱낱이 실었다. 가판대마다 사람들이 몰려 기사를 읽는다. 이 소란을 어떻게 다룰지 정해야 한다."
 tu_vic_ev.12.a:0 "언론의 자유를 지킨다"
 tu_vic_ev.12.b:0 "보도를 다듬어 소란을 가라앉힌다"
 tu_vic_ev.13.t:0 "공백 왕좌의 확장 칙령"
 tu_vic_ev.13.d:0 "빈 왕좌의 이름으로 확장 칙령이 선포되었다. 잃어버린 영토를 되찾겠다는 구호에 시민들이 환호한다. 그러나 국고와 군의 준비가 그 말을 따라갈 수 있을지는 아직 모른다."
 tu_vic_ev.13.a:0 "칙령을 집행한다"
 tu_vic_ev.13.b:0 "칙령을 보류하고 준비를 우선한다"
 tu_vic_ev.14.t:0 "갱단 협약"
 tu_vic_ev.14.d:0 "글래스고 갱단 두목들이 한자리에 모여 서로의 구역을 인정하는 협약에 서명했다. 거리의 총성은 줄었지만 대가는 분명하다. 이 협약을 공인할지 정해야 한다."
 tu_vic_ev.14.a:0 "협약을 공인한다"
 tu_vic_ev.14.b:0 "협약을 무시하고 거리를 감시한다"
 tu_vic_ev.15.t:0 "불꽃 국가의 선포"
 tu_vic_ev.15.d:0 "드라코 지도자가 불꽃 국가의 성립을 선포했다. 선거는 정지되고 청년단의 행진이 도시를 뒤덮는다. 국외에서는 이 선언을 지켜보고 있다."
 tu_vic_ev.15.a:0 "체제를 공고히 한다"
 tu_vic_ev.15.b:0 "선거 재개를 약속해 외부 비판을 누그러뜨린다"
 tu_vic_ev.16.t:0 "시즈 국왕의 즉위"
 tu_vic_ev.16.d:0 "시즈가 빈 왕좌에 올라 왕관을 쓰고 대공들의 맹세를 받았다. 왕실 복원의 신호로 받아들여진 즉위식에 시민들이 몰려들었다. 소식은 대륙 전역으로 빠르게 퍼졌다."
 tu_vic_ev.16.a:0 "소식을 확인한다"
 tu_vic_ev.17.t:0 "아슬란 대관식"
 tu_vic_ev.17.d:0 "글래스고 대성당에서 아슬란의 대관식이 치러졌다. 교회는 축복을 내렸고 갱단은 거리를 메웠다. 빅토리아의 왕관이 다시 누군가의 머리 위에 놓였다."
 tu_vic_ev.17.a:0 "소식을 확인한다"
 tu_vic_ev.18.t:0 "드라코 지도자의 취임"
 tu_vic_ev.18.d:0 "드라코 지도자가 권력을 쥐고 선거를 중단했다. 국외의 시선은 차갑게 식었다. 불꽃 국가의 첫 지도자가 세상에 알려졌다."
 tu_vic_ev.18.a:0 "소식을 확인한다"
 tu_vic_ev.19.t:0 "의회 총리 선출"
 tu_vic_ev.19.d:0 "의회가 총리를 선출했다. 헌법과 자유 선거를 약속하는 연설이 이어졌다. 빅토리아의 민주주의가 다시 시험대에 올랐다."
 tu_vic_ev.19.a:0 "소식을 확인한다"
 tu_vic_ev.20.t:0 "글래스고 항만 소요"
 tu_vic_ev.20.d:0 "글래스고 항만 노동자들이 임금 체불에 항의해 부두를 점거했다. 짐을 실은 배들이 항구에 묶였고 길드는 협상을 요구한다. 어떻게 응할지 정해야 한다."
 tu_vic_ev.20.a:0 "소요를 진압한다"
 tu_vic_ev.20.b:0 "길드와 협상에 나선다"
 tu_vic_ev.20.c:0 "노동자 편에 서서 항만을 풀어 준다"
 tu_vic_ev.21.t:0 "스팀 나이트 시험 행군"
 tu_vic_ev.21.d:0 "스팀 나이트 부대가 도심에서 시험 행군을 요청했다. 증기 갑주의 행진을 보려는 시민들이 길가에 모여든다. 행군을 허가할지 보류할지 정해야 한다."
 tu_vic_ev.21.a:0 "행군을 허가한다"
 tu_vic_ev.21.b:0 "당분간 보류한다"
 tu_vic_ev.22.t:0 "세금 반란"
 tu_vic_ev.22.d:0 "농촌에서 세금 반란이 번지고 있다. 징세관의 마차가 불탔고 지방 관리들은 숨어 버렸다. 세율을 낮출지 징세를 강행할지 정해야 한다."
 tu_vic_ev.22.a:0 "세율을 낮춘다"
 tu_vic_ev.22.b:0 "징세를 강행한다"
 tu_vic_ev.23.t:0 "대공들의 불만"
 tu_vic_ev.23.d:0 "대공들이 빈 왕좌의 공백을 두고 공개적으로 불만을 터뜨렸다. 회의장에서 몇몇 가문은 떠날 채비를 한다. 그들의 몫을 나눠 줄지 무시할지 정해야 한다."
 tu_vic_ev.23.a:0 "대공들에게 자리를 나눠 준다"
 tu_vic_ev.23.b:0 "불만을 무시한다"
 tu_vic_ev.24.t:0 "템스강 밀수선"
 tu_vic_ev.24.d:0 "템스강 하구에서 밀수선이 대량으로 발견되었다. 세관 관리들이 뇌물을 받고 눈을 감았다는 소문이 돈다. 세관을 장악할지 밀수를 묵인할지 정해야 한다."
 tu_vic_ev.24.a:0 "세관을 장악한다"
 tu_vic_ev.24.b:0 "밀수를 묵인한다"
 tu_vic_ev.25.t:0 "론디니움의 난민"
 tu_vic_ev.25.d:0 "론디니움에서 밀려난 난민들이 국경 도시로 몰려오고 있다. 카즈델의 점령을 피해 온 사람들은 굶주려 있다. 난민을 받아들일지 국경을 닫을지 정해야 한다."
 tu_vic_ev.25.a:0 "국경을 닫는다"
 tu_vic_ev.25.b:0 "임시 캠프를 열어 난민을 맞는다"
 tu_vic_ev.26.t:0 "의회 청원서"
 tu_vic_ev.26.d:0 "의원들이 연명으로 청원서를 올렸다. 청원서에는 자유 선거와 왕실 재정의 공개가 적혀 있다. 청원을 받아들일지 묵살할지 정해야 한다."
 tu_vic_ev.26.a:0 "청원을 받아들인다"
 tu_vic_ev.26.b:0 "청원을 묵살한다"
 tu_vic_ev.27.t:0 "조폐국의 위조지폐"
 tu_vic_ev.27.d:0 "왕실 조폐국에서 찍은 것과 똑같은 위조지폐가 시장에 풀렸다. 상인들은 받은 지폐를 하나하나 의심하기 시작했다. 위조범을 잡을지 조용히 넘어갈지 정해야 한다."
 tu_vic_ev.27.a:0 "위조범을 잡는다"
 tu_vic_ev.27.b:0 "조용히 넘어간다"
 tu_vic_ev.28.t:0 "갱단의 답신"
 tu_vic_ev.28.d:0 "글래스고 갱단이 답신을 보내왔다. 그들은 항만 구역을 넘기는 대가로 세관 권리를 요구한다. 답신을 받아들일지 법정에 세울지 정해야 한다."
 tu_vic_ev.28.a:0 "갱단의 요구를 받아들인다"
 tu_vic_ev.28.b:0 "갱단을 법정에 세운다"
 tu_vic_ev.29.t:0 "난민 캠프의 현실"
 tu_vic_ev.29.d:0 "임시 캠프에 난민이 넘쳐 식량과 의약품이 모자란다. 캠프 안에서 질병이 돌고 있다는 보고가 올라온다. 지원을 늘릴지 캠프를 해산할지 정해야 한다."
 tu_vic_ev.29.a:0 "지원을 늘리고 청년을 모집한다"
 tu_vic_ev.29.b:0 "캠프를 해산한다"
 TU_VIC_ev_smuggling_trade:0 "밀수 항로의 이득"
 TU_VIC_ev_smuggling_trade_desc:0 "밀수선이 들여온 물자와 은밀한 자금이 정치 활동을 키운다. 정치력 획득이 늘어난다."
 TU_VIC_ev_parade_pride:0 "개선식의 자긍심"
 TU_VIC_ev_parade_pride_desc:0 "론디니움 개선식으로 국민의 자긍심이 높아졌다. 안정도가 오른다."
 tu_vic_ev.40.t:0 "왕위의 향방"
 tu_vic_ev.40.d:0 "대공들이 론디니움에 모였지만 왕좌는 여전히 비어 있다. 네 갈래 길이 있다.\n\n[대공 의회] 영지를 가진 대공들이 의회를 장악하고 과두 체제로 다스린다. 지도자: 대공 의회 의장.\n[아슬란 복위] 글래스고의 거리와 충성 귀족을 모아 아슬란을 왕위에 올린다. 지도자: 시즈 국왕.\n[드라코와 타라] 타라의 불꽃으로 봉기를 이끌어 군사 독재를 세운다. 지도자: 드라코.\n[빅토리아 의회] 자유 언론과 선거로 입헌 의회 체제를 연다. 지도자: 의회 총리.\n\n고른 노선의 중점만 트리에 나타난다."
 tu_vic_ev.40.a:0 "대공 의회가 이끈다."
 tu_vic_ev.40.b:0 "아슬란이 왕위에 오른다."
 tu_vic_ev.40.c:0 "타라의 불꽃이 타오른다."
 tu_vic_ev.40.e:0 "빅토리아 의회가 열린다."
