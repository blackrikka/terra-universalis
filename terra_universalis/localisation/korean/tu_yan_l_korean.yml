l_korean:
 TU_YAN_focus:0 "염국 중점"
 TU_YAN_emperor:0 "염국 황제"
 TU_YAN_chongyue:0 "종예"
 TU_YAN_chongyue_desc:0 "세 형제의 맏이. 육군을 이끄는 장군이다."
 TU_YAN_nian:0 "니엔"
 TU_YAN_nian_desc:0 "대장간을 맡은 형제. 산업 계열 고문이다."
 TU_YAN_dusk:0 "시(Dusk)"
 TU_YAN_dusk_desc:0 "그림과 말로 민심을 다루는 형제. 선전 계열 고문이다."
 TU_YAN_ling:0 "링"
 TU_YAN_ling_desc:0 "술자리에서 전쟁 지지를 모으는 형제. 안정도 계열 고문이다."
 TU_YAN_sleeping_giant:0 "잠자는 거인"
 TU_YAN_sleeping_giant_desc:0 "잠든 거인처럼 산업이 느리게 움직인다. 산업 생산이 줄고 징집이 조금 늘어난다."
 TU_YAN_imperial_bureaucracy:0 "황실 관료제"
 TU_YAN_imperial_bureaucracy_desc:0 "조정의 관료제가 정치력 획득을 높이고 안정도를 지탱한다."
 TU_YAN_sui_legacy:0 "세(歲)의 유산"
 TU_YAN_sui_legacy_desc:0 "쉐이의 조각들이 남긴 지식이 연구를 조금 빠르게 한다."
 TU_YAN_lungmen_levy:0 "용문 교역세"
 TU_YAN_lungmen_levy_desc:0 "용문의 교역에서 거두는 세금이 소비재 수요를 줄인다."
 TU_YAN_court_category:0 "조정"
 TU_YAN_lungmen_trade_levy:0 "용문 교역세 징수"
 TU_YAN_lungmen_trade_levy_desc:0 "용문의 교역에 세금을 매긴다. 정치력 50, 180일 동안 소비재 감소 효과."
 TU_YAN_sui_council:0 "세 형제 회의"
 TU_YAN_sui_council_desc:0 "세 형제가 모여 회의를 연다. 장군들의 경험이 쌓인다. 1회."
 TU_YAN_imperial_reform:0 "조정 개혁"
 TU_YAN_imperial_reform_desc:0 "조정의 낡은 질서를 손봐 나라의 방향을 세운다."
 TU_YAN_rail_network:0 "철도망 건설"
 TU_YAN_rail_network_desc:0 "수도의 철도와 기반시설을 새로 깐다."
 TU_YAN_bureaucratic_modernization:0 "관료제 근대화"
 TU_YAN_bureaucratic_modernization_desc:0 "관료제를 근대화해 정치력과 안정도를 높인다."
 TU_YAN_civil_inspection:0 "관료 감찰"
 TU_YAN_civil_inspection_desc:0 "지방 관료를 감찰해 기강을 바로잡는다."
 TU_YAN_provincial_levy:0 "지방 징발"
 TU_YAN_provincial_levy_desc:0 "지방에서 인력을 징발한다."
 TU_YAN_industrial_awakening:0 "산업 각성"
 TU_YAN_industrial_awakening_desc:0 "잠든 거인이 깨어난다. 잠자는 거인 아이디어가 사라지고 공장 단지가 하나 생긴다."
 TU_YAN_grand_mobilization:0 "조정 동원"
 TU_YAN_grand_mobilization_desc:0 "조정 전체를 동원해 군의 경험과 인력을 끌어올린다."
 TU_YAN_chongyue_return:0 "종예의 귀환"
 TU_YAN_chongyue_return_desc:0 "종예가 전선에서 돌아와 세 형제의 길이 열린다."
 TU_YAN_nian_forge:0 "니엔의 대장간"
 TU_YAN_nian_forge_desc:0 "니엔의 대장간에 무기 공장을 세운다. 링의 술과 상호 배타."
 TU_YAN_nian_arsenal:0 "대장간 증산"
 TU_YAN_nian_arsenal_desc:0 "대장간의 생산을 늘려 장비를 빠르게 공급한다."
 TU_YAN_dusk_painting:0 "시의 그림"
 TU_YAN_dusk_painting_desc:0 "시의 그림이 민심을 다독여 안정도를 높인다."
 TU_YAN_dusk_broadcast:0 "시의 방송"
 TU_YAN_dusk_broadcast_desc:0 "방송으로 나라 전체에 선전을 퍼뜨려 전쟁 지지를 높인다."
 TU_YAN_ling_wine:0 "링의 술"
 TU_YAN_ling_wine_desc:0 "링이 술자리를 열어 전쟁 지지를 모은다. 니엔의 대장간과 상호 배타."
 TU_YAN_ling_banquet:0 "링의 연회"
 TU_YAN_ling_banquet_desc:0 "연회에서 장군들을 치하해 경험을 쌓고 전쟁 지지를 얻는다."
 TU_YAN_sui_brothers_unity:0 "세 형제의 결속"
 TU_YAN_sui_brothers_unity_desc:0 "세 형제가 하나로 뭉친다. 세 형제 회의를 열 수 있게 된다."
 TU_YAN_lungmen_policy:0 "용문 정책"
 TU_YAN_lungmen_policy_desc:0 "용문을 어떻게 다룰지 정한다. 자치 보장과 직할화 중 하나를 고른다."
 TU_YAN_lungmen_autonomy:0 "용문 자치 보장"
 TU_YAN_lungmen_autonomy_desc:0 "용문의 자치를 보장해 관계를 개선하고 용문에 공장을 지원한다. 직할화와 상호 배타."
 TU_YAN_lungmen_annex:0 "용문 직할화"
 TU_YAN_lungmen_annex_desc:0 "용문을 염국의 직할 영토로 합병한다. 자치 보장과 상호 배타."
 TU_YAN_lungmen_trade_pact:0 "용문 교역 협정"
 TU_YAN_lungmen_trade_pact_desc:0 "용문과 교역 협정을 맺어 정치력을 얻는다."
 TU_YAN_lungmen_factories:0 "편입된 공장"
 TU_YAN_lungmen_factories_desc:0 "용문을 합병한 뒤 공장 단지를 하나 더 세운다."
 TU_YAN_infantry:0 "염국 보병 사단"
