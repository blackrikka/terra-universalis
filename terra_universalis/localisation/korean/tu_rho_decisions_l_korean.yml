 TU_RHO_pmc_contract:0 "PMC 계약 체결"
 TU_RHO_pmc_contract_desc:0 "교전 중인 나라와 180일 계약을 맺습니다. 계약 동안 월 용문폐 수입이 늘어납니다. 비용은 정치력 25입니다."
 TU_RHO_op_chernobog:0 "작전명: 체르노보그 구출"
 TU_RHO_op_chernobog_desc:0 "체르노보그로 구출 부대를 보냅니다. 지휘력 30과 용문폐 500이 듭니다. 60일 뒤 인력 5000, 군 경험 25, 전쟁 지지도 +5%를 얻습니다. 한 번만 실행할 수 있습니다."
