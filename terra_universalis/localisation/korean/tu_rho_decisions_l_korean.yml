l_korean:
 TU_RHO_relocate_rho_start:0 "시작 정박지로 귀환"
 TU_RHO_relocate_rho_start_desc:0 "육상함을 로도스 아일랜드의 시작 정박지로 옮깁니다. 수도가 이곳으로 옮겨집니다. 이동 뒤 30일 동안 도약 직후 페널티를 받습니다."
