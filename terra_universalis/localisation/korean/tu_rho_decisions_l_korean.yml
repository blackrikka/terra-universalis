 TU_RHO_upgrade_factory:0 "RIIC 제조소 업그레이드"
 TU_RHO_upgrade_factory_desc:0 "제조소 레벨을 올려 외부 무기 공장을 하나 더 얻습니다. 레벨 상한은 발전소 레벨 + 2입니다. 비용은 정치력 25와 용문폐 100 × (현재 레벨 + 1)입니다."
 TU_RHO_upgrade_trade:0 "RIIC 무역소 업그레이드"
 TU_RHO_upgrade_trade_desc:0 "무역소 레벨을 올려 외부 산업 단지를 하나 더 얻고 월 용문폐 수입이 늘어납니다. 비용은 정치력 25와 용문폐 100 × (현재 레벨 + 1)입니다."
 TU_RHO_upgrade_power:0 "RIIC 발전소 업그레이드"
 TU_RHO_upgrade_power_desc:0 "발전소 레벨을 올립니다 (최대 3). 다른 기반시설의 레벨 상한이 1 오릅니다. 비용은 정치력 25와 용문폐 100 × (현재 레벨 + 1)입니다."
 TU_RHO_upgrade_dorm:0 "RIIC 숙소 업그레이드"
 TU_RHO_upgrade_dorm_desc:0 "숙소 레벨을 올려 군 조직 회복과 사기를 높입니다. 비용은 정치력 25와 용문폐 100 × (현재 레벨 + 1)입니다."
 TU_RHO_upgrade_reception:0 "RIIC 응접실 업그레이드"
 TU_RHO_upgrade_reception_desc:0 "응접실 레벨을 올려 정치력 획득을 높입니다. 라 레지스탕스가 있으면 정보망 획득도 높아집니다. 비용은 정치력 25와 용문폐 100 × (현재 레벨 + 1)입니다."
 TU_RHO_headhunting:0 "공개구집"
 TU_RHO_headhunting_desc:0 "수도에 특무 작전 분대를 편성합니다. 비용은 정치력 50과 용문폐 300입니다. 60일 뒤 다시 쓸 수 있습니다."
 TU_RHO_safehouse_URS:0 "우르수스 구호 지부 설립"
 TU_RHO_safehouse_URS_desc:0 "우르수스에 구호 지부를 세웁니다. 매월 인력 300을 얻습니다. 국가당 한 번만 세울 수 있습니다."
 TU_RHO_safehouse_KZD:0 "카즈델 구호 지부 설립"
