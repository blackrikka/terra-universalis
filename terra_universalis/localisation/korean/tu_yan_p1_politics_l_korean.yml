l_korean:
 TU_YAN_p1_throne_root:0 "황제 친정 선언"
 TU_YAN_p1_throne_root_desc:0 "황제가 조정 위에 직접 서서 나라를 다스리겠다고 선언한다. 낡은 자문회의를 접고 친정 체제의 뼈대를 세운다."
 TU_YAN_p1_throne_court_purge:0 "조정 숙청"
 TU_YAN_p1_throne_court_purge_desc:0 "조정의 반대파를 쫓아낸다. 정치력은 얻지만 안정도가 떨어진다."
 TU_YAN_p1_throne_court_pact:0 "조정과의 타협"
 TU_YAN_p1_throne_court_pact_desc:0 "반대파에게 자리를 나눠 주고 조정을 달랜다. 안정도가 조금 오른다."
 TU_YAN_p1_throne_court_settled:0 "조정 정리"
 TU_YAN_p1_throne_court_settled_desc:0 "조정의 자리가 정리되어 황제의 뜻이 아래까지 닿는다."
 TU_YAN_p1_throne_appoint:0 "지방관 직할 임명"
 TU_YAN_p1_throne_appoint_desc:0 "지방관을 황실이 직접 임명한다."
 TU_YAN_p1_throne_bargain:0 "지방 세력과 협상"
 TU_YAN_p1_throne_bargain_desc:0 "지방 토호와 손을 잡고 세금과 병력을 나눈다. 전쟁 지지가 조금 오른다."
 TU_YAN_p1_throne_admin:0 "행정 통일"
 TU_YAN_p1_throne_admin_desc:0 "지방 행정을 하나의 체계로 묶는다."
 TU_YAN_p1_throne_guard:0 "황실 친위군 창설"
 TU_YAN_p1_throne_guard_desc:0 "황제 직속 친위군을 세운다. 보병 무기 기술이 한 단계 앞선다."
 TU_YAN_p1_throne_levy:0 "지방 징집 강화"
 TU_YAN_p1_throne_levy_desc:0 "지방에서 병력을 더 징발한다."
 TU_YAN_p1_throne_loyal:0 "황실 군 충성 서약"
 TU_YAN_p1_throne_loyal_desc:0 "군대가 황제에게 충성을 맹세한다. 육군 경험이 쌓인다."
 TU_YAN_p1_throne_treasury:0 "황실 금고 개방"
 TU_YAN_p1_throne_treasury_desc:0 "황실 금고를 국고로 돌린다. 정치력을 크게 얻는다."
 TU_YAN_p1_throne_tax:0 "세금 청부제"
 TU_YAN_p1_throne_tax_desc:0 "세금 징수를 민간에 맡긴다. 전쟁 지지가 조금 오르지만 재정 질서가 흐려진다."
 TU_YAN_p1_throne_fiscal:0 "재정 질서"
 TU_YAN_p1_throne_fiscal_desc:0 "재정 장부를 다시 맞춘다. 안정도가 오른다."
 TU_YAN_p1_throne_codex:0 "절대 법전"
 TU_YAN_p1_throne_codex_desc:0 "황제의 칙령을 하나의 법전으로 묶는다."
 TU_YAN_p1_throne_bureau:0 "칙령국 설치"
 TU_YAN_p1_throne_bureau_desc:0 "칙령을 기록하고 전달하는 관청을 세운다. 전쟁 지지가 오른다."
 TU_YAN_p1_throne_statutes:0 "통일 율령"
 TU_YAN_p1_throne_statutes_desc:0 "법전과 칙령국이 하나의 율령으로 합쳐진다."
 TU_YAN_p1_throne_palace:0 "황궁 중건"
 TU_YAN_p1_throne_palace_desc:0 "황궁 공사에 자재를 쏟는다. 산업 기술이 한 단계 앞선다."
 TU_YAN_p1_throne_academy:0 "황실 학술원"
 TU_YAN_p1_throne_academy_desc:0 "황실 학술원을 세워 전자 연구를 돕는다. 전자 기술이 한 단계 앞선다."
 TU_YAN_p1_throne_plan:0 "황실 대계"
 TU_YAN_p1_throne_plan_desc:0 "황실의 장기 계획을 세운다. 포병 기술이 한 단계 앞선다."
 TU_YAN_p1_throne_tribute:0 "조공 체제"
 TU_YAN_p1_throne_tribute_desc:0 "주변국에게 조공을 받아 황실의 위엄을 세운다."
 TU_YAN_p1_throne_diplomats:0 "사신 외교"
 TU_YAN_p1_throne_diplomats_desc:0 "사신을 보내 주변국과 관계를 다진다."
 TU_YAN_p1_throne_envoy_settled:0 "황실 외교 확립"
 TU_YAN_p1_throne_envoy_settled_desc:0 "황실 외교의 원칙이 정해진다."
 TU_YAN_p1_throne_judiciary:0 "황실 사법 독점"
 TU_YAN_p1_throne_judiciary_desc:0 "재판권을 황실이 독점한다. 안정도가 오른다."
 TU_YAN_p1_throne_delegated:0 "대리 재판"
 TU_YAN_p1_throne_delegated_desc:0 "재판을 관료에게 맡긴다. 전쟁 지지가 조금 오른다."
 TU_YAN_p1_throne_justice:0 "사법 체계"
 TU_YAN_p1_throne_justice_desc:0 "황실의 사법 체계가 완성된다."
 TU_YAN_p1_throne_absolute:0 "절대 천명"
 TU_YAN_p1_throne_absolute_desc:0 "황제의 권위가 모든 회의 위에 선다. 절대 천명이 나라를 덮는다."
 TU_YAN_p1_throne_restrained:0 "온건한 천명"
 TU_YAN_p1_throne_restrained_desc:0 "황제가 조정과 나눠 다스린다. 정치력과 전쟁 지지가 함께 오른다."
 TU_YAN_p1_throne_seal:0 "천명의 인장"
 TU_YAN_p1_throne_seal_desc:0 "모든 칙령에 황제의 인장이 찍힌다. 정치력과 안정도가 크게 오른다."
 TU_YAN_p1_throne_lungmen:0 "용문 직할 행정단"
 TU_YAN_p1_throne_lungmen_desc:0 "용문을 황실의 직할 행정단으로 묶는다. 용문 교역 협정과 상호 배타."
 TU_YAN_p1_throne_progress:0 "황제 순행"
 TU_YAN_p1_throne_progress_desc:0 "황제가 도시를 돌며 충성을 확인받는다."
 TU_YAN_p1_throne_review:0 "근위 사열"
 TU_YAN_p1_throne_review_desc:0 "근위대를 사열해 군의 사기를 높인다."
 TU_YAN_p1_throne_proclaim:0 "천하 공고"
 TU_YAN_p1_throne_proclaim_desc:0 "율령을 천하에 널리 알린다."
 TU_YAN_p1_warlord_root:0 "세 형제의 분열"
 TU_YAN_p1_warlord_root_desc:0 "세 형제가 제각각 세력을 갈라 군벌이 된다. 세 형제의 결속과 상호 배타. 조정의 권위가 흔들린다."
 TU_YAN_p1_warlord_nian:0 "니엔에게 병기창을"
 TU_YAN_p1_warlord_nian_desc:0 "니엔이 대장간을 쥐고 군벌의 중심이 된다. 산업 군벌의 길을 연다."
 TU_YAN_p1_warlord_dusk:0 "시에게 여론을"
 TU_YAN_p1_warlord_dusk_desc:0 "시가 그림과 방송으로 여론을 장악한다. 선전 군벌의 길을 연다."
 TU_YAN_p1_warlord_ling:0 "링에게 술자리를"
 TU_YAN_p1_warlord_ling_desc:0 "링이 술자리로 장수들을 묶는다. 연회 군벌의 길을 연다."
 TU_YAN_p1_warlord_chong:0 "종예에게 군권을"
 TU_YAN_p1_warlord_chong_desc:0 "종예가 전선의 군대를 손에 넣는다. 전장 군벌의 길을 연다."
 TU_YAN_p1_warlord_foundry:0 "대장간 군수 체계"
 TU_YAN_p1_warlord_foundry_desc:0 "대장간이 독자적인 군수 체계를 짠다. 보병 무기 기술이 한 단계 앞선다."
 TU_YAN_p1_warlord_supply:0 "보급창 독점"
 TU_YAN_p1_warlord_supply_desc:0 "보급창을 혼자 쥐고 다른 군벌의 보급을 끊는다. 정치력을 얻는다."
 TU_YAN_p1_warlord_hold:0 "병기창 독립"
 TU_YAN_p1_warlord_hold_desc:0 "병기창을 조정에서 떼어 독립시킨다."
 TU_YAN_p1_warlord_gazette:0 "관영 신문 장악"
 TU_YAN_p1_warlord_gazette_desc:0 "관영 신문을 장악해 여론을 바꾼다. 안정도가 오른다."
 TU_YAN_p1_warlord_bards:0 "순회 극단 동원"
 TU_YAN_p1_warlord_bards_desc:0 "순회 극단으로 전선과 도시에 선전을 퍼뜨린다. 전쟁 지지가 오른다."
 TU_YAN_p1_warlord_mandate:0 "민심의 그림"
 TU_YAN_p1_warlord_mandate_desc:0 "그림으로 민심을 다독여 군벌의 명분을 세운다. 안정도가 오른다."
 TU_YAN_p1_warlord_tavern:0 "술집 연맹"
 TU_YAN_p1_warlord_tavern_desc:0 "술집마다 군벌의 연맹을 세운다. 전쟁 지지가 오른다."
 TU_YAN_p1_warlord_feast:0 "군벌 연회"
 TU_YAN_p1_warlord_feast_desc:0 "장수들을 연회에 불러 경험을 쌓게 한다."
 TU_YAN_p1_warlord_oath:0 "무사 서약"
 TU_YAN_p1_warlord_oath_desc:0 "무사들이 군벌에게 서약한다. 전쟁 지지가 크게 오른다."
 TU_YAN_p1_warlord_march:0 "행군 훈련"
 TU_YAN_p1_warlord_march_desc:0 "장거리 행군으로 군대를 단련한다. 육군 경험이 쌓인다."
 TU_YAN_p1_warlord_fort:0 "국경 요새"
 TU_YAN_p1_warlord_fort_desc:0 "국경에 요새를 쌓는다. 포병 기술이 한 단계 앞선다."
 TU_YAN_p1_warlord_chong_banner:0 "군벌 깃발"
 TU_YAN_p1_warlord_chong_banner_desc:0 "종예의 깃발 아래 군대가 모인다. 육군 경험이 쌓인다."
 TU_YAN_p1_warlord_league:0 "군벌 연합"
 TU_YAN_p1_warlord_league_desc:0 "네 군벌이 연합해 조정과 맞선다."
 TU_YAN_p1_warlord_absorb:0 "지방 군벌 흡수"
 TU_YAN_p1_warlord_absorb_desc:0 "작은 군벌을 흡수해 병력을 늘린다."
 TU_YAN_p1_warlord_mediate:0 "군벌 간 조정"
 TU_YAN_p1_warlord_mediate_desc:0 "군벌끼리 다투지 않도록 조정한다. 안정도가 오른다."
 TU_YAN_p1_warlord_order:0 "군벌 질서"
 TU_YAN_p1_warlord_order_desc:0 "흡수와 조정이 하나의 질서로 묶인다."
 TU_YAN_p1_warlord_claim:0 "황제 칭호 요구"
 TU_YAN_p1_warlord_claim_desc:0 "군벌이 황제의 칭호를 요구한다. 전쟁 지지가 오른다."
 TU_YAN_p1_warlord_submit:0 "조정에 복종"
 TU_YAN_p1_warlord_submit_desc:0 "군벌이 조정 앞에 머리를 숙인다. 안정도가 오른다."
 TU_YAN_p1_warlord_regime:0 "군벌 체제 확립"
 TU_YAN_p1_warlord_regime_desc:0 "군벌 체제가 자리 잡는다."
 TU_YAN_p1_warlord_east:0 "동방 진출"
 TU_YAN_p1_warlord_east_desc:0 "동쪽 땅으로 세력을 넓힌다."
 TU_YAN_p1_warlord_west:0 "서부 할거"
 TU_YAN_p1_warlord_west_desc:0 "서쪽 땅을 지키며 웅크린다."
 TU_YAN_p1_warlord_front:0 "전선 정리"
 TU_YAN_p1_warlord_front_desc:0 "동서 전선이 정리된다. 육군 경험이 쌓인다."
 TU_YAN_p1_warlord_civil_war:0 "내전 개시"
 TU_YAN_p1_warlord_civil_war_desc:0 "군벌끼리 내전을 시작한다. 전쟁 지지가 오른다."
 TU_YAN_p1_warlord_talks:0 "협상 회담"
 TU_YAN_p1_warlord_talks_desc:0 "군벌끼리 협상 테이블에 앉는다. 안정도가 오른다."
 TU_YAN_p1_warlord_partition:0 "천하 분할 준비"
 TU_YAN_p1_warlord_partition_desc:0 "천하를 나눌 계획을 짠다."
 TU_YAN_p1_warlord_tax:0 "군벌 세금 징수"
 TU_YAN_p1_warlord_tax_desc:0 "군벌이 영지에서 세금을 거둔다. 정치력을 얻는다."
 TU_YAN_p1_warlord_governors:0 "지방 장관 파견"
 TU_YAN_p1_warlord_governors_desc:0 "군벌이 장관을 보내 영지를 다스린다."
 TU_YAN_p1_warlord_fiscal:0 "군벌 재정"
 TU_YAN_p1_warlord_fiscal_desc:0 "군벌의 재정이 하나로 묶인다."
 TU_YAN_p1_warlord_empire:0 "세 형제의 천하"
 TU_YAN_p1_warlord_empire_desc:0 "분열된 세 형제가 하나의 천하를 노린다. 정치력이 크게 오른다."
 TU_YAN_p1_guard_root:0 "근위국 개편"
 TU_YAN_p1_guard_root_desc:0 "황실 근위국을 개편하고 관료 개혁의 방향을 세운다. 근대 입헌 노선을 택한다."
 TU_YAN_p1_guard_form:0 "근위국 창설"
 TU_YAN_p1_guard_form_desc:0 "근위국을 새로 세워 군과 정치를 나눈다."
 TU_YAN_p1_guard_civil:0 "문관 행정 우선"
 TU_YAN_p1_guard_civil_desc:0 "문관이 행정을 맡고 군은 뒤로 물러난다."
 TU_YAN_p1_guard_decree:0 "개혁 칙령"
 TU_YAN_p1_guard_decree_desc:0 "개혁의 칙령이 나라 전체에 내려간다."
 TU_YAN_p1_guard_draft:0 "헌법 초안"
 TU_YAN_p1_guard_draft_desc:0 "헌법 초안을 여러 차례 고친다."
 TU_YAN_p1_guard_charter:0 "지방 자치 헌장"
 TU_YAN_p1_guard_charter_desc:0 "지방에 자치의 권리를 헌장으로 보장한다."
 TU_YAN_p1_guard_constitution:0 "헌법 공포"
 TU_YAN_p1_guard_constitution_desc:0 "헌법이 공포되어 권력이 나뉜다."
 TU_YAN_p1_guard_exam:0 "과거제 개혁"
 TU_YAN_p1_guard_exam_desc:0 "관료 선발 시험을 공정하게 고친다."
 TU_YAN_p1_guard_merit:0 "관료 능력 평가"
 TU_YAN_p1_guard_merit_desc:0 "관료의 능력을 평가해 자리를 정한다."
 TU_YAN_p1_guard_civil_service:0 "관료 시험 완성"
 TU_YAN_p1_guard_civil_service_desc:0 "관료 시험 제도가 완성된다."
 TU_YAN_p1_guard_parliament:0 "의회 설립"
 TU_YAN_p1_guard_parliament_desc:0 "선출된 의원이 모이는 의회를 세운다."
 TU_YAN_p1_guard_senate:0 "원로원 자문회"
 TU_YAN_p1_guard_senate_desc:0 "원로들이 모인 자문회가 의회를 대신한다."
 TU_YAN_p1_guard_session:0 "의회 개원"
 TU_YAN_p1_guard_session_desc:0 "의회가 처음으로 열린다."
 TU_YAN_p1_guard_election:0 "총선 실시"
 TU_YAN_p1_guard_election_desc:0 "전국에서 총선을 치른다."
 TU_YAN_p1_guard_delay:0 "선거 연기"
 TU_YAN_p1_guard_delay_desc:0 "비상을 핑계로 선거를 미룬다. 안정도가 떨어진다."
 TU_YAN_p1_guard_vote:0 "선거 질서"
 TU_YAN_p1_guard_vote_desc:0 "선거의 질서가 정해진다."
 TU_YAN_p1_guard_trade:0 "자유 무역 개방"
 TU_YAN_p1_guard_trade_desc:0 "국경을 열어 자유 무역을 시작한다."
 TU_YAN_p1_guard_protect:0 "국영 산업 보호"
 TU_YAN_p1_guard_protect_desc:0 "국영 산업을 관세로 지킨다."
 TU_YAN_p1_guard_market:0 "시장 제도"
 TU_YAN_p1_guard_market_desc:0 "시장과 국영 산업이 함께 자라는 제도를 세운다."
 TU_YAN_p1_guard_press:0 "언론 자유 보장"
 TU_YAN_p1_guard_press_desc:0 "언론의 자유를 법으로 보장한다."
 TU_YAN_p1_guard_censor:0 "언론 통제"
 TU_YAN_p1_guard_censor_desc:0 "언론을 통제해 혼란을 막는다."
 TU_YAN_p1_guard_press_settled:0 "언론 정비"
