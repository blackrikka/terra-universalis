l_korean:
 tu_rho_ev.1.t:0 "방주 임무 개시"
 tu_rho_ev.1.d:0 "방주 호송대가 감염자 구역 깊숙이 임무를 시작했다. 아미야는 살아남은 사람부터 구하자고 했고, 닥터는 방주가 버티려면 자원부터 확보해야 한다고 맞섰다. 어느 쪽에 무게를 실을지는 지휘부의 몫이다."
 tu_rho_ev.1.a:0 "아미야의 뜻을 따라 구조를 최우선으로 한다"
 tu_rho_ev.1.b:0 "닥터의 판단을 따라 자원 확보를 우선한다"
 tu_rho_ev.1.c:0 "양쪽을 아우르는 조정안을 낸다"
 tu_rho_ev.2.t:0 "테라 헌장"
 tu_rho_ev.2.d:0 "방주 대표들과 인근 도시 대표들이 테라 헌장 초안을 두고 모였다. 헌장은 감염자와 비감염자 모두의 권리를 명시하지만, 최종 서명권을 누가 갖는지는 여전히 논쟁 중이다."
 tu_rho_ev.2.a:0 "즉시 헌장에 서명한다"
 tu_rho_ev.2.b:0 "조항을 손질한 뒤 서명한다"
 tu_rho_ev.2.c:0 "서명을 미루고 독자 노선을 유지한다"
 tu_rho_ev.3.t:0 "계약자 노선 선언"
 tu_rho_ev.3.d:0 "로도스 아일랜드는 용병 계약자로서 생존 자금을 얻기로 했다. 아미야는 계약이 누구의 편인지 분명해야 한다고 말했다. 닥터는 고객을 가리지 않는 것이 생존의 조건이라고 답했다."
 tu_rho_ev.3.a:0 "모든 대륙을 상대로 계약을 개방한다"
 tu_rho_ev.3.b:0 "신뢰할 수 있는 고객만 받는다"
 tu_rho_ev.3.c:0 "계약 노선을 잠시 보류한다"
 tu_rho_ev.4.t:0 "마왕의 귀환"
 tu_rho_ev.4.d:0 "오래 잠들어 있던 힘이 다시 깨어났다. 바벨의 기억 속 존재가 돌아왔다는 보고가 올라왔고, 방주 안에서도 그것을 구원으로 볼지 재앙으로 볼지 의견이 갈린다. 아미야는 누구도 그 힘을 쉽게 믿어서는 안 된다고 경고했다."
 tu_rho_ev.4.a:0 "귀환의 힘을 이용해 세력을 키운다"
 tu_rho_ev.4.b:0 "귀환을 봉인하고 방주를 지킨다"
 tu_rho_ev.4.c:0 "정보를 모으며 계속 관찰한다"
 tu_rho_ev.5.t:0 "닥터의 전쟁"
 tu_rho_ev.5.d:0 "닥터는 전면전을 선포했다. 명분은 계약 고객의 보호였지만, 그 과정에서 많은 감염자가 전장으로 끌려 나갔다. 아미야는 이 선택이 방주 전체의 신뢰를 무너뜨릴 것이라고 경고했다."
 tu_rho_ev.5.a:0 "전면전을 승인한다"
 tu_rho_ev.5.b:0 "전쟁을 제한하고 인명을 우선한다"
 tu_rho_ev.5.c:0 "전선 확장 계획을 세운다"
 tu_rho_ev.6.t:0 "강화 윤리의 기로"
 tu_rho_ev.6.d:0 "강화 병사 실험이 윤리 검토 단계에 이르렀다. 연구팀은 성과를 보고했지만, 실험체의 동의와 부작용 기록이 충분하지 않다는 지적이 나왔다. 아미야는 연구를 멈추라고 요구했고, 닥터는 이것이 감염자를 구할 유일한 수단이라고 맞섰다."
 tu_rho_ev.6.a:0 "윤리 검토를 강화하고 연구를 계속한다"
 tu_rho_ev.6.b:0 "강화 연구를 즉시 중단한다"
 tu_rho_ev.6.c:0 "성과를 우선해 실험을 확장한다"
 tu_rho_ev.7.t:0 "전 세계를 위한 치료제"
 tu_rho_ev.7.d:0 "오리파시 치료제가 대량 생산 단계에 들어섰다. 특허를 어떻게 다룰지를 두고 의견이 갈린다. 공개하면 수많은 감염자가 살겠지만, 방주의 재정은 크게 흔들릴 것이다."
 tu_rho_ev.7.a:0 "치료제를 무상으로 공개한다"
 tu_rho_ev.7.b:0 "특허를 유지해 재정을 확보한다"
 tu_rho_ev.7.c:0 "공개 범위를 단계적으로 정한다"
 tu_rho_ev.8.t:0 "정예 오퍼레이터의 전설"
 tu_rho_ev.8.d:0 "정예 오퍼레이터들의 이름이 방주 곳곳에 퍼졌다. 그들의 활약은 사람들에게 희망을 주었지만, 전설이 된 이들이 지쳐 간다는 소문도 돌고 있다. 켈시는 그들을 쉬게 하라고 요청했다."
 tu_rho_ev.8.a:0 "전설을 선전에 활용한다"
 tu_rho_ev.8.b:0 "정예들에게 휴식과 교대를 보장한다"
 tu_rho_ev.8.c:0 "정예를 전선에 더 많이 투입한다"
 tu_rho_ev.9.t:0 "육상함의 도약"
 tu_rho_ev.9.d:0 "육상함이 마지막 도약 시험을 마쳤다. 이 거대한 함선은 이제 사막과 황무지를 가로지를 수 있다. 기술자들은 성공을 축하했지만, 연료 보급과 항로 문제는 여전히 남아 있다."
 tu_rho_ev.9.a:0 "즉시 원정 항로를 연다"
 tu_rho_ev.9.b:0 "함대를 보수하고 교대 체계를 세운다"
 tu_rho_ev.9.c:0 "도약 기술을 다른 나라에 판다"
 tu_rho_ev.10.t:0 "산업 시설의 재가동"
 tu_rho_ev.10.d:0 "RIIC 산업 시설의 공장들이 다시 돌아가기 시작했다. 무기 생산 라인과 민간 공장이 함께 가동되며 주민들의 일자리가 늘었다. 다만 공장의 이익을 누가 가져갈지는 아직 정해지지 않았다."
 tu_rho_ev.10.a:0 "무기 생산을 우선한다"
 tu_rho_ev.10.b:0 "민간 생산을 우선한다"
 tu_rho_ev.10.c:0 "공장 이익을 방주 기금으로 돌린다"
 tu_rho_ev.11.t:0 "방주의 영원한 항로"
 tu_rho_ev.11.d:0 "방주가 마침내 영원한 항로를 확보했다. 난민을 실은 배들이 다시 각국 항구에 닿고 있다. 로도스 아일랜드의 이름은 이제 구호의 상징으로 불린다."
 tu_rho_ev.11.a:0 "소식을 전해 듣는다"
 tu_rho_ev.12.t:0 "계약 협정의 완성"
 tu_rho_ev.12.d:0 "로도스 아일랜드가 계약자 연합의 최종 협정에 서명했다. 용병 시장은 이제 국경을 넘어 움직인다. 각국 정부는 이 거대한 사설 군사 집단을 어떻게 다룰지 고심하고 있다."
 tu_rho_ev.12.a:0 "소식을 전해 듣는다"
 tu_rho_ev.13.t:0 "카즈델로의 귀환"
 tu_rho_ev.13.d:0 "마왕의 그림자가 카즈델의 황무지에서 다시 일어섰다. 로도스 아일랜드의 깃발이 사막 위에 올랐고, 이웃 나라들은 긴장한 채 그 행보를 지켜보고 있다."
 tu_rho_ev.13.a:0 "소식을 전해 듣는다"
 tu_rho_ev.14.t:0 "방주의 야간 진료"
 tu_rho_ev.14.d:0 "밤늦게까지 진료소의 불이 꺼지지 않고 있다. 감염자와 주민들이 줄을 서고 있지만 의약품은 빠르게 줄고 있다. 진료 시간을 늘릴지 줄일지 결정해야 한다."
 tu_rho_ev.14.a:0 "진료 시간을 늘린다"
 tu_rho_ev.14.b:0 "의약품을 아껴 진료를 줄인다"
 tu_rho_ev.15.t:0 "감염자 이탈"
 tu_rho_ev.15.d:0 "일부 감염자가 방주의 통제선을 넘어 도시로 흩어졌다. 주민들은 불안을 드러내고 있다. 추격대를 보낼지, 설득에 나설지 정해야 한다."
 tu_rho_ev.15.a:0 "추격대를 보낸다"
 tu_rho_ev.15.b:0 "설득과 보호를 우선한다"
 tu_rho_ev.16.t:0 "닥터의 메모"
 tu_rho_ev.16.d:0 "닥터가 남긴 메모가 지휘실에 전달되었다. 메모에는 계약 고객 명단과 협상 조건이 빼곡히 적혀 있다. 아미야는 이 문서를 공개하자고 요구하고 있다."
 tu_rho_ev.16.a:0 "문서를 공개해 투명성을 보인다"
 tu_rho_ev.16.b:0 "문서를 비밀로 묶어 협상에 쓴다"
 tu_rho_ev.17.t:0 "켈시의 중간 보고서"
 tu_rho_ev.17.d:0 "켈시가 오리파시 연구의 중간 보고서를 올렸다. 치료 후보 물질 몇 가지가 초기 단계를 통과했지만, 부작용 데이터는 아직 부족하다. 연구를 어디까지 밀어붙일지 결정이 필요하다."
 tu_rho_ev.17.a:0 "연구 예산을 늘린다"
 tu_rho_ev.17.b:0 "현재 속도를 유지하고 데이터를 모은다"
 tu_rho_ev.18.t:0 "구호 지부의 기부"
 tu_rho_ev.18.d:0 "익명의 후원자가 구호 지부에 큰 금액을 보냈다. 후원금에 조건이 붙어 있다는 소문이 있다. 지부는 기부금을 받을지 결정해야 한다."
 tu_rho_ev.18.a:0 "기부금을 받아 구호에 쓴다"
 tu_rho_ev.18.b:0 "조건을 검토한 뒤 거절한다"
 tu_rho_ev.19.t:0 "전선 확장 계획"
 tu_rho_ev.19.d:0 "전선 사령부가 확장 계획안을 올려 보냈다. 새 거점을 얻으면 보급이 나아지지만, 그만큼 방어선도 넓어진다. 아미야는 전선보다 방주 내부의 신뢰를 먼저 지키라고 요구했다."
 tu_rho_ev.19.a:0 "계획을 승인하고 진격한다"
 tu_rho_ev.19.b:0 "계획을 보류하고 방어에 집중한다"
 tu_rho_ev.20.t:0 "확장된 전선의 첫 보고"
 tu_rho_ev.20.d:0 "확장된 전선에서 첫 보고가 도착했다. 일부 거점은 손쉽게 함락되었지만, 사로잡은 감염자 포로를 두고 지휘관들의 의견이 엇갈린다. 이 결과는 방주의 다음 행보를 결정할 것이다."
 tu_rho_ev.20.a:0 "포로를 방주에서 치료한다"
 tu_rho_ev.20.b:0 "포로를 전선 노동에 투입한다"
