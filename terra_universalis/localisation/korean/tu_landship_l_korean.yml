l_korean:
 TU_landship_category:0 "육상함·이동도시"
 TU_landship_category_desc:0 "바다를 잃은 테라에서 함대는 땅 위를 달린다. 육상함을 취역하고, 이동도시를 옮기고, 주행과 정박을 바꾼다."
 TU_landship_commission:0 "육상함 취역"
 TU_landship_commission_desc:0 "수도에서 육상함 전대 하나를 진수한다 (기술에 따라 경·중·이동도시급). 취역 한도: 육상함 설계 2, 중육상함 4, 이동도시급 6."
 TU_landship_relocate:0 "이동도시 이전"
 TU_landship_relocate_desc:0 "수도를 이 주로 옮긴다. 기반시설 +1. 90일 동안 §R이동 중인 도시§! (생산·건설 감소)."
 TU_city_mode_cruise:0 "도시 주행"
 TU_city_mode_cruise_desc:0 "이동도시가 달린다: 육군 속도 +5%, 보급 소모 −10%, 건설 속도 −15%."
 TU_city_mode_anchor:0 "도시 정박"
 TU_city_mode_anchor_desc:0 "이동도시가 닻을 내린다: 건설 속도 +10%, 공장 생산 +5%, 육군 속도 −5%."
 TU_city_in_transit:0 "이동 중인 도시"
 TU_city_in_transit_desc:0 "도시 전체가 새 자리로 움직이고 있다."
 TU_city_cruising:0 "주행 중인 도시"
 TU_city_cruising_desc:0 "이동도시가 황야를 가로질러 달린다."
 TU_city_anchored:0 "정박한 도시"
 TU_city_anchored_desc:0 "이동도시가 닻을 내리고 공장을 돌린다."
