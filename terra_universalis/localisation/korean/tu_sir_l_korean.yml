 tu_sir_ev.1.t:0 "늑대의 땅"
 tu_sir_ev.1.d:0 "시라쿠사의 거리는 조용하다. 조용한 데는 이유가 있다. 패밀리가 보고 있기 때문이다."
 tu_sir_ev.1.a:0 "규율을 지킨다."
 tu_sir_ev.20.t:0 "늑대 군주의 이야기"
 tu_sir_ev.20.d:0 "노인들은 아직 늑대 군주의 이야기를 한다. 시라쿠사의 모든 늑대를 다스렸던 이. 그가 언젠가 돌아온다고 한다."
 tu_sir_ev.20.a:0 "옛이야기일 뿐이다."
 tu_sir_ev.20.b:0 "그 이야기를 찾아보라."
 tu_sir_ev.21.t:0 "의례의 밤"
 tu_sir_ev.21.d:0 "보름달 아래 늑대의 의례가 열렸다. 수천 명의 늑대가 같은 방향을 바라보았다."
 tu_sir_ev.21.a:0 "무리는 하나다."
 tu_sir_ev.22.t:0 "라플란드의 행방"
 tu_sir_ev.22.d:0 "늑대 군주의 흔적을 좇던 이들이 한 이름에 닿았다. 라플란드. 그녀는 무언가를 알고 있다."
 tu_sir_ev.22.a:0 "그녀를 찾는다."
 tu_sir_ev.22.b:0 "내버려 둔다."
 tu_sir_ev.23.t:0 "침묵이 깨지다"
 tu_sir_ev.23.d:0 "한 패밀리 조직원이 법정에서 모든 것을 증언했다. 오메르타가 깨졌다."
 tu_sir_ev.23.a:0 "법이 이긴다."
 tu_sir_ev.24.t:0 "대부의 체포"
 tu_sir_ev.24.d:0 "한 패밀리의 대부가 수갑을 찼다. 그의 부하들이 거리로 나왔다."
 tu_sir_ev.24.a:0 "질서를 지킨다."
 tu_sir_ev.25.t:0 "늑대의 징조"
 tu_sir_ev.25.d:0 "옛 늑대 군주의 성채에서 무언가가 깨어났다. 시라쿠사의 모든 늑대가 그 울음을 들었다."
 tu_sir_ev.25.a:0 "군주가 돌아온다."
 tu_sir_ev.26.t:0 "패밀리 전쟁"
 tu_sir_ev.26.d:0 "두 패밀리가 서로의 구역을 노리고 총을 들었다. 거리에서 총성이 멈추지 않는다."
 tu_sir_ev.26.a:0 "군을 보내 진압한다."
 tu_sir_ev.26.b:0 "한쪽 편을 든다."
 tu_sir_ev.26.c:0 "저절로 끝나길 기다린다."
 tu_sir_ev.27.t:0 "텍사스의 귀향"
 tu_sir_ev.27.d:0 "한때 패밀리의 후계자였던 텍사스가 고향을 찾았다. 그녀를 알아본 이들이 수군댄다."
 tu_sir_ev.27.a:0 "조용히 지나가게 한다."
 tu_sir_ev.27.b:0 "패밀리들이 그녀를 원한다."
 tu_sir_ev.28.t:0 "패밀리 연합 정부"
 tu_sir_ev.28.d:0 "대부들이 내각에 들어왔다. 거리는 조용해졌지만 모두가 대가를 치른다."
 tu_sir_ev.28.a:0 "가족이 먼저다."
 tu_sir_ev.29.t:0 "법의 시라쿠사"
 tu_sir_ev.29.d:0 "시라쿠사 역사상 처음으로 법원이 패밀리보다 강해졌다."
 tu_sir_ev.29.a:0 "정의가 섰다."
 tu_sir_ev.30.t:0 "늑대 군주의 귀환"
 tu_sir_ev.30.d:0 "늑대 군주가 성채에서 내려왔다. 대부도 판사도 무릎을 꿇었다."
 tu_sir_ev.30.a:0 "늑대의 시대."
