 tu_sir_ev.1.t:0 "시라쿠사의 갈림길"
 tu_sir_ev.1.d:0 "시라쿠사의 거리는 조용하다. 조용한 데는 이유가 있다. 패밀리가 보고 있기 때문이다.\n이제 누가 이 도시들을 이끌지 정해야 한다. 고른 루트의 중점만 트리에 나타나고, 지도자가 바로 바뀐다.\n\n§Y벨로네§!: 벨로네 — 건설과 산업. 공장을 가장 많이 얻는다.\n§Y감비노§!: 감비노 대부 — 군사와 동원. 공격력과 병력이 강하다.\n§Y살루초§!: 살루초 대부 — 돈과 외교. 정치력과 연구가 빠르다.\n§Y법§!: 페넌스 (라비니아) — 패밀리를 무너뜨리는 법치. 안정도와 연구.\n§Y늑대§!: 라플란드 더 데카덴차 — 늑대 군주의 힘. 공격과 정복."
 tu_sir_ev.1.a:0 "벨로네 — 건설과 산업. 공장을 가장 많이 얻는다."
 tu_sir_ev.1.b:0 "감비노 대부 — 군사와 동원. 공격력과 병력이 강하다."
 tu_sir_ev.1.c:0 "살루초 대부 — 돈과 외교. 정치력과 연구가 빠르다."
 tu_sir_ev.1.e:0 "페넌스 (라비니아) — 패밀리를 무너뜨리는 법치. 안정도와 연구."
 tu_sir_ev.1.f:0 "라플란드 더 데카덴차 — 늑대 군주의 힘. 공격과 정복."
 tu_sir_ev.20.t:0 "늑대 군주의 이야기"
 tu_sir_ev.20.d:0 "노인들은 아직 늑대 군주의 이야기를 한다. 시라쿠사의 모든 늑대를 다스렸던 이. 그가 언젠가 돌아온다고 한다."
 tu_sir_ev.20.a:0 "그 이야기는 진짜다."
 tu_sir_ev.21.t:0 "의례의 밤"
 tu_sir_ev.21.d:0 "보름달 아래 늑대의 의례가 열렸다. 수천 명의 늑대가 같은 방향을 바라보았다."
 tu_sir_ev.21.a:0 "무리는 하나다."
 tu_sir_ev.22.t:0 "라플란드의 귀환"
 tu_sir_ev.22.d:0 "늑대 군주의 흔적을 좇던 라플란드가 돌아왔다. 그녀의 눈에는 옛 군주의 빛이 깃들어 있다."
 tu_sir_ev.22.a:0 "무리가 그녀를 따른다."
 tu_sir_ev.23.t:0 "침묵이 깨지다"
 tu_sir_ev.23.d:0 "한 패밀리 조직원이 법정에서 모든 것을 증언했다. 오메르타가 깨졌다."
 tu_sir_ev.23.a:0 "법이 이긴다."
 tu_sir_ev.24.t:0 "대부의 체포"
 tu_sir_ev.24.d:0 "한 패밀리의 대부가 수갑을 찼다. 그의 부하들이 거리로 나왔다."
 tu_sir_ev.24.a:0 "질서를 지킨다."
 tu_sir_ev.25.t:0 "늑대의 징조"
 tu_sir_ev.25.d:0 "옛 늑대 군주의 성채에서 무언가가 깨어났다. 시라쿠사의 모든 늑대가 그 울음을 들었다."
 tu_sir_ev.25.a:0 "군주가 돌아온다."
 tu_sir_ev.26.t:0 "패밀리 전쟁"
 tu_sir_ev.26.d:0 "두 패밀리가 서로의 구역을 노리고 총을 들었다. 거리에서 총성이 멈추지 않는다."
 tu_sir_ev.26.a:0 "군을 보내 진압한다."
 tu_sir_ev.26.b:0 "한쪽 편을 든다."
 tu_sir_ev.26.c:0 "저절로 끝나길 기다린다."
 tu_sir_ev.27.t:0 "텍사스의 귀향"
 tu_sir_ev.27.d:0 "한때 패밀리의 후계자였던 텍사스가 고향을 찾았다. 그녀를 알아본 이들이 수군댄다."
 tu_sir_ev.27.a:0 "조용히 지나가게 한다."
 tu_sir_ev.27.b:0 "패밀리들이 그녀를 원한다."
 tu_sir_ev.28.t:0 "패밀리의 시라쿠사"
 tu_sir_ev.28.d:0 "한 패밀리가 시라쿠사의 꼭대기에 섰다. 다른 패밀리들은 고개를 숙였다."
 tu_sir_ev.28.a:0 "가족이 먼저다."
 tu_sir_ev.29.t:0 "법의 시라쿠사"
 tu_sir_ev.29.d:0 "시라쿠사 역사상 처음으로 법원이 패밀리보다 강해졌다."
 tu_sir_ev.29.a:0 "정의가 섰다."
 tu_sir_ev.30.t:0 "늑대 군주의 귀환"
 tu_sir_ev.30.d:0 "늑대 군주가 성채에서 내려왔다. 대부도 판사도 무릎을 꿇었다."
 tu_sir_ev.30.a:0 "늑대의 시대."
 tu_sir_ev.32.t:0 "판사 암살 미수"
 tu_sir_ev.32.d:0 "패밀리 사건을 맡은 판사가 습격을 받았지만 살아남았다."
 tu_sir_ev.32.a:0 "경호를 강화한다."
 tu_sir_ev.32.b:0 "판사를 교체한다."
 tu_sir_ev.33.t:0 "관광객의 물결"
 tu_sir_ev.33.d:0 "카지노와 해변을 찾아 외국인들이 몰려왔다."
 tu_sir_ev.33.a:0 "환영한다."
 tu_sir_ev.34.t:0 "달밤의 울음"
 tu_sir_ev.34.d:0 "달밤마다 성채 쪽에서 늑대 울음이 들린다는 신고가 늘었다."
 tu_sir_ev.34.a:0 "조사단을 보낸다."
 tu_sir_ev.35.t:0 "처음 듣는 패밀리"
 tu_sir_ev.35.d:0 "통합 협상장 명부에 낯선 이름이 하나 끼어 있다.\n\n\"이 패밀리는 뭐지? 엄...뭐..? 처음들어보는군..\""
 tu_sir_ev.35.a:0 "좀 더 알아봐라."
 tu_sir_ev.36.t:0 "엄지"
 tu_sir_ev.36.d:0 "조사 보고서가 올라왔다. 규율이 엄격하고, 명령에 절대 복종하며, 탄환 하나 허투루 쓰지 않는다고.\n\n\"엄지..? 괜찮은 패밀리 같아보이는군\""
 tu_sir_ev.36.a:0 "패밀리로 받아들인다"
 tu_sir_ev.36.b:0 "다른 패밀리를 알아본다"
 tu_sir_ev.37.t:0 "발렌치나"
 tu_sir_ev.37.d:0 "엄지에서 보낸 지휘관이 회의실 문을 걷어차고 들어왔다. 그녀는 아무에게도 고개를 숙이지 않았다.\n\n\"지긋지긋해, 너도 패밀리도, 모두 다!!!\""
 tu_sir_ev.37.a:0 "...잘 부탁한다, 발렌치나."
 TU_SIR_focus:0 "시라쿠사 중점"
