 TU_SIR_root:0 "늑대의 땅"
 TU_SIR_root_desc:0 "시라쿠사의 도시들은 정부가 아니라 패밀리가 다스린다. 이 중점을 마치면 §Y시라쿠사의 갈림길§! 이벤트에서 다섯 루트 중 하나를 고른다.\n\n§Y벨로네§!: 벨로네 — 건설과 산업. 공장을 가장 많이 얻는다.\n§Y감비노§!: 감비노 대부 — 군사와 동원. 공격력과 병력이 강하다.\n§Y살루초§!: 살루초 대부 — 돈과 외교. 정치력과 연구가 빠르다.\n§Y법§!: 페넌스 (라비니아) — 패밀리를 무너뜨리는 법치. 안정도와 연구.\n§Y늑대§!: 라플란드 더 데카덴차 — 늑대 군주의 힘. 공격과 정복."
