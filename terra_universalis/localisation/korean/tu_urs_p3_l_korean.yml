l_korean:
 TU_URS_noble_senate_summon:0 "원로원 소집"
 TU_URS_noble_senate_summon_desc:0 "옛 대공들이 모여 원로원을 다시 연다. 정치력이 늘어난다."
 TU_URS_noble_senate_law:0 "원로원 법령"
 TU_URS_noble_senate_law_desc:0 "원로원이 법령을 승인하는 절차를 세운다. 원로원 위임 아이디어를 얻는다."
 TU_URS_noble_senate_veto:0 "원로원 거부권"
 TU_URS_noble_senate_veto_desc:0 "원로원이 황제의 칙령에 거부권을 행사한다. BoP가 구귀족파 쪽으로 기운다."
 TU_URS_noble_regency:0 "섭정 체제"
 TU_URS_noble_regency_desc:0 "황제가 어려 권한을 맡길 수 없을 때 섭정을 세운다. 섭정 평의회 아이디어를 얻는다."
 TU_URS_noble_regent_council:0 "섭정 평의회"
 TU_URS_noble_regent_council_desc:0 "섭정을 보좌하는 평의회를 구성해 정치력을 모은다."
 TU_URS_noble_senate_chamber:0 "원로원 의사당"
 TU_URS_noble_senate_chamber_desc:0 "원로원 의사당을 다시 세운다. 정치력과 안정도가 조금 오른다."
 TU_URS_noble_senate_levy:0 "원로원 징병"
 TU_URS_noble_senate_levy_desc:0 "원로원이 귀족 영지에서 병력을 징발한다."
 TU_URS_noble_senate_peace:0 "원로원 평화 협정"
 TU_URS_noble_senate_peace_desc:0 "원로원이 평화를 선언한다. BoP가 조금 구귀족파 쪽으로 기운다."
 TU_URS_noble_feudal_charter:0 "영지 특허장"
 TU_URS_noble_feudal_charter_desc:0 "귀족 영지에 자치 특허장을 내린다. 영지 특허장 아이디어를 얻는다."
 TU_URS_noble_feudal_autonomy:0 "영지 자치권"
 TU_URS_noble_feudal_autonomy_desc:0 "영지마다 자치 권한을 준다. BoP가 구귀족파 쪽으로 기운다."
 TU_URS_noble_local_taxes:0 "지방 징세권"
 TU_URS_noble_local_taxes_desc:0 "영주가 직접 세금을 거둔다. 정치력이 늘지만 안정도가 떨어진다."
 TU_URS_noble_governors:0 "지방 총독 임명"
 TU_URS_noble_governors_desc:0 "귀족 가문에서 지방 총독을 임명한다."
 TU_URS_noble_estate_law:0 "영지법 제정"
 TU_URS_noble_estate_law_desc:0 "영지의 법과 세금 규칙을 정리한다. 무작위 주에 공장이 세워진다."
 TU_URS_noble_decentral_union:0 "분권 연합"
 TU_URS_noble_decentral_union_desc:0 "영지들이 느슨하게 연합한다. 인력이 늘고 BoP가 구귀족파 쪽으로 조금 기운다."
 TU_URS_noble_feudal_legacy:0 "영지 군제 유산"
 TU_URS_noble_feudal_legacy_desc:0 "영지의 군사 전통을 정리해 육군 교리를 발전시킨다."
 TU_URS_noble_cartel_charter:0 "카르텔 헌장"
 TU_URS_noble_cartel_charter_desc:0 "귀족 산업 카르텔의 헌장을 공포한다. 카르텔 채권 아이디어를 얻는다."
 TU_URS_noble_cartel_monopoly:0 "독점 카르텔"
 TU_URS_noble_cartel_monopoly_desc:0 "카르텔이 시장을 독점한다. 정치력이 늘지만 자유 교역은 막힌다."
 TU_URS_noble_free_trade:0 "자유 교역"
 TU_URS_noble_free_trade_desc:0 "카르텔 문을 열고 자유 교역을 허용한다. 안정도가 조금 오른다."
 TU_URS_noble_trade_routes:0 "교역 항로"
 TU_URS_noble_trade_routes_desc:0 "북쪽 교역 항로를 연다. 무작위 주에 공장이 세워진다."
 TU_URS_noble_cartel_factories:0 "카르텔 공장"
 TU_URS_noble_cartel_factories_desc:0 "카르텔 자본으로 공장을 세운다. 무작위 주에 공장이 세워진다."
 TU_URS_noble_cartel_bank:0 "귀족 은행"
 TU_URS_noble_cartel_bank_desc:0 "카르텔이 은행을 세운다. 정치력이 늘어난다."
 TU_URS_noble_cartel_exports:0 "카르텔 수출"
 TU_URS_noble_cartel_exports_desc:0 "카르텔 제품을 수출한다. 산업 기술이 발전한다."
 TU_URS_noble_industrial_union:0 "귀족 산업 연합"
 TU_URS_noble_industrial_union_desc:0 "귀족 산업 연합을 세운다. BoP가 구귀족파 쪽으로 기운다."
 TU_URS_noble_cartel_peak:0 "카르텔 총수 회의"
 TU_URS_noble_cartel_peak_desc:0 "카르텔 총수들이 모여 노선을 정한다. 정치력이 크게 늘고 귀족 원수가 합류한다."
 TU_URS_noble_cartel_standard:0 "카르텔 표준화"
 TU_URS_noble_cartel_standard_desc:0 "카르텔 제품을 표준화해 소총 생산 기술을 높인다."
 TU_URS_noble_cartel_arsenal:0 "카르텔 병기창"
 TU_URS_noble_cartel_arsenal_desc:0 "카르텔이 병기창을 세운다. 무작위 주에 공장이 세워진다."
 TU_URS_noble_monopoly_law:0 "독점법"
 TU_URS_noble_monopoly_law_desc:0 "독점 카르텔을 법으로 묶는다. 정치력이 늘지만 안정도가 떨어진다."
 TU_URS_noble_cartel_empire:0 "카르텔 제국"
 TU_URS_noble_cartel_empire_desc:0 "카르텔이 북부 경제를 장악한다. BoP가 구귀족파 쪽으로 기운다."
 TU_URS_noble_cartel_legacy:0 "귀족 산업 유산"
 TU_URS_noble_cartel_legacy_desc:0 "귀족 산업의 기술을 정리해 산업 기술을 크게 발전시킨다."
 TU_URS_noble_private_armies:0 "사병 편성"
 TU_URS_noble_private_armies_desc:0 "귀족들이 사병을 모은다. 육군 경험치가 오른다."
 TU_URS_noble_estate_militia:0 "영지 민병대"
 TU_URS_noble_estate_militia_desc:0 "영지 민병대를 조직한다. 사병 연대 아이디어를 얻고 영지 수비대장이 합류한다."
 TU_URS_noble_armed_retainers:0 "가신 연대"
 TU_URS_noble_armed_retainers_desc:0 "가신들로 연대를 편성한다. 인력이 늘고 육군 경험치가 오른다."
 TU_URS_noble_oath_pledge:0 "충성 서약"
 TU_URS_noble_oath_pledge_desc:0 "귀족들이 황실에 충성을 맹세한다. 안정도가 오르고 정치력이 늘어난다."
 TU_URS_noble_private_regiment:0 "사병 연대"
 TU_URS_noble_private_regiment_desc:0 "사병들을 정식 연대로 묶는다. 인력이 늘어난다."
 TU_URS_noble_armoured_retinue:0 "기갑 가신단"
 TU_URS_noble_armoured_retinue_desc:0 "귀족이 장갑차량을 구입해 기갑 가신단을 만든다. 기갑 기술이 발전한다."
 TU_URS_noble_estate_defence:0 "영지 방어선"
 TU_URS_noble_estate_defence_desc:0 "영지마다 방어선을 쌓는다. 정치력이 늘지만 안정도가 떨어진다."
 TU_URS_noble_mobile_estates:0 "이동도시 영지"
 TU_URS_noble_mobile_estates_desc:0 "이동도시에 영지를 세우는 계획을 세운다. 정치력이 늘어난다."
 TU_URS_noble_mobile_survey:0 "이동 측량"
 TU_URS_noble_mobile_survey_desc:0 "이동도시의 경로를 측량한다. 기동화 장비 기술이 발전한다."
 TU_URS_noble_mobile_settlement:0 "정착 도시"
 TU_URS_noble_mobile_settlement_desc:0 "이동도시를 한곳에 정착시킨다. 무작위 주에 공장이 세워진다."
 TU_URS_noble_caravan_route:0 "순회 노선"
 TU_URS_noble_caravan_route_desc:0 "이동도시가 계속 순회한다. 이동 영지 아이디어를 얻는다."
 TU_URS_noble_mobile_factory:0 "이동 공장"
 TU_URS_noble_mobile_factory_desc:0 "이동도시 안에 공장을 세운다. 무작위 주에 공장이 세워진다."
 TU_URS_noble_mobile_capital:0 "이동 수도"
 TU_URS_noble_mobile_capital_desc:0 "이동도시 연합의 수도를 세운다. 정치력이 크게 늘어난다."
 TU_URS_noble_envoy_office:0 "외교 사절국"
 TU_URS_noble_envoy_office_desc:0 "귀족 외교 사절국을 세운다. 귀족 외교망 아이디어를 얻는다."
 TU_URS_noble_envoy_kazimierz:0 "카지미에시 사절단"
 TU_URS_noble_envoy_kazimierz_desc:0 "카지미에시(KAZ)와 불가침 조약을 맺는다."
 TU_URS_noble_marriage_pact:0 "정략결혼 동맹"
 TU_URS_noble_marriage_pact_desc:0 "카즈델(KZD)에 보장 제의를 보낸다. 정략결혼이 동맹의 명분이 된다."
 TU_URS_noble_puppet_kazimierz:0 "카지미에시 종속"
 TU_URS_noble_puppet_kazimierz_desc:0 "카지미에시(KAZ)를 종속국으로 만드는 전쟁 명분을 얻는다."
 TU_URS_noble_claim_victoria:0 "빅토리아 영유권 주장"
 TU_URS_noble_claim_victoria_desc:0 "빅토리아(VIC)의 주 영유권을 주장한다."
 TU_URS_noble_lei_pressure:0 "레이타니엔 압박"
 TU_URS_noble_lei_pressure_desc:0 "레이타니엔(LEI)의 주 영유권을 주장한다."
 TU_URS_noble_guarantee_lei:0 "레이타니엔 보장"
 TU_URS_noble_guarantee_lei_desc:0 "레이타니엔(LEI)에 보장 제의를 보낸다."
 TU_URS_noble_puppet_sam:0 "사미 종속"
 TU_URS_noble_puppet_sam_desc:0 "사미(SAM)를 종속국으로 만드는 전쟁 명분을 얻는다."
 TU_URS_noble_annex_kazdel:0 "카즈델 병합"
 TU_URS_noble_annex_kazdel_desc:0 "카즈델(KZD)을 병합하는 전쟁 명분을 얻는다. 정치력이 늘어난다."
 TU_URS_reform_path:0 "개혁파의 길"
 TU_URS_reform_path_desc:0 "학생과 시민이 제국의 개편을 요구한다. BoP가 개혁파 쪽으로 기운다."
 TU_URS_reform_student_council:0 "학생자치단 설립"
 TU_URS_reform_student_council_desc:0 "우르수스 학생자치단을 세운다. 학생자치단 아이디어를 얻는다."
 TU_URS_reform_constitution_draft:0 "헌법 초안"
 TU_URS_reform_constitution_draft_desc:0 "제국의 새 헌법 초안을 작성한다. 헌법 체제 아이디어를 얻는다."
 TU_URS_reform_constitutional_monarchy:0 "입헌군주정"
 TU_URS_reform_constitutional_monarchy_desc:0 "황실은 남기고 권한을 의회에 넘긴다. 공화정과 상호 배타."
 TU_URS_reform_royal_charter:0 "왕실 헌장"
 TU_URS_reform_royal_charter_desc:0 "황실이 스스로 권한을 제한하는 헌장을 공포한다."
 TU_URS_reform_crown_councils:0 "왕실 자문회의"
 TU_URS_reform_crown_councils_desc:0 "왕실 자문회의가 행정을 정비한다. 입헌 행정 기술을 얻는다."
 TU_URS_reform_monarch_assembly:0 "입헌 의회"
 TU_URS_reform_monarch_assembly_desc:0 "입헌 의회가 세워지고 무작위 주에 공장이 세워진다."
 TU_URS_reform_monarch_legacy:0 "입헌 왕정의 유산"
 TU_URS_reform_monarch_legacy_desc:0 "입헌 왕정이 자리를 잡아 정치력이 크게 늘어난다."
 TU_URS_reform_republic_path:0 "공화정 전환"
 TU_URS_reform_republic_path_desc:0 "황제를 폐하고 공화정을 세운다. BoP가 개혁파 쪽으로 크게 기운다. 입헌군주정과 상호 배타."
 TU_URS_reform_republic_assembly:0 "공화 의회"
 TU_URS_reform_republic_assembly_desc:0 "선출직 대의원으로 의회를 꾸린다."
 TU_URS_reform_republic_vote:0 "공화 선거"
 TU_URS_reform_republic_vote_desc:0 "첫 공화 선거를 치른다. 과도기라 안정도가 조금 떨어진다."
 TU_URS_reform_republic_civil_service:0 "공직 개혁"
 TU_URS_reform_republic_civil_service_desc:0 "공무원 제도를 바꾼다. 공직 연구 기술을 얻는다."
 TU_URS_reform_republic_legacy:0 "공화국의 유산"
 TU_URS_reform_republic_legacy_desc:0 "공화국의 기틀이 세워져 BoP가 개혁파 쪽으로 더 기운다."
 TU_URS_reform_democratic_party:0 "민주당 집권"
 TU_URS_reform_democratic_party_desc:0 "집권당을 민주주의 정당으로 바꾼다. 민주 지지가 크게 오른다."
 TU_URS_reform_elections:0 "정기 선거"
 TU_URS_reform_elections_desc:0 "정기 선거를 도입한다. 정치력이 늘고 안정도가 오른다."
 TU_URS_reform_coalition_rule:0 "연립 정부"
 TU_URS_reform_coalition_rule_desc:0 "여러 정당이 연립 정부를 구성한다."
 TU_URS_reform_civil_rights:0 "시민권 보장"
 TU_URS_reform_civil_rights_desc:0 "시민의 기본 권리를 법으로 보장한다. BoP가 개혁파 쪽으로 조금 기운다."
 TU_URS_reform_labour_law:0 "노동법 제정"
 TU_URS_reform_labour_law_desc:0 "노동자의 권리를 법으로 정한다. 인력이 늘어난다."
 TU_URS_reform_welfare_state:0 "복지 국가"
 TU_URS_reform_welfare_state_desc:0 "사회 보장 제도를 세워 안정도가 크게 오른다."
 TU_URS_reform_national_dialogue:0 "국민 대화"
 TU_URS_reform_national_dialogue_desc:0 "국민 대화를 열고 개혁 정책을 조율한다. 정치력이 늘고 BoP가 개혁파 쪽으로 조금 기운다."
 TU_URS_reform_constitutional_court:0 "헌법재판소"
 TU_URS_reform_constitutional_court_desc:0 "헌법재판소를 세워 권력을 견제한다."
 TU_URS_reform_anti_corruption:0 "반부패 위원회"
 TU_URS_reform_anti_corruption_desc:0 "부패를 감시하는 위원회를 세운다."
 TU_URS_reform_open_government:0 "열린 행정"
 TU_URS_reform_open_government_desc:0 "행정 정보를 공개한다. BoP가 개혁파 쪽으로 조금 기운다."
 TU_URS_reform_civil_society:0 "시민사회 육성"
 TU_URS_reform_civil_society_desc:0 "시민 단체를 키워 안정도를 높인다."
 TU_URS_reform_completion:0 "개혁 완수"
 TU_URS_reform_completion_desc:0 "개혁의 마지막 단계를 마친다. 정치력이 크게 늘고 BoP가 개혁파 쪽으로 기운다."
 TU_URS_reform_reunion_talks:0 "리유니온 대화"
 TU_URS_reform_reunion_talks_desc:0 "리유니온(REU)과 대화를 연다. 불가침 조약을 맺는다."
 TU_URS_reform_reunion_treaty:0 "리유니온 화해 조약"
 TU_URS_reform_reunion_treaty_desc:0 "리유니온과 화해 조약을 맺는다. 화해 정책 아이디어를 얻는다. 로도스 협정과 상호 배타."
 TU_URS_reform_rhodes_pact:0 "로도스 협정"
 TU_URS_reform_rhodes_pact_desc:0 "로도스 아일랜드(RHO)와 협정을 맺는다. 불가침 조약을 맺는다. 리유니온 화해 조약과 상호 배타."
