l_korean:
 TU_LGM_focus:0 "용문 중점"
 TU_LGM_wei_yenwu:0 "웨이옌우"
 TU_LGM_chen:0 "첸"
 TU_LGM_chen_leader:0 "첸 근위국장"
 TU_LGM_chen_leader_desc:0 "근위국을 장악한 첸이 용문의 새 지도자가 된다."
 TU_LGM_hoshiguma:0 "호시구마"
 TU_LGM_hoshiguma_desc:0 "육군 참모 출신의 고문. 방어 계열이다."
 TU_LGM_swire:0 "스와이어"
 TU_LGM_swire_desc:0 "교역을 다루는 정치 고문. 무역 계열이다."
 TU_LGM_trade_hub:0 "무역 허브"
 TU_LGM_trade_hub_desc:0 "용문의 무역 허브가 소비재 수요를 줄이고 공장 생산을 조금 높인다."
 TU_LGM_guard_department:0 "근위국"
 TU_LGM_guard_department_desc:0 "근위국이 방어 전선을 지켜 방어력을 높인다."
 TU_LGM_mobile_city:0 "이동도시"
 TU_LGM_mobile_city_desc:0 "이동도시의 구조가 참호를 더 깊게 파게 한다."
 TU_LGM_city_mobilized:0 "도시 동원"
 TU_LGM_city_mobilized_desc:0 "도시 전체가 전쟁에 동원되어 방어력이 크게 오른다."
 TU_LGM_city_category:0 "도시 방위"
 TU_LGM_mobilize_city:0 "도시 동원령"
 TU_LGM_mobilize_city_desc:0 "리유니온과 전쟁 중일 때 도시를 동원한다. 90일 동안 방어력이 크게 오른다."
 TU_LGM_request_rhodes:0 "로도스 원조 요청"
 TU_LGM_request_rhodes_desc:0 "로도스 아일랜드에 원조를 요청한다. 로도스와 관계가 좋아지고 용문의 안정도가 오른다."
 TU_LGM_trade_hub_focus:0 "무역 도시 용문"
 TU_LGM_trade_hub_focus_desc:0 "작은 무역 도시에서 출발해 세력을 넓힌다."
 TU_LGM_defence_plan:0 "방어 계획"
 TU_LGM_defence_plan_desc:0 "도시의 방어 계획을 세운다."
 TU_LGM_refugee_camps:0 "피난 수용소"
 TU_LGM_refugee_camps_desc:0 "피난민을 수용해 인력을 확보한다."
 TU_LGM_sanction_relief:0 "제재 완화"
 TU_LGM_sanction_relief_desc:0 "교역 제재를 풀어 안정도를 되찾는다."
 TU_LGM_port_expansion:0 "항만 확장"
 TU_LGM_port_expansion_desc:0 "항만을 넓혀 도시의 기반시설을 키운다."
 TU_LGM_city_charter:0 "도시 헌장 준비"
 TU_LGM_city_charter_desc:0 "자치를 위한 도시 헌장을 준비한다."
 TU_LGM_autonomy_talks:0 "자치권 협상"
 TU_LGM_autonomy_talks_desc:0 "리유니온 국지전에서 살아남은 뒤 염국과 자치권을 협상한다. 완료하면 염국의 종속에서 벗어난다."
 TU_LGM_independence:0 "자치권 확보"
 TU_LGM_independence_desc:0 "자치권을 확보해 안정도를 높이고 정치력을 얻는다. 근위국 쿠데타와 상호 배타."
 TU_LGM_guard_reform:0 "근위국 재편"
 TU_LGM_guard_reform_desc:0 "근위국의 편제를 다시 짠다."
 TU_LGM_chen_plan:0 "첸의 계획"
 TU_LGM_chen_plan_desc:0 "첸이 근위국을 움직일 계획을 세운다."
 TU_LGM_chen_coup:0 "첸의 쿠데타"
 TU_LGM_chen_coup_desc:0 "첸이 근위국을 이끌고 지도자를 교체한다. 전쟁 지지가 오르고 근위국 방어 아이디어를 얻는다. 자치권 확보와 상호 배타."
 TU_LGM_guard_drill:0 "근위 훈련"
 TU_LGM_guard_drill_desc:0 "근위를 혹독하게 훈련시킨다."
 TU_LGM_border_watch:0 "국경 감시"
 TU_LGM_border_watch_desc:0 "국경을 감시해 경험과 안정도를 얻는다."
 TU_LGM_guard:0 "용문 근위 사단"
