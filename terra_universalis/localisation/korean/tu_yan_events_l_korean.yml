l_korean:
 TU_YAN_ev_idea_court_unity:0 "조정 결속"
 TU_YAN_ev_idea_court_unity_desc:0 "조정 대신들이 한뜻으로 움직인다. 안정도가 조금 오르고 정치력 획득이 빨라진다."
 TU_YAN_ev_idea_court_unrest:0 "조정 동요"
 TU_YAN_ev_idea_court_unrest_desc:0 "대신들 사이에 파벌 다툼이 번진다. 안정도가 떨어지고 정치력 획득이 느려진다."
 TU_YAN_ev_idea_spirit_fervor:0 "신령 열기"
 TU_YAN_ev_idea_spirit_fervor_desc:0 "사원마다 신령을 기리는 열기가 가득하다. 전쟁 지지가 높아진다."

 tu_yan_ev.1.t:0 "조정 개혁의 칙령"
 tu_yan_ev.1.d:0 "황실 조정의 낡은 질서를 손볼 칙령 초안이 올라왔다. 대신들은 서로 눈치를 보고 있고, 지방에서는 개혁이 실제로 행해질지 의심하는 목소리가 들린다. 황제는 이 칙령으로 나라의 방향을 정해야 한다."
 tu_yan_ev.1.a:0 "칙령을 즉시 공포한다"
 tu_yan_ev.1.b:0 "대신들과 타협해 칙령을 고친다"
 tu_yan_ev.1.c:0 "개혁을 잠시 미룬다"

 tu_yan_ev.2.t:0 "관료제 근대화 상소"
 tu_yan_ev.2.d:0 "관료제 근대화가 시작되자 지방에서 상소문이 산더미처럼 쌓였다. 낡은 문서 체계를 버리고 새 심사 기구를 세울지, 기존 서리들의 손에 맡길지 결정해야 한다. 어느 쪽이든 관리들 사이에 권력이 어떻게 나뉠지가 정해진다."
 tu_yan_ev.2.a:0 "새 심사 기구를 세운다"
 tu_yan_ev.2.b:0 "지방 보고부터 먼저 처리한다"
 tu_yan_ev.2.c:0 "옛 서리 체계를 지킨다"

 tu_yan_ev.3.t:0 "종예의 귀환"
 tu_yan_ev.3.d:0 "전선에서 돌아온 맏형 종예가 수도 성문을 지나 조정에 들었다. 병사들은 그를 영웅으로 떠받들고, 대신들은 그가 쥔 군권을 경계한다. 세 형제의 길이 여기서 갈리기 시작한다."
 tu_yan_ev.3.a:0 "환영 연회를 열어 사기를 높인다"
 tu_yan_ev.3.b:0 "전선 보고를 직접 듣는다"
 tu_yan_ev.3.c:0 "군권을 조정으로 거둔다"

 tu_yan_ev.4.t:0 "황제 친정의 선언"
 tu_yan_ev.4.d:0 "황제가 조정 위에 직접 서서 나라를 다스리겠다고 선언했다. 오래된 자문회의는 해산될 운명이고, 대공들은 아직 이 선언에 어떻게 답할지 정하지 못했다. 친정 체제의 첫 칙령이 곧 내려질 것이다."
 tu_yan_ev.4.a:0 "칙령을 발표해 권위를 세운다"
 tu_yan_ev.4.b:0 "대공들을 불러 뜻을 전한다"
 tu_yan_ev.4.c:0 "자문회의를 바로 해산한다"

 tu_yan_ev.5.t:0 "세 형제의 분열"
 tu_yan_ev.5.d:0 "세 형제가 제각기 세력을 갈라 군벌이 되었다. 조정의 명령은 국경 너머까지 닿지 않고, 병사들은 형제 가운데 누구의 깃발을 따를지 고민하고 있다. 이 분열을 봉합할지, 방치할지는 황제가 정해야 한다."
 tu_yan_ev.5.a:0 "군을 형제들에게 나눠 맡긴다"
 tu_yan_ev.5.b:0 "형제들을 회유해 조정에 묶는다"
 tu_yan_ev.5.c:0 "군벌을 힘으로 억누른다"

 tu_yan_ev.6.t:0 "근위국의 상주문"
 tu_yan_ev.6.d:0 "황실 근위국이 개편을 청하는 상주문을 올렸다. 근위의 권한을 법으로 묶고 헌장 초안을 쓰자는 내용이다. 보수파 대신들은 이를 황실의 권위를 깎는 일로 여긴다."
 tu_yan_ev.6.a:0 "개편을 승인하고 헌장을 쓴다"
 tu_yan_ev.6.b:0 "초안을 먼저 검토한다"
 tu_yan_ev.6.c:0 "보수파의 반발을 달랜다"

 tu_yan_ev.7.t:0 "신령의 사원"
 tu_yan_ev.7.d:0 "신령을 모시는 사원이 수도와 농촌에서 동시에 문을 열었다. 사제들은 신탁을 내세워 민심을 모으고 있으며, 조정의 관료들은 그 힘이 어디까지 커질지 두려워한다. 신앙을 키울지, 억누를지 선택해야 한다."
 tu_yan_ev.7.a:0 "사원을 열어 신앙을 키운다"
 tu_yan_ev.7.b:0 "사제들을 경계한다"
 tu_yan_ev.7.c:0 "신탁을 청해 국정을 묻는다"

 tu_yan_ev.8.t:0 "세 형제 회의"
 tu_yan_ev.8.d:0 "세 형제가 한자리에 모였다. 오래 갈라져 있던 그들의 이야기는 사냥터의 술잔과 전선의 보고로 채워졌다. 이 회의에서 나온 결정이 앞으로 세 형제를 어떻게 묶을지 정할 것이다."
 tu_yan_ev.8.a:0 "세 형제에게 권한을 나눠 맡긴다"
 tu_yan_ev.8.b:0 "니엔에게 공방의 몫을 준다"
 tu_yan_ev.8.c:0 "종예에게 전권을 맡긴다"

 tu_yan_ev.9.t:0 "용문 정책 논의"
 tu_yan_ev.9.d:0 "용문의 상인과 관리들이 사신을 보내 자치를 청했다. 조정 대신들은 자치를 허락할지, 직할로 편입할지를 두고 맞서고 있다. 여기서 정한 방향이 염국과 용문의 관계를 가를 것이다."
 tu_yan_ev.9.a:0 "자치를 보장한다"
 tu_yan_ev.9.b:0 "직할화를 검토한다"
 tu_yan_ev.9.c:0 "교역 협정부터 맺는다"

 tu_yan_ev.10.t:0 "용문 직할화"
 tu_yan_ev.10.d:0 "용문이 염국의 직할 영토가 되었다. 성문 앞에는 자치를 잃은 시민들이 모여 항의하고 있고, 새 총독부의 문서가 밤새 오간다. 이 불만을 어떻게 다루느냐가 앞으로 몇 달의 민심을 정한다."
 tu_yan_ev.10.a:0 "항의를 진압한다"
 tu_yan_ev.10.b:0 "대화로 다스린다"
 tu_yan_ev.10.c:0 "세금을 일시 면제한다"

 tu_yan_ev.11.t:0 "용문 교역 협정"
 tu_yan_ev.11.d:0 "용문과의 교역 협정 초안이 완성되었다. 항구의 세관원들은 관세율을 두고 다투고 있으며, 협정이 체결되면 정치력과 교역로가 함께 열린다. 협정 문구를 어떻게 정할지는 조정의 몫이다."
 tu_yan_ev.11.a:0 "협정에 서명한다"
 tu_yan_ev.11.b:0 "관세를 높여 이익을 챙긴다"
 tu_yan_ev.11.c:0 "협정을 보류한다"

 tu_yan_ev.12.t:0 "용문 자치 헌장"
 tu_yan_ev.12.d:0 "용문 자치 헌장이 조정에 올라왔다. 헌장은 용문의 법정과 세관을 그대로 두지만, 황실의 감찰이 어디까지 미칠지는 분명히 적지 않았다. 헌장을 비준하면 두 도시의 관계가 한층 가까워진다."
 tu_yan_ev.12.a:0 "헌장을 비준한다"
 tu_yan_ev.12.b:0 "단서를 붙여 승인한다"
 tu_yan_ev.12.c:0 "헌장을 찢어 버린다"

 tu_yan_ev.13.t:0 "수이 협정"
 tu_yan_ev.13.d:0 "세 형제가 맺었던 옛 약속을 되살리는 협정이 나왔다. 협정이 체결되면 형제들 사이의 불신이 누그러지고 조정은 숨을 고를 수 있다. 다만 조항 가운데 일부는 세 형제의 권한을 나눠 놓고 있다."
 tu_yan_ev.13.a:0 "협정에 서명한다"
 tu_yan_ev.13.b:0 "조건부로 승인한다"
 tu_yan_ev.13.c:0 "협정을 파기한다"

 tu_yan_ev.14.t:0 "잠든 거인의 깨어남"
 tu_yan_ev.14.d:0 "오래 잠들어 있던 산업이 깨어났다. 공장 굴뚝이 하나둘 올라오고, 조정은 이 기세를 어디에 쓸지 고민하고 있다. 공장 단지를 넓히는 일은 곧 노동력과 세수의 문제이기도 하다."
 tu_yan_ev.14.a:0 "공장을 더 짓는다"
 tu_yan_ev.14.b:0 "농촌의 노동력을 징발한다"
 tu_yan_ev.14.c:0 "산업 조직을 조정한다"

 tu_yan_ev.15.t:0 "용문에 보내는 사신"
 tu_yan_ev.15.d:0 "친정 체제가 굳어지자 황제는 용문에 사신을 보내 복종을 요구하려 한다. 용문의 상인들은 이미 교역로를 내세워 맞설 준비를 하고 있다. 사신을 누구와 함께 보내느냐에 따라 이 갈등의 결말이 갈린다."
 tu_yan_ev.15.a:0 "정식 사신단을 보낸다"
 tu_yan_ev.15.b:0 "사신을 거절한다"
 tu_yan_ev.15.c:0 "수행원만 딸려 보낸다"

 tu_yan_ev.16.t:0 "천명의 인장"
 tu_yan_ev.16.d:0 "황제의 인장이 모든 칙령에 찍히기 시작했다. 친정 체제가 완성되었다는 소식이 수도 전역에 퍼졌고, 각지의 관리들이 황제의 뜻을 받들겠다고 상주하고 있다."
 tu_yan_ev.16.a:0 "천명은 황제에게 있다"

 tu_yan_ev.17.t:0 "세 형제의 천하"
 tu_yan_ev.17.d:0 "분열했던 세 형제가 다시 손을 맞잡고 천하를 노린다는 소식이 전해졌다. 주변 나라들은 이 연합이 어디로 향할지 주시하고 있다."
 tu_yan_ev.17.a:0 "천하는 하나로 모인다"

 tu_yan_ev.18.t:0 "입헌 공화국 선포"
 tu_yan_ev.18.d:0 "염국이 입헌 공화국을 선포하고 새 총리를 세웠다. 정당이 다시 열렸고 곧 선거가 치러질 것이라는 발표에 수도 시민들이 거리로 나섰다."
 tu_yan_ev.18.a:0 "새로운 시대가 열렸다"

 tu_yan_ev.19.t:0 "신령 신정의 선포"
 tu_yan_ev.19.d:0 "신령 대제관이 신정 체제의 성립을 선언했다. 사원의 종소리가 수도를 덮었고, 주변 나라들은 염국의 신앙이 어디까지 뻗을지 우려하고 있다."
 tu_yan_ev.19.a:0 "신령의 뜻을 받든다"

 tu_yan_ev.20.t:0 "조정의 소문"
 tu_yan_ev.20.d:0 "조정에 떠도는 소문이 끊이지 않는다. 한 대신이 황제의 측근을 비난했다는 이야기도 있고, 공석이 된 자리를 둘러싼 암투가 벌어졌다는 말도 있다. 소문의 진상을 파헤칠지 무시할지 정해야 한다."
 tu_yan_ev.20.a:0 "진상을 조사한다"
 tu_yan_ev.20.b:0 "소문을 무시한다"
 tu_yan_ev.20.c:0 "소문을 퍼뜨린 자를 벌한다"

 tu_yan_ev.21.t:0 "대운하의 상인"
 tu_yan_ev.21.d:0 "대운하를 따라 상선이 줄을 잇고 있다. 상인들은 수문의 통행료를 낮춰 달라고 청원하고, 수문을 지키는 관리들은 세수를 줄이지 말자고 맞선다. 운하가 나라의 혈맥인 만큼 결정은 신중해야 한다."
 tu_yan_ev.21.a:0 "통행료를 낮춘다"
 tu_yan_ev.21.b:0 "현행 통행료를 유지한다"
 tu_yan_ev.21.c:0 "수문을 강화해 세를 더 거둔다"

 tu_yan_ev.22.t:0 "이동도시의 행렬"
 tu_yan_ev.22.d:0 "이동도시의 행렬이 국경 근처 철길을 따라 움직이고 있다. 지나는 마을마다 식량과 의약품을 청하고 있으며, 행렬을 호위하는 병사들은 말이 없다. 행렬을 어떻게 맞을지 정해야 한다."
 tu_yan_ev.22.a:0 "보급을 지원한다"
 tu_yan_ev.22.b:0 "행렬이 그냥 지나가게 둔다"
 tu_yan_ev.22.c:0 "호위대를 막아선다"

 tu_yan_ev.23.t:0 "원석 광맥의 발견"
 tu_yan_ev.23.d:0 "산간 마을에서 아츠 원석 광맥이 발견되었다. 광부들이 이미 몰려들었고, 연구소는 원석의 성질을 시험할 인력을 요구하고 있다. 광맥을 국가가 독점할지 민간에 맡길지 정해야 한다."
 tu_yan_ev.23.a:0 "국가가 독점한다"
 tu_yan_ev.23.b:0 "민간에 개방한다"
 tu_yan_ev.23.c:0 "연구소에 맡긴다"

 tu_yan_ev.24.t:0 "지방관의 상소"
 tu_yan_ev.24.d:0 "변경의 한 지방관이 세금 감면과 병력 보충을 함께 청하는 상소를 올렸다. 상소에는 백성의 굶주림과 관리들의 횡포가 함께 적혀 있다. 조정이 어떻게 답하느냐가 변경의 민심을 좌우한다."
 tu_yan_ev.24.a:0 "세금을 감면하고 상소를 받아들인다"
 tu_yan_ev.24.b:0 "병력만 보충한다"
 tu_yan_ev.24.c:0 "상소를 묵살한다"

 tu_yan_ev.25.t:0 "신령 숭배의 축제"
 tu_yan_ev.25.d:0 "수도에서 신령을 기리는 축제가 열렸다. 등불과 노랫소리가 밤새 이어졌고, 사제들은 이 축제가 나라의 평안을 가져온다고 주장한다. 황실이 축제에 얼마나 나설지 정해야 한다."
 tu_yan_ev.25.a:0 "황실이 직접 참석한다"
 tu_yan_ev.25.b:0 "축제를 관리에게 맡긴다"
 tu_yan_ev.25.c:0 "축제를 금지한다"

 tu_yan_ev.26.t:0 "감염자 소문"
 tu_yan_ev.26.d:0 "변경 마을에서 감염자가 나왔다는 소문이 퍼지고 있다. 사실 여부는 알 수 없으며, 마을 사람들은 성문을 닫아걸었다. 소문을 잡을지, 마을을 봉쇄할지 정해야 한다."
 tu_yan_ev.26.a:0 "진상을 확인해 공개한다"
 tu_yan_ev.26.b:0 "마을을 봉쇄한다"
 tu_yan_ev.26.c:0 "소문을 무시한다"

 tu_yan_ev.27.t:0 "세 형제의 서신"
 tu_yan_ev.27.d:0 "세 형제가 각자 조정에 서신을 보냈다. 한 통은 충성을, 한 통은 불만을, 나머지 한 통은 협상을 말하고 있다. 어느 서신에 답하느냐에 따라 군벌들의 행보가 달라질 것이다."
 tu_yan_ev.27.a:0 "충성 서신에 답한다"
 tu_yan_ev.27.b:0 "불만 서신을 받아들인다"
 tu_yan_ev.27.c:0 "협상 서신을 택한다"

 tu_yan_ev.28.t:0 "소문의 진상"
 tu_yan_ev.28.d:0 "조사관이 소문의 실마리를 찾았다. 한 대신이 황제의 측근과 사사로운 거래를 했다는 기록이 나왔다. 기록을 공개해 대신을 벌할지, 덮어 조정의 평온을 지킬지 정해야 한다."
 tu_yan_ev.28.a:0 "기록을 공개하고 벌한다"
 tu_yan_ev.28.b:0 "덮고 평온을 지킨다"
 tu_yan_ev.28.c:0 "두 사람을 모두 불러 묻는다"

 tu_yan_ev.29.t:0 "용문 자치의 시험"
 tu_yan_ev.29.d:0 "보장된 자치 아래 용문의 상인 조합이 세금 문제로 파업을 시작했다. 자치를 지키려는 시민과 질서를 요구하는 관리들이 맞서고 있다. 이 시험에서 조정이 보이는 태도가 자치의 무게를 정한다."
 tu_yan_ev.29.a:0 "자치를 존중해 세금을 양보한다"
 tu_yan_ev.29.b:0 "질서를 위해 파업을 진압한다"
 tu_yan_ev.29.c:0 "중재단을 세운다"
