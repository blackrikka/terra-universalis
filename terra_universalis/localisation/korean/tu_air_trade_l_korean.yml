l_korean:
 TU_air_trade_category:0 "항공 수입"
 TU_air_trade_category_desc:0 "바다를 건널 수 없으니 하늘로 실어 온다. 수송 비행선 §Y10§!대와 민간 공장 1개를 180일 동안 계약에 쓰면 수도에 자원 §G+8§!이 들어온다. 계약이 끝나면 수송 비행선 8대가 돌아온다."
 TU_air_import_oil:0 "오리지늄 항공 수입: [From.GetName]"
 TU_air_import_oil_desc:0 "[From.GetName]에서 오리지늄을(를) 수송 비행선으로 실어 온다. 180일 동안 오리지늄 §G+8§!, 민간 공장 1개 사용, 수송 비행선 10대 투입 (끝나면 8대 귀환). [From.GetName]은(는) 정치력 +15."
