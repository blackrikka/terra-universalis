l_korean:
 TU_VIC_choice_dock_drive:0 "항만 공장 가동"
 TU_VIC_choice_dock_drive_desc:0 "항만 공장의 생산 효율이 5% 오른다."
 TU_VIC_choice_rail_works:0 "철도 공사 가속"
 TU_VIC_choice_rail_works_desc:0 "건설 속도가 10% 빨라진다."
 TU_VIC_choice_research_drive:0 "화염 연구 가속"
 TU_VIC_choice_research_drive_desc:0 "연구 속도가 3% 오른다."
 TU_VIC_choice_conscript_law:0 "징병법 확대"
 TU_VIC_choice_conscript_law_desc:0 "징집 비율이 1% 오른다."
 TU_VIC_ducal_arsenal_alt:0 "대공 영지 결속"
 TU_VIC_ducal_arsenal_alt_desc:0 "대공들이 영지 안에서 결속을 다져 치안을 굳힌다. 안정도를 얻는다."
 TU_VIC_glasgow_volunteers_alt:0 "글래스고 선동가"
 TU_VIC_glasgow_volunteers_alt_desc:0 "글래스고 선동가들이 시민을 전쟁 쪽으로 불러 모은다. 전쟁 지지를 얻는다."
 TU_VIC_duk_council_law_alt:0 "의회 치안령"
 TU_VIC_duk_council_law_alt_desc:0 "의회가 치안령을 공포해 질서를 세운다. 정치력과 안정도를 얻는다."
 TU_VIC_duk_rail_concession_alt:0 "영지 공사 청부"
 TU_VIC_duk_rail_concession_alt_desc:0 "영지 공사를 청부로 맡겨 건설 속도를 끌어올린다. 정치력 25와 건설 속도 보너스를 얻는다."
 TU_VIC_duk_war_cabinet_alt:0 "대공 참모회의"
 TU_VIC_duk_war_cabinet_alt_desc:0 "대공들이 참모회의를 열어 군 훈련을 강화한다. 정치력, 육군 경험, 안정도를 얻는다."
 TU_VIC_duk_fortified_estates_alt:0 "장원 동원령"
 TU_VIC_duk_fortified_estates_alt_desc:0 "장원의 농민을 동원해 전쟁 지지를 얻는다. 정치력 25와 전쟁 지지를 얻는다."
 TU_VIC_asl_docks_industry_alt:0 "항만 치안 연맹"
 TU_VIC_asl_docks_industry_alt_desc:0 "항만 노동자와 상인이 치안 연맹을 맺는다. 정치력 50과 안정도를 얻는다."
 TU_VIC_asl_city_watch_alt:0 "도시 밀정단"
 TU_VIC_asl_city_watch_alt_desc:0 "정보원을 풀어 도시 치안을 감시한다. 정치력 25와 안정도를 얻는다."
 TU_VIC_asl_loyal_regiment_alt:0 "시민 의용 여단"
 TU_VIC_asl_loyal_regiment_alt_desc:0 "시민 의용군을 여단으로 편성해 전쟁 지지와 안정도를 얻는다."
 TU_VIC_asl_glasgow_pilgrimage_alt:0 "성당 자선 헌금"
 TU_VIC_asl_glasgow_pilgrimage_alt_desc:0 "성당에 헌금을 모아 신앙심을 다진다. 정치력 25, 안정도와 전쟁 지지를 얻는다."
 TU_VIC_drc_flame_academies_alt:0 "화염 연구소"
 TU_VIC_drc_flame_academies_alt_desc:0 "화염 연구 기관을 세워 연구 속도를 높인다. 정치력 25와 연구 속도 보너스를 얻는다."
 TU_VIC_drc_ash_laborers_alt:0 "잿더미 용병대"
 TU_VIC_drc_ash_laborers_alt_desc:0 "잿더미 용병을 모아 군 경험을 쌓는다. 정치력 25와 육군 경험을 얻는다."
 TU_VIC_drc_secret_radio_alt:0 "전시 정보 방송"
 TU_VIC_drc_secret_radio_alt_desc:0 "정보 방송으로 여론을 전쟁 쪽으로 돌린다. 정치력 25와 전쟁 지지를 얻는다."
 TU_VIC_drc_war_fund_alt:0 "잿빛 군자금"
 TU_VIC_drc_war_fund_alt_desc:0 "군자금을 풀어 병력 훈련을 돕는다. 정치력 25와 육군 경험을 얻는다."
 TU_VIC_drc_sky_flames_alt:0 "비행 공방"
 TU_VIC_drc_sky_flames_alt_desc:0 "하늘 화염 공방에서 조종사를 훈련한다. 정치력 25와 항공 경험을 얻는다."
 TU_VIC_drc_martial_courts_alt:0 "야전 재판"
 TU_VIC_drc_martial_courts_alt_desc:0 "야전 재판으로 반대파를 조용히 정리한다. 정치력 25와 전쟁 지지를 얻는다."
 TU_VIC_drc_veteran_cadre_alt:0 "신병 교관단"
 TU_VIC_drc_veteran_cadre_alt_desc:0 "베테랑 교관단이 시민군 신병을 가르친다. 정치력 25와 전쟁 지지를 얻는다."
 TU_VIC_par_pamphlets_alt:0 "의회 연설회"
 TU_VIC_par_pamphlets_alt_desc:0 "의회 연설회로 여론을 다진다. 정치력 25와 전쟁 지지를 얻는다."
 TU_VIC_par_steel_rail_alt:0 "공공 주택 공사"
 TU_VIC_par_steel_rail_alt_desc:0 "공공 주택을 지어 민심을 얻는다. 정치력 50과 안정도를 얻는다."
 TU_VIC_par_police_reform_alt:0 "의회 민병 훈련"
 TU_VIC_par_police_reform_alt_desc:0 "의회가 민병을 훈련시켜 군 경험을 쌓는다. 정치력 25와 육군 경험을 얻는다."
 TU_VIC_par_free_elections_alt:0 "재선거 공고"
 TU_VIC_par_free_elections_alt_desc:0 "선거 관리를 재편해 민심을 가라앉힌다. 정치력 50과 안정도를 얻는다."
 TU_VIC_par_veterans_bill_alt:0 "징병법 개정"
 TU_VIC_par_veterans_bill_alt_desc:0 "징병법을 고쳐 병력을 더 모은다. 정치력 25와 징집 보너스를 얻는다."
 TU_VIC_par_civil_rights_alt:0 "법치 질서 선포"
 TU_VIC_par_civil_rights_alt_desc:0 "법치 질서를 선포해 치안을 세운다. 정치력 50과 전쟁 지지를 얻는다."
 TU_VIC_par_monarch_pension_alt:0 "귀족 기사단 소집"
 TU_VIC_par_monarch_pension_alt_desc:0 "귀족 기사단을 소집해 군 경험을 쌓는다. 정치력 50과 육군 경험을 얻는다."
 TU_VIC_par_colonial_office_alt:0 "식민 행정 개편"
 TU_VIC_par_colonial_office_alt_desc:0 "식민지 행정을 개편해 치안을 세운다. 정치력 25와 안정도를 얻는다."
 TU_VIC_kzd_mercenaries_alt:0 "주둔지 민정 행정"
 TU_VIC_kzd_mercenaries_alt_desc:0 "주둔지 민정 행정을 맡아 점령지 안정을 높인다. 정치력 25와 안정도를 얻는다."
 TU_VIC_eco_airship_fleet_alt:0 "비행선 정찰대"
 TU_VIC_eco_airship_fleet_alt_desc:0 "비행선 정찰대를 훈련해 항공 경험을 쌓는다. 정치력 25와 항공 경험을 얻는다."
