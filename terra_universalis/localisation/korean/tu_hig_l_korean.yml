 tu_hig_ev.1.t:0 "바다 끝 섬나라"
 tu_hig_ev.1.d:0 "막부의 성 위로 벚꽃이 흩날린다. 수평선 너머로 낯선 연기가 보였다는 소문이 돈다."
 tu_hig_ev.1.a:0 "문은 닫혀 있다."
 tu_hig_ev.1.b:0 "밖을 내다볼 때다."
 tu_hig_ev.20.t:0 "흑선의 내항"
 tu_hig_ev.20.d:0 "검은 연기를 뿜는 외국 함선들이 항구 앞에 닻을 내렸다. 그들은 개항을 요구한다."
 tu_hig_ev.20.a:0 "개항을 받아들인다."
 tu_hig_ev.20.b:0 "시간을 번다."
 tu_hig_ev.21.t:0 "존왕양이"
 tu_hig_ev.21.d:0 "젊은 무사들이 '천황을 받들고 오랑캐를 물리치자'고 외친다."
 tu_hig_ev.21.a:0 "그들의 뜻에 공감한다."
 tu_hig_ev.21.b:0 "단속한다."
 TU_HIG_foreign_m25_tt:0 "§R외세 영향§! -25"
 TU_HIG_foreign_m15_tt:0 "§R외세 영향§! -15"
 tu_hig_ev.22.t:0 "존왕양이 봉기"
 tu_hig_ev.22.d:0 "외세에 분노한 무사들이 외국인 거류지를 습격하고 막부를 규탄한다."
 tu_hig_ev.22.a:0 "봉기를 진압한다."
 tu_hig_ev.22.b:0 "봉기에 합류한다."
 tu_hig_ev.22.c:0 "외국인을 내보낸다."
 tu_hig_ev.23.t:0 "외국 상인의 선물"
 tu_hig_ev.23.d:0 "외국 상인들이 신기한 기계를 선물했다."
 tu_hig_ev.23.a:0 "연구한다."
 tu_hig_ev.24.t:0 "닌자의 배신"
 tu_hig_ev.24.d:0 "닌자 하나가 외국에 비밀을 팔아넘겼다."
 tu_hig_ev.24.a:0 "추적해 처단한다."
 tu_hig_ev.24.b:0 "조직을 재편한다."
 tu_hig_ev.25.t:0 "무사의 실업"
 tu_hig_ev.25.d:0 "녹봉을 잃은 무사들이 거리에서 떠돈다."
 tu_hig_ev.25.a:0 "군대에 받아들인다."
 tu_hig_ev.25.b:0 "방치한다."
 tu_hig_ev.26.t:0 "지진"
 tu_hig_ev.26.d:0 "큰 지진이 수도를 흔들었다."
 tu_hig_ev.26.a:0 "복구에 나선다."
 tu_hig_ev.27.t:0 "외국인 거류지의 소동"
 tu_hig_ev.27.d:0 "술 취한 외국 선원들이 마을 사람들과 싸움을 벌였다."
 tu_hig_ev.27.a:0 "외국 영사에게 항의한다."
 tu_hig_ev.27.b:0 "조용히 넘어간다."
 tu_hig_ev.28.t:0 "쇼군의 막부"
 tu_hig_ev.28.d:0 "막부가 다시 굳건해졌다."
 tu_hig_ev.28.a:0 "막부 만세."
 tu_hig_ev.29.t:0 "개국 극동"
 tu_hig_ev.29.d:0 "극동이 세계의 일원이 되었다."
 tu_hig_ev.29.a:0 "앞으로."
 tu_hig_ev.30.t:0 "천황 친정"
 tu_hig_ev.30.d:0 "쇼군이 대정을 천황에게 돌려주었다."
 tu_hig_ev.30.a:0 "천황 폐하 만세."
