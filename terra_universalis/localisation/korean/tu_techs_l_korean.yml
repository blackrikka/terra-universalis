 tu_landship_1_desc:0 "바다를 잃은 테라의 함대는 땅 위를 달린다. 경육상함 전대를 취역할 수 있다 (최대 2)."
 tu_landship_2:0 "중육상함"
 tu_landship_2_desc:0 "중육상함 전대 (최대 4), 이동도시 이전 디시전."
 tu_landship_3:0 "이동도시급 육상함"
 tu_landship_3_desc:0 "도시 하나가 통째로 움직이는 거대 육상함 (최대 6)."
 tu_oripathy_research:0 "광석병 연구"
 tu_oripathy_research_desc:0 "원석 결정이 몸을 잠식하는 불치병. 정제소가 늘수록 감염의 위험도 커진다."
