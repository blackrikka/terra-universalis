 tu_col_ev.1.t:0 "컬럼비아의 아침"
 tu_col_ev.1.d:0 "트라이마운트의 고층 빌딩 사이로 라인 생명의 비행선이 지나간다. 서부 개척지에서는 오늘도 보안관이 무법자를 쫓는다."
 tu_col_ev.1.a:0 "기회의 땅이다."
 tu_col_ev.10.t:0 "대통령 선거"
 tu_col_ev.10.d:0 "4년마다 돌아오는 대통령 선거다. 세 후보가 각자의 공약을 내걸었다. 당선자의 공약이 다음 4년을 정한다."
 tu_col_ev.10.a:0 "산업 후보: 공장과 철도를!"
 tu_col_ev.10.b:0 "국방 후보: 강한 컬럼비아를!"
 tu_col_ev.10.c:0 "과학 후보: 미래에 투자를!"
 tu_col_ev.11.t:0 "중간 선거"
 tu_col_ev.11.d:0 "임기 중반, 의회 선거가 열렸다. 행정부에 대한 평가가 표로 나타난다."
 tu_col_ev.11.a:0 "행정부가 신임을 얻었다."
 tu_col_ev.11.b:0 "의회가 행정부를 견제한다."
 tu_col_ev.12.t:0 "컬럼비아의 새 대통령"
 tu_col_ev.12.d:0 "컬럼비아가 새 대통령을 뽑았다."
 tu_col_ev.12.a:0 "그렇군."
 tu_col_ev.20.t:0 "라인 생명 실험 사고"
 tu_col_ev.20.d:0 "라인 생명의 연구 시설에서 폭발 사고가 일어났다. 연구소는 원인을 밝히지 않고 있다."
 tu_col_ev.20.a:0 "연구소를 감사한다."
 tu_col_ev.20.b:0 "연구는 계속되어야 한다."
 tu_col_ev.21.t:0 "연구의 돌파구"
 tu_col_ev.21.d:0 "라인 생명의 한 연구부가 예상보다 일찍 성과를 냈다."
 tu_col_ev.21.a:0 "훌륭하다."
 tu_col_ev.22.t:0 "라인 생명의 야망"
 tu_col_ev.22.d:0 "라인 생명의 이사회가 연구소의 자치권을 요구했다. 국가의 간섭 없이 하늘 프로젝트를 진행하겠다는 것이다."
 tu_col_ev.22.a:0 "자치권을 준다."
 tu_col_ev.22.b:0 "국가가 통제한다."
 tu_col_ev.23.t:0 "하늘 너머"
 tu_col_ev.23.d:0 "크리스틴 라이트의 연구가 마침내 하늘의 벽을 넘었다. 테라 어느 나라도 가 보지 못한 곳이다."
 tu_col_ev.23.a:0 "새로운 시대다."
 tu_col_ev.24.t:0 "서부의 무법자들"
 tu_col_ev.24.d:0 "서부 개척지의 무법자 갱단이 열차를 털었다."
 tu_col_ev.24.a:0 "현상금을 건다."
 tu_col_ev.24.b:0 "군을 보낸다."
 tu_col_ev.25.t:0 "이동 도시의 도착"
 tu_col_ev.25.d:0 "황야를 떠돌던 이동 도시 하나가 컬럼비아 편입을 요청했다."
 tu_col_ev.25.a:0 "받아들인다."
 tu_col_ev.25.b:0 "돌려보낸다."
 tu_col_ev.26.t:0 "독립 기념일"
 tu_col_ev.26.d:0 "빅토리아에서 독립한 날을 기념하는 행진이 열렸다. 몇몇 연설가는 빅토리아를 거칠게 비난했다."
 tu_col_ev.26.a:0 "자유를 기억하자."
 tu_col_ev.27.t:0 "볼리바르의 파벌"
 tu_col_ev.27.d:0 "우리가 지원한 볼리바르 파벌이 세력을 넓혔다. 그들은 더 많은 지원을 원한다."
 tu_col_ev.27.a:0 "더 지원한다."
 tu_col_ev.27.b:0 "이 정도면 충분하다."
 tu_col_ev.28.t:0 "공화국 수호"
 tu_col_ev.28.d:0 "컬럼비아는 헌법과 선거를 지키기로 했다."
 tu_col_ev.28.a:0 "자유를 위하여."
 tu_col_ev.29.t:0 "기업 공화국"
 tu_col_ev.29.d:0 "기업 대표들이 각료 회의에 자리를 얻었다."
 tu_col_ev.29.a:0 "효율이 곧 번영이다."
 tu_col_ev.30.t:0 "개척자 연방"
 tu_col_ev.30.d:0 "개척지의 보안관과 장군들이 수도에 들어왔다."
 tu_col_ev.30.a:0 "서부의 방식대로."
