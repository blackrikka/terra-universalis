l_korean:
 tu_urs_ev.1.t:0 "제국의 직접 통치"
 tu_urs_ev.1.d:0 "황제는 대공회의의 권한을 접고 모든 명령을 옥좌에서 직접 내리기로 했다. 근위대가 궁정 복도를 채우고, 대공들은 공개 석상에서 이견을 말하지 못한다. 그러나 오래 억눌린 불만은 가장 조용한 곳에서 자란다. 이제 우르수스의 운명은 한 사람의 판단에 달렸다."
 tu_urs_ev.1.a:0 "짐이 곧 법이다"
 tu_urs_ev.1.b:0 "대공 한 명에게 자리를 내주다"
 tu_urs_ev.1.c:0 "칙령을 잠시 거두다"
 tu_urs_ev.2.t:0 "군정 위원회 설치"
 tu_urs_ev.2.d:0 "황실의 무능에 지친 전쟁 장관들이 군정 위원회를 세웠다. 병영마다 동원 명령이 내려지고, 도시의 이동 요새는 전선으로 방향을 돌린다. 민간 관료들은 하나씩 자리를 빼앗기고 있다. 군정은 질서를 약속하지만, 그 질서가 누구를 향할지는 아직 아무도 모른다."
 tu_urs_ev.2.a:0 "전시 체제를 전면 가동하다"
 tu_urs_ev.2.b:0 "군정에 민정 일부를 허락하다"
 tu_urs_ev.2.c:0 "예비병력만 소집하다"
 tu_urs_ev.3.t:0 "귀족 회의의 의장석"
 tu_urs_ev.3.d:0 "대공과 백작들이 원로원을 열어 합의를 받아들였다. 세습 영지의 자치권은 보장되고, 황실에는 의장석만 남는다. 귀족들은 이 타협을 승리로 여기며 축배를 든다. 하지만 원로원에 기대는 황실은 다음 칙령마다 그들의 눈치를 봐야 한다."
 tu_urs_ev.3.a:0 "원로원의 결정을 존중하다"
 tu_urs_ev.3.b:0 "귀족 연합에 힘을 실어 주다"
 tu_urs_ev.3.c:0 "의장석만 받고 물러서다"
 tu_urs_ev.4.t:0 "개혁 헌장의 서명"
 tu_urs_ev.4.d:0 "학생자치단과 개혁파 관료들이 마침내 헌장 초안에 서명했다. 옥좌는 권한을 나누겠다고 약속했지만, 그 약속이 어디까지 지켜질지는 아무도 장담하지 못한다. 수도의 신문들은 처음으로 황실을 비판하는 기사를 싣기 시작했다. 개혁은 시작되었고, 되돌리기에는 이미 늦었다."
 tu_urs_ev.4.a:0 "헌장을 그대로 공포하다"
 tu_urs_ev.4.b:0 "조항을 줄여 공포하다"
 tu_urs_ev.4.c:0 "헌장을 보류하다"
 tu_urs_ev.5.t:0 "강경파 장군의 부임"
 tu_urs_ev.5.d:0 "국경 수비대를 지휘하던 강경파 장군이 황실의 부름을 받고 수도로 돌아왔다. 그는 체르노보그 사태 이후 황실에 맞서는 모든 세력을 적으로 간주한다고 공언했다. 그의 부하들은 이미 병영 안에서 그의 명령만을 따르고 있다. 그를 옹호하는 자들과 두려워하는 자들이 궁정 안에서 갈라서기 시작했다."
 tu_urs_ev.5.a:0 "전쟁 준비를 명하다"
 tu_urs_ev.5.b:0 "그를 회유해 협상 자리에 앉히다"
 tu_urs_ev.6.t:0 "체르노보그 대응 계획"
 tu_urs_ev.6.d:0 "체르노보그 사태의 여파가 아직 가라앉지 않았다. 감염 지역을 봉쇄하자는 계획과 난민을 받아들이자는 계획이 황실 회의에서 맞서고 있다. 전선 사령부는 봉쇄를 요구하지만, 수도의 여론은 구호를 원한다. 이 결정은 곧 우르수스의 얼굴을 바꿀 것이다."
 tu_urs_ev.6.a:0 "감염 지역을 봉쇄하다"
 tu_urs_ev.6.b:0 "난민을 받아들이다"
 tu_urs_ev.7.t:0 "기동 사단의 지휘관"
 tu_urs_ev.7.d:0 "기동 사단을 창설하는 임무를 맡은 원수가 정해졌다. 그는 철도와 장갑 열차를 묶는 새로운 전술을 설계하고 있다. 병사들은 그를 철길 위의 장군이라 부르며 따른다. 빠른 기동은 승리를 약속하지만, 보급선이 끊기면 그 약속도 함께 끊어진다."
 tu_urs_ev.7.a:0 "전선에 기동 사단을 투입하다"
 tu_urs_ev.7.b:0 "산업 생산을 먼저 확충하다"
 tu_urs_ev.8.t:0 "절대 왕관의 빛"
 tu_urs_ev.8.d:0 "궁정 공방이 새 왕관의 세공을 마쳤다. 왕관은 제국의 권위를 상징하는 보물로 공개되고, 대공들조차 고개를 숙이고 그 앞을 지나야 한다. 백성들은 왕관을 보려고 광장으로 몰려든다. 빛이 강할수록 그림자도 짙어진다는 말이 궁정에 돈다."
 tu_urs_ev.8.a:0 "왕관을 대중 앞에 전시하다"
 tu_urs_ev.8.b:0 "왕관을 궁정 깊숙이 감추다"
 tu_urs_ev.9.t:0 "영원한 옥좌"
 tu_urs_ev.9.d:0 "옥좌의 세습 법이 다시 쓰였다. 황제의 후계는 혈통과 의례로 못 박히고, 이후의 모든 칙령은 옥좌의 이름으로 공포된다. 연로한 대신들은 눈물을 머금고 서명했다. 영원이라는 말은 아름답지만, 역사는 영원한 옥좌가 얼마나 드물었는지를 보여 준다."
 tu_urs_ev.9.a:0 "세습 의례를 성대히 치르다"
 tu_urs_ev.9.b:0 "세습 법을 다듬어 실무에 맞추다"
 tu_urs_ev.9.c:0 "조용히 서명만 하다"
 tu_urs_ev.10.t:0 "근위대의 검"
 tu_urs_ev.10.d:0 "근위대의 정예 검사들이 새 지휘관을 맞이했다. 그는 황궁의 문을 지키는 것이 곧 제국을 지키는 것이라고 말한다. 검사들은 칼날이 무뎌지기 전에 훈련을 다시 시작했다. 그러나 황궁 밖에서는 그들이 누구를 지키는지 묻는 목소리가 들려온다."
 tu_urs_ev.10.a:0 "검사들을 혹독하게 단련하다"
 tu_urs_ev.10.b:0 "근위 병력을 늘리다"
 tu_urs_ev.11.t:0 "끝나지 않는 군정"
 tu_urs_ev.11.d:0 "전쟁이 끝났는데도 군정은 권력을 내려놓지 않는다. 병영에서 흘러나온 명령이 이제 행정 기관의 명령을 대신한다. 전선의 장군들은 황제보다 자기 부하를 더 믿는다고 말한다. 군정이 언제 끝나냐고 묻는 자는 이제 반역자로 불린다."
 tu_urs_ev.11.a:0 "군정을 계속 유지하다"
 tu_urs_ev.11.b:0 "군정을 해체하고 행정을 되찾다"
 tu_urs_ev.12.t:0 "대공 영지의 민병대장"
 tu_urs_ev.12.d:0 "대공들은 자기 영지마다 민병대를 세우고 있다. 그중 가장 충직한 민병대장이 황실의 허가를 받아 공식 직함을 얻었다. 그는 농민들을 징집하는 대신 세금을 면제해 주겠다고 약속했다. 민병은 빠르게 늘어나고, 황실이 그것을 통제할 수 있을지는 불분명하다."
 tu_urs_ev.12.a:0 "민병대 징집을 허가하다"
 tu_urs_ev.12.b:0 "민병대의 지휘권을 황실에 귀속시키다"
 tu_urs_ev.13.t:0 "이동하는 수도"
 tu_urs_ev.13.d:0 "귀족들의 이동 도시가 첫 목적지를 확정했다. 철도와 캐러밴 노선을 따라 궁정과 상단이 함께 움직인다. 도시의 시장들은 자치를 주장하지만, 도시가 움직이는 동안 누가 세금을 걷을지는 여전히 논쟁거리다. 수도가 바퀴를 달았다는 농담이 시장 골목에 퍼졌다."
 tu_urs_ev.13.a:0 "이동 도시에 세금 권한을 주다"
 tu_urs_ev.13.b:0 "교역로를 통행료로 묶다"
 tu_urs_ev.14.t:0 "수도 철도 종착역"
 tu_urs_ev.14.d:0 "수도의 새 철도 종착역이 완공되었다. 역사 아래에는 군수 물자가 쌓이고, 노동자들은 밤낮으로 석탄을 실어 나른다. 시민들은 역사의 웅장함에 감탄하지만 노동자의 임금은 그대로다. 종착역은 제국의 심장이 될 수도, 가장 먼저 멈춰 설 곳이 될 수도 있다."
 tu_urs_ev.14.a:0 "종착역에 군수 창고를 확충하다"
 tu_urs_ev.14.b:0 "노동자 임금을 올리다"
 tu_urs_ev.15.t:0 "카르텔의 유산"
 tu_urs_ev.15.d:0 "카르텔 연합이 제국 경제의 한 축을 차지했다. 그들이 남긴 공장과 은행은 여전히 가동 중이고, 그들의 계약서가 항구마다 붙어 있다. 황실은 그들의 자본이 필요하지만, 그 힘이 황제의 명령을 넘어서지 않을지 걱정한다. 이 유산은 누구의 손에 돌아갈 것인가?"
 tu_urs_ev.15.a:0 "카르텔 자본을 국가 사업에 흡수하다"
 tu_urs_ev.15.b:0 "카르텔과 손잡고 세금을 나누다"
 tu_urs_ev.16.t:0 "우르수스의 재통일"
 tu_urs_ev.16.d:0 "북방의 대공령과 남방의 영주들이 마침내 하나의 깃발 아래 모였다. 황제는 통일의 칙명을 선포했고, 종소리가 국경 너머까지 퍼진다. 이웃 나라들은 그 소리를 경고로 받아들인다. 이제 우르수스는 하나의 나라로서 역사에 이름을 올린다."
 tu_urs_ev.16.a:0 "통일을 축하하다"
 tu_urs_ev.17.t:0 "헌장의 완성"
 tu_urs_ev.17.d:0 "개혁 헌장의 마지막 조항이 공포되었다. 신문은 자유를 외치고, 학생들은 광장에서 노래를 부른다. 그러나 오래된 귀족과 군부는 조용히 다음 기회를 엿보고 있다. 헌장이 완성된 날, 우르수스는 처음으로 스스로에게 질문을 던졌다."
 tu_urs_ev.17.a:0 "개혁의 완성을 지켜보다"
 tu_urs_ev.18.t:0 "카르텔 원수의 등장"
 tu_urs_ev.18.d:0 "카르텔 연합이 자신들의 원수를 세웠다. 그는 군복 대신 상인의 외투를 입고 열병식에 나타났다. 공장 굴뚝이 일제히 연기를 뿜고, 항구의 기중기가 깃발을 올린다. 카르텔의 힘이 군대의 힘과 같아진 순간이다."
 tu_urs_ev.18.a:0 "카르텔 원수를 공식 인정하다"
 tu_urs_ev.19.t:0 "철의 정권"
 tu_urs_ev.19.d:0 "군정이 철의 정권이라는 이름을 달았다. 방송은 전선의 승리를 되풀이하고, 도시마다 감시 초소가 들어섰다. 시민들은 말을 아끼고, 아이들은 행진곡을 배운다. 철은 단단하지만 너무 세게 쥐면 부서진다는 말은 아무도 하지 않는다."
 tu_urs_ev.19.a:0 "철의 정권을 공식 선포하다"
 tu_urs_ev.20.t:0 "대공들의 다툼"
 tu_urs_ev.20.d:0 "대공들이 황실 회의 뒤에서 격하게 다투었다. 한 대공이 다른 대공의 영지 세입을 가로챘다는 소문이 돈다. 황실은 누구의 편을 들지 고민한다. 이 다툼을 어떻게 다루느냐에 따라 다음 회의의 표결이 달라질 것이다."
 tu_urs_ev.20.a:0 "빚을 갚아 중재하다"
 tu_urs_ev.20.b:0 "재산을 몰수해 본보기를 보이다"
 tu_urs_ev.20.c:0 "회의를 무시하다"
 tu_urs_ev.21.t:0 "근위대의 불만"
 tu_urs_ev.21.d:0 "황궁 근위대의 봉급이 두 달째 밀려 있다. 병사들이 막사 앞에 모여 언성을 높이고, 일부는 황궁 정문을 떠나겠다고 외친다. 장교들은 상황을 숨기려 하지만 소문은 이미 수도에 퍼졌다. 근위대의 충성은 봉급 장부 위에 놓여 있다."
 tu_urs_ev.21.a:0 "봉급을 정상화하다"
 tu_urs_ev.21.b:0 "불만 세력을 해산시키다"
 tu_urs_ev.22.t:0 "감염 지대의 난민"
 tu_urs_ev.22.d:0 "체르노보그 감염 지대에서 밀려난 난민들이 국경 도시 외곽에 천막을 치기 시작했다. 아이들은 굶고, 병든 자들은 약을 찾고 있다. 군은 감염이 퍼질까 우려하며 출입을 막자고 주장한다. 어느 쪽을 택하든 역사는 이 선택을 기억할 것이다."
 tu_urs_ev.22.a:0 "난민 수용소를 열다"
 tu_urs_ev.22.b:0 "국경을 봉쇄하다"
 tu_urs_ev.22.c:0 "사건을 조용히 덮다"
 tu_urs_ev.23.t:0 "학생자치단의 시위"
 tu_urs_ev.23.d:0 "학생자치단이 대학 광장을 가득 메운 채 헌장의 시행을 요구하고 있다. 연설자는 황실의 약속을 한 줄씩 읽어 내리며 증거를 요구한다. 경찰은 물러서지 않겠다고 말하고, 학생들도 물러서지 않겠다고 답한다. 이 긴장은 어느 쪽이 먼저 한 발 물러서느냐에 달려 있다."
 tu_urs_ev.23.a:0 "헌장을 실행하겠다고 약속하다"
 tu_urs_ev.23.b:0 "시위를 강제로 해산하다"
 tu_urs_ev.23.c:0 "시위를 무시하다"
 tu_urs_ev.24.t:0 "북방 원정의 준비"
 tu_urs_ev.24.d:0 "겨울 전선 너머 북방 땅을 향한 원정 계획이 황실 참모부에 올라왔다. 참모들은 철도가 얼어붙기 전에 출발해야 한다고 주장한다. 병사들은 낯선 설원을 두려워하지만, 장교들은 승리의 기회를 외친다. 원정이 성공하면 영광이, 실패하면 재앙이 찾아올 것이다."
 tu_urs_ev.24.a:0 "원정을 승인하다"
 tu_urs_ev.24.b:0 "원정을 연기하다"
 tu_urs_ev.25.t:0 "리유니온의 사절"
 tu_urs_ev.25.d:0 "리유니온이 황실에 사절을 보내 휴전을 청하고 있다. 그들의 대표는 체르노보그의 감염자들도 우르수스의 백성이었다고 말한다. 강경파는 사절을 쫓아내라고 요구하지만, 전선의 병사들은 전쟁에 지쳐 있다. 사절을 받을지 여부가 곧 전쟁의 방향을 정할 것이다."
 tu_urs_ev.25.a:0 "협상 사절단을 보내다"
 tu_urs_ev.25.b:0 "사절을 쫓아내다"
 tu_urs_ev.25.c:0 "답을 미루다"
 tu_urs_ev.26.t:0 "궁정 스캔들"
 tu_urs_ev.26.d:0 "황실 조정 개편 과정에서 고위 관료가 공금을 빼돌린 증거가 드러났다. 그를 감싸 온 인물들이 황궁 안에 여럿 있다. 조사가 시작되면 그물에 걸리는 이름에는 황실의 가까운 친척도 있을지 모른다. 덮을 것인가, 파헤칠 것인가."
 tu_urs_ev.26.a:0 "스캔들을 덮다"
 tu_urs_ev.26.b:0 "관련자를 숙청하다"
 tu_urs_ev.27.t:0 "감염자 시민권 청원"
 tu_urs_ev.27.d:0 "감염자 공동체가 시민권과 노동권을 보장하라는 청원서를 제출했다. 청원서에는 수천 명의 서명이 적혀 있고, 그중에는 공장 노동자와 학생들의 이름도 있다. 지방 관리들은 이를 위험한 선동으로 몰아가고 있다. 이 청원을 받아들일지는 우르수스가 누구를 국민으로 여기는지 보여 줄 것이다."
 tu_urs_ev.27.a:0 "청원을 받아들이다"
 tu_urs_ev.27.b:0 "청원을 거부하다"
 tu_urs_ev.28.t:0 "수용소의 소문"
 tu_urs_ev.28.d:0 "수용소에서 감염 의심 환자가 나왔다는 소문이 수도로 번졌다. 신문들은 진상을 묻고, 야당 기자들은 황실이 사실을 숨긴다고 비난한다. 수용소의 의사들은 아직 확인되지 않은 보고만 가지고 있다고 말한다. 소문이 사실로 끝날지 거짓으로 끝날지는 이제 황실의 입에 달려 있다."
 tu_urs_ev.28.a:0 "진상을 공개하다"
 tu_urs_ev.28.b:0 "소문을 막다"
 tu_urs_ev.29.t:0 "학생 헌장의 시행"
 tu_urs_ev.29.d:0 "학생자치단의 시행 요구에 황실이 답할 차례가 왔다. 헌장의 몇몇 조항은 대학의 자치와 언론의 자유를 명시하고 있다. 관료들은 실행 방법을 두고 다투고, 학생 대표들은 약속한 날짜를 요구한다. 헌장이 실행된다면 우르수스는 새로운 시대로 들어설 것이다."
 tu_urs_ev.29.a:0 "헌장을 시행하다"
 tu_urs_ev.29.b:0 "헌장을 찢어 버리다"
 TU_URS_ev_chernobog_shadow:0 "체르노보그의 그림자"
 TU_URS_ev_chernobog_shadow_desc:0 "감염 지대에서 밀려난 난민과 소문이 수도에 그림자를 드리운다. 안정도가 떨어지고 전쟁 지지가 조금 오른다."
 TU_URS_ev_student_charter:0 "학생 헌장"
 TU_URS_ev_student_charter_desc:0 "학생자치단이 얻어 낸 헌장의 약속이 대학과 신문을 움직인다. 정치력 획득이 늘고 안정도가 오른다."
