l_korean:
 TU_KJE_harsh_winter:0 "혹독한 겨울"
 TU_KJE_harsh_winter_desc:0 "눈이 길을 막고 산을 막는다. 4월이 되면 풀린다."
 TU_KJE_mild_winter:0 "견딜 만한 겨울"
 TU_KJE_mild_winter_desc:0 "월동 준비 덕분에 겨울을 견딜 만하다. 4월이 되면 풀린다."
 TU_KJE_three_houses:0 "세 가문"
 TU_KJE_three_houses_desc:0 "엔시오다스, 성녀의 가문, 구귀족. 세 가문이 쉐라그를 나눠 쥐고 있다."
