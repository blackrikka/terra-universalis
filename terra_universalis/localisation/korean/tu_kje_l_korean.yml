 tu_kje_ev.1.t:0 "만년설 아래"
 tu_kje_ev.1.d:0 "칼란 무역의 화물열차가 산길을 오르고, 그 옆으로 순례자들이 성녀의 신전으로 걸어간다."
 tu_kje_ev.1.a:0 "새 시대가 오고 있다."
 tu_kje_ev.1.b:0 "옛것을 지켜야 한다."
 tu_kje_ev.10.t:0 "겨울이 왔다"
 tu_kje_ev.10.d:0 "첫눈이 산길을 덮었다. 앞으로 다섯 달, 쉐라그는 눈 속에 갇힌다."
 tu_kje_ev.10.a:0 "버틴다."
 tu_kje_ev.11.t:0 "봄의 해빙"
 tu_kje_ev.11.d:0 "눈이 녹고 산길이 열렸다."
 tu_kje_ev.11.a:0 "일을 시작하자."
 tu_kje_ev.20.t:0 "세 가문의 회담"
 tu_kje_ev.20.d:0 "엔시오다스 가문의 실버애쉬, 성녀, 구귀족의 원로가 한 방에 앉았다. 침묵이 길었다."
 tu_kje_ev.20.a:0 "실버애쉬의 말에 귀 기울인다."
 tu_kje_ev.20.b:0 "성녀의 말에 귀 기울인다."
 tu_kje_ev.20.c:0 "누구의 편도 들지 않는다."
 tu_kje_ev.21.t:0 "눈사태"
 tu_kje_ev.21.d:0 "거대한 눈사태가 산골 마을을 덮쳤다."
 tu_kje_ev.21.a:0 "구조대를 보낸다."
 tu_kje_ev.21.b:0 "봄을 기다린다."
 tu_kje_ev.22.t:0 "칼란 무역의 스캔들"
 tu_kje_ev.22.d:0 "칼란 무역이 외국 자본에 광산을 넘겼다는 의혹이 제기됐다."
 tu_kje_ev.22.a:0 "실버애쉬를 믿는다."
 tu_kje_ev.22.b:0 "조사한다."
 tu_kje_ev.23.t:0 "성녀의 기적"
 tu_kje_ev.23.d:0 "성녀의 기도 뒤 오래 앓던 아이가 일어났다는 소문이 퍼졌다."
 tu_kje_ev.23.a:0 "신을 찬양하라."
 TU_KJE_modern_m3_tt:0 "§Y전통§! +3 (근대화 -3)"
 tu_kje_ev.24.t:0 "철도 반대 시위"
 tu_kje_ev.24.d:0 "성스러운 봉우리를 지나는 철도 계획에 순례자들이 반대한다."
 tu_kje_ev.24.a:0 "계획을 밀어붙인다."
 tu_kje_ev.24.b:0 "노선을 바꾼다."
 tu_kje_ev.25.t:0 "구귀족의 불만"
 tu_kje_ev.25.d:0 "구귀족들이 두 가문에 밀려 설 자리가 없다고 호소한다."
 tu_kje_ev.25.a:0 "영지를 보장한다."
 tu_kje_ev.25.b:0 "무시한다."
 tu_kje_ev.26.t:0 "산 너머 손님"
 tu_kje_ev.26.d:0 "외국 기술자들이 산을 넘어왔다."
 tu_kje_ev.26.a:0 "환영한다."
 tu_kje_ev.27.t:0 "설산 축제"
 tu_kje_ev.27.d:0 "온 나라가 눈 조각과 노래로 겨울을 즐겼다."
 tu_kje_ev.27.a:0 "즐겁다."
 tu_kje_ev.28.t:0 "근대 쉐라그"
 tu_kje_ev.28.d:0 "실버애쉬가 쉐라그의 미래를 이끈다."
 tu_kje_ev.28.a:0 "전진."
 tu_kje_ev.29.t:0 "성녀의 신정"
 tu_kje_ev.29.d:0 "성녀가 쉐라그드르의 이름으로 나라를 맡았다."
 tu_kje_ev.29.a:0 "신의 뜻대로."
 tu_kje_ev.30.t:0 "세 가문의 화합"
 tu_kje_ev.30.d:0 "세 가문이 처음으로 한 깃발 아래 섰다."
 tu_kje_ev.30.a:0 "함께."
