l_korean:
 # generated by tools/focusgen/vic_acts.py (spec 80)
 TU_VIC_a1_glasgow:0 "글래스고 거점 확보"
 TU_VIC_a1_glasgow_desc:0 "새 수도 글래스고의 거리와 항만을 단단히 쥔다. 왕당 공작들의 영향력이 오른다."
 TU_VIC_a1_royal_guard:0 "왕실 근위대 유산"
 TU_VIC_a1_royal_guard_desc:0 "옛 근위대의 이름으로 충성을 모은다. 왕당 공작들의 영향력이 크게 오른다."
 TU_VIC_a1_mobilize:0 "공작군 동원령"
 TU_VIC_a1_mobilize_desc:0 "공작들의 영지군을 끌어모은다. 귀족 세력(캐스터·애버콘)이 힘을 얻고, 웰링턴이 소외된다. (자구군 접촉·웰링턴 회유와 택일)"
 TU_VIC_a1_selfsalv:0 "자구군 비밀 접촉"
 TU_VIC_a1_selfsalv_desc:0 "론디니움 안의 자구군과 선을 댄다. 개혁 세력(스태퍼드·고도딘)이 힘을 얻고 파편이 늦춰진다."
 TU_VIC_a1_wellington:0 "웰링턴 회유"
 TU_VIC_a1_wellington_desc:0 "웰링턴 공작을 회유해 군부를 묶는다. 타라 동조 세력(웰링턴·윈더미어)이 힘을 얻고 캐스터가 반발한다."
 TU_VIC_a1_noble_levy:0 "영지 징집령"
 TU_VIC_a1_noble_levy_desc:0 "영지마다 장정을 뽑는다. 병력이 늘지만 안정도가 조금 깎인다."
 TU_VIC_a1_noble_council:0 "귀족 의회 장악"
 TU_VIC_a1_noble_council_desc:0 "귀족 의회의 표를 묶는다. 캐스터·애버콘의 영향력이 오르고 정치력을 얻는다."
 TU_VIC_a1_noble_army:0 "공작군 편제"
 TU_VIC_a1_noble_army_desc:0 "영지군을 한 지휘 아래 묶는다. 경험치와 보병 연구 보너스를 얻는다."
 TU_VIC_a1_reform_press:0 "지하 인쇄소"
 TU_VIC_a1_reform_press_desc:0 "론디니움에서 새어 나온 소식을 찍어 퍼뜨린다. 스태퍼드의 영향력이 오르고 안정도가 오른다."
 TU_VIC_a1_reform_rhodes:0 "로도스 침투조 연락"
 TU_VIC_a1_reform_rhodes_desc:0 "로도스 아일랜드 침투조와 연락선을 만든다. 파편이 늦춰진다."
 TU_VIC_a1_reform_militia:0 "시민 무장"
 TU_VIC_a1_reform_militia_desc:0 "시민들에게 소총을 나눠 준다. 인력과 보병 장비를 얻는다."
 TU_VIC_a1_tara_envoy:0 "타라 밀사"
 TU_VIC_a1_tara_envoy_desc:0 "더블린의 타라 세력과 밀사를 주고받는다. 웰링턴과 윈더미어의 영향력이 오른다."
 TU_VIC_a1_tara_ls:0 "육상전함 정비"
 TU_VIC_a1_tara_ls_desc:0 "웰링턴의 육상전함을 정비한다. 포병 연구 보너스와 웰링턴 충성도."
 TU_VIC_a1_tara_junta:0 "군부 결속"
 TU_VIC_a1_tara_junta_desc:0 "군부 공작들을 한 편으로 묶는다. 윈더미어 충성도와 육군 경험치."
 TU_VIC_a1_siege:0 "론디니움 포위망 구축"
 TU_VIC_a1_siege_desc:0 "론디니움 둘레에 요새와 보급선을 쌓는다. 어느 쪽에 비중을 두었든 이어서 할 수 있다."
 TU_VIC_a1_shard_stop:0 "파편 저지 작전"
 TU_VIC_a1_shard_stop_desc:0 "론디니움 탈환 작전을 연다. 카즈델을 상대로 영유권 전쟁 목표를 얻고 파편을 늦춘다."
 TU_VIC_a1_end:0 "사변의 종결"
 TU_VIC_a1_end_desc:0 "론디니움을 되찾았거나 파편이 발동한 뒤에 찍을 수 있다. 세력 균형이 2막의 정치 루트를 정한다."
 TU_VIC_kz_head:0 "강탈 조약"
 TU_VIC_kz_head_desc:0 "카즈델이 '보호'를 대가로 빅토리아의 공업을 요구한다. 서명하면 카즈델의 보호국이 된다."
 TU_VIC_kz_levy:0 "공업 징발"
 TU_VIC_kz_levy_desc:0 "카즈델이 공장 가동분을 징발해 간다. 대신 정치력을 얻는다."
 TU_VIC_kz_governor:0 "총독부 협력"
 TU_VIC_kz_governor_desc:0 "총독부에 협력해 숨 돌릴 틈을 번다. 안정도가 오르지만 저항이 식는다."
 TU_VIC_kz_dukes:0 "공작령 보장"
 TU_VIC_kz_dukes_desc:0 "공작들의 영지를 보장하고 충성을 산다. 모든 공작의 충성도가 오른다."
 TU_VIC_kz_resist:0 "지하 저항망"
 TU_VIC_kz_resist_desc:0 "징발 속에서 지하 저항망을 짠다. 인력과 육군 경험치."
 TU_VIC_kz_arms:0 "비밀 무기고"
 TU_VIC_kz_arms_desc:0 "징발에서 빼돌린 무기를 숨긴다. 보병 장비와 군수 공장."
 TU_VIC_kz_strikes:0 "공장 파업 조직"
 TU_VIC_kz_strikes_desc:0 "공장마다 파업을 조직해 징발을 늦춘다. 공작들의 불만이 영지마다 번진다."
 TU_VIC_kz_shard:0 "파편 해체 공작"
 TU_VIC_kz_shard_desc:0 "자구군과 로도스의 도움으로 파편을 해체한다. 재앙 국민정신이 사라진다."
 TU_VIC_kz_uprising:0 "독립 봉기"
 TU_VIC_kz_uprising_desc:0 "모든 것을 걸고 봉기한다. 카즈델의 보호국에서 벗어난다."
 TU_VIC_kz_free:0 "자유 빅토리아"
 TU_VIC_kz_free_desc:0 "강탈은 끝났다. 징발 국민정신이 사라지고 공업이 돌아온다."
 TU_VIC_asl_exemplars:0 "모범군 개편"
 TU_VIC_asl_exemplars_desc:0 "아슬란 복위군의 정예를 '모범군'으로 개편한다. '특수 프로젝트'에서 모범군 사단을 세울 수 있다."
 TU_VIC_red_fog:0 "붉은 안개"
 TU_VIC_red_fog_desc:0 "론디니움 하늘의 붉은 안개 아래 왕좌는 비어 있고, 사람들은 불안해한다. 안정도 -5%, 정치력 -10%, 전쟁 지지 -5%. 사변이 끝나면 걷힌다."
 TU_VIC_kz_extortion:0 "카즈델의 강탈"
 TU_VIC_kz_extortion_desc:0 "카즈델이 보호를 대가로 공업을 징발한다. 공장 출력 -25%, 안정도 -10%."
 tu_vic_ev.41.t:0 "론디니움 사변의 끝"
 tu_vic_ev.41.d:0 "사변은 끝났다. 어느 공작 세력이 가장 큰 힘을 얻었느냐가 빅토리아의 다음 길을 정한다. 한 세력의 영향력이 §Y80§! 이상이면 그 루트를 고를 수 있다.\n\n귀족 [?TU_VIC_f_noble|0] · 왕당 [?TU_VIC_f_royal|0] · 타라 [?TU_VIC_f_tara|0] · 개혁 [?TU_VIC_f_reform|0]"
 tu_vic_ev.41.a:0 "대공 의회가 이끈다. (귀족)"
 tu_vic_ev.41.b:0 "아슬란이 왕위에 오른다. (왕당)"
 tu_vic_ev.41.c:0 "타라의 불꽃이 타오른다. (타라)"
 tu_vic_ev.41.e:0 "비나와 자구군의 의회. (개혁)"
 tu_vic_ev.41.f:0 "가장 큰 세력을 따른다."
 tu_vic_ev.41.g:0 "카즈델의 '보호'를 받아들인다."
