 tu_bol_ev.20.t:0 "공세의 결과"
 tu_bol_ev.20.d:0 "공세에 나섰던 부대들이 보고서를 보내왔다."
 tu_bol_ev.20.a:0 "전선을 밀어냈다!"
 tu_bol_ev.20.b:0 "교착 상태다."
 tu_bol_ev.20.c:0 "공세가 실패했다."
 tu_bol_ev.21.t:0 "탈영"
 tu_bol_ev.21.d:0 "전쟁에 지친 병사들이 무리 지어 탈영했다."
 tu_bol_ev.21.a:0 "탈영병을 쫓는다."
 tu_bol_ev.21.b:0 "사면한다."
 tu_bol_ev.22.t:0 "반전 시위"
 tu_bol_ev.22.d:0 "수도에서 '전쟁을 끝내라'는 시위가 일어났다."
 tu_bol_ev.22.a:0 "협상을 약속한다."
 tu_bol_ev.22.b:0 "해산시킨다."
 tu_bol_ev.23.t:0 "컬럼비아의 요구"
 tu_bol_ev.23.d:0 "컬럼비아가 원조의 대가로 광산 채굴권을 요구한다."
 tu_bol_ev.23.a:0 "받아들인다."
 tu_bol_ev.23.b:0 "거절한다."
 tu_bol_ev.24.t:0 "빅토리아의 요구"
 tu_bol_ev.24.d:0 "빅토리아가 원조의 대가로 항구 사용권을 요구한다."
 tu_bol_ev.24.a:0 "받아들인다."
 tu_bol_ev.24.b:0 "거절한다."
 TU_BOL_weariness_m20_tt:0 "§R전쟁 피로§! -20"
 tu_bol_ev.25.t:0 "내전 종식"
 tu_bol_ev.25.d:0 "마지막 반군 지도자가 무기를 내려놓았다. 볼리바르에 처음으로 평화가 왔다."
 tu_bol_ev.25.a:0 "평화다!"
 tu_bol_ev.26.t:0 "반군의 협상 제의"
 tu_bol_ev.26.d:0 "반군 지도자 하나가 비밀리에 협상을 제의했다."
 tu_bol_ev.26.a:0 "응한다."
 tu_bol_ev.26.b:0 "함정이다."
 TU_BOL_weariness_m3_tt:0 "§R전쟁 피로§! -3"
 tu_bol_ev.27.t:0 "마을의 학살"
 tu_bol_ev.27.d:0 "한 마을에서 학살이 일어났다. 누구의 짓인지 서로 비난한다."
 tu_bol_ev.27.a:0 "진상을 조사한다."
 tu_bol_ev.27.b:0 "반군의 짓이라 발표한다."
 tu_bol_ev.28.t:0 "볼리바르 공화국"
 tu_bol_ev.28.d:0 "볼리바르는 스스로 일어섰다."
 tu_bol_ev.28.a:0 "자유 볼리바르!"
 tu_bol_ev.29.t:0 "컬럼비아 보호국"
 tu_bol_ev.29.d:0 "컬럼비아 군이 반군을 몰아내고 평화를 지킨다."
 tu_bol_ev.29.a:0 "감사하다."
 tu_bol_ev.30.t:0 "빅토리아 보호국"
 tu_bol_ev.30.d:0 "빅토리아 군이 반군을 몰아내고 평화를 지킨다."
 tu_bol_ev.30.a:0 "감사하다."
 tu_bol_ev.31.t:0 "밀림의 영웅"
 tu_bol_ev.31.d:0 "한 게릴라 대장이 전설적인 전과를 올렸다."
 tu_bol_ev.31.a:0 "훈장을 준다."
