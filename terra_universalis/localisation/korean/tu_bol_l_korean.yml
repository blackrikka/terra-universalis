 tu_bol_ev.1.t:0 "내전의 나라"
 tu_bol_ev.1.d:0 "수도 밖으로 반나절만 가면 다른 깃발이 걸린 마을이 나온다. 컬럼비아와 빅토리아의 무기가 양쪽에 다 흘러든다."
 tu_bol_ev.1.a:0 "전쟁을 끝낸다."
 tu_bol_ev.1.b:0 "백성부터 살린다."
