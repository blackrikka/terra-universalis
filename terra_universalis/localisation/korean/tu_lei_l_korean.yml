 tu_lei_ev.32.t:0 "아츠 폭주"
 tu_lei_ev.32.d:0 "공명이 너무 높아지자 도시 곳곳에서 아츠가 저절로 일어났다."
 tu_lei_ev.32.a:0 "연주를 멈춘다."
 tu_lei_ev.32.b:0 "받아들인다."
 tu_lei_ev.33.t:0 "유물의 속삭임"
 tu_lei_ev.33.d:0 "유물을 지키던 학자가 밤마다 목소리를 듣는다고 호소한다."
