 TU_LEI_arts_envoys_desc:0 ""
 tu_lei_ev.1.t:0 "두 여제의 아침"
 tu_lei_ev.1.d:0 "궁정 악단이 두 여제를 위한 아침 곡을 연주한다. 선제후들은 연주가 끝나기도 전에 자리를 떴다."
 tu_lei_ev.1.a:0 "선제후들을 다시 불러라."
 tu_lei_ev.1.b:0 "음악은 계속된다."
 tu_lei_ev.20.t:0 "마왕의 흔적"
 tu_lei_ev.20.d:0 "옛 마왕의 성에서 봉인이 흔들린다는 보고가 들어왔다."
 tu_lei_ev.20.a:0 "봉인을 보강한다."
 tu_lei_ev.20.b:0 "무엇이 남았는지 조사한다."
 TU_LEI_relics_1_tt:0 "§R마왕의 유물§! +1"
 tu_lei_ev.21.t:0 "유물 탐색의 결과"
 tu_lei_ev.21.d:0 "탐색대가 돌아왔다."
 tu_lei_ev.21.a:0 "유물을 찾았다."
 tu_lei_ev.21.b:0 "빈손으로 돌아왔다."
 tu_lei_ev.22.t:0 "선제후의 이탈"
 tu_lei_ev.22.d:0 "한 선제후가 여제의 정책에 반대하며 궁정을 떠났다."
 tu_lei_ev.22.a:0 "붙잡는다."
 tu_lei_ev.22.b:0 "가게 둔다."
 tu_lei_ev.23.t:0 "두 여제의 다툼"
 tu_lei_ev.23.d:0 "두 여제가 공개석상에서 서로 다른 칙령을 발표했다."
 tu_lei_ev.23.a:0 "언니의 뜻을 따른다."
 tu_lei_ev.23.b:0 "동생의 뜻을 따른다."
 tu_lei_ev.24.t:0 "우르수스 문제"
 tu_lei_ev.24.d:0 "우르수스의 사절이 국경 협정을 제안했다. 선제후들은 우르수스를 믿지 않는다."
 tu_lei_ev.24.a:0 "협정을 맺는다."
 tu_lei_ev.24.b:0 "거절한다."
 TU_LEI_resonance_15_tt:0 "§G아츠 공명§! +15"
 tu_lei_ev.25.t:0 "천재 작곡가"
 tu_lei_ev.25.d:0 "한 젊은 작곡가의 곡이 연주되자 청중 모두가 아츠의 떨림을 느꼈다."
 tu_lei_ev.25.a:0 "궁정에 초빙한다."
 TU_LEI_resonance_m10_tt:0 "§G아츠 공명§! -10"
 tu_lei_ev.26.t:0 "오페라 극장 화재"
 tu_lei_ev.26.d:0 "공연 중 오페라 극장에 불이 났다. 아츠가 폭주했다는 소문이다."
 tu_lei_ev.26.a:0 "재건한다."
 tu_lei_ev.26.b:0 "아츠 공연을 규제한다."
 tu_lei_ev.27.t:0 "마왕 추종자의 습격"
 tu_lei_ev.27.d:0 "마왕을 숭배하는 자들이 기록 보관소를 습격했다."
 tu_lei_ev.27.a:0 "추적한다."
 tu_lei_ev.27.b:0 "그들이 찾던 것을 조사한다."
 tu_lei_ev.28.t:0 "쌍둥이 여제의 통치"
 tu_lei_ev.28.d:0 "선제후들이 두 여제 앞에 무릎을 꿇었다."
 tu_lei_ev.28.a:0 "하나의 목소리로."
 tu_lei_ev.29.t:0 "선제후 연방"
 tu_lei_ev.29.d:0 "라이타니엔은 선제후들의 연방이 되었다."
 tu_lei_ev.29.a:0 "각자의 땅에서."
 tu_lei_ev.30.t:0 "마왕의 귀환"
 tu_lei_ev.30.d:0 "세 유물이 공명하자 옛 왕좌에 그림자가 앉았다."
 tu_lei_ev.30.a:0 "두려워하라."
