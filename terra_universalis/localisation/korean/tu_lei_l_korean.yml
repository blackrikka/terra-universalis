l_korean:
 TU_LEI_twin_throne:0 "쌍둥이 옥좌"
 TU_LEI_twin_throne_desc:0 "두 여제가 한 나라를 다스린다. 선제후들은 그 틈을 노린다."
 TU_LEI_witch_king_shadow:0 "마왕의 그림자"
 TU_LEI_witch_king_shadow_desc:0 "마왕을 몰아낸 지 오래지만, 그의 흔적은 아직 이 땅에 남아 있다."
 TU_LEI_battle_symphony:0 "전투 교향곡 연주"
 TU_LEI_battle_symphony_desc:0 "공명 30을 써서 90일 동안 연주한다 (대교향곡 뒤 180일). 한 번에 하나만."
 TU_LEI_rebuild_concerto:0 "재건 협주곡 연주"
 TU_LEI_rebuild_concerto_desc:0 "공명 30을 써서 90일 동안 연주한다 (대교향곡 뒤 180일). 한 번에 하나만."
 TU_LEI_healing_song:0 "치유의 노래 연주"
 TU_LEI_healing_song_desc:0 "공명 30을 써서 90일 동안 연주한다 (대교향곡 뒤 180일). 한 번에 하나만."
 TU_LEI_twin_empresses:0 "쌍둥이 여제의 통치"
 TU_LEI_twin_empresses_desc:0 "두 여제가 하나의 목소리로 다스린다. (선제후 5표 이상)"
 TU_LEI_electoral_federation:0 "선제후 연방"
 TU_LEI_electoral_federation_desc:0 "여제는 상징으로 남고, 선제후들이 나라를 나눠 다스린다. (선제후 2표 이하)"
