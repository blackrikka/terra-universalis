l_korean:
 TU_URS_emperor:0 "우르수스 황제"
 TU_URS_general_1:0 "제국 근위대장"
 TU_URS_general_2:0 "북부 방면군 사령관"
 TU_URS_backward_infrastructure:0 "낙후된 인프라"
 TU_URS_backward_infrastructure_desc:0 "낡은 철도와 도로 때문에 공장 가동이 느리고 보급 소모가 늘어난다."
 TU_URS_frozen_empire:0 "동토의 제국"
 TU_URS_frozen_empire_desc:0 "혹한 속에서도 인구는 늘고 징집 체계는 조금 강해진다."
 TU_URS_infected_discrimination:0 "감염자 차별"
 TU_URS_infected_discrimination_desc:0 "감염자를 향한 차별이 사회 안정을 흔든다."
 TU_URS_imperial_guard_idea:0 "제국 근위대 전통"
 TU_URS_imperial_guard_idea_desc:0 "근위대의 규율이 전장에서 공격과 방어를 강화한다."
 TU_URS_bop:0 "황제파 대 구귀족파"
 TU_URS_bop_desc:0 "황제의 친정과 귀족 의회 사이의 권력 다툼."
 TU_URS_bop_emperor:0 "황제파"
 TU_URS_bop_emperor_desc:0 "중앙집권을 밀어붙이는 황제파. 정치력이 늘어난다."
 TU_URS_bop_nobility:0 "구귀족파"
 TU_URS_bop_nobility_desc:0 "지방 귀족의 산업 이익을 지키는 세력. 생산이 늘지만 안정도가 떨어진다."
 TU_URS_focus:0 "우르수스 중점"
 TU_URS_frozen_empire_focus:0 "동토의 제국"
 TU_URS_frozen_empire_focus_desc:0 "얼어붙은 땅에서 제국의 질서를 세운다."
 TU_URS_railway_reform:0 "철도 개량"
 TU_URS_railway_reform_desc:0 "낡은 철도를 고쳐 낙후된 인프라를 없앤다."
 TU_URS_infection_policy:0 "감염자 정책 수립"
 TU_URS_infection_policy_desc:0 "감염자를 다룰 방향을 정한다. 강제 노동과 격리 중 하나를 고른다."
 TU_URS_ice_supply:0 "동토 보급로"
 TU_URS_ice_supply_desc:0 "얼음 위로 보급로를 열어 전선을 유지한다."
 TU_URS_imperial_decree:0 "황제의 칙령"
 TU_URS_imperial_decree_desc:0 "황제가 제국의 방향을 칙령으로 선포한다."
 TU_URS_emperor_rule:0 "황제 친정"
 TU_URS_emperor_rule_desc:0 "황제가 직접 권력을 쥔다. 황제파 쪽으로 BoP가 기운다."
 TU_URS_central_administration:0 "중앙 행정"
 TU_URS_central_administration_desc:0 "중앙 관료제를 세워 권력을 집중한다."
 TU_URS_secret_police:0 "황실 비밀경찰"
 TU_URS_secret_police_desc:0 "감시망을 펼쳐 반대 세력을 억누른다. 안정도가 조금 떨어진다."
 TU_URS_noble_compromise:0 "귀족 의회 타협"
 TU_URS_noble_compromise_desc:0 "귀족 의회와 손을 잡는다. BoP가 구귀족파 쪽으로 기운다."
 TU_URS_noble_factories:0 "귀족 공장"
 TU_URS_noble_factories_desc:0 "귀족 영지에 공장을 세운다."
 TU_URS_noble_council:0 "귀족 의회 운영"
 TU_URS_noble_council_desc:0 "의회를 운영하며 정치력을 얻는다."
 TU_URS_noble_levies:0 "귀족 의용대"
 TU_URS_noble_levies_desc:0 "귀족이 거느린 의용대를 징집한다."
 TU_URS_imperial_guard:0 "제국 근위대"
 TU_URS_imperial_guard_desc:0 "정예 근위 사단을 편성한다. 근위대 사단 템플릿이 열린다."
 TU_URS_guard_drill:0 "근위 훈련"
 TU_URS_guard_drill_desc:0 "근위대를 혹독하게 훈련시킨다."
 TU_URS_guard_expansion:0 "근위대 증강"
 TU_URS_guard_expansion_desc:0 "근위대의 인원을 늘린다."
 TU_URS_guard_doctrine:0 "근위 교리"
 TU_URS_guard_doctrine_desc:0 "근위대만의 전술 교리를 정립한다."
 TU_URS_forced_labour:0 "강제 노동"
 TU_URS_forced_labour_desc:0 "감염자를 노동력으로 동원한다. 인력은 늘지만 안정도가 떨어진다."
 TU_URS_labour_camps:0 "노동 수용소"
 TU_URS_labour_camps_desc:0 "수용소를 세워 노동력을 더 짜낸다."
 TU_URS_quarantine_zones:0 "격리 구역"
 TU_URS_quarantine_zones_desc:0 "감염자를 격리 구역에 모아 사회 안정을 되찾는다. 차별 아이디어가 사라진다."
 TU_URS_quarantine_wall:0 "격리 장벽"
 TU_URS_quarantine_wall_desc:0 "격리 구역을 장벽으로 둘러싼다."
 TU_URS_chernobog_development:0 "체르노보그 개발"
 TU_URS_chernobog_development_desc:0 "체르노보그에 공장과 기반시설을 세운다."
 TU_URS_chernobog_garrison:0 "체르노보그 주둔"
 TU_URS_chernobog_garrison_desc:0 "체르노보그에 수비대를 주둔시킨다."
 TU_URS_chernobog_category:0 "체르노보그"
 TU_URS_chernobog_patrol:0 "체르노보그 순찰 강화"
 TU_URS_chernobog_patrol_desc:0 "체르노보그 순찰을 늘려 주민의 불안을 누그러뜨린다. 비용 25 PP, 90일 쿨다운."
 TU_URS_infantry:0 "우르수스 보병 사단"
 TU_URS_guard_division:0 "제국 근위 사단"
