l_korean:
 TU_URS_rail_standard:0 "궤간 통일"
 TU_URS_rail_standard_desc:0 "낡은 철도의 궤간을 맞춰 열차 운행을 빠르게 한다. 정치력이 늘어난다."
 TU_URS_originium_survey:0 "오리지늄 탐사"
 TU_URS_originium_survey_desc:0 "얼어붙은 산맥에서 오리지늄 광맥을 찾아낸다."
 TU_URS_rail_bridges:0 "철교 복구"
 TU_URS_rail_bridges_desc:0 "끊긴 철교를 복구해 도시 사이의 연결을 되살린다. 도시 지역 하나에 기반시설이 세워진다."
 TU_URS_frozen_road:0 "동토 도로"
 TU_URS_frozen_road_desc:0 "얼음 위에 도로를 깔아 북부 보급선을 이어 준다. 인력이 늘어난다."
 TU_URS_originium_mines:0 "오리지늄 광산"
 TU_URS_originium_mines_desc:0 "광맥을 파서 채광을 시작한다. 시골 지역 하나에서 텅스텐을 얻고 산업 단지가 세워진다."
 TU_URS_northern_survey:0 "북부 지질 조사"
 TU_URS_northern_survey_desc:0 "북부 지층을 조사해 강철 광상을 찾는다. 시골 지역 하나에서 강철을 얻는다."
 TU_URS_state_planning:0 "국가 계획 경제"
 TU_URS_state_planning_desc:0 "국가가 생산을 계획한다. 시장 개방과 함께 고를 수 없다."
 TU_URS_market_reform:0 "시장 개방"
 TU_URS_market_reform_desc:0 "시장을 열어 민간 생산을 키운다. 국가 계획 경제와 함께 고를 수 없다."
 TU_URS_mobile_plan:0 "이동도시 설계"
 TU_URS_mobile_plan_desc:0 "철로 위를 달리는 이동도시의 설계도를 그린다. 정치력이 늘어난다."
 TU_URS_northern_frontier:0 "북방 개척지"
 TU_URS_northern_frontier_desc:0 "북부 변경에 개척지를 세워 사람들을 모은다. 인력이 늘어난다."
 TU_URS_frost_supply:0 "동토 보급 창고"
 TU_URS_frost_supply_desc:0 "얼어붙은 땅에 보급 창고를 세운다. 보급 소모가 줄어든다."
 TU_URS_consumer_goods:0 "소비재 생산"
 TU_URS_consumer_goods_desc:0 "소비재 공장을 늘려 민심을 달랜다. 안정도가 오르고 소비재 수요가 줄어든다. 전시 경제와 함께 고를 수 없다."
 TU_URS_mobile_city:0 "이동도시 건설"
 TU_URS_mobile_city_desc:0 "철로 위에 이동도시를 세운다. 도시 지역 하나에 공장 슬롯과 기반시설이 늘어난다."
 TU_URS_war_economy:0 "전시 경제"
 TU_URS_war_economy_desc:0 "모든 생산을 전쟁에 돌린다. 전쟁 지지도가 오른다. 소비재 생산과 함께 고를 수 없다."
 TU_URS_originium_refine:0 "오리지늄 정제"
 TU_URS_originium_refine_desc:0 "채굴한 광석을 정제해 연구에 쓸 원료를 만든다."
 TU_URS_mobile_civil:0 "이동도시 민간 구역"
 TU_URS_mobile_civil_desc:0 "이동도시 안에 민간 구역을 넓힌다. 안정도가 오른다. 이동 요새와 함께 고를 수 없다."
 TU_URS_mobile_fort:0 "이동도시 요새화"
 TU_URS_mobile_fort_desc:0 "이동도시를 요새로 바꾼다. 육군 경험치가 오른다. 이동도시 민간 구역과 함께 고를 수 없다."
 TU_URS_northern_settlers:0 "북부 정착민 이주"
 TU_URS_northern_settlers_desc:0 "정착민을 북부로 보낸다. 변경 지역 하나에 공장 슬롯이 늘어난다. 북방 수비선과 함께 고를 수 없다."
 TU_URS_northern_garrison:0 "북방 수비선"
 TU_URS_northern_garrison_desc:0 "북부 국경에 수비선을 세운다. 육군 경험치와 인력이 늘어난다. 북부 정착민 이주와 함께 고를 수 없다."
 TU_URS_originium_export:0 "오리지늄 수출 협정"
 TU_URS_originium_export_desc:0 "정제한 오리지늄을 외국에 판다. 정치력이 크게 늘어난다."
 TU_URS_mobile_housing:0 "주거 구역 확충"
 TU_URS_mobile_housing_desc:0 "이동도시의 주거 구역을 늘린다. 도시 지역 하나에 공장 슬롯이 늘어난다."
 TU_URS_mobile_arsenal:0 "이동 병기창"
 TU_URS_mobile_arsenal_desc:0 "이동도시에 병기 공장을 세운다. 중소 도시 지역 하나에 군수 공장이 완공된다."
 TU_URS_permafrost_mines:0 "영구동토 광산"
 TU_URS_permafrost_mines_desc:0 "영구동토를 뚫어 광산을 연다. 시골 지역 하나에서 텅스텐을 얻고 인력이 늘어난다."
 TU_URS_originium_plant:0 "오리지늄 정제소"
 TU_URS_originium_plant_desc:0 "오리지늄 정제소를 넓힌다. 시골 지역 하나에 산업 단지가 세워지고 정치력이 늘어난다."
 TU_URS_mobile_market:0 "이동 시장"
 TU_URS_mobile_market_desc:0 "이동도시에 시장을 연다. 안정도와 정치력이 늘어난다."
 TU_URS_mobile_siege_rail:0 "이동 포대 철도"
 TU_URS_mobile_siege_rail_desc:0 "이동도시에 포대 철도를 붙인다. 건설 기술 보너스를 얻고 육군 경험치가 오른다."
 TU_URS_permafrost_rail:0 "동토 철로망"
 TU_URS_permafrost_rail_desc:0 "영구동토에 철로망을 잇는다. 인력이 늘고 안정도가 조금 오른다."
 TU_URS_originium_grid:0 "오리지늄 송전망"
 TU_URS_originium_grid_desc:0 "광산과 정제소를 송전망으로 잇는다. 정치력이 늘어난다."
 TU_URS_mobile_network:0 "이동도시 연결망"
 TU_URS_mobile_network_desc:0 "이동 시장과 포대 철도를 잇는다. 정치력이 크게 늘고 도시 지역 하나에 기반시설이 세워진다."
 TU_URS_originium_stockpile:0 "오리지늄 비축고"
 TU_URS_originium_stockpile_desc:0 "채굴한 광석을 비축한다. 시골 지역 하나에서 텅스텐을 더 얻는다."
 TU_URS_mobile_terminal:0 "이동도시 종착역"
 TU_URS_mobile_terminal_desc:0 "이동도시의 종착역을 짓는다. 정치력과 인력이 늘어난다."
 TU_URS_originium_deep:0 "오리지늄 심층 채광"
 TU_URS_originium_deep_desc:0 "광맥을 깊이 판다. 시골 지역 하나에서 텅스텐을 얻고 산업 단지가 세워진다."
 TU_URS_mobile_expansion:0 "이동도시 증설"
 TU_URS_mobile_expansion_desc:0 "이동도시를 넓힌다. 도시 지역 하나에 공장 슬롯과 기반시설이 늘어난다."
 TU_URS_originium_core:0 "오리지늄 핵심 광산"
 TU_URS_originium_core_desc:0 "가장 깊은 광맥을 개발한다. 정치력이 크게 늘지만 안정도가 떨어진다."
 TU_URS_mobile_core:0 "이동도시 중추"
 TU_URS_mobile_core_desc:0 "이동도시의 중추 시설을 세운다. 정치력이 크게 늘고 건물 생산이 빨라진다."
 TU_URS_originium_secure:0 "오리지늄 독점 체제"
 TU_URS_originium_secure_desc:0 "오리지늄 공급을 손에 쥔다. 정치력이 늘고 연구 속도가 조금 오른다."
 TU_URS_army_mass_draft:0 "대규모 징병"
 TU_URS_army_mass_draft_desc:0 "전 국민을 징집한다. 인력이 크게 늘고 대규모 징병제 아이디어를 얻는다. 정예 선발과 함께 고를 수 없다."
 TU_URS_army_elite_draft:0 "정예 선발"
 TU_URS_army_elite_draft_desc:0 "소수 정예를 뽑는다. 육군 경험치와 정치력이 늘어난다. 대규모 징병과 함께 고를 수 없다."
 TU_URS_army_frost_drill:0 "동토 훈련"
 TU_URS_army_frost_drill_desc:0 "얼어붙은 훈련장에서 병사를 단련한다. 육군 경험치가 늘어난다."
 TU_URS_army_arts_trials:0 "아츠 시험 부대"
 TU_URS_army_arts_trials_desc:0 "아츠를 쓰는 병사를 시험 편성한다. 아츠 부대 아이디어를 얻는다."
 TU_URS_army_conscript_camps:0 "징집 병영"
 TU_URS_army_conscript_camps_desc:0 "징집병을 수용할 병영을 세운다. 인력이 늘지만 안정도가 떨어진다."
 TU_URS_army_winter_doctrine:0 "동토 전술 교리"
 TU_URS_army_winter_doctrine_desc:0 "추위 속 전투 교리를 세운다. 동토 전투 아이디어를 얻는다."
 TU_URS_army_artillery_school:0 "포병 학교"
 TU_URS_army_artillery_school_desc:0 "포병 장교를 길러 낸다. 육군 경험치와 정치력이 늘어난다."
 TU_URS_army_frost_entrench:0 "동토 참호 진지"
 TU_URS_army_frost_entrench_desc:0 "동토에 참호를 파고 버틴다. 육군 경험치와 인력이 늘어난다. 동토 기동 전술과 함께 고를 수 없다."
 TU_URS_army_frost_mobile:0 "동토 기동 전술"
 TU_URS_army_frost_mobile_desc:0 "추위 속에서 빠르게 움직인다. 육군 경험치가 늘어난다. 동토 참호 진지와 함께 고를 수 없다."
 TU_URS_army_artillery_doctrine:0 "포병 교리"
 TU_URS_army_artillery_doctrine_desc:0 "포병 중심의 교리를 세운다. 포병 공격력 아이디어를 얻는다."
 TU_URS_army_mass_mobilisation:0 "총동원 체제"
 TU_URS_army_mass_mobilisation_desc:0 "사회 전체를 동원한다. 전쟁 지지도가 오르고 안정도가 떨어진다. 직업 군대와 함께 고를 수 없다."
 TU_URS_army_professional:0 "직업 군대"
 TU_URS_army_professional_desc:0 "직업 군인을 키운다. 육군 경험치가 늘어난다. 총동원 체제와 함께 고를 수 없다."
 TU_URS_army_armour_doctrine:0 "기갑 교리"
 TU_URS_army_armour_doctrine_desc:0 "전차 전술을 정립한다. 기갑 교리 아이디어를 얻는다."
 TU_URS_army_general_staff:0 "참모본부"
 TU_URS_army_general_staff_desc:0 "참모본부를 세운다. 육군 경험치와 정치력이 크게 늘어난다. 군부 독재 체제가 필요하다."
 TU_URS_army_total_war:0 "총력전 편성"
 TU_URS_army_total_war_desc:0 "총력전 체제를 갖춘다. 인력이 크게 늘어난다."
 TU_URS_arts_engineering:0 "아츠 공학 연구"
 TU_URS_arts_engineering_desc:0 "아츠를 공학으로 풀어 연구한다. 전자 연구 보너스를 얻는다. 재래식 항공 연구와 함께 고를 수 없다."
 TU_URS_arts_conventional:0 "재래식 항공 연구"
 TU_URS_arts_conventional_desc:0 "기존 항공 기술을 연구한다. 공군 교리 연구 보너스를 얻는다. 아츠 공학 연구와 함께 고를 수 없다."
 TU_URS_arts_lab:0 "아츠 연구소"
 TU_URS_arts_lab_desc:0 "아츠 연구소를 연다. 레이더 기술 보너스와 연구 가속 아이디어를 얻는다. 개혁파 체제가 필요하다."
 TU_URS_frozen_airfield:0 "동토 비행장"
 TU_URS_frozen_airfield_desc:0 "얼어붙은 땅에 비행장을 연다. 공군 경험치와 정치력이 늘어난다."
 TU_URS_frozen_hangar:0 "동토 격납고"
 TU_URS_frozen_hangar_desc:0 "시골 지역 하나에 공군 기지를 세운다. 공군 경험치가 늘어난다."
 TU_URS_frozen_pilots:0 "동토 조종사 양성"
 TU_URS_frozen_pilots_desc:0 "추위에 강한 조종사를 기른다. 공군 경험치가 크게 늘고 동토 항공 기술 아이디어를 얻는다. 황제 친정이 필요하다."
 TU_URS_frost_supremacy:0 "동토 항공 우위"
 TU_URS_frost_supremacy_desc:0 "동토 상공을 장악한다. 동토 항공 우위 아이디어를 얻고 공군 경험치가 늘어난다."
 TU_URS_northern_expedition:0 "북방 원정 연구"
 TU_URS_northern_expedition_desc:0 "북방 원정에 쓸 항공 장비를 연구한다. 항공 장비 연구 보너스를 얻고 정치력이 늘어난다. 군부 독재 체제가 필요하다."
 TU_URS_northern_bomber:0 "북방 폭격기 연구"
 TU_URS_northern_bomber_desc:0 "장거리 폭격기를 연구한다. 전술 폭격기 연구 보너스를 얻는다. 북방 전투기 연구와 함께 고를 수 없다."
 TU_URS_northern_fighter:0 "북방 전투기 연구"
 TU_URS_northern_fighter_desc:0 "북방 전투기를 연구한다. 항공 장비 연구 보너스를 얻고 북방 항속 거리 아이디어를 얻는다. 북방 폭격기 연구와 함께 고를 수 없다."
 TU_URS_reu_suppression:0 "리유니온 진압"
 TU_URS_reu_suppression_desc:0 "리유니온 반란을 무력으로 진압한다. 리유니온의 안정도와 전쟁 지지도가 떨어진다. 리유니온 협상과 함께 고를 수 없다."
 TU_URS_reu_negotiation:0 "리유니온 협상"
 TU_URS_reu_negotiation_desc:0 "리유니온과 협상 창구를 연다. 리유니온의 안정도가 조금 오른다. 리유니온 진압과 함께 고를 수 없다."
 TU_URS_reu_occupation:0 "리유니온 점령 계획"
 TU_URS_reu_occupation_desc:0 "리유니온 영토를 점령할 계획을 짠다. 육군 경험치가 늘고 전쟁 지지도가 조금 오른다."
 TU_URS_reu_peace:0 "리유니온 평화 협정"
 TU_URS_reu_peace_desc:0 "체르노보그 사태가 끝난 뒤 평화 협정을 맺는다. 정치력이 늘고 안정도가 오른다."
 TU_URS_lungmen_aid:0 "용문 지원"
 TU_URS_lungmen_aid_desc:0 "버텨 낸 용문을 돕는다. 용문의 안정도가 오르고 정치력이 늘어난다."
 TU_URS_reu_siege:0 "리유니온 포위"
 TU_URS_reu_siege_desc:0 "리유니온을 포위한다. 육군 경험치가 크게 늘고 리유니온의 전쟁 지지도가 떨어진다."
 TU_URS_labour_expansion:0 "강제 노동 확대"
 TU_URS_labour_expansion_desc:0 "강제 노동을 더 넓힌다. 인력이 늘고 안정도가 떨어진다. 노동 할당 아이디어를 얻는다. 황제 친정이 필요하다."
 TU_URS_chernobog_reconstruction:0 "체르노보그 재건"
 TU_URS_chernobog_reconstruction_desc:0 "체르노보그를 재건한다. 체르노보그에 무기 공장이 세워지고 공장 슬롯이 늘어난다."
 TU_URS_rho_cooperation:0 "로도스 아일랜드 협력"
 TU_URS_rho_cooperation_desc:0 "로도스 아일랜드와 감염자 치료에 협력한다. 안정도가 오르고 의료 협력 아이디어를 얻는다."
 TU_URS_chernobog_defence:0 "체르노보그 방어선"
 TU_URS_chernobog_defence_desc:0 "체르노보그 주변에 방어선을 긋는다. 육군 경험치와 정치력이 늘어난다."
 TU_URS_chernobog_fortress:0 "체르노보그 요새"
 TU_URS_chernobog_fortress_desc:0 "체르노보그를 요새로 만든다. 육군 경험치, 안정도, 인력이 늘어난다."
 TU_URS_chernobog_core:0 "체르노보그 중심 시설"
 TU_URS_chernobog_core_desc:0 "체르노보그의 중심 시설을 세운다. 산업 단지와 기반시설이 세워진다."
 TU_URS_chernobog_seal:0 "체르노보그 봉쇄"
 TU_URS_chernobog_seal_desc:0 "체르노보그를 봉쇄한다. 정치력이 늘고 육군 경험치가 늘어난다."
 TU_URS_e1_state_planning:0 "국가 계획 경제"
 TU_URS_e1_state_planning_desc:0 "국가가 생산을 계획해 건설 속도가 오르지만 안정도가 떨어진다."
 TU_URS_e1_market_economy:0 "시장 경제"
 TU_URS_e1_market_economy_desc:0 "시장이 열려 정치력 획득이 늘고 소비재 수요가 줄어든다."
 TU_URS_e1_war_economy:0 "전시 경제"
 TU_URS_e1_war_economy_desc:0 "모든 공장을 전쟁에 돌린다. 건설 속도와 전쟁 지지도가 오르고 소비재 수요가 조금 늘어난다."
 TU_URS_e1_consumer_goods:0 "소비재 공급"
 TU_URS_e1_consumer_goods_desc:0 "소비재를 충분히 공급해 민심을 누그러뜨린다. 소비재 수요가 줄고 안정도가 오른다."
 TU_URS_e1_mobile_civil:0 "이동도시 생활권"
 TU_URS_e1_mobile_civil_desc:0 "이동도시에 사는 인구가 늘어난다. 월간 인구와 안정도가 오른다."
 TU_URS_e1_mobile_fort:0 "이동 요새"
 TU_URS_e1_mobile_fort_desc:0 "이동도시의 방어력이 오른다. 방어력이 늘고 참호 구축 속도가 빨라진다."
 TU_URS_e1_frost_supply:0 "동토 보급 체계"
 TU_URS_e1_frost_supply_desc:0 "얼어붙은 땅의 보급 소모가 줄고 동토의 손실이 줄어든다."
 TU_URS_e1_mobile_core:0 "이동도시 중추 기능"
 TU_URS_e1_mobile_core_desc:0 "이동도시의 중추 기능으로 건물 생산이 빨라지고 인구가 늘어난다."
 TU_URS_e1_originium_monopoly:0 "오리지늄 독점"
 TU_URS_e1_originium_monopoly_desc:0 "오리지늄을 독점해 연구 속도가 오르지만 광산 사고로 안정도가 떨어진다."
 TU_URS_e2_mass_conscription:0 "대규모 징병제"
 TU_URS_e2_mass_conscription_desc:0 "징집 비율이 오르지만 징집병이 얻는 경험치는 줄어든다."
 TU_URS_e2_arts_units:0 "아츠 부대"
 TU_URS_e2_arts_units_desc:0 "아츠를 쓰는 부대가 공격력을 얻고 경험치가 빨리 쌓인다."
 TU_URS_e2_frozen_warfare:0 "동토 전투"
 TU_URS_e2_frozen_warfare_desc:0 "추위로 생기는 손실이 줄고 동토에서 방어력이 오른다."
 TU_URS_e2_artillery_doctrine:0 "포병 교리"
 TU_URS_e2_artillery_doctrine_desc:0 "포병의 공격력이 오른다."
 TU_URS_e2_armour_doctrine:0 "기갑 교리"
 TU_URS_e2_armour_doctrine_desc:0 "전차의 공격력이 오르고 훈련 시간이 줄어든다."
 TU_URS_e2_general_staff:0 "참모본부 체계"
 TU_URS_e2_general_staff_desc:0 "참모본부가 훈련 시간을 줄인다."
 TU_URS_e2_total_war:0 "총력전 체제"
 TU_URS_e2_total_war_desc:0 "전쟁 지지도가 오르지만 안정도가 떨어진다."
 TU_URS_e3_frozen_air:0 "동토 항공 기술"
 TU_URS_e3_frozen_air_desc:0 "추위로 생기는 항공 패널티가 줄어든다."
 TU_URS_e3_arts_research:0 "아츠 연구 가속"
 TU_URS_e3_arts_research_desc:0 "연구 속도가 빨라진다."
 TU_URS_e3_frost_supremacy:0 "동토 항공 우위 기술"
 TU_URS_e3_frost_supremacy_desc:0 "요격 효율과 항공 우위 효율이 오른다."
 TU_URS_e3_northern_range:0 "북방 항속 거리"
 TU_URS_e3_northern_range_desc:0 "항공기의 작전 거리가 늘어난다."
 TU_URS_e4_labour_quota:0 "노동 할당"
 TU_URS_e4_labour_quota_desc:0 "건물 생산 속도가 빨라지지만 안정도가 떨어진다."
 TU_URS_e4_rho_medical:0 "의료 협력"
