l_korean:
 TU_URS_uprising_category:0 "체르노보그의 불씨"
 TU_URS_uprising_category_desc:0 "체르노보그의 감염자 구역에서 불온한 소문이 돈다. 이대로라면 봉기는 시간문제다."
 TU_URS_uprising_mission:0 "체르노보그 봉기"
 TU_URS_uprising_mission_desc:0 "남은 날이 다하면 체르노보그에서 감염자 봉기가 일어나고 리유니온이 일어선다."
 TU_URS_uprising_martial_law:0 "체르노보그 계엄령"
 TU_URS_uprising_martial_law_desc:0 "군을 풀어 감염자 구역을 봉쇄한다. 봉기까지 20일을 번다. 안정도 −3%."
 TU_URS_uprising_arrests:0 "지도부 일제 검거"
 TU_URS_uprising_arrests_desc:0 "봉기 지도부로 의심되는 자들을 모조리 잡아들인다. 봉기까지 40일을 번다. 안정도·전쟁 지지 −5%."
