l_korean:
 recon:0 "뱅가드 정찰 중대"
 recon_desc:0 "앞서 나가 지형과 적의 움직임을 살피고, 부대가 주도권을 잡을 길을 엽니다."
 mot_recon:0 "뱅가드 기동 정찰 중대"
 mot_recon_desc:0 "차량으로 빠르게 움직이며 전선을 먼저 차지할 자리를 찾습니다."
 motorized:0 "뱅가드 기동 대대"
 motorized_desc:0 "차량으로 먼저 도착해 전선을 선점하는 뱅가드 부대입니다."
 mechanized:0 "뱅가드 장갑 기동 대대"
 mechanized_desc:0 "장갑 차량으로 포화 속에서도 전선을 선점합니다."
 infantry:0 "가드 대대"
 infantry_desc:0 "전선을 맞서 싸우는 주력 오퍼레이터 부대입니다."
 mountaineers:0 "산악 가드 대대"
 mountaineers_desc:0 "험한 지형에서 싸우도록 훈련받은 가드 부대입니다."
 marine:0 "상륙 가드 대대"
 marine_desc:0 "물을 건너 해안을 빼앗도록 훈련받은 가드 부대입니다."
 light_armor:0 "경장 디펜더 대대"
 light_armor_desc:0 "가벼운 장갑을 두른 디펜더입니다. 빠르지만 오래 버티지는 못합니다."
 medium_armor:0 "디펜더 대대"
 medium_armor_desc:0 "두꺼운 장갑으로 전선을 받아 내는 디펜더 주력입니다."
 heavy_armor:0 "중장 디펜더 대대"
 heavy_armor_desc:0 "가장 두꺼운 장갑을 두른 디펜더입니다. 느리지만 쉽게 뚫리지 않습니다."
 artillery:0 "지원 스나이퍼 중대"
 artillery_brigade:0 "스나이퍼 대대"
 mot_artillery_brigade:0 "기동 스나이퍼 대대"
 rocket_artillery_brigade:0 "로켓 스나이퍼 대대"
 anti_air:0 "지원 대공 스나이퍼 중대"
 anti_air_brigade:0 "대공 스나이퍼 대대"
 mot_anti_air_brigade:0 "기동 대공 스나이퍼 대대"
 anti_tank:0 "지원 캐스터 중대"
 anti_tank_brigade:0 "캐스터 대대"
 mot_anti_tank_brigade:0 "기동 캐스터 대대"
 field_hospital:0 "메딕 중대"
 field_hospital_desc:0 "쓰러진 병사를 치료해 전선으로 돌려보냅니다."
 signal_company:0 "서포터 통신 중대"
 signal_company_desc:0 "부대 안의 연락을 맡아 작전 계획을 앞당깁니다."
 logistics_company:0 "서포터 군수 중대"
 logistics_company_desc:0 "물자를 계획하고 나누어 보급 소모를 줄입니다."
 paratrooper:0 "스페셜리스트 강하 대대"
 paratrooper_desc:0 "적의 후방으로 침투해 전선을 흔듭니다."
 military_police:0 "스페셜리스트 헌병 중대"
 military_police_desc:0 "점령지를 안정시키고 후방의 위협을 찾아냅니다."
 tu_arts_caster:0 "아츠 캐스터 대대"
 tu_arts_caster_desc:0 "오리지늄 아츠로 장갑을 꿰뚫고 보병까지 휩쓰는 술사 부대입니다. 일반 캐스터보다 폭이 넓고 훈련이 오래 걸립니다."
