l_korean:
 LOADING_TIP_0:0 "내게는 고통밖에 없습니다.\n그것 말고는 아무것도 바라지 않습니다.\n- 롤랑, 「고통을 사랑하기 위한 기도」"
 LOADING_TIP_1:0 "감염자도 사람입니다. 그 당연한 말을 하기 위해, 우리는 얼마나 멀리 걸어야 할까요.\n- 아미야, 로도스 아일랜드"
 LOADING_TIP_2:0 "희망은 약이 아니다. 하지만 약을 끝까지 만들게 하는 것은 희망이다.\n- 켈시"
 LOADING_TIP_3:0 "얼음은 녹는다. 그러나 녹은 물이 어디로 흐를지는 우리가 정한다.\n- 프로스트노바"
 LOADING_TIP_4:0 "용문은 누구의 편도 아니다. 용문은 용문의 편이다.\n- 웨이옌우"
 LOADING_TIP_5:0 "왕관은 무겁지 않다. 무거운 것은 그 아래에서 죽어 간 자들의 이름이다.\n- 테레시스"
 LOADING_TIP_6:0 "기사의 명예는 광고판 위가 아니라 무너진 성벽 아래에서 빛난다.\n- 마거릿 니어"
 LOADING_TIP_7:0 "바다는 아무것도 잊지 않아. 그러니까 박사도 나를 잊지 마.\n- 스카디"
 LOADING_TIP_8:0 "천재는 예고 없이 오지 않는다. 다만 아무도 예보를 믿지 않을 뿐이다.\n- 천재 신사의 일지"
 LOADING_TIP_9:0 "원석은 도시를 움직이고, 사람을 멈추게 한다.\n- 림 빌리튼 광산 표어"
 LOADING_TIP_10:0 "바다를 등진 나라는 있어도, 바다를 잊은 나라는 없다.\n- 이베리아 대심판소 기록"
 LOADING_TIP_11:0 "총을 쥐는 것은 손이지만, 방아쇠를 당기는 것은 헤일로다.\n- 라테라노 속담"
 LOADING_TIP_12:0 "이동도시는 멈추는 순간 무덤이 된다.\n- 우르수스 황야 상인의 말"
 LOADING_TIP_13:0 "책장을 넘기는 손이 떨린다면, 그건 아직 읽을 이유가 남아 있다는 뜻이다.\n- 도서관의 사서"
 LOADING_TIP_14:0 "보급이 끊긴 기사는 그저 무거운 갑옷일 뿐이다.\n- 카시미어 참모 교범"
 LOADING_TIP_15:0 "황야에서는 지도가 아니라 바람이 길을 알려 준다.\n- 사르곤 사막 기병의 격언"
