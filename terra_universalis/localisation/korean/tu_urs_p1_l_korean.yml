l_korean:
 TU_URS_imperial_court:0 "황실 조정 재편"
 TU_URS_imperial_court_desc:0 "궁정 관료를 황제의 측근으로 갈아 끼운다."
 TU_URS_absolutism_codex:0 "절대 법전"
 TU_URS_absolutism_codex_desc:0 "황제의 칙령을 하나의 법전으로 묶는다. 지방 관습은 법전 아래로 들어간다."
 TU_URS_sovereign_seal:0 "황제의 인장"
 TU_URS_sovereign_seal_desc:0 "모든 법령에 황제의 인장이 찍힌다."
 TU_URS_palace_rebuild:0 "황궁 재건"
 TU_URS_palace_rebuild_desc:0 "불탄 황궁을 다시 세운다. 무작위 주에 공장이 바로 들어선다."
 TU_URS_absolute_crown:0 "절대 왕관"
 TU_URS_absolute_crown_desc:0 "황제가 왕관을 머리에 얹는다. 절대왕정이 완성된다."
 TU_URS_eternal_throne:0 "영원한 옥좌"
 TU_URS_eternal_throne_desc:0 "옥좌는 대대손손 이어진다. 황제파의 최종 목표."
 TU_URS_imperial_blades:0 "황제의 칼날"
 TU_URS_imperial_blades_desc:0 "근위대를 황제의 칼날로 벼린다. 근위 원수가 합류한다."
 TU_URS_guard_elite_corps:0 "정예 근위단"
 TU_URS_guard_elite_corps_desc:0 "가장 뛰어난 병사만 골라 정예 근위단을 편성한다."
 TU_URS_guard_imperial_cavalry:0 "황실 기병대"
 TU_URS_guard_imperial_cavalry_desc:0 "황실 기병을 늘려 빠른 기동으로 반란을 제압한다."
 TU_URS_guard_bastion:0 "근위 요새"
 TU_URS_guard_bastion_desc:0 "황궁 외곽에 요새를 쌓아 근위대의 거점으로 삼는다."
 TU_URS_surveillance_bureau:0 "황실 감찰국"
 TU_URS_surveillance_bureau_desc:0 "황실 직속 감찰국이 관료와 귀족을 함께 감시한다."
 TU_URS_censorship_regime:0 "검열 체계"
 TU_URS_censorship_regime_desc:0 "신문과 설교를 검열해 황실에 불리한 말을 막는다."
 TU_URS_public_trials:0 "공개 재판"
 TU_URS_public_trials_desc:0 "반역자를 광장에서 재판해 본보기를 세운다."
 TU_URS_purge_dissent:0 "반체제 색출"
 TU_URS_purge_dissent_desc:0 "숨어 있는 반체제 인사를 찾아낸다. 안정도가 떨어진다."
 TU_URS_grand_dukes_summons:0 "대공 소환"
 TU_URS_grand_dukes_summons_desc:0 "지방의 대공들을 수도로 불러들인다."
 TU_URS_estate_seizure:0 "영지 몰수"
 TU_URS_estate_seizure_desc:0 "죄가 드러난 대공의 영지를 몰수한다. 귀족의 불만이 커진다."
 TU_URS_grand_duke_appease:0 "대공 회유"
 TU_URS_grand_duke_appease_desc:0 "작위와 특권을 나눠 대공을 달랜다."
 TU_URS_ducal_courts:0 "대공 법정"
 TU_URS_ducal_courts_desc:0 "대공의 소송을 황실 법정이 맡는다."
 TU_URS_local_customs:0 "지방 관습 존중"
 TU_URS_local_customs_desc:0 "지방의 관습을 인정하고 법전 편찬을 미룬다. 구귀족의 신뢰를 얻는다."
 TU_URS_direct_rule_lands:0 "직할령 편입"
 TU_URS_direct_rule_lands_desc:0 "대공 영지를 황실 직할령으로 편입한다."
 TU_URS_unification_vision:0 "대통합의 구상"
 TU_URS_unification_vision_desc:0 "흩어진 우르수스 땅을 하나로 묶는 계획을 세운다."
 TU_URS_kazdel_claims:0 "카즈델 영유권 주장"
 TU_URS_kazdel_claims_desc:0 "카즈델의 옛 우르수스 땅을 주장한다. 카즈델의 주들이 요구 목록에 오른다."
 TU_URS_kazimir_war_plans:0 "카시미어 전쟁 계획"
 TU_URS_kazimir_war_plans_desc:0 "카시미어와의 전쟁 명분을 세운다. 전쟁 목표가 열린다."
 TU_URS_kazimir_diplomacy:0 "카시미어 외교 협정"
 TU_URS_kazimir_diplomacy_desc:0 "전쟁 대신 통상 협정으로 카시미어를 묶는다."
 TU_URS_leithanien_claims:0 "라이타니엔 영유권 주장"
 TU_URS_leithanien_claims_desc:0 "라이타니엔 변경 주에 대한 옛 권리를 되살린다."
 TU_URS_sami_claims:0 "사미 영유권 주장"
 TU_URS_sami_claims_desc:0 "북쪽 사미 땅의 영유권을 주장한다."
 TU_URS_yan_war_plans:0 "염국 전쟁 계획"
 TU_URS_yan_war_plans_desc:0 "남방 염국과 맞설 전쟁 명분을 준비한다."
 TU_URS_unification_complete:0 "우르수스 대통합"
 TU_URS_unification_complete_desc:0 "흩어진 우르수스 땅이 하나의 제국으로 묶인다."
 TU_URS_capital_railway_plan:0 "수도 철도 계획"
 TU_URS_capital_railway_plan_desc:0 "황제가 머무는 수도까지 철도를 잇는 계획을 세운다."
 TU_URS_capital_railway_build:0 "수도 철도 건설"
 TU_URS_capital_railway_build_desc:0 "수도로 이어지는 철로를 깔아 무작위 주에 공장 부지를 연다."
 TU_URS_rail_gauge:0 "표준 궤간 통일"
 TU_URS_rail_gauge_desc:0 "제국 전역의 궤간을 하나로 맞춘다."
 TU_URS_rail_heavy_industry:0 "철도 중공업"
 TU_URS_rail_heavy_industry_desc:0 "철도 공장을 중공업 공장으로 바꿔 설비 기술을 얻는다."
 TU_URS_imperial_express:0 "황실 특급열차"
 TU_URS_imperial_express_desc:0 "황제 전용 특급열차를 띄워 황실의 위엄을 보인다."
 TU_URS_capital_factory_belt:0 "수도 공업 지대"
 TU_URS_capital_factory_belt_desc:0 "철도를 따라 공업 지대를 세운다. 무작위 주 두 곳에 공장이 들어선다."
 TU_URS_frozen_supply_line:0 "동토 보급선"
 TU_URS_frozen_supply_line_desc:0 "얼어붙은 땅에도 보급선을 열어 전선을 이어 간다."
 TU_URS_steel_network:0 "오리론 연결망"
 TU_URS_steel_network_desc:0 "오리론 공장을 철도로 묶어 생산 흐름을 빠르게 한다."
 TU_URS_eastern_rail_link:0 "동부 철도 연결"
 TU_URS_eastern_rail_link_desc:0 "동쪽 변경과 수도를 잇는 철도를 완성한다."
 TU_URS_capital_terminal:0 "수도 종착역"
 TU_URS_capital_terminal_desc:0 "수도의 중앙역이 완성되어 제국의 심장이 된다."
 TU_URS_military_junta:0 "군사 독재"
 TU_URS_military_junta_desc:0 "강경파 장군들이 제국의 실권을 쥔다."
 TU_URS_hardline_generals:0 "강경파 장군단"
 TU_URS_hardline_generals_desc:0 "체르노보그 이후 강경파 장군들이 회의를 장악한다."
 TU_URS_chernobog_response:0 "체르노보그 사건 대응"
 TU_URS_chernobog_response_desc:0 "체르노보그 사건을 구실로 비상령을 선포한다. 전쟁 지지가 오르고 안정도가 떨어진다."
 TU_URS_fascist_turn:0 "파시즘으로의 전환"
 TU_URS_fascist_turn_desc:0 "정당을 파시즘으로 바꾸고 선거를 중단한다. 대중의 지지가 파시즘으로 쏠린다."
 TU_URS_total_war_economy:0 "총력전 경제"
 TU_URS_total_war_economy_desc:0 "민간 소비를 줄이고 전쟁 물자 생산에 모든 것을 건다."
 TU_URS_war_production:0 "군수 생산"
 TU_URS_war_production_desc:0 "무작위 주에 군수 공장을 바로 세운다."
 TU_URS_purge_generals:0 "장군단 숙청"
 TU_URS_purge_generals_desc:0 "말을 듣지 않는 장군을 쫓아낸다. 빈자리에 강경파가 들어온다."
 TU_URS_total_mobilisation:0 "총동원 칙령"
 TU_URS_total_mobilisation_desc:0 "전 국민을 동원 체계에 편입한다."
 TU_URS_iron_regime:0 "철의 군정 체제"
 TU_URS_iron_regime_desc:0 "군정은 법이 되고 법은 철이 된다."
 TU_URS_standing_junta:0 "상설 군정"
 TU_URS_standing_junta_desc:0 "군정을 임시가 아닌 상설 기구로 만든다."
 TU_URS_militarise_state:0 "국가 군사화"
 TU_URS_militarise_state_desc:0 "민간 공장을 군수 체계로 편입한다."
 TU_URS_endless_junta:0 "영속하는 군정"
 TU_URS_endless_junta_desc:0 "군정은 끝나지 않는다. 황제파조차 군부에 기댄다."
 TU_URS_junta_caretaker:0 "군정 유지"
 TU_URS_junta_caretaker_desc:0 "이념을 바꾸지 않고 군정을 그대로 유지한다. 안정도가 조금 오른다."
 TU_URS_frost_conscription:0 "동토 징병"
 TU_URS_frost_conscription_desc:0 "동토 마을까지 징병관을 보내 병력을 긁어모은다."
 TU_URS_war_bonds:0 "전쟁 공채"
 TU_URS_war_bonds_desc:0 "국민에게 전쟁 공채를 팔아 재정을 채운다."
 TU_URS_arms_factories:0 "군수 공장 확충"
 TU_URS_arms_factories_desc:0 "무작위 주 두 곳에 군수 공장을 세운다."
 TU_URS_rationing:0 "배급제"
 TU_URS_rationing_desc:0 "식량과 연료를 배급한다. 민심은 안정되지만 생산은 줄어든다."
 TU_URS_steel_quota:0 "오리론 할당제"
 TU_URS_steel_quota_desc:0 "오리론을 군수에 우선 배정한다."
 TU_URS_mobile_divisions:0 "기계화 사단"
 TU_URS_mobile_divisions_desc:0 "기계화 사단을 편성하고 동원 원수를 임명한다."
 TU_URS_armored_rail:0 "장갑 열차"
 TU_URS_armored_rail_desc:0 "장갑 열차를 띄워 철길을 지킨다."
 TU_URS_city_patrols:0 "도시 순찰대"
 TU_URS_city_patrols_desc:0 "이동도시 거리를 순찰대가 돈다. 질서는 잡히지만 자유는 줄어든다."
 TU_URS_siege_engines:0 "공성 장비"
 TU_URS_siege_engines_desc:0 "이동도시에 공성 장비를 실어 성벽을 부순다."
 TU_URS_mobile_factory_city:0 "이동 공장 도시"
 TU_URS_mobile_factory_city_desc:0 "이동도시 안에 공장을 세워 전선을 따라 움직인다."
 TU_URS_black_regiment:0 "검은 연대"
 TU_URS_black_regiment_desc:0 "검은 제복의 연대가 체제에 불만인 자를 찾아 제거한다."
 TU_URS_border_purge:0 "변경 숙청"
 TU_URS_border_purge_desc:0 "변경 지역의 반대 세력을 솎아 낸다."
 TU_URS_lei_war_plans:0 "라이타니엔 침공 계획"
 TU_URS_lei_war_plans_desc:0 "라이타니엔과의 전쟁 명분을 만든다. 전쟁 목표가 열린다."
 TU_URS_lei_diplomacy:0 "라이타니엔 외교 교섭"
 TU_URS_lei_diplomacy_desc:0 "전쟁 대신 교섭으로 라이타니엔의 양보를 얻는다."
 TU_URS_kazdel_border_claims:0 "카즈델 국경 주장"
 TU_URS_kazdel_border_claims_desc:0 "카즈델과의 국경을 옛 경계로 되돌려 달라고 주장한다."
 TU_URS_sami_war_plans:0 "사미 침공 계획"
 TU_URS_sami_war_plans_desc:0 "북방 사미와의 전쟁 명분을 쌓는다."
 TU_URS_loyalty_oath:0 "충성 서약"
 TU_URS_loyalty_oath_desc:0 "모든 장교가 황제와 군정에 충성을 맹세한다."
 TU_URS_p1_absolute_crown:0 "절대 왕관"
 TU_URS_p1_absolute_crown_desc:0 "왕관 아래 모든 권력이 모인다. 정치력 획득이 늘고 안정도가 오른다."
 TU_URS_p1_unification_mandate:0 "대통합 칙명"
 TU_URS_p1_unification_mandate_desc:0 "우르수스 땅을 하나로 묶는 칙명. 전쟁 지지와 공격력이 오른다."
 TU_URS_p1_grand_duke_fear:0 "대공들의 공포"
 TU_URS_p1_grand_duke_fear_desc:0 "대공들이 황제를 두려워한다. 정치력은 늘고 지방 안정도는 떨어진다."
 TU_URS_p1_surveillance_state:0 "감시 국가"
 TU_URS_p1_surveillance_state_desc:0 "곳곳의 눈이 제국을 지킨다. 안정도가 오르고 전쟁 지지가 조금 떨어진다."
 TU_URS_p1_imperial_blades:0 "황제의 칼날"
 TU_URS_p1_imperial_blades_desc:0 "근위대가 황제의 칼날로 벼려졌다. 사기와 조직력이 오른다."
 TU_URS_p1_crown_lands:0 "직할령"
 TU_URS_p1_crown_lands_desc:0 "황실 직할령의 세입이 제국 인구를 늘린다. 건설 속도가 오른다."
 TU_URS_p1_eternal_throne:0 "영원한 옥좌"
 TU_URS_p1_eternal_throne_desc:0 "옥좌는 대대로 이어진다. 정치력 획득이 늘고 안정도가 서서히 오른다."
 TU_URS_p1_capital_rail:0 "수도 철도망"
 TU_URS_p1_capital_rail_desc:0 "수도로 이어진 철도가 보급선을 짧게 한다. 보급 소모가 줄고 생산이 빨라진다."
 TU_URS_p2_total_war_economy:0 "총력전 경제"
 TU_URS_p2_total_war_economy_desc:0 "민간 소비를 줄이고 공장 생산을 높인다."
 TU_URS_p2_iron_regime:0 "철의 군정"
 TU_URS_p2_iron_regime_desc:0 "군정 체제가 철처럼 굳는다. 공격력이 오르지만 안정도가 떨어진다."
 TU_URS_p2_black_regiment:0 "검은 연대의 그림자"
 TU_URS_p2_black_regiment_desc:0 "검은 연대가 도시를 감시한다. 방어력이 오르지만 안정도가 떨어진다."
 TU_URS_p1_war_office_tech:0 "중앙 군정국 자문"
 TU_URS_p1_academy_tech:0 "황실 대학 연구"
 TU_URS_p1_guard_tech:0 "근위 보병 연구"
 TU_URS_p1_royal_tech:0 "왕실 기계화 연구"
 TU_URS_p1_rail_tech:0 "철도 중공업 기술"
 TU_URS_p1_steel_tech:0 "오리론 연결망 기술"
 TU_URS_p2_siege_tech:0 "포위 공성 기술"
 TU_URS_p2_armor_tech:0 "철갑 돌파 기술"
 TU_URS_p2_quota_tech:0 "군수 오리론 기술"
 TU_URS_p2_barrage_tech:0 "포병 집중 사격 기술"
 TU_URS_p2_corps_tech:0 "기갑 군단 기술"
 TU_URS_p2_armored_rail_tech:0 "장갑 열차 기술"
 TU_URS_p1_guard_marshal:0 "근위대 원수 블라디슬라프"
 TU_URS_p2_hardline_general:0 "강경파 장군 드미트리"
 TU_URS_p2_mobilisation_marshal:0 "동원 원수 야로슬라프"
