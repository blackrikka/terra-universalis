l_korean:
 # generated by tools/vic_dukes.py (spec 80)
 TU_VIC_dukes_category:0 "대공 의회"
 TU_VIC_dukes_category_desc:0 "빅토리아 본토는 여덟 공작의 영지로 나뉘어 있다. 충성도가 §Y40§! 아래로 떨어진 공작의 영지는 공장 출력이 몫만큼 줄고 안정도가 깎이며, 그 공작의 정예 사단을 소집할 수 없다. 한 공작을 밀어주면 맞수가 반발한다."
 TU_VIC_shard_category:0 "파편"
 TU_VIC_shard_category_desc:0 "론디니움을 점거한 카즈델 군사위원회가 인공 재앙 병기 '파편'을 깨우고 있다. 활성도가 §R100%§!가 되면 동부 전선이 초토화되고 카즈델 강탈 루트가 열린다. 론디니움을 되찾으면 멈춘다."
 TU_VIC_shard_mission:0 "파편 카운트다운"
 TU_VIC_shard_mission_desc:0 "남은 날이 다하면 파편이 발동한다. 자구군 지원·로도스 침투조·시설 파괴 공작으로 늦출 수 있다. 론디니움을 되찾으면 취소된다."
 TU_VIC_dec_shard_corps:0 "자구군 지원"
 TU_VIC_dec_shard_corps_desc:0 "론디니움 안의 자구군에 지휘력 §Y20§!과 보병 장비 §Y1000§!개를 보낸다. 파편 활성도 -8%, 시간 +48일."
 TU_VIC_dec_shard_rhodes:0 "로도스 침투조 지원"
 TU_VIC_dec_shard_rhodes_desc:0 "로도스 아일랜드 침투조를 돕는다. 지휘력 §Y10§!. 파편 활성도 -16%."
 TU_VIC_dec_shard_sabotage:0 "파편 시설 파괴 공작"
 TU_VIC_dec_shard_sabotage_desc:0 "파편의 에너지 시설을 노린다. 지휘력 §Y40§!, 안정도 -2%. 파편 활성도 -24%. (활성도 40% 이상)"
 TU_VIC_dec_muster_wellington:0 "웰링턴 육상전함 사단 소집"
 TU_VIC_dec_muster_wellington_desc:0 "웰링턴 공작의 육상전함 사단 한 개를 수도에 세운다. (웰링턴 충성도 §Y40§! 이상)"
 TU_VIC_dec_muster_windermere:0 "윈더미어 전선 돌파군 소집"
 TU_VIC_dec_muster_windermere_desc:0 "윈더미어 공작의 전선 돌파군 한 개를 수도에 세운다. (윈더미어 충성도 §Y40§! 이상)"
 TU_VIC_shard_aftermath:0 "파편의 재앙"
 TU_VIC_shard_aftermath_desc:0 "파편이 깨어났다. 동부 전선의 인프라가 무너지고 군은 혼란에 빠졌다. 조직력 -50%, 안정도 -15%, 전쟁 지지 -10%."
 TU_VIC_dukes_unrest:0 "공작들의 불만"
 TU_VIC_dukes_unrest_desc:0 "충성을 잃은 공작의 영지에서 공장이 돌지 않는다."
 tu_vic_shard.1.t:0 "파편 발동"
 tu_vic_shard.1.d:0 "론디니움의 하늘이 붉게 물들었다. 카즈델 군사위원회가 '파편'을 깨웠고, 동부 전선에서 인프라가 차례로 무너진다. 군의 조직은 반으로 줄었다. 이제 카즈델은 빅토리아의 공업을 '보호'하겠다며 손을 내밀고 있다."
 tu_vic_shard.1.a:0 "...늦었다."
 TU_VIC_dec_support_caster:0 "캐스터 공작 밀어주기"
 TU_VIC_dec_support_caster_desc:0 "캐스터 공작(중앙집권·정치 공작)의 충성도 +12, 영향력 +8. 맞수 웰링턴 공작은 충성도 -8, 영향력 -5."
 TU_VIC_dec_appease_caster:0 "캐스터 공작 달래기"
 TU_VIC_dec_appease_caster_desc:0 "캐스터 공작의 충성도 +6. 충성도가 55 미만일 때만 보인다."
 tu_vic_dukes.1.t:0 "캐스터 공작의 불만"
 tu_vic_dukes.1.d:0 "캐스터 공작이 의회에 나오지 않고 영지의 문을 닫았다. 영지의 공장이 멈추고 있다. (영지 몫 29%, 공장 출력 -14%)"
 tu_vic_dukes.1.a:0 "선물을 보내 달랜다."
 tu_vic_dukes.1.b:0 "버틴다."
