 tu_min_ev.1.t:0 "다섯 도시의 아침"
 tu_min_ev.1.d:0 "민회 광장에 시민들이 모였다. 신전에서는 사제가 신탁을 준비하고, 항구에서는 상선이 돛을 올린다."
 tu_min_ev.1.a:0 "민회의 뜻대로."
 tu_min_ev.1.b:0 "바다로."
 tu_min_ev.20.t:0 "신탁"
 tu_min_ev.20.d:0 "연기 속에서 무녀가 입을 열었다."
 tu_min_ev.20.a:0 "길조다!"
 tu_min_ev.20.b:0 "흉조다..."
 tu_min_ev.20.c:0 "알 수 없는 수수께끼다."
 tu_min_ev.21.t:0 "신탁의 끝"
 tu_min_ev.21.d:0 "신탁의 기운이 사라졌다."
 tu_min_ev.21.a:0 "다시 신탁을 구할 때다."
 TU_MIN_routes_m1_tt:0 "§G해상 교역로§! -1"
 tu_min_ev.22.t:0 "해적의 습격"
 tu_min_ev.22.d:0 "해적이 교역로 하나를 끊었다."
 tu_min_ev.22.a:0 "손실을 받아들인다."
 tu_min_ev.22.b:0 "호위대를 보낸다."
 TU_MIN_assembly_m5_tt:0 "§Y민회 지지§! -5"
 tu_min_ev.23.t:0 "철학자들의 논쟁"
 tu_min_ev.23.d:0 "광장에서 철학자들의 논쟁이 사흘째 이어진다."
 tu_min_ev.23.a:0 "끝까지 듣는다."
 tu_min_ev.23.b:0 "해산시킨다."
 tu_min_ev.24.t:0 "도편 추방 투표"
 tu_min_ev.24.d:0 "시민들이 너무 강해진 정치인 하나를 추방하자고 투표했다."
 tu_min_ev.24.a:0 "민회의 뜻을 따른다."
 tu_min_ev.24.b:0 "투표를 무효로 한다."
 tu_min_ev.25.t:0 "대경기의 영웅"
 tu_min_ev.25.d:0 "한 젊은 선수가 대경기에서 모든 종목을 휩쓸었다."
 tu_min_ev.25.a:0 "영웅을 기린다."
 tu_min_ev.26.t:0 "상선의 귀환"
 tu_min_ev.26.d:0 "먼 항해에서 돌아온 상선이 진귀한 물건을 가득 실었다."
 tu_min_ev.26.a:0 "시장에 푼다."
 tu_min_ev.27.t:0 "원로와 시민의 충돌"
 tu_min_ev.27.d:0 "원로들이 민회의 결정을 뒤집으려 하자 시민들이 광장을 채웠다."
 tu_min_ev.27.a:0 "시민 편을 든다."
 tu_min_ev.27.b:0 "원로 편을 든다."
 tu_min_ev.28.t:0 "민주 폴리스"
 tu_min_ev.28.d:0 "미노스는 시민의 나라가 되었다."
 tu_min_ev.28.a:0 "민회 만세."
 tu_min_ev.29.t:0 "원로 정체"
 tu_min_ev.29.d:0 "원로들이 미노스를 맡았다."
 tu_min_ev.29.a:0 "지혜를 따르라."
 tu_min_ev.30.t:0 "해상 패권"
 tu_min_ev.30.d:0 "미노스의 배가 닿지 않는 바다는 없다."
 tu_min_ev.30.a:0 "바다의 주인."
 tu_min_ev.31.t:0 "폭풍"
 tu_min_ev.31.d:0 "큰 폭풍이 상선 여러 척을 삼켰다."
 tu_min_ev.31.a:0 "애도한다."
 tu_min_ev.32.t:0 "신전의 기적"
 tu_min_ev.32.d:0 "신전의 성화가 저절로 타올랐다."
 tu_min_ev.32.a:0 "신이 함께한다."
 tu_min_ev.33.t:0 "외국 유학생"
