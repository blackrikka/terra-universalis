 TU_STATUS_TU_SIR_saluzzo_tt:0 "§Y살루초 패밀리§!: [?TU_SIR_saluzzo|Y0] / 100\n살루초 패밀리의 영향력입니다. 매달 오르며, 거래하면 더 강해지고 단속하면 약해집니다.\n\n§g막대의 눈금(50 · 60)은 정세가 달라지는 고비입니다.§!"
