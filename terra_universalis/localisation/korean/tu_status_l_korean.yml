l_korean:
 TU_STATUS_TU_BOL_control_label:0 "정부 장악력"
 TU_STATUS_TU_BOL_control_value:0 "[?TU_BOL_control|Y0] / 100"
 TU_STATUS_TU_BOL_control_tt:0 "§Y정부 장악력§!: [?TU_BOL_control|Y0] / 100\n정부가 실제로 다스리는 땅과 사람들입니다. §Y100§!에 이르면 내전이 끝납니다.\n\n§g막대의 눈금(40 · 50 · 70)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_BOL_weariness_label:0 "전쟁 피로"
 TU_STATUS_TU_BOL_weariness_value:0 "[?TU_BOL_weariness|Y0] / 100"
 TU_STATUS_TU_BOL_weariness_tt:0 "§Y전쟁 피로§!: [?TU_BOL_weariness|Y0] / 100\n내전이 이어지는 동안 매달 오릅니다. 이제 사람들은 누가 이기든 상관없다고 말합니다.\n\n§g막대의 눈금(60 · 70 · 80)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_BOL_victoria_label:0 "빅토리아 의존"
 TU_STATUS_TU_BOL_victoria_value:0 "[?TU_BOL_victoria|Y0] / 100"
 TU_STATUS_TU_BOL_victoria_tt:0 "§Y빅토리아 의존§!: [?TU_BOL_victoria|Y0] / 100\n빅토리아의 원조에 기댄 만큼 쌓입니다. §Y60§!을 넘으면 후원국이 요구를 해 옵니다.\n\n§g막대의 눈금(30 · 40 · 60 · 70)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_BOL_columbia_label:0 "컬럼비아 의존"
 TU_STATUS_TU_BOL_columbia_value:0 "[?TU_BOL_columbia|Y0] / 100"
 TU_STATUS_TU_BOL_columbia_tt:0 "§Y컬럼비아 의존§!: [?TU_BOL_columbia|Y0] / 100\n컬럼비아의 원조에 기댄 만큼 쌓입니다. §Y60§!을 넘으면 후원국이 요구를 해 옵니다.\n\n§g막대의 눈금(30 · 40 · 60 · 70)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_COL_science_label:0 "과학 역량"
 TU_STATUS_TU_COL_science_value:0 "[?TU_COL_science|Y0] / 200"
 TU_STATUS_TU_COL_science_tt:0 "§Y과학 역량§!: [?TU_COL_science|Y0] / 200\n국가 연구 프로젝트와 행정이 쌓아 올린 과학의 힘입니다.\n\n§g막대의 눈금(30 · 40 · 60 · 100 · 180)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_HIG_foreign_label:0 "외세 영향"
 TU_STATUS_TU_HIG_foreign_value:0 "[?TU_HIG_foreign|Y0] / 100"
 TU_STATUS_TU_HIG_foreign_tt:0 "§Y외세 영향§!: [?TU_HIG_foreign|Y0] / 100\n열린 항구마다 바깥의 입김이 쌓입니다. §Y60§!을 넘으면 존왕양이 봉기가 일어납니다.\n\n§g막대의 눈금(20 · 40 · 60)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_HIG_ports_label:0 "개항장"
 TU_STATUS_TU_HIG_ports_value:0 "[?TU_HIG_ports|Y0] / 4"
 TU_STATUS_TU_HIG_ports_tt:0 "§Y개항장§!: [?TU_HIG_ports|Y0] / 4\n바깥 배에 문을 연 항구입니다. 항구마다 매달 정치력 §G+0.5§!, 외세 영향 §R+2§!가 붙습니다.\n\n§g막대의 눈금(1 · 2 · 3)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_HIG_shinobi_label:0 "닌자"
 TU_STATUS_TU_HIG_shinobi_value:0 "[?TU_HIG_shinobi|Y0] / 10"
 TU_STATUS_TU_HIG_shinobi_tt:0 "§Y닌자§!: [?TU_HIG_shinobi|Y0] / 10\n막부가 부릴 수 있는 그림자들입니다. 작전 하나에 닌자 §Y2§!명이 듭니다.\n\n§g막대의 눈금(1 · 4 · 5 · 9)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_IBE_threat_label:0 "바다의 위협"
 TU_STATUS_TU_IBE_threat_value:0 "[?TU_IBE_threat|Y0] / 100"
 TU_STATUS_TU_IBE_threat_tt:0 "§Y바다의 위협§!: [?TU_IBE_threat|Y0] / 100\n심연에서 올라오는 것들의 기척입니다. 매달 오르며, 온전한 등대가 많을수록 덜 오릅니다. §Y70§! 이상이면 해안 마을이 침식됩니다.\n\n§g막대의 눈금(20 · 25 · 30 · 40 · 50 · 70)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_IBE_lighthouses_label:0 "해안의 등대"
 TU_STATUS_TU_IBE_lighthouses_value:0 "불 밝힌 등대 [?TU_IBE_lighthouses|Y0]기 · §O꺼져 가는 등대 [?TU_IBE_lh_damaged|0]기§!"
 TU_STATUS_TU_IBE_lighthouses_tt:0 "§Y해안의 등대§!: 불 밝힌 등대 [?TU_IBE_lighthouses|Y0]기 · §O꺼져 가는 등대 [?TU_IBE_lh_damaged|0]기§!\n다시 불을 밝힌 해안의 등대입니다. 온전한 등대 하나마다 바다의 위협이 덜 오릅니다.\n칸 색: §Y금색§! 온전 · §O주황§! 손상 1단계 · §R빨강§! 손상 2단계. 손상된 등대는 위협을 막지 못합니다.\n\n§g막대의 눈금(1 · 2)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_KAZ_fame_label:0 "기사 명성"
 TU_STATUS_TU_KAZ_fame_value:0 "[?TU_KAZ_fame|Y0] / 100"
 TU_STATUS_TU_KAZ_fame_tt:0 "§Y기사 명성§!: [?TU_KAZ_fame|Y0] / 100\n경기장과 전장에서 얻은 카시미어 기사들의 이름값입니다.\n\n§g막대의 눈금(20 · 30 · 40 · 50 · 60 · 80)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_KJE_modern_label:0 "근대화"
 TU_STATUS_TU_KJE_modern_value:0 "[?TU_KJE_modern|Y0] / 100"
 TU_STATUS_TU_KJE_modern_tt:0 "§Y근대화§!: [?TU_KJE_modern|Y0] / 100\n공장과 연구가 설산에 들어온 정도입니다. 근대화는 공장과 연구를, 전통은 신앙과 안정을 가져옵니다.\n\n§g막대의 눈금(15 · 30 · 40 · 50 · 60 · 70)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_KZD_contracts_label:0 "맺은 용병 계약"
 TU_STATUS_TU_KZD_contracts_value:0 "[?TU_KZD_contracts|Y0] / 3"
 TU_STATUS_TU_KZD_contracts_tt:0 "§Y맺은 용병 계약§!: [?TU_KZD_contracts|Y0] / 3\n지금 맺고 있는 용병 계약입니다. 한 번에 §Y3§!건까지 맺을 수 있습니다."
 TU_STATUS_TU_LAT_pilgrims_label:0 "순례자"
 TU_STATUS_TU_LAT_pilgrims_value:0 "[?TU_LAT_pilgrims|Y0] / 200"
 TU_STATUS_TU_LAT_pilgrims_tt:0 "§Y순례자§!: [?TU_LAT_pilgrims|Y0] / 200\n성도를 찾아온 순례자들입니다. 매달 늘어나고, 전쟁 중에는 줄어듭니다. 헌금·의용대·축제로 쓸 수 있습니다.\n\n§g막대의 눈금(10 · 20 · 30 · 50 · 80 · 100)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_LAT_influence_label:0 "교황청 영향력"
 TU_STATUS_TU_LAT_influence_value:0 "[?TU_LAT_influence|Y0] / 100"
 TU_STATUS_TU_LAT_influence_tt:0 "§Y교황청 영향력§!: [?TU_LAT_influence|Y0] / 100\n교황청의 목소리가 테라 곳곳에 닿는 정도입니다.\n\n§g막대의 눈금(20 · 30)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_LEI_resonance_label:0 "아츠 공명"
 TU_STATUS_TU_LEI_resonance_value:0 "[?TU_LEI_resonance|Y0] / 100"
 TU_STATUS_TU_LEI_resonance_tt:0 "§Y아츠 공명§!: [?TU_LEI_resonance|Y0] / 100\n연주회로 쌓아 올린 아츠의 울림입니다. 공명 §Y30§!으로 교향곡을 걸 수 있습니다.\n\n§g막대의 눈금(30 · 50 · 90)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_LEI_electors_label:0 "여제 편 선제후"
 TU_STATUS_TU_LEI_electors_value:0 "[?TU_LEI_electors|Y0] / 7"
 TU_STATUS_TU_LEI_electors_tt:0 "§Y여제 편 선제후§!: [?TU_LEI_electors|Y0] / 7\n여제를 지지하는 선제후입니다. §Y5§!명 이상이면 제국 칙령을 내릴 수 있습니다.\n\n§g막대의 눈금(2 · 3 · 4)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_LEI_relics_label:0 "마왕의 유물"
 TU_STATUS_TU_LEI_relics_value:0 "[?TU_LEI_relics|Y0] / 3"
 TU_STATUS_TU_LEI_relics_tt:0 "§Y마왕의 유물§!: [?TU_LEI_relics|Y0] / 3\n제국 곳곳에 흩어진 마왕 시대의 유물입니다.\n\n§g막대의 눈금(1 · 2)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_MIN_assembly_label:0 "민회 지지"
 TU_STATUS_TU_MIN_assembly_value:0 "[?TU_MIN_assembly|Y0] / 100"
 TU_STATUS_TU_MIN_assembly_tt:0 "§Y민회 지지§!: [?TU_MIN_assembly|Y0] / 100\n민회가 정부를 믿고 따르는 정도입니다. 법안을 통과시킬 때 씁니다.\n\n§g막대의 눈금(10 · 15 · 30 · 70)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_MIN_routes_label:0 "해상 교역로"
 TU_STATUS_TU_MIN_routes_value:0 "[?TU_MIN_routes|Y0] / 6"
 TU_STATUS_TU_MIN_routes_tt:0 "§Y해상 교역로§!: [?TU_MIN_routes|Y0] / 6\n다섯 도시를 바깥 세상과 잇는 바닷길입니다.\n\n§g막대의 눈금(1 · 2 · 3 · 4 · 5)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_lmd_label:0 "보유 용문폐"
 TU_STATUS_TU_lmd_value:0 "[?TU_lmd|Y0] LMD"
 TU_STATUS_TU_lmd_tt:0 "§Y보유 용문폐§!: [?TU_lmd|Y0] LMD\n로도스 아일랜드의 운영 자금입니다. RIIC 업그레이드와 작전에 씁니다."
 TU_STATUS_TU_RHO_lmd_income_label:0 "월 수입"
 TU_STATUS_TU_RHO_lmd_income_value:0 "[?TU_RHO_lmd_income|Y0] LMD"
 TU_STATUS_TU_RHO_lmd_income_tt:0 "§Y월 수입§!: [?TU_RHO_lmd_income|Y0] LMD\n매달 들어오는 용문폐입니다. 무역소 레벨이 오르면 늘어납니다."
 TU_STATUS_TU_RHO_riic_power_label:0 "RIIC 발전소"
 TU_STATUS_TU_RHO_riic_power_value:0 "[?TU_RHO_riic_power|Y0] / 3"
 TU_STATUS_TU_RHO_riic_power_tt:0 "§YRIIC 발전소§!: [?TU_RHO_riic_power|Y0] / 3\n최대 §Y3§!레벨입니다. 레벨마다 다른 시설의 레벨 상한이 1 오릅니다."
 TU_STATUS_TU_RHO_riic_factory_label:0 "RIIC 제조소"
 TU_STATUS_TU_RHO_riic_factory_value:0 "[?TU_RHO_riic_factory|Y0] / [?TU_RHO_riic_cap|0]"
 TU_STATUS_TU_RHO_riic_factory_tt:0 "§YRIIC 제조소§!: [?TU_RHO_riic_factory|Y0] / [?TU_RHO_riic_cap|0]\n레벨마다 외부 무기 공장을 하나씩 더 얻습니다.\n레벨 상한은 발전소 레벨 + 2입니다."
 TU_STATUS_TU_RHO_riic_trade_label:0 "RIIC 무역소"
 TU_STATUS_TU_RHO_riic_trade_value:0 "[?TU_RHO_riic_trade|Y0] / [?TU_RHO_riic_cap|0]"
 TU_STATUS_TU_RHO_riic_trade_tt:0 "§YRIIC 무역소§!: [?TU_RHO_riic_trade|Y0] / [?TU_RHO_riic_cap|0]\n레벨마다 외부 산업 단지를 하나씩 더 얻고, 월 용문폐 수입이 늘어납니다.\n레벨 상한은 발전소 레벨 + 2입니다."
 TU_STATUS_TU_RHO_riic_dorm_label:0 "RIIC 숙소"
 TU_STATUS_TU_RHO_riic_dorm_value:0 "[?TU_RHO_riic_dorm|Y0] / [?TU_RHO_riic_cap|0]"
 TU_STATUS_TU_RHO_riic_dorm_tt:0 "§YRIIC 숙소§!: [?TU_RHO_riic_dorm|Y0] / [?TU_RHO_riic_cap|0]\n군 조직 회복과 사기를 높입니다.\n레벨 상한은 발전소 레벨 + 2입니다."
 TU_STATUS_TU_RHO_riic_reception_label:0 "RIIC 응접실"
 TU_STATUS_TU_RHO_riic_reception_value:0 "[?TU_RHO_riic_reception|Y0] / [?TU_RHO_riic_cap|0]"
 TU_STATUS_TU_RHO_riic_reception_tt:0 "§YRIIC 응접실§!: [?TU_RHO_riic_reception|Y0] / [?TU_RHO_riic_cap|0]\n정치력 획득을 높입니다. 라 레지스탕스가 있으면 정보망 획득도 오릅니다.\n레벨 상한은 발전소 레벨 + 2입니다."
 TU_STATUS_TU_RHO_pmc_count_label:0 "PMC 계약"
 TU_STATUS_TU_RHO_pmc_count_value:0 "[?TU_RHO_pmc_count|Y0]"
 TU_STATUS_TU_RHO_pmc_count_tt:0 "§YPMC 계약§!: [?TU_RHO_pmc_count|Y0]\n로도스 아일랜드가 맺고 있는 PMC 계약입니다."
 TU_STATUS_TU_RIM_infection_label:0 "광석병 감염률"
 TU_STATUS_TU_RIM_infection_value:0 "[?TU_RIM_infection|Y0] / 100"
 TU_STATUS_TU_RIM_infection_tt:0 "§Y광석병 감염률§!: [?TU_RIM_infection|Y0] / 100\n광부와 주민 사이에 퍼진 광석병입니다. §Y60§!을 넘으면 파업과 집단 감염이 일어납니다.\n\n§g막대의 눈금(30 · 40 · 60 · 75)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_RIM_ore_label:0 "비축 원석"
 TU_STATUS_TU_RIM_ore_value:0 "[?TU_RIM_ore|Y0] / 500"
 TU_STATUS_TU_RIM_ore_tt:0 "§Y비축 원석§!: [?TU_RIM_ore|Y0] / 500\n갱도에서 캐낸 원석입니다. 갱도마다 매달 §G+5§!씩 쌓입니다.\n\n§g막대의 눈금(20 · 30 · 50 · 60 · 100 · 150)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_RIM_shafts_label:0 "원석 갱도"
 TU_STATUS_TU_RIM_shafts_value:0 "[?TU_RIM_shafts|Y0] / 8"
 TU_STATUS_TU_RIM_shafts_tt:0 "§Y원석 갱도§!: [?TU_RIM_shafts|Y0] / 8\n운영 중인 원석 갱도입니다. 갱도마다 매달 광석 §G+5§!, 감염률 §R+1§!이 붙습니다.\n\n§g막대의 눈금(3 · 5)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_RIM_settlements_label:0 "정착촌"
 TU_STATUS_TU_RIM_settlements_value:0 "[?TU_RIM_settlements|Y0] / 5"
 TU_STATUS_TU_RIM_settlements_tt:0 "§Y정착촌§!: [?TU_RIM_settlements|Y0] / 5\n황무지 위에 세운 정착촌입니다.\n\n§g막대의 눈금(1 · 3)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_SAM_grace_label:0 "숲의 은총"
 TU_STATUS_TU_SAM_grace_value:0 "[?TU_SAM_grace|Y0] / 100"
 TU_STATUS_TU_SAM_grace_tt:0 "§Y숲의 은총§!: [?TU_SAM_grace|Y0] / 100\n숲이 사미에게 허락한 은총입니다. 정령 계약 하나마다 매달 §R-1§!씩 줄어듭니다. §Y20§! 아래로 떨어지면 숲이 분노합니다.\n\n§g막대의 눈금(15 · 20 · 40 · 50 · 60 · 80)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_SAM_contact_label:0 "바깥과의 접촉"
 TU_STATUS_TU_SAM_contact_value:0 "[?TU_SAM_contact|Y0] / 100"
 TU_STATUS_TU_SAM_contact_tt:0 "§Y바깥과의 접촉§!: [?TU_SAM_contact|Y0] / 100\n바깥 세상과 닿은 정도입니다.\n\n§g막대의 눈금(60)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_SAM_councils_label:0 "부족 회의"
 TU_STATUS_TU_SAM_councils_value:0 "[?TU_SAM_councils|Y0] / 3"
 TU_STATUS_TU_SAM_councils_tt:0 "§Y부족 회의§!: [?TU_SAM_councils|Y0] / 3\n열린 부족 회의입니다.\n\n§g막대의 눈금(2)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_SAM_pacts_label:0 "정령 계약"
 TU_STATUS_TU_SAM_pacts_value:0 "[?TU_SAM_pacts|Y0] / 2"
 TU_STATUS_TU_SAM_pacts_tt:0 "§Y정령 계약§!: [?TU_SAM_pacts|Y0] / 2\n맺은 정령 계약입니다. 동시에 §Y2§!개까지 맺을 수 있습니다.\n\n§g막대의 눈금(1)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_SAR_gold_label:0 "황금"
 TU_STATUS_TU_SAR_gold_value:0 "[?TU_SAR_gold|Y0] / 200"
 TU_STATUS_TU_SAR_gold_tt:0 "§Y황금§!: [?TU_SAR_gold|Y0] / 200\n대상단이 싣고 온 황금입니다. 대상단은 떠난 지 60일 뒤에 돌아옵니다.\n\n§g막대의 눈금(20 · 25 · 30 · 40 · 50 · 60 · 100)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_SAR_loyalty_label:0 "영주들의 충성"
 TU_STATUS_TU_SAR_loyalty_value:0 "[?TU_SAR_loyalty|Y0] / 100"
 TU_STATUS_TU_SAR_loyalty_tt:0 "§Y영주들의 충성§!: [?TU_SAR_loyalty|Y0] / 100\n영주들이 파디샤를 섬기는 마음입니다. §Y30§! 아래로 떨어지면 반란이 일어날 수 있습니다.\n\n§g막대의 눈금(30 · 40 · 45 · 50 · 70)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_SIR_law_label:0 "법의 권위"
 TU_STATUS_TU_SIR_law_value:0 "[?TU_SIR_law|Y0] / 100"
 TU_STATUS_TU_SIR_law_tt:0 "§Y법의 권위§!: [?TU_SIR_law|Y0] / 100\n도시에 남아 있는 법의 무게입니다. 패밀리와 거래하면 약해지고, 단속하면 강해집니다.\n\n§g막대의 눈금(40 · 50 · 70)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_SIR_bellone_label:0 "벨로네 패밀리"
 TU_STATUS_TU_SIR_bellone_value:0 "[?TU_SIR_bellone|Y0] / 100"
 TU_STATUS_TU_SIR_bellone_tt:0 "§Y벨로네 패밀리§!: [?TU_SIR_bellone|Y0] / 100\n벨로네 패밀리의 영향력입니다. 매달 오르며, 거래하면 더 강해지고 단속하면 약해집니다.\n\n§g막대의 눈금(50 · 60)은 정세가 달라지는 고비입니다.§!"
 TU_STATUS_TU_SIR_gambino_label:0 "감비노 패밀리"
 TU_STATUS_TU_SIR_gambino_value:0 "[?TU_SIR_gambino|Y0] / 100"
 TU_STATUS_TU_SIR_gambino_tt:0 "§Y감비노 패밀리§!: [?TU_SIR_gambino|Y0] / 100\n감비노 패밀리의 영향력입니다. 매달 오르며, 거래하면 더 강해지고 단속하면 약해집니다.\n\n§g막대의 눈금(50 · 60)은 정세가 달라지는 고비입니다.§!"
