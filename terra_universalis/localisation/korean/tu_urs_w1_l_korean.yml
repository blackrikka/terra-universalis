l_korean:
 TU_URS_w1_border_readiness:0 "국경 전진 준비"
 TU_URS_w1_border_readiness_desc:0 "국경 요새와 병력이 언제든 움직일 수 있도록 준비돼 있다."
 TU_URS_w1_mercenary_levy:0 "용병 징집병"
 TU_URS_w1_mercenary_levy_desc:0 "카즈델에서 넘어온 용병들이 우르수스의 군기에 조금씩 익숙해지고 있다."
 TU_URS_w1_war_footing:0 "전시 편제"
 TU_URS_w1_war_footing_desc:0 "전시 편제 아래 공장과 부대가 빠르게 움직인다."
 TU_URS_w1_occupation_strain:0 "점령지 피로"
 TU_URS_w1_occupation_strain_desc:0 "점령지 주민과 병사 모두 점령의 무게를 느끼고 있다."
 TU_URS_w1_cultural_absorption:0 "문화 흡수"
 TU_URS_w1_cultural_absorption_desc:0 "편입된 주의 전통과 말이 우르수스의 생활 속으로 천천히 녹아든다."
 TU_URS_w2_sleeping_giant:0 "잠든 거인의 기지개"
 TU_URS_w2_sleeping_giant_desc:0 "대륙의 거대한 인구가 깨어나 징병 명부에 오르기 시작한다."
 TU_URS_w2_merchant_fleet:0 "상단 선대"
 TU_URS_w2_merchant_fleet_desc:0 "용문의 상선들이 우르수스의 깃발을 달고 항구를 드나든다."
 TU_URS_w2_naval_blockade:0 "해상 봉쇄"
 TU_URS_w2_naval_blockade_desc:0 "극동의 항구는 굳게 닫혔고 교역은 눈에 띄게 줄었다."
 TU_URS_w2_reunion_front:0 "레유니온 전선"
 TU_URS_w2_reunion_front_desc:0 "레유니온과의 분쟁 지역에서 병사들의 사기가 높아진다."
 TU_URS_w2_occupation_strain:0 "남방 점령지 피로"
 TU_URS_w2_occupation_strain_desc:0 "남방 점령지의 치안 유지가 병력과 민심을 함께 지치게 한다."

 TU_URS_w1_kzd_envoy:0 "카즈델 사절단"
 TU_URS_w1_kzd_envoy_desc:0 "용병 도시 카즈델에 사절을 보낸다. 그들은 계약서를 믿지만 먼저 얼굴을 확인하려 한다."
 TU_URS_w1_kzd_trade_talks:0 "용병 교역 협정"
 TU_URS_w1_kzd_trade_talks_desc:0 "용병 계약을 교역 협정으로 바꾼다. 테레시스의 상인들은 셈이 빠르고 약속은 정확하다."
 TU_URS_w1_kzd_border_claims:0 "국경 마을 반환 요구"
 TU_URS_w1_kzd_border_claims_desc:0 "카즈델이 점유한 국경 마을이 우르수스의 옛 땅이라고 공문으로 주장한다."
 TU_URS_w1_kzd_cultural_exchange:0 "용병 문화 교류"
 TU_URS_w1_kzd_cultural_exchange_desc:0 "카즈델의 전투 노래와 우르수스의 시를 나란히 실은 책자를 펴낸다."
 TU_URS_w1_kzd_border_buildup:0 "국경 병력 집결"
 TU_URS_w1_kzd_border_buildup_desc:0 "국경 요새에 병력을 모은다. 카즈델의 눈에는 이것이 경고로 보인다."
 TU_URS_w1_kzd_mobilization:0 "예비 군단 동원"
 TU_URS_w1_kzd_mobilization_desc:0 "예비 전력을 깨우고 장교단을 재편한다."
 TU_URS_w1_kzd_non_aggression:0 "카즈델 불가침 조약"
 TU_URS_w1_kzd_non_aggression_desc:0 "국경 충돌을 멈추는 조약에 서명한다. 서명이 끝나면 전쟁 계획은 서랍 속으로 들어간다."
 TU_URS_w1_kzd_border_ultimatum:0 "국경 최후통첩"
 TU_URS_w1_kzd_border_ultimatum_desc:0 "마을 반환과 통행권을 요구하는 최후통첩을 보낸다. 거절하면 대가는 카즈델이 치른다."
 TU_URS_w1_kzd_war_doctrine:0 "용병 격파 교리"
 TU_URS_w1_kzd_war_doctrine_desc:0 "용병 부대를 상대하는 전술을 연구한다. 계약이 끝난 병사는 쉽게 흩어진다."
 TU_URS_w1_kzd_guarantee:0 "카즈델 안보 보장"
 TU_URS_w1_kzd_guarantee_desc:0 "카즈델의 독립을 보장한다. 보장은 무기가 되기도 하고 족쇄가 되기도 한다."
 TU_URS_w1_kzd_imperial_levy:0 "황제의 용병 징집"
 TU_URS_w1_kzd_imperial_levy_desc:0 "황제의 칙령으로 카즈델 용병을 우르수스 군에 편입한다."
 TU_URS_w1_kzd_war_declaration:0 "카즈델 침공 선언"
 TU_URS_w1_kzd_war_declaration_desc:0 "테레시스를 향한 전면전을 선포한다. 계약서는 찢어졌고 전쟁이 시작된다."
 TU_URS_w1_kzd_occupation:0 "테레시스 점령"
 TU_URS_w1_kzd_occupation_desc:0 "점령지의 질서를 세운다. 잔당은 숨어 있지만 성문은 이미 우리 손에 있다."
 TU_URS_w1_kzd_core_integration:0 "카즈델 중핵 편입"
 TU_URS_w1_kzd_core_integration_desc:0 "카즈델의 핵심 주를 우르수스의 핵심 영토로 편입한다."
 TU_URS_w1_kzd_long_term:0 "용병단 재편과 기반 건설"
 TU_URS_w1_kzd_long_term_desc:0 "편입된 주에 공장과 기반시설을 세운다. 용병의 돈은 이제 우리 장부에 기록된다."

 TU_URS_w1_vic_envoy:0 "론디니움 사절단"
 TU_URS_w1_vic_envoy_desc:0 "왕좌가 비어 있는 빅토리아에 사절을 보낸다. 섭정 가운데 누가 실권을 쥐었는지부터 알아야 한다."
 TU_URS_w1_vic_trade_talks:0 "항만 무역 협정"
 TU_URS_w1_vic_trade_talks_desc:0 "섭정들과 항만 사용료를 맞춘다. 누구의 도장이든 종이에 찍히면 효력이 있다."
 TU_URS_w1_vic_border_claims:0 "빈 왕좌의 영유권"
 TU_URS_w1_vic_border_claims_desc:0 "왕이 없는 빅토리아의 국경 땅을 우르수스의 몫으로 주장한다."
 TU_URS_w1_vic_cultural_exchange:0 "론디니움 학술 교류"
 TU_URS_w1_vic_cultural_exchange_desc:0 "의회 도서관의 기록을 교환해 서로의 법률과 역사를 배운다."
 TU_URS_w1_vic_border_buildup:0 "접경 요새 증강"
 TU_URS_w1_vic_border_buildup_desc:0 "빅토리아 국경의 요새를 보강하고 전선으로 이어지는 보급로를 깐다."
 TU_URS_w1_vic_mobilization:0 "공위 틈 진격 준비"
 TU_URS_w1_vic_mobilization_desc:0 "왕좌가 비어 있는 틈을 노려 기동 부대를 편성한다."
 TU_URS_w1_vic_non_aggression:0 "빅토리아 불가침 조약"
 TU_URS_w1_vic_non_aggression_desc:0 "섭정 회의와 불가침 조약을 맺는다. 종이 한 장이 국경의 총성을 잠시 멈춘다."
 TU_URS_w1_vic_border_ultimatum:0 "섭정에게 보내는 최후통첩"
 TU_URS_w1_vic_border_ultimatum_desc:0 "국경 마을과 항만 통행권을 요구하는 최후통첩을 보낸다."
 TU_URS_w1_vic_war_doctrine:0 "보급선 우선 교리"
 TU_URS_w1_vic_war_doctrine_desc:0 "보급선을 먼저 확보하고 진격하는 교리를 채택한다."
 TU_URS_w1_vic_guarantee:0 "빅토리아 독립 보장"
 TU_URS_w1_vic_guarantee_desc:0 "빅토리아의 독립을 보장해 다른 열강의 손을 막는다."
 TU_URS_w1_vic_junta_intervention:0 "군사 정부의 개입"
 TU_URS_w1_vic_junta_intervention_desc:0 "군사 정부의 명령으로 빅토리아 내정에 개입한다. 질서는 빨리 잡히지만 명분은 늦게 따라온다."
 TU_URS_w1_vic_war_declaration:0 "빅토리아 침공 선언"
 TU_URS_w1_vic_war_declaration_desc:0 "론디니움을 향한 전쟁을 선포한다. 빈 왕좌는 이제 우리의 것이 된다."
 TU_URS_w1_vic_occupation:0 "론디니움 점령"
 TU_URS_w1_vic_occupation_desc:0 "항만과 의회를 점령하고 치안을 세운다."
 TU_URS_w1_vic_core_integration:0 "빅토리아 중핵 편입"
 TU_URS_w1_vic_core_integration_desc:0 "빅토리아의 핵심 주를 우르수스의 핵심 영토로 편입한다."
 TU_URS_w1_vic_long_term:0 "항만 공업 지구 건설"
 TU_URS_w1_vic_long_term_desc:0 "편입된 항만 주에 공장과 기반시설을 세운다."

 TU_URS_w1_lei_envoy:0 "쌍둥이 여제 사절단"
 TU_URS_w1_lei_envoy_desc:0 "두 여제 가운데 누구에게 먼저 인사할지부터 정해야 한다. 아츠 학자 한 명을 함께 보낸다."
 TU_URS_w1_lei_trade_talks:0 "아츠 학술 교역"
 TU_URS_w1_lei_trade_talks_desc:0 "아츠 연구 자료를 주고받는 조건으로 관세를 낮춘다."
 TU_URS_w1_lei_border_claims:0 "두 여제의 옛 영지"
 TU_URS_w1_lei_border_claims_desc:0 "두 여제의 조상이 다스리던 국경 영지를 우르수스의 땅으로 주장한다."
 TU_URS_w1_lei_cultural_exchange:0 "두 여제의 궁정 교류"
 TU_URS_w1_lei_cultural_exchange_desc:0 "궁정 무용단과 악단을 교환해 양국 귀족의 감정을 누그러뜨린다."
 TU_URS_w1_lei_border_buildup:0 "아츠 방벽 증강"
 TU_URS_w1_lei_border_buildup_desc:0 "아츠 술식으로 강화한 방벽을 국경에 세운다."
 TU_URS_w1_lei_mobilization:0 "여제 친위대 동원"
 TU_URS_w1_lei_mobilization_desc:0 "여제의 친위대를 전선으로 보낸다."
 TU_URS_w1_lei_non_aggression:0 "쌍둥이 여제와의 불가침 조약"
 TU_URS_w1_lei_non_aggression_desc:0 "두 여제와 함께 국경 불가침을 약속한다."
 TU_URS_w1_lei_border_ultimatum:0 "두 여제에게 보내는 최후통첩"
 TU_URS_w1_lei_border_ultimatum_desc:0 "국경 영지의 반환을 요구하는 최후통첩을 보낸다."
 TU_URS_w1_lei_war_doctrine:0 "아츠 포격 교리"
 TU_URS_w1_lei_war_doctrine_desc:0 "아츠 포격 부대의 운용 교리를 정리한다."
 TU_URS_w1_lei_guarantee:0 "라이타니엔 안전 보장"
 TU_URS_w1_lei_guarantee_desc:0 "라이타니엔의 국경을 보장해 두 여제의 신뢰를 얻는다."
 TU_URS_w1_lei_reform_mediation:0 "개혁파 중재안"
 TU_URS_w1_lei_reform_mediation_desc:0 "개혁파가 낸 중재안을 받아들여 라이타니엔 의회에 전달한다."
 TU_URS_w1_lei_war_declaration:0 "라이타니엔 침공 선언"
 TU_URS_w1_lei_war_declaration_desc:0 "두 여제의 궁성을 향한 전쟁을 선포한다."
 TU_URS_w1_lei_occupation:0 "두 여제의 궁성 점령"
 TU_URS_w1_lei_occupation_desc:0 "궁성을 점령하고 아츠 연구소를 접수한다."
 TU_URS_w1_lei_core_integration:0 "라이타니엔 중핵 편입"
 TU_URS_w1_lei_core_integration_desc:0 "라이타니엔의 핵심 주를 우르수스의 핵심 영토로 편입한다."
 TU_URS_w1_lei_long_term:0 "아츠 공업 단지 건설"
 TU_URS_w1_lei_long_term_desc:0 "편입된 주에 공장과 기반시설을 세운다."

 TU_URS_w2_yan_envoy:0 "염국 사절단"
 TU_URS_w2_yan_envoy_desc:0 "잠든 거인 염국에 사절을 보낸다. 수이 남매 가운데 누가 나라를 대변하는지부터 알아야 한다."
 TU_URS_w2_yan_trade_talks:0 "비단길 통행 협정"
 TU_URS_w2_yan_trade_talks_desc:0 "오래된 비단길의 통행료를 맞춘다."
 TU_URS_w2_yan_border_claims:0 "잠든 땅의 경계"
 TU_URS_w2_yan_border_claims_desc:0 "염국이 잠든 사이 흐려진 국경선을 우르수스의 기록대로 되돌린다."
 TU_URS_w2_yan_border_buildup:0 "국경 수비대 증원"
 TU_URS_w2_yan_border_buildup_desc:0 "국경 수비대를 늘리고 감시탑을 세운다."
 TU_URS_w2_yan_mobilization:0 "전시 동원 준비"
 TU_URS_w2_yan_mobilization_desc:0 "예비군을 소집하고 탄약 비축을 시작한다."
 TU_URS_w2_yan_non_aggression:0 "염국 불가침 조약"
 TU_URS_w2_yan_non_aggression_desc:0 "염국 조정과 국경 불가침 조약에 서명한다."
 TU_URS_w2_yan_border_ultimatum:0 "염국 최후통첩"
 TU_URS_w2_yan_border_ultimatum_desc:0 "잃어버린 국경선의 반환을 요구한다. 거부하면 결과는 염국이 감당한다."
 TU_URS_w2_yan_war_doctrine:0 "대륙전 교리"
 TU_URS_w2_yan_war_doctrine_desc:0 "넓은 평야에서 대군을 운용하는 교리를 채택한다."
 TU_URS_w2_yan_military_access:0 "염국 통행권 협정"
 TU_URS_w2_yan_military_access_desc:0 "염국 영내의 군사 통행권을 확보한다."
 TU_URS_w2_yan_awakening:0 "잠든 거인의 각성"
 TU_URS_w2_yan_awakening_desc:0 "황제의 명령으로 대륙의 잠든 거인을 깨운다. 징병은 쉬워지지만 불안도 함께 커진다."
 TU_URS_w2_yan_guarantee:0 "염국 안전 보장"
 TU_URS_w2_yan_guarantee_desc:0 "염국의 독립을 보장하고 대륙 질서의 한 축으로 세운다."
 TU_URS_w2_yan_war_declaration:0 "염국 침공 선언"
 TU_URS_w2_yan_war_declaration_desc:0 "잠든 거인을 깨우는 전쟁을 선포한다."
 TU_URS_w2_yan_occupation:0 "염국 중원 점령"
 TU_URS_w2_yan_occupation_desc:0 "염국의 중원 도시를 점령하고 저항 세력을 몰아낸다."
 TU_URS_w2_yan_core_integration:0 "염국 중핵 편입"
 TU_URS_w2_yan_core_integration_desc:0 "염국의 핵심 주를 우르수스의 핵심 영토로 편입한다."
 TU_URS_w2_yan_long_term:0 "대륙 철도망 건설"
 TU_URS_w2_yan_long_term_desc:0 "편입된 주에 공장과 기반시설을 세운다. 잠들었던 땅에 철로가 깔린다."

 TU_URS_w2_lgm_envoy:0 "용문 상회 사절단"
 TU_URS_w2_lgm_envoy_desc:0 "교역 도시 용문의 상회 대표에게 사절을 보낸다. 레유니온과의 분쟁을 화제로 삼으면 대화가 쉽다."
 TU_URS_w2_lgm_trade_talks:0 "용문 무역 특구 협정"
 TU_URS_w2_lgm_trade_talks_desc:0 "용문 항구에 무관세 특구를 세우는 협정을 맺는다."
 TU_URS_w2_lgm_border_claims:0 "용문 외곽의 옛 경계"
 TU_URS_w2_lgm_border_claims_desc:0 "용문 외곽의 교외 주들이 우르수스의 옛 경계 안에 있었다고 주장한다."
 TU_URS_w2_lgm_reunion_pressure:0 "레유니온 국경 압박"
 TU_URS_w2_lgm_reunion_pressure_desc:0 "레유니온과의 분쟁을 이용해 용문 주변 국경에 병력을 배치한다."
 TU_URS_w2_lgm_mobilization:0 "분쟁 지역 동원"
 TU_URS_w2_lgm_mobilization_desc:0 "레유니온 분쟁에 대비해 예비 부대를 소집한다."
 TU_URS_w2_lgm_non_aggression:0 "용문 불가침 조약"
 TU_URS_w2_lgm_non_aggression_desc:0 "용문 상회와 국경 불가침을 약속한다."
 TU_URS_w2_lgm_border_ultimatum:0 "용문 상회에 보내는 최후통첩"
 TU_URS_w2_lgm_border_ultimatum_desc:0 "교외 주의 반환과 통행세 폐지를 요구한다."
 TU_URS_w2_lgm_war_doctrine:0 "전선 보급 교리"
 TU_URS_w2_lgm_war_doctrine_desc:0 "긴 보급선을 따라 전선을 유지하는 교리를 채택한다."
 TU_URS_w2_lgm_noble_gate:0 "귀족 상인 연합 설득"
 TU_URS_w2_lgm_noble_gate_desc:0 "구귀족 원로원의 지원을 얻어 용문 상인 연합을 설득한다. 상단의 공장이 우리 편에 선다."
 TU_URS_w2_lgm_guarantee:0 "용문 교역로 보장"
 TU_URS_w2_lgm_guarantee_desc:0 "용문 교역로의 안전을 보장해 상인들의 신뢰를 얻는다."
 TU_URS_w2_lgm_war_declaration:0 "용문 침공 선언"
 TU_URS_w2_lgm_war_declaration_desc:0 "교역 도시를 향한 전쟁을 선포한다. 항구의 문은 우리 손으로 연다."
 TU_URS_w2_lgm_core_integration:0 "용문 중핵 편입"
 TU_URS_w2_lgm_core_integration_desc:0 "용문의 핵심 주를 우르수스의 핵심 영토로 편입한다."
 TU_URS_w2_lgm_long_term:0 "항만 공장 지대 건설"
 TU_URS_w2_lgm_long_term_desc:0 "편입된 항만 주에 공장과 기반시설을 세운다."

 TU_URS_w2_hig_envoy:0 "극동 사절단"
 TU_URS_w2_hig_envoy_desc:0 "고립된 섬나라 극동에 사절을 보낸다. 항구 몇 곳만 열어 줘도 대화는 시작된다."
 TU_URS_w2_hig_trade_talks:0 "해상 교역 협정"
 TU_URS_w2_hig_trade_talks_desc:0 "극동 어선과 상선의 항로를 정하는 협정을 맺는다."
 TU_URS_w2_hig_border_claims:0 "섬 주변 해역 주장"
 TU_URS_w2_hig_border_claims_desc:0 "극동 근해의 섬들을 우르수스의 해역으로 주장한다."
 TU_URS_w2_hig_naval_buildup:0 "해협 함대 증강"
 TU_URS_w2_hig_naval_buildup_desc:0 "해협 입구에 순찰선을 늘려 극동의 항로를 감시한다."
 TU_URS_w2_hig_mobilization:0 "상륙 부대 편성"
 TU_URS_w2_hig_mobilization_desc:0 "해안 방어 부대를 상륙 부대로 재편한다."
 TU_URS_w2_hig_non_aggression:0 "극동 불가침 조약"
 TU_URS_w2_hig_non_aggression_desc:0 "극동와 해상 불가침 조약을 맺는다."
 TU_URS_w2_hig_ultimatum:0 "극동 해군에 보내는 최후통첩"
 TU_URS_w2_hig_ultimatum_desc:0 "섬 주변 해역의 통행권과 어업권을 요구한다."
 TU_URS_w2_hig_war_doctrine:0 "해상 상륙 교리"
 TU_URS_w2_hig_war_doctrine_desc:0 "함대의 엄호 아래 해안에 병력을 내리는 교리를 채택한다."
 TU_URS_w2_hig_junta_landing:0 "군사 정부의 해상 봉쇄"
 TU_URS_w2_hig_junta_landing_desc:0 "군사 정부의 명령으로 극동 항구를 봉쇄한다. 봉쇄는 빠르지만 여론은 늦게 식는다."
 TU_URS_w2_hig_guarantee:0 "극동 안보 보장"
 TU_URS_w2_hig_guarantee_desc:0 "극동의 독립을 보장해 섬나라의 고립을 풀어 준다."
 TU_URS_w2_hig_war_declaration:0 "극동 침공 선언"
 TU_URS_w2_hig_war_declaration_desc:0 "섬나라를 향한 전쟁을 선포한다. 바다를 건너는 전쟁이 시작된다."
 TU_URS_w2_hig_core_integration:0 "극동 중핵 편입"
 TU_URS_w2_hig_core_integration_desc:0 "극동의 핵심 섬을 우르수스의 핵심 영토로 편입한다."
 TU_URS_w2_hig_long_term:0 "해양 조선 단지 건설"
 TU_URS_w2_hig_long_term_desc:0 "편입된 섬에 조선소와 공장을 세운다."
