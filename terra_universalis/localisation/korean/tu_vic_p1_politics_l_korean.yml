l_korean:
 TU_VIC_duk_route:0 "대공 의회 과두 선언"
 TU_VIC_duk_route_desc:0 "대공 의회가 과두 체제를 공식 선언한다. 대공 회의 소집 뒤 이벤트에서 이 노선을 골랐을 때만 보인다."
 TU_VIC_duk_estate_charters:0 "영지 특허장"
 TU_VIC_duk_estate_charters_desc:0 "대공 영지에 특허장을 내려 산업 자치를 보장한다."
 TU_VIC_duk_estate_industry:0 "영지 산업화"
 TU_VIC_duk_estate_industry_desc:0 "영지마다 공장을 세워 생산을 끌어올린다. 산업 기술 보너스를 얻는다."
 TU_VIC_duk_grand_arsenal:0 "대공 군수 복합체"
 TU_VIC_duk_grand_arsenal_desc:0 "공방과 공장을 묶어 전차 생산 기반을 세운다. 장갑 기술 보너스를 얻는다."
 TU_VIC_duk_estate_grid:0 "영지 송전망"
 TU_VIC_duk_estate_grid_desc:0 "영지 사이에 송전망을 깔아 공장 가동률을 높인다."
 TU_VIC_duk_tax_farming:0 "조세 청부"
 TU_VIC_duk_tax_farming_desc:0 "세금 징수를 대공 가문에 맡긴다. 민심이 떨어진다."
 TU_VIC_duk_oligarchic_order:0 "과두 질서 확립"
 TU_VIC_duk_oligarchic_order_desc:0 "대공 의회가 권력을 독점한다. 핵심 갈래 중점으로 정치력 100."
 TU_VIC_duk_council_seats:0 "의석 재배분"
 TU_VIC_duk_council_seats_desc:0 "의회 의석을 대공 가문끼리 나눈다."
 TU_VIC_duk_council_vote:0 "의회 표결 장악"
 TU_VIC_duk_council_vote_desc:0 "표결을 대공 쪽으로 몰아간다. 공개 자문회의와 상호 배타."
 TU_VIC_duk_open_council:0 "공개 자문회의"
 TU_VIC_duk_open_council_desc:0 "회의를 공개해 여론을 달랜다. 의회 표결 장악과 상호 배타."
 TU_VIC_duk_tenancy:0 "소작 체제 강화"
 TU_VIC_duk_tenancy_desc:0 "소작료를 올려 영지 수입을 확보한다. 노동 시장을 열어 생산을 늘린다."
 TU_VIC_duk_free_labour:0 "자유 노동 도입"
 TU_VIC_duk_free_labour_desc:0 "노동 시장을 열어 생산을 늘린다."
 TU_VIC_duk_guild_pact:0 "길드 협약"
 TU_VIC_duk_guild_pact_desc:0 "길드와 협약을 맺어 질서를 지킨다. 길드 독점을 깨고 공방을 풀어 놓는다."
 TU_VIC_duk_guild_break:0 "길드 해체"
 TU_VIC_duk_guild_break_desc:0 "길드 독점을 깨고 공방을 풀어 놓는다."
 TU_VIC_duk_treasury_loans:0 "대공 금고 차관"
 TU_VIC_duk_treasury_loans_desc:0 "대공 금고에서 차관을 빌려 국고를 채운다. 은행 가문을 세워 해외 무역을 장악한다."
 TU_VIC_duk_banking_house:0 "은행 가문 설립"
 TU_VIC_duk_banking_house_desc:0 "은행 가문을 세워 해외 무역을 장악한다."
 TU_VIC_duk_private_guard:0 "사병 조직"
 TU_VIC_duk_private_guard_desc:0 "대공들이 사병을 조직한다. 사병 조직 아이디어를 얻는다."
 TU_VIC_duk_council_law:0 "의회법 제정"
 TU_VIC_duk_council_law_desc:0 "의회 권한을 법으로 못 박는다."
 TU_VIC_duk_rail_concession:0 "철도 특허"
 TU_VIC_duk_rail_concession_desc:0 "철도 부설권을 대공 가문에 준다. 기동 장비 기술 보너스를 얻는다."
 TU_VIC_duk_war_cabinet:0 "대공 전쟁 내각"
 TU_VIC_duk_war_cabinet_desc:0 "대공들로 전쟁 내각을 꾸린다. 전쟁 지지를 높인다."
 TU_VIC_duk_fortified_estates:0 "요새화된 영지"
 TU_VIC_duk_fortified_estates_desc:0 "영지마다 방벽을 쌓아 방어를 굳힌다."
 TU_VIC_asl_route:0 "아슬란 복위 선언"
 TU_VIC_asl_route_desc:0 "아슬란이 왕위 복위를 선언한다. 대공 회의 소집 뒤 이벤트에서 이 노선을 골랐을 때만 보인다."
 TU_VIC_asl_glasgow_gangs:0 "글래스고 갱단 결집"
 TU_VIC_asl_glasgow_gangs_desc:0 "글래스고 갱단이 아슬란 편에 결집한다."
 TU_VIC_asl_street_war:0 "시가전 훈련"
 TU_VIC_asl_street_war_desc:0 "골목 전투를 훈련시킨다."
 TU_VIC_asl_royal_levy:0 "왕실 징병"
 TU_VIC_asl_royal_levy_desc:0 "왕실 이름으로 기병을 징집한다."
 TU_VIC_asl_royal_army:0 "왕실 기계화 군단"
 TU_VIC_asl_royal_army_desc:0 "왕실 군을 기계화해 군단을 편성한다."
 TU_VIC_asl_royal_mint:0 "왕실 조폐국"
 TU_VIC_asl_royal_mint_desc:0 "왕실 조폐국을 다시 열어 화폐를 주조한다."
 TU_VIC_asl_coronation:0 "아슬란 대관식"
 TU_VIC_asl_coronation_desc:0 "시즈 즉위와 맞물려 아슬란이 대관한다. 핵심 갈래 중점으로 정치력 100."
 TU_VIC_asl_loyal_nobles:0 "충성 귀족 회유"
 TU_VIC_asl_loyal_nobles_desc:0 "귀족을 회유해 충성을 얻는다. 귀족 재산 몰수와 상호 배타."
 TU_VIC_asl_confiscation:0 "귀족 재산 몰수"
 TU_VIC_asl_confiscation_desc:0 "반대하는 귀족의 재산을 몰수한다. 충성 귀족 회유와 상호 배타."
 TU_VIC_asl_docks_industry:0 "항만 산업 재건"
 TU_VIC_asl_docks_industry_desc:0 "항만 공장을 다시 세운다. 산업 기술 보너스를 얻는다. 항만 노동자와 상인이 치안 연맹을 맺는다. 정치력 50과 안정도를 얻는다."
 TU_VIC_asl_smuggling:0 "밀수 항로"
 TU_VIC_asl_smuggling_desc:0 "밀수 항로로 물자를 들여온다. 세관을 장악해 관세를 걷는다."
 TU_VIC_asl_customs:0 "세관 장악"
 TU_VIC_asl_customs_desc:0 "세관을 장악해 관세를 걷는다."
 TU_VIC_asl_gang_pact:0 "갱단 협약"
 TU_VIC_asl_gang_pact_desc:0 "갱단 두목들과 협약을 맺어 안정도를 높인다."
 TU_VIC_asl_city_watch:0 "글래스고 야경대"
 TU_VIC_asl_city_watch_desc:0 "야경대를 편성해 치안을 맡긴다."
 TU_VIC_asl_street_law:0 "가로 질서 조례"
 TU_VIC_asl_street_law_desc:0 "거리 질서를 조례로 정한다."
 TU_VIC_asl_gang_courts:0 "갱단 법정"
 TU_VIC_asl_gang_courts_desc:0 "갱단이 스스로 재판한다."
 TU_VIC_asl_loyal_regiment:0 "충성 연대"
 TU_VIC_asl_loyal_regiment_desc:0 "충성스러운 연대를 편성해 포병을 강화한다. 포병 기술 보너스를 얻는다."
 TU_VIC_asl_glasgow_pilgrimage:0 "글래스고 순례"
 TU_VIC_asl_glasgow_pilgrimage_desc:0 "아슬란이 글래스고를 순례해 민심을 얻는다."
 TU_VIC_drc_route:0 "타라 봉기 점화"
 TU_VIC_drc_route_desc:0 "타라 봉기를 점화해 드라코 정권의 기반을 세운다. 대공 회의 소집 뒤 이벤트에서 이 노선을 골랐을 때만 보인다."
 TU_VIC_drc_flame_arts:0 "화염 아츠 전수"
 TU_VIC_drc_flame_arts_desc:0 "화염 아츠를 봉기군에게 전수한다. 화염 아츠 아이디어를 얻는다."
 TU_VIC_drc_secret_police:0 "비밀 경찰"
 TU_VIC_drc_secret_police_desc:0 "비밀 경찰을 창설해 감시를 시작한다."
 TU_VIC_drc_tara_arsenal:0 "타라 병기창"
 TU_VIC_drc_tara_arsenal_desc:0 "타라에 병기창을 세운다. 포병 기술 보너스를 얻는다."
 TU_VIC_drc_purge_dublinn:0 "더블린 숙청"
 TU_VIC_drc_purge_dublinn_desc:0 "더블린 내 반대파를 숙청한다. 전쟁 지지가 오르고 안정도가 떨어진다."
 TU_VIC_drc_fascist_state:0 "파시스트 국가"
 TU_VIC_drc_fascist_state_desc:0 "국가를 파시즘 체제로 재편한다."
 TU_VIC_drc_draco_leader:0 "드라코 즉위"
 TU_VIC_drc_draco_leader_desc:0 "드라코 지도자가 즉위하고 정권이 파시즘 체제로 바뀐다. 선거는 폐지된다. 핵심 갈래 중점으로 정치력 100."
 TU_VIC_drc_tara_truce:0 "타라 휴전"
 TU_VIC_drc_tara_truce_desc:0 "타라와 잠시 휴전한다."
 TU_VIC_drc_tara_crackdown:0 "타라 강경 진압"
 TU_VIC_drc_tara_crackdown_desc:0 "타라 봉기를 짓밟는다. 타라와 잠시 휴전한다."
 TU_VIC_drc_flame_academies:0 "화염 학교"
 TU_VIC_drc_flame_academies_desc:0 "화염 아츠를 가르칠 학교를 세운다. 화염 연구 기관을 세워 연구 속도를 높인다. 정치력 25와 연구 속도 보너스를 얻는다."
 TU_VIC_drc_flame_drill:0 "화염 돌격 훈련"
 TU_VIC_drc_flame_drill_desc:0 "화염 아츠를 쓰는 돌격 훈련을 한다. 화염으로 방벽을 쌓는다."
 TU_VIC_drc_flame_bastion:0 "화염 방벽"
 TU_VIC_drc_flame_bastion_desc:0 "화염으로 방벽을 쌓는다."
 TU_VIC_drc_ash_laborers:0 "잿더미 노동대"
 TU_VIC_drc_ash_laborers_desc:0 "전쟁터의 잿더미를 치울 노동대를 꾸린다. 잿더미 용병을 모아 군 경험을 쌓는다. 정치력 25와 육군 경험을 얻는다."
 TU_VIC_drc_secret_radio:0 "비밀 방송"
 TU_VIC_drc_secret_radio_desc:0 "비밀 방송으로 여론을 조작한다."
 TU_VIC_drc_loyal_dublinn:0 "더블린 충성파"
 TU_VIC_drc_loyal_dublinn_desc:0 "더블린의 충성파를 키운다. 반대파 가족을 인질로 잡는 법을 세운다."
 TU_VIC_drc_hostage_law:0 "인질법"
 TU_VIC_drc_hostage_law_desc:0 "반대파 가족을 인질로 잡는 법을 세운다."
 TU_VIC_drc_war_fund:0 "전쟁 기금"
 TU_VIC_drc_war_fund_desc:0 "전쟁 기금을 모아 군수를 채운다. 군자금을 풀어 병력 훈련을 돕는다. 정치력 25와 육군 경험을 얻는다."
 TU_VIC_drc_sky_flames:0 "하늘의 불꽃"
 TU_VIC_drc_sky_flames_desc:0 "화염 비행대를 띄운다."
 TU_VIC_drc_martial_courts:0 "군사 재판소"
 TU_VIC_drc_martial_courts_desc:0 "군사 재판소를 열어 반대파를 처벌한다."
 TU_VIC_drc_veteran_cadre:0 "노병 간부단"
 TU_VIC_drc_veteran_cadre_desc:0 "노병으로 간부단을 꾸린다."
 TU_VIC_par_route:0 "빅토리아 의회 소집"
 TU_VIC_par_route_desc:0 "빅토리아 의회를 소집해 입헌 공화정을 준비한다. 대공 회의 소집 뒤 이벤트에서 이 노선을 골랐을 때만 보인다."
 TU_VIC_par_free_press:0 "자유 언론법"
 TU_VIC_par_free_press_desc:0 "언론의 자유를 보장하는 법을 세운다. 자유 언론 아이디어를 얻는다."
 TU_VIC_par_public_works:0 "공공 사업"
 TU_VIC_par_public_works_desc:0 "론디니움 공공 사업을 벌인다. 공공 사업 아이디어를 얻는다."
 TU_VIC_par_elections:0 "총선 실시"
 TU_VIC_par_elections_desc:0 "총선을 치러 민주 체제를 연다. 여당이 민주당으로 바뀐다."
 TU_VIC_par_london_exchange:0 "런던 증권 거래소"
 TU_VIC_par_london_exchange_desc:0 "런던 증권 거래소를 세운다. 런던 증권 아이디어를 얻는다."
 TU_VIC_par_ministry_war:0 "전쟁성 개편"
 TU_VIC_par_ministry_war_desc:0 "전쟁성을 의회 아래 둔다."
 TU_VIC_par_rule_of_law:0 "법치 확립"
 TU_VIC_par_rule_of_law_desc:0 "법치를 확립해 안정도를 높인다."
 TU_VIC_par_pm_election:0 "총리 선출"
 TU_VIC_par_pm_election_desc:0 "의회가 총리를 뽑는다. 핵심 갈래 중점으로 정치력 100."
 TU_VIC_par_pamphlets:0 "정치 팸플릿"
 TU_VIC_par_pamphlets_desc:0 "정치 팸플릿을 뿌려 여론을 모은다."
 TU_VIC_par_union_law:0 "노조법"
 TU_VIC_par_union_law_desc:0 "노조 결성을 합법화한다."
 TU_VIC_par_guild_charter:0 "길드 헌장 개정"
 TU_VIC_par_guild_charter_desc:0 "길드 헌장을 고쳐 생산을 늘린다. 노조 결성을 합법화한다."
 TU_VIC_par_tech_schools:0 "기술 학교"
 TU_VIC_par_tech_schools_desc:0 "기술 학교를 세워 연구를 키운다."
 TU_VIC_par_public_schools:0 "공공 학교"
 TU_VIC_par_public_schools_desc:0 "공공 학교를 세워 교육을 넓힌다. 기술 학교를 세워 연구를 키운다."
 TU_VIC_par_free_trade:0 "자유 무역"
 TU_VIC_par_free_trade_desc:0 "관세를 낮추고 자유 무역을 연다. 보호 관세와 상호 배타."
 TU_VIC_par_tariffs:0 "보호 관세"
 TU_VIC_par_tariffs_desc:0 "국내 산업을 보호하는 관세를 건다. 자유 무역과 상호 배타."
 TU_VIC_par_steel_rail:0 "오리론 철도"
 TU_VIC_par_steel_rail_desc:0 "오리론 공장과 철도를 잇는다. 산업 기술 보너스를 얻는다. 공공 주택을 지어 민심을 얻는다. 정치력 50과 안정도를 얻는다."
 TU_VIC_par_police_reform:0 "경찰 개혁"
 TU_VIC_par_police_reform_desc:0 "경찰을 개혁해 치안을 바로잡는다."
 TU_VIC_par_free_elections:0 "자유 선거"
 TU_VIC_par_free_elections_desc:0 "자유 선거 제도를 다진다. 선거 관리를 재편해 민심을 가라앉힌다. 정치력 50과 안정도를 얻는다."
 TU_VIC_par_veterans_bill:0 "참전용사법"
 TU_VIC_par_veterans_bill_desc:0 "참전 용사를 위한 법을 세운다. 징병법을 고쳐 병력을 더 모은다. 정치력 25와 징집 보너스를 얻는다."
 TU_VIC_par_civil_rights:0 "시민권 법"
 TU_VIC_par_civil_rights_desc:0 "시민권을 보장한다. 법치 질서를 선포해 치안을 세운다. 정치력 50과 전쟁 지지를 얻는다."
 TU_VIC_par_monarch_pension:0 "왕실 연금"
 TU_VIC_par_monarch_pension_desc:0 "폐위된 왕실에 연금을 준다."
 TU_VIC_par_colonial_office:0 "식민성"
