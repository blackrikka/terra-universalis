 tu_sar_ev.31.t:0 "궁정의 음모"
 tu_sar_ev.31.d:0 "궁정 시종 하나가 파디샤를 독살하려는 음모를 고발했다."
 tu_sar_ev.31.a:0 "주모자를 처형한다."
