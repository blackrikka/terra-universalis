 tu_sar_ev.1.t:0 "파디샤의 아침"
 tu_sar_ev.1.d:0 "궁전의 분수가 물을 뿜는다. 같은 시각, 사막 끝의 영주는 파디샤의 사신을 문전박대했다."
 tu_sar_ev.1.a:0 "영주들을 길들여야 한다."
 tu_sar_ev.1.b:0 "황금이 모든 것을 해결한다."
 TU_SAR_gold_40_tt:0 "§Y황금§! +40"
 tu_sar_ev.20.t:0 "원정대의 귀환"
 tu_sar_ev.20.d:0 "푀엔 열지로 떠났던 원정대가 돌아왔다. 무엇을 가져왔을까?"
 tu_sar_ev.20.a:0 "모래에 묻힌 유적을 찾았다!"
 tu_sar_ev.20.b:0 "황금 광맥을 찾았다!"
 tu_sar_ev.20.c:0 "원정대 일부가 돌아오지 못했다."
 tu_sar_ev.21.t:0 "영주의 반란"
 tu_sar_ev.21.d:0 "한 영주가 파디샤의 깃발을 내리고 자기 깃발을 올렸다. 다른 영주들이 지켜보고 있다."
 tu_sar_ev.21.a:0 "군을 보내 진압한다."
 tu_sar_ev.21.b:0 "황금으로 달랜다."
 tu_sar_ev.21.c:0 "그의 요구를 들어준다."
 TU_SAR_gold_m10_tt:0 "§Y황금§! -10"
 tu_sar_ev.22.t:0 "모래폭풍"
 tu_sar_ev.22.d:0 "거대한 모래폭풍이 대상로를 덮었다."
 tu_sar_ev.22.a:0 "폭풍이 지나가길 기다린다."
 tu_sar_ev.23.t:0 "정글의 열병"
 tu_sar_ev.23.d:0 "정글 지대에 열병이 돌았다."
 tu_sar_ev.23.a:0 "의사를 보낸다."
 tu_sar_ev.23.b:0 "버틴다."
 tu_sar_ev.24.t:0 "영주들의 연회"
 tu_sar_ev.24.d:0 "영주들이 파디샤를 위한 연회를 열었다. 진심일까?"
 tu_sar_ev.24.a:0 "기꺼이 참석한다."
 tu_sar_ev.24.b:0 "의심한다."
 tu_sar_ev.25.t:0 "황금 강도"
 tu_sar_ev.25.d:0 "국고로 향하던 황금 수송대가 습격당했다."
 tu_sar_ev.25.a:0 "범인을 쫓는다."
 tu_sar_ev.25.b:0 "손실을 받아들인다."
 tu_sar_ev.26.t:0 "상인들의 청원"
 tu_sar_ev.26.d:0 "부유한 상인들이 궁정에서 발언권을 달라고 청원했다."
 tu_sar_ev.26.a:0 "받아들인다."
 tu_sar_ev.26.b:0 "거절한다."
 tu_sar_ev.27.t:0 "오아시스의 발견"
 tu_sar_ev.27.d:0 "정찰대가 지도에 없는 오아시스를 찾았다."
 tu_sar_ev.27.a:0 "정착지를 세운다."
 tu_sar_ev.28.t:0 "파디샤의 제국"
 tu_sar_ev.28.d:0 "모든 영주가 파디샤 앞에 무릎을 꿇었다."
 tu_sar_ev.28.a:0 "사르곤은 하나다."
 tu_sar_ev.29.t:0 "영주 연합"
 tu_sar_ev.29.d:0 "파디샤는 영주들과 권력을 나누기로 했다."
 tu_sar_ev.29.a:0 "함께 다스린다."
 tu_sar_ev.30.t:0 "황금 상인 정부"
 tu_sar_ev.30.d:0 "궁정의 의자 절반을 상인들이 차지했다."
 tu_sar_ev.30.a:0 "황금이 말한다."
