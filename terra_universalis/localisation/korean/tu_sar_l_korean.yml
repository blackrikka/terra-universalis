 tu_sar_ev.32.t:0 "거상의 기부"
 tu_sar_ev.32.d:0 "한 거상이 국고에 막대한 황금을 바쳤다. 대가를 바라는 눈치다."
 tu_sar_ev.32.a:0 "감사히 받는다."
 tu_sar_ev.33.t:0 "부족 간 결혼"
 tu_sar_ev.33.d:0 "두 부족이 혼인으로 오랜 다툼을 끝냈다."
 tu_sar_ev.33.a:0 "축복한다."
