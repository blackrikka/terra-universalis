 tu_lat_ev.20.a:0 "소환장을 보낸다."
 tu_lat_ev.20.b:0 "조용히 지켜본다."
 tu_lat_ev.21.t:0 "추적의 끝"
 tu_lat_ev.21.d:0 "공증인 사무소가 타락 천사 몇 명을 붙잡아 성도로 데려왔다. 시민들은 엇갈린 반응을 보였다."
 tu_lat_ev.21.a:0 "법은 법이다."
 tu_lat_ev.21.b:0 "자비를 베푼다."
 tu_lat_ev.22.t:0 "돌아온 이들"
 tu_lat_ev.22.d:0 "사면 소식을 듣고 광륜을 잃은 산크타들이 하나둘 돌아왔다."
 tu_lat_ev.22.a:0 "어서 오라."
 tu_lat_ev.23.t:0 "순례자 폭주"
 tu_lat_ev.23.d:0 "올해 순례자가 성도가 감당할 수 없을 만큼 몰려왔다."
 tu_lat_ev.23.a:0 "모두 받아들인다."
 tu_lat_ev.23.b:0 "입장을 제한한다."
 tu_lat_ev.24.t:0 "이베리아의 침묵"
 tu_lat_ev.24.d:0 "이베리아의 심판소가 라테라노 교회와 오래전 갈라선 일을 다시 꺼냈다. 화해의 기회일까, 갈등의 시작일까?"
 tu_lat_ev.24.a:0 "화해의 특사를 보낸다."
 tu_lat_ev.24.b:0 "교리를 앞세운다."
 tu_lat_ev.25.t:0 "총기 축성 논쟁"
 tu_lat_ev.25.d:0 "젊은 사제들이 '총을 축성하는 것이 옳은가'라는 물음을 던졌다."
 tu_lat_ev.25.a:0 "총은 수호의 도구다."
 tu_lat_ev.25.b:0 "토론을 허락한다."
 tu_lat_ev.26.t:0 "성문 앞의 피난민"
 tu_lat_ev.26.d:0 "전쟁을 피해 온 피난민들이 성문 앞에 모였다. 그들 대부분은 산크타가 아니다."
 tu_lat_ev.26.a:0 "받아들인다."
 tu_lat_ev.26.b:0 "돌려보낸다."
 tu_lat_ev.28.t:0 "교황의 신정"
 tu_lat_ev.28.d:0 "교황의 말이 곧 법이 되었다."
 tu_lat_ev.28.a:0 "빛 아래 하나로."
 tu_lat_ev.29.t:0 "공증인 공화국"
 tu_lat_ev.29.d:0 "이제 라테라노를 다스리는 것은 법전과 공증인이다."
 tu_lat_ev.29.a:0 "계약은 지켜진다."
 tu_lat_ev.30.t:0 "열린 성도"
 tu_lat_ev.30.d:0 "성문이 모두에게 열렸다. 산크타가 아닌 시민이 처음으로 생겼다."
 tu_lat_ev.30.a:0 "빛은 모두에게."
