 TU_LAT_halo_grant:0 "광륜 연구 지원"
 TU_LAT_halo_grant_desc:0 ""
 tu_lat_ev.31.t:0 "콘클라베"
 tu_lat_ev.31.d:0 "추기경들이 문을 걸어 잠그고 회의를 열었다. 성도 전체가 굴뚝의 연기를 지켜본다."
 tu_lat_ev.31.a:0 "흰 연기가 올랐다."
 tu_lat_ev.32.t:0 "성도의 총기 사고"
 tu_lat_ev.32.d:0 "축제 중 축포가 빗나가 부상자가 났다."
 tu_lat_ev.32.a:0 "총기 규정을 강화한다."
 tu_lat_ev.32.b:0 "축제는 계속된다."
 tu_lat_ev.33.t:0 "외국 순례 사절단"
 tu_lat_ev.33.d:0 "먼 나라의 고관들이 순례를 왔다. 그들은 라테라노와 가까워지고 싶어 한다."
 tu_lat_ev.33.a:0 "환대한다."
 tu_lat_ev.34.t:0 "광륜의 기적"
 tu_lat_ev.34.d:0 "광륜을 잃었던 산크타의 머리 위에 다시 빛이 떠올랐다는 소문이 돌았다."
 tu_lat_ev.34.a:0 "기적이다!"
 TU_LAT_focus:0 "라테라노 중점"
