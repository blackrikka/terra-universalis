l_korean:
 TU_RHO_med_start:0 "광산병 연구 개시"
 TU_RHO_med_start_desc:0 "로도스의 의료 팀이 광산병 연구를 시작합니다. 정치력을 얻습니다."
 TU_RHO_med_sample:0 "감염체 표본 수집"
 TU_RHO_med_sample_desc:0 "감염자에게서 표본을 모아 원석병의 경로를 추적합니다."
 TU_RHO_med_crystal:0 "결정화 연구"
 TU_RHO_med_crystal_desc:0 "원석 결정화 과정을 분석해 연구 속도를 끌어올립니다."
 TU_RHO_cure_track:0 "억제제 노선 선택"
 TU_RHO_cure_track_desc:0 "광산병을 억누르는 치료제 노선을 택합니다. 강화 노선과 함께 택할 수 없습니다."
 TU_RHO_enh_track:0 "강화 노선 선택"
 TU_RHO_enh_track_desc:0 "감염을 역이용해 인간을 강화하는 위험한 노선을 택합니다. 억제제 노선과 함께 택할 수 없습니다."
 TU_RHO_cure_trial:0 "임상 시험 승인"
 TU_RHO_cure_trial_desc:0 "억제제의 임상 시험을 승인받습니다."
 TU_RHO_cure_mass:0 "억제제 대량 생산"
 TU_RHO_cure_mass_desc:0 "치료제 생산 라인을 열어 대량 생산에 들어갑니다."
 TU_RHO_cure_clinic:0 "오리파시 진료망"
 TU_RHO_cure_clinic_desc:0 "전국의 감염자에게 진료를 제공하는 진료망을 세웁니다."
 TU_RHO_enh_lab:0 "강화 실험실"
 TU_RHO_enh_lab_desc:0 "감염체를 다루는 비밀 실험실을 마련합니다."
 TU_RHO_enh_serum:0 "전투용 혈청"
 TU_RHO_enh_serum_desc:0 "전투력을 높이는 혈청을 시험합니다. 부대의 경험이 오릅니다."
 TU_RHO_enh_squad:0 "강화 특무대"
 TU_RHO_enh_squad_desc:0 "혈청을 맞은 특무대를 편성합니다. 공격력이 오릅니다."
 TU_RHO_enh_ethics:0 "윤리 위원회 무력화"
 TU_RHO_enh_ethics_desc:0 "윤리 위원회를 해산해 연구의 제약을 없앱니다. 사회가 크게 흔들립니다."
 TU_RHO_med_research_hall:0 "의료 연구소 확장"
 TU_RHO_med_research_hall_desc:0 "연구소를 넓혀 연구진을 늘립니다. 치료 노선과 강화 노선 어느 쪽이든 이어집니다."
 TU_RHO_med_peer_review:0 "국제 학회 발표"
 TU_RHO_med_peer_review_desc:0 "연구 결과를 국제 학회에서 발표합니다."
 TU_RHO_med_patent:0 "특허 공동 개발"
 TU_RHO_med_patent_desc:0 "치료법의 특허를 공동으로 개발해 용문폐 500을 얻습니다."
 TU_RHO_med_global_cure:0 "광산병 치료 공개"
 TU_RHO_med_global_cure_desc:0 "치료법을 세계에 공개합니다. 사회가 안정되고 정치력을 크게 얻습니다."
 TU_RHO_elite_selection:0 "정예 오퍼레이터 선발"
 TU_RHO_elite_selection_desc:0 "가장 뛰어난 오퍼레이터를 선발합니다."
 TU_RHO_elite_training:0 "정예 훈련 과정"
 TU_RHO_elite_training_desc:0 "선발된 오퍼레이터를 혹독하게 훈련합니다. 부대의 경험이 크게 오릅니다."
 TU_RHO_elite_equip:0 "정예 장비 지급"
 TU_RHO_elite_equip_desc:0 "정예 오퍼레이터에게 최신 장비를 지급합니다."
 TU_RHO_elite_squads:0 "정예 분대 편성"
 TU_RHO_elite_squads_desc:0 "정예 오퍼레이터로 분대를 편성합니다. 정예 합동 훈련이 열립니다."
 TU_RHO_elite_command:0 "정예 지휘 체계"
 TU_RHO_elite_command_desc:0 "정예 분대를 하나의 지휘 체계로 묶습니다. 정예 지휘부 출동이 열립니다."
 TU_RHO_elite_legend:0 "정예의 전설"
 TU_RHO_elite_legend_desc:0 "정예 오퍼레이터의 이름이 전설이 됩니다. 사기와 경험치가 크게 오릅니다."
 TU_RHO_camp_survey:0 "난민촌 실태 조사"
 TU_RHO_camp_survey_desc:0 "난민촌의 상태를 조사해 구호 계획을 짭니다."
 TU_RHO_camp_build:0 "난민촌 건설"
 TU_RHO_camp_build_desc:0 "구호 지부 주변에 난민촌을 세웁니다. 구호 천막 설치가 열립니다."
 TU_RHO_camp_autonomy:0 "난민촌 자치"
 TU_RHO_camp_autonomy_desc:0 "난민들에게 자치를 허용해 안정을 얻습니다. 경비 노선과 함께 택할 수 없습니다."
 TU_RHO_camp_guard:0 "난민촌 경비대"
 TU_RHO_camp_guard_desc:0 "난민촌을 경비대가 지킵니다. 자치 노선과 함께 택할 수 없습니다."
 TU_RHO_camp_gate:0 "난민촌의 문"
 TU_RHO_camp_gate_desc:0 "난민촌의 문을 열어 전쟁 지지를 얻습니다."
 TU_RHO_speech_tour:0 "아미야 순회 강연"
 TU_RHO_speech_tour_desc:0 "아미야가 나라 곳곳을 돌며 강연합니다."
 TU_RHO_petition:0 "시민 서명 운동"
 TU_RHO_petition_desc:0 "시민들이 방주의 이상에 서명합니다."
 TU_RHO_public_rally:0 "대중 집회"
 TU_RHO_public_rally_desc:0 "대규모 집회가 열려 방주의 뜻이 퍼집니다. 방주에 대한 공감이 생깁니다."
 TU_RHO_ark_broadcast:0 "방주 전국 방송"
 TU_RHO_ark_broadcast_desc:0 "아미야의 목소리가 전국에 방송됩니다. 아미야의 연설이 열립니다."
 TU_RHO_ark_council:0 "방주 평의회"
 TU_RHO_ark_council_desc:0 "방주의 평의회를 소집해 균형을 아미야 쪽으로 조금 기울입니다."
 TU_RHO_terra_charter:0 "테라 연합 헌장"
 TU_RHO_terra_charter_desc:0 "테라 연합 헌장에 서명합니다. 균형이 크게 아미야 쪽으로 기웁니다."
 TU_RHO_ark_eternal:0 "영원한 방주"
 TU_RHO_ark_eternal_desc:0 "방주의 이상이 세대를 이어 지속됩니다. 균형이 조금 더 아미야 쪽으로 기웁니다."
 TU_RHO_volunteer_camp:0 "의용군 훈련소"
 TU_RHO_volunteer_camp_desc:0 "의용군을 모을 훈련소를 엽니다. 인력 3000을 얻습니다."
 TU_RHO_volunteer_drill:0 "의용군 실전 훈련"
 TU_RHO_volunteer_drill_desc:0 "의용군을 실전에 가깝게 훈련합니다."
 TU_RHO_volunteer_front:0 "의용군 전선 파견"
 TU_RHO_volunteer_front_desc:0 "의용군을 전선에 보냅니다. 전쟁 지지가 오릅니다."
 TU_RHO_volunteer_regiment:0 "의용군 연대 창설"
 TU_RHO_volunteer_regiment_desc:0 "의용군 연대를 창설해 인력을 크게 늘립니다."
 TU_RHO_ark_guard_pick:0 "아미야 친위대 선발"
 TU_RHO_ark_guard_pick_desc:0 "아미야를 지킬 친위대를 선발합니다."
 TU_RHO_ark_guard_train:0 "친위대 훈련"
 TU_RHO_ark_guard_train_desc:0 "친위대를 혹독하게 훈련합니다."
 TU_RHO_ark_guard_post:0 "친위대 배치"
 TU_RHO_ark_guard_post_desc:0 "친위대를 아미야 곁에 배치합니다. 친위대 합동 훈련이 열립니다."
 TU_RHO_ark_school:0 "난민 학교"
 TU_RHO_ark_school_desc:0 "난민 자녀를 위한 학교를 세웁니다."
 TU_RHO_ark_teachers:0 "교사 양성"
 TU_RHO_ark_teachers_desc:0 "교사를 길러 학교를 채웁니다."
 TU_RHO_ark_scholars:0 "방주의 학자들"
 TU_RHO_ark_scholars_desc:0 "방주에서 자란 학자들이 사회에 나섭니다."
 TU_RHO_ark_convoy:0 "방주 수송 대열"
 TU_RHO_ark_convoy_desc:0 "물자를 나르는 수송 대열을 짭니다. 용문폐 200을 얻습니다. 방주 원조 디시전이 열립니다."
 TU_RHO_ark_mandate:0 "방주의 위임"
 TU_RHO_ark_mandate_desc:0 "방주가 시민에게서 위임을 받습니다."
 TU_RHO_broker_office:0 "계약 중개소"
 TU_RHO_broker_office_desc:0 "용병 계약을 중개하는 사무소를 엽니다. 용문폐 300을 얻습니다."
 TU_RHO_broker_fees:0 "중개 수수료 인상"
 TU_RHO_broker_fees_desc:0 "중개 수수료를 올려 수입을 늘립니다. 단골 할인과 함께 택할 수 없습니다."
 TU_RHO_broker_discount:0 "단골 할인"
 TU_RHO_broker_discount_desc:0 "단골 고객에게 할인해 신뢰를 얻습니다. 수수료 인상과 함께 택할 수 없습니다."
 TU_RHO_broker_guild:0 "계약 길드"
 TU_RHO_broker_guild_desc:0 "중개인들이 길드를 이룹니다. 용문폐 500을 얻습니다. 공정 중개가 열립니다."
 TU_RHO_gold_vault:0 "금고 개설"
 TU_RHO_gold_vault_desc:0 "계약금을 보관할 금고를 엽니다. 용문폐 300을 얻습니다."
 TU_RHO_gold_hedge:0 "환율 방어"
 TU_RHO_gold_hedge_desc:0 "용문폐 가치를 지키는 방법을 찾습니다."
 TU_RHO_gold_insurance:0 "계약 보험"
 TU_RHO_gold_insurance_desc:0 "계약 보험을 도입해 손실을 줄입니다."
 TU_RHO_gold_fund:0 "비상 기금"
 TU_RHO_gold_fund_desc:0 "비상 기금을 세워 위기에 대비합니다. 용문폐 500을 얻습니다. 금괴 경매가 열립니다."
 TU_RHO_contract_pick:0 "계약 정예 선발"
 TU_RHO_contract_pick_desc:0 "계약 병력 가운데 정예를 고릅니다."
 TU_RHO_contract_escort:0 "호위 임무"
 TU_RHO_contract_escort_desc:0 "계약 정예가 호위 임무를 맡습니다. 전쟁 지지가 조금 오릅니다."
 TU_RHO_contract_legion:0 "테라의 군단"
 TU_RHO_contract_legion_desc:0 "계약자들이 하나의 군단으로 묶입니다. 계약 현상금이 열립니다."
 TU_RHO_market_stall:0 "용병 시장 노점"
 TU_RHO_market_stall_desc:0 "작은 노점에서 용병 시장을 시작합니다."
 TU_RHO_market_hub:0 "용병 시장 거점"
 TU_RHO_market_hub_desc:0 "시장을 거점으로 키웁니다. 용문폐 400을 얻습니다."
 TU_RHO_market_open:0 "시장 개방"
 TU_RHO_market_open_desc:0 "시장을 외국 상인에게 개방합니다."
 TU_RHO_market_union:0 "시장 연합"
 TU_RHO_market_union_desc:0 "여러 시장이 하나로 연합합니다."
 TU_RHO_lmd_audit:0 "용문폐 감사"
 TU_RHO_lmd_audit_desc:0 "계약 보상금의 흐름을 감사합니다."
 TU_RHO_lmd_bank:0 "계약 은행"
 TU_RHO_lmd_bank_desc:0 "계약 보상금을 맡길 은행을 세웁니다. 용문폐 600을 얻습니다."
 TU_RHO_lmd_shield:0 "재정 방패"
 TU_RHO_lmd_shield_desc:0 "재정을 지키는 방패를 세웁니다."
 TU_RHO_pmc_escort:0 "PMC 호위"
 TU_RHO_pmc_escort_desc:0 "PMC가 중요한 인물을 호위합니다."
 TU_RHO_pmc_guard:0 "PMC 경비"
 TU_RHO_pmc_guard_desc:0 "PMC가 거점을 경비합니다."
 TU_RHO_pmc_board:0 "PMC 이사회"
 TU_RHO_pmc_board_desc:0 "PMC의 이사회가 열려 계약을 정합니다. 용문폐 300을 얻습니다."
 TU_RHO_pmc_union:0 "PMC 연합"
 TU_RHO_pmc_union_desc:0 "여러 PMC가 연합해 힘을 얻습니다. PMC 임시 작전이 열립니다."
 TU_RHO_accord_writ:0 "중립 선언문"
 TU_RHO_accord_writ_desc:0 "모든 나라에 중립 선언문을 보냅니다."
 TU_RHO_accord_final:0 "중립의 완성"
 TU_RHO_accord_final_desc:0 "중립 외교가 완성되어 용문폐 800을 얻습니다."
 TU_RHO_doctrine_draft:0 "닥터의 전술 초안"
 TU_RHO_doctrine_draft_desc:0 "닥터가 전술 초안을 씁니다. 부대의 경험이 오릅니다."
 TU_RHO_doctrine_strike:0 "닥터식 돌격"
 TU_RHO_doctrine_strike_desc:0 "빠른 돌격으로 적을 흔듭니다. 포위 전술과 함께 택할 수 없습니다."
 TU_RHO_doctrine_siege:0 "닥터식 포위"
 TU_RHO_doctrine_siege_desc:0 "포위 전술로 적을 몰아붙입니다. 돌격 전술과 함께 택할 수 없습니다."
 TU_RHO_doctrine_codex:0 "마왕의 교범"
 TU_RHO_doctrine_codex_desc:0 "전술을 교범으로 묶어 부대가 따릅니다. 닥터의 작전 브리핑이 열립니다."
 TU_RHO_front_mobilize:0 "전선 동원"
 TU_RHO_front_mobilize_desc:0 "전선으로 병력 4000을 동원합니다."
 TU_RHO_front_assault:0 "전선 돌격"
 TU_RHO_front_assault_desc:0 "전선에서 대규모 돌격을 감행합니다. 균형이 조금 닥터 쪽으로 기웁니다."
 TU_RHO_front_siege:0 "전선 포위"
 TU_RHO_front_siege_desc:0 "주요 거점을 포위합니다."
 TU_RHO_front_victory:0 "전선의 승리"
 TU_RHO_front_victory_desc:0 "전선에서 승리해 균형이 닥터 쪽으로 기웁니다."
 TU_RHO_regular_barracks:0 "정규군 병영"
 TU_RHO_regular_barracks_desc:0 "정규군 병영을 짓습니다. 인력 2000을 얻습니다."
 TU_RHO_regular_academy:0 "정규군 사관학교"
 TU_RHO_regular_academy_desc:0 "정규군 사관을 기릅니다."
 TU_RHO_regular_pay:0 "정규군 급여"
 TU_RHO_regular_pay_desc:0 "정규군의 급여를 올려 사기를 높입니다."
 TU_RHO_regular_command:0 "정규군 지휘부"
 TU_RHO_regular_command_desc:0 "정규군 지휘부가 새로 꾸려집니다."
 TU_RHO_kazdel_scouts:0 "카즈델 정찰"
 TU_RHO_kazdel_scouts_desc:0 "카즈델 방면을 정찰합니다."
 TU_RHO_kazdel_plans:0 "카즈델 작전 계획"
 TU_RHO_kazdel_plans_desc:0 "카즈델 수복 계획을 짭니다."
 TU_RHO_kazdel_return:0 "카즈델 귀환"
 TU_RHO_kazdel_return_desc:0 "카즈델 귀환을 공표합니다."
 TU_RHO_babel_archive:0 "바벨 기록고"
 TU_RHO_babel_archive_desc:0 "바벨의 기록을 모읍니다."
 TU_RHO_babel_library:0 "바벨 도서관"
 TU_RHO_babel_library_desc:0 "바벨의 이름으로 도서관을 엽니다."
 TU_RHO_shadow_cell:0 "그림자 세포"
 TU_RHO_shadow_cell_desc:0 "닥터의 그림자 세포를 만듭니다."
 TU_RHO_shadow_ops:0 "그림자 작전"
 TU_RHO_shadow_ops_desc:0 "그림자 작전으로 적의 허점을 노립니다. 균형이 조금 닥터 쪽으로 기웁니다. 그림자 돌격이 열립니다."
 TU_RHO_shadow_pact:0 "그림자 협약"
