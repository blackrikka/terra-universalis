 tu_kaz_ev.1.t:0 "카시미어의 아침"
 tu_kaz_ev.1.d:0 "수도의 대형 전광판에는 기사 경기 광고와 새 음료 광고가 번갈아 뜬다. 옛 기사단의 문장은 기념품 가게에서 팔린다. 그래도 아직 맹세를 기억하는 기사들이 있다."
 tu_kaz_ev.1.a:0 "연합회가 이 나라를 굴린다."
 tu_kaz_ev.1.b:0 "기사도는 아직 죽지 않았다."
 tu_kaz_ev.10.t:0 "메이저 개막"
 tu_kaz_ev.10.d:0 "대경기장이 관중으로 가득 찼다. 기업 로고를 단 기사와 낡은 갑옷의 기사가 같은 대진표에 올랐다. 이번 대회를 어떻게 꾸릴 것인가?"
 tu_kaz_ev.10.a:0 "후원 기업을 앞세운다."
 tu_kaz_ev.10.b:0 "기사의 명예를 앞세운다."
 tu_kaz_ev.11.t:0 "준결승의 파란"
 tu_kaz_ev.11.d:0 "준결승을 앞두고 문제가 터졌다. 한 우승 후보가 감염자라는 사실이 알려졌고, 다른 경기에는 승부 조작 의혹이 붙었다."
 tu_kaz_ev.11.a:0 "감염자 기사의 출전을 허용한다."
 tu_kaz_ev.11.b:0 "규정대로 실격시킨다."
 tu_kaz_ev.11.c:0 "승부 조작부터 파헤친다."
 tu_kaz_ev.12.t:0 "메이저 결승"
 tu_kaz_ev.12.d:0 "결승이 끝났다. 수십만 관중이 새 챔피언의 이름을 외친다."
 tu_kaz_ev.12.a:0 "기업 소속 기사가 우승했다."
 tu_kaz_ev.12.b:0 "떠돌이 기사가 우승했다."
 tu_kaz_ev.12.c:0 "명문 기사 가문이 우승했다."
 tu_kaz_ev.12.e:0 "감염자 기사가 우승했다!"
 tu_kaz_ev.13.t:0 "메이저 이후"
 tu_kaz_ev.13.d:0 "축제가 끝나고 경기장의 조명이 꺼졌다. 다음 메이저는 일 년 뒤다."
 tu_kaz_ev.13.a:0 "내년을 기약한다."
 tu_kaz_ev.20.t:0 "감염자 기사들의 시위"
 tu_kaz_ev.20.d:0 "감염자 기사들이 경기장 앞에 모였다. 그들은 '우리도 기사다'라고 적힌 깃발을 들었다."
 tu_kaz_ev.20.a:0 "그들의 목소리를 듣는다."
 tu_kaz_ev.20.b:0 "해산시킨다."
 tu_kaz_ev.21.t:0 "니어 가문의 청원"
 tu_kaz_ev.21.d:0 "옛 기사 가문 니어의 기사가 의회에 청원서를 냈다. 감염 여부와 상관없이 기사의 자격을 인정해 달라는 내용이다."
 tu_kaz_ev.21.a:0 "청원을 받아들인다."
 tu_kaz_ev.21.b:0 "의회에서 계속 논의한다."
 tu_kaz_ev.22.t:0 "북부 국경 사건"
 tu_kaz_ev.22.d:0 "우르수스 정찰대가 국경을 넘어왔다가 카시미어 기사와 충돌했다. 사상자가 났다."
 tu_kaz_ev.22.a:0 "강하게 항의하고 경계를 높인다."
 tu_kaz_ev.22.b:0 "조용히 덮는다."
 tu_kaz_ev.23.t:0 "조작된 뉴스"
 tu_kaz_ev.23.d:0 "연합회 소유 방송사들이 같은 날 같은 문장으로 정부를 칭찬하는 기사를 냈다. 시민들이 눈치채기 시작했다."
 tu_kaz_ev.23.a:0 "문제없다."
 tu_kaz_ev.23.b:0 "방송사에 경고한다."
 tu_kaz_ev.24.t:0 "결투 끝의 죽음"
 tu_kaz_ev.24.d:0 "명예 결투에서 젊은 기사가 목숨을 잃었다. 결투를 다시 금지하라는 여론이 일어났다."
 tu_kaz_ev.24.a:0 "결투는 기사의 권리다."
 tu_kaz_ev.24.b:0 "규칙을 엄격히 한다."
 tu_kaz_ev.25.t:0 "기업 기사 스캔들"
 tu_kaz_ev.25.d:0 "인기 기업 기사가 약물을 썼다는 폭로가 나왔다. 후원 기업은 모르는 일이라고 한다."
 tu_kaz_ev.25.a:0 "기업을 처벌한다."
 tu_kaz_ev.25.b:0 "기사 개인의 일탈로 처리한다."
 tu_kaz_ev.26.t:0 "유목 기사단의 방문"
 tu_kaz_ev.26.d:0 "평원을 떠도는 유목 기사단이 수도 근처에 천막을 쳤다. 그들은 일거리를 찾고 있다."
 tu_kaz_ev.26.a:0 "고용한다."
 tu_kaz_ev.26.b:0 "떠나보낸다."
 tu_kaz_ev.27.t:0 "무광 기사의 귀환"
 tu_kaz_ev.27.d:0 "이름 없는 기사가 메이저 예선에 나타나 모든 상대를 쓰러뜨리고 사라졌다. 그가 누구인지 아는 사람은 없다."
 tu_kaz_ev.27.a:0 "전설이 돌아왔다."
 tu_kaz_ev.28.t:0 "주주의 나라"
 tu_kaz_ev.28.d:0 "의회는 이제 주주총회처럼 열린다. 카시미어는 효율적인 나라가 되었다. 기사들은 계약서를 읽는다."
 tu_kaz_ev.28.a:0 "이익이 곧 국익이다."
 tu_kaz_ev.29.t:0 "기사의 나라"
 tu_kaz_ev.29.d:0 "광고판이 내려가고 옛 기사단의 깃발이 다시 걸렸다. 기사들은 다시 맹세한다."
 tu_kaz_ev.29.a:0 "맹세를 지킨다."
 tu_kaz_ev.30.t:0 "모두를 위한 기사도"
 tu_kaz_ev.30.d:0 "감염자 기사가 갑옷을 입고 수도를 행진했다. 시민들이 길을 비켜 경례했다."
 tu_kaz_ev.30.a:0 "기사도는 마음에 있다."
 TU_KAZ_focus:0 "카시미어 중점"
