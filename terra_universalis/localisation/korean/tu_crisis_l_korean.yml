l_korean:
 tu_crisis.1.t:0 "체르노보그의 불길"
 tu_crisis.1.d:0 "감염자 봉기가 체르노보그를 덮쳤다. 도시는 우르수스 제국의 손을 떠나 리유니온의 깃발 아래 들어갔다. 리유니온군이 우르수스 영토를 향해 진격을 시작한다."
 tu_crisis.1.a:0 "제국 전역에 비상을 선포한다"
 tu_crisis.1.b:0 "리유니온의 깃발 아래 선다 (리유니온으로 플레이)"
 tu_crisis.2.t:0 "체르노보그 함락"
 tu_crisis.2.d:0 "체르노보그가 리유니온군에 넘어갔다. 우르수스, 리유니온, 로도스 아일랜드 모두에 소식이 전해진다."
 tu_crisis.2.a:0 "소식을 확인한다"
 tu_crisis.3.t:0 "이동도시 체르노보그, 용문으로"
 tu_crisis.3.d:0 "리유니온은 체르노보그를 이동도시로 개조해 용문 국경으로 향하게 했다. 용문과의 국지전이 시작된다."
 tu_crisis.3.a:0 "진격을 계속한다"
 tu_crisis.4.t:0 "용문 국경의 전운"
 tu_crisis.4.d:0 "리유니온이 용문에 선전포고했다. 용문 자치정부는 주변 세력의 응답을 기다린다."
 tu_crisis.4.yan_support:0 "용문을 지원한다"
 tu_crisis.4.yan_ignore:0 "방관한다"
 tu_crisis.4.rho_op:0 "체르노보그 구출 작전 개시"
 tu_crisis.4.lgm_ack:0 "전열을 가다듬는다"
 tu_crisis.5.t:0 "용문 국지전의 결말"
 tu_crisis.5.d:0 "용문과 리유니온의 국지전이 끝났다. 결과가 중원과 로도스에 전해진다."
 tu_crisis.5.a:0 "결과를 확인한다"
 tu_crisis.6.t:0 "용문 사수"
 tu_crisis.6.d:0 "용문이 수도를 지켜냈다. 이동도시의 교역로는 살아남았다."
 tu_crisis.6.a:0 "승리를 기념한다"
 tu_crisis.7.t:0 "용문 함락"
 tu_crisis.7.d:0 "용문의 수도가 리유니온군의 손에 넘어갔다. 자치권은 사라졌다."
 tu_crisis.7.a:0 "비통하게 받아들인다"
 tu_crisis.8.t:0 "리유니온 진압"
 tu_crisis.8.d:0 "리유니온 세력이 무너져 체르노보그 사태가 진압되었다."
 tu_crisis.8.a:0 "사태가 끝났다"
 tu_crisis.20.t:0 "감염자들의 봉기"
 tu_crisis.20.d:0 "체르노보그의 불길 속에서 리유니온이 일어섰다. 우리는 더 이상 짓밟히지 않는다. 이제 이 봉기를 이끄는 것은 당신이다."
 tu_crisis.20.a:0 "리유니온을 위하여!"
