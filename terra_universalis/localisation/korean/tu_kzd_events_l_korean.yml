l_korean:
 tu_kzd_ev.1.t:0 "신 카즈델 제국의 깃발"
 tu_kzd_ev.1.d:0 "테레시스는 흩어진 사르카즈 씨족과 카즈델의 대공들을 하나의 제국 아래 묶겠다고 선언했다. 황무지 곳곳에서 낡은 왕조의 문장이 내려지고 제국의 깃발이 올라가는 행렬이 이어진다. 그러나 이 깃발이 모두를 기쁘게 하지는 않는다."
 tu_kzd_ev.1.a:0 "제국의 깃발을 높이 든다"
 tu_kzd_ev.1.b:0 "씨족 지도자들에게 충성 서약을 받는다"
 tu_kzd_ev.2.t:0 "여섯 왕의 맹세"
 tu_kzd_ev.2.d:0 "육왕의 옥좌는 여섯 개의 봉인으로 나뉘어 있다. 왕들은 나라를 지키는 방패가 되겠다고 맹세했지만, 그 맹세가 얼마나 오래갈지는 아무도 모른다. 국경의 산성마다 봉인된 깃발이 다시 걸린다."
 tu_kzd_ev.2.a:0 "여섯 왕의 이름으로 맹세한다"
 tu_kzd_ev.2.b:0 "왕권의 일부를 대공들에게 나눠 준다"
 tu_kzd_ev.3.t:0 "바벨 복원의 첫 삽"
 tu_kzd_ev.3.d:0 "황무지 아래에서 바벨의 것으로 보이는 석조 구조물이 드러났다. 학자들은 옛 기록을 찾으면 공방과 학원을 되살릴 수 있다고 말한다. 로도스 아일랜드의 대표단도 이 발굴의 결과를 주시하고 있다."
 tu_kzd_ev.3.a:0 "바벨의 기록을 찾아 나선다"
 tu_kzd_ev.3.b:0 "로도스 아일랜드와 교역로를 먼저 연다"
 tu_kzd_ev.4.t:0 "테레시스의 즉위"
 tu_kzd_ev.4.d:0 "테레시스가 옥좌에 올라 카즈델의 주인이 되었다. 궁정의 대신들은 그녀의 결단을 칭송했지만, 오래된 대공 가문들은 입을 다물고 있다. 새 왕좌는 피와 철로 다져진 자리다."
 tu_kzd_ev.4.a:0 "옥좌 앞에 충성을 맹세한다"
 tu_kzd_ev.4.b:0 "대공들의 자리를 다시 나눈다"
 tu_kzd_ev.5.t:0 "용병 왕국 헌장"
 tu_kzd_ev.5.d:0 "용병 길드의 대표들이 왕국의 근본을 적은 헌장을 가져왔다. 계약의 신뢰와 보수의 규칙을 세우는 조항들이다. 헌장에 옥새가 찍히면 카즈델은 전쟁을 파는 나라가 된다."
 tu_kzd_ev.5.a:0 "헌장에 옥새를 찍는다"
 tu_kzd_ev.5.b:0 "헌장을 대공 회의에 넘긴다"
 tu_kzd_ev.6.t:0 "론디니움 진격"
 tu_kzd_ev.6.d:0 "론디니움의 외곽 방어선이 무너졌다. 도심에는 아직 빅토리아의 잔존군과 시민들이 뒤섞여 있다. 지휘관은 도시를 점령할지, 시민을 먼저 보호할지 결정해야 한다."
 tu_kzd_ev.6.a:0 "도심을 점령하고 질서를 세운다"
 tu_kzd_ev.6.b:0 "시민을 보호하며 천천히 진군한다"
 tu_kzd_ev.7.t:0 "사르카즈 혈통 징집"
 tu_kzd_ev.7.d:0 "씨족의 장로들이 혈통을 이은 병사들을 전선에 보내겠다고 제안했다. 혈통의 힘은 강력하지만 통제가 어렵다는 말도 따라온다. 징집 명단은 아직 비어 있다."
 tu_kzd_ev.7.a:0 "혈통 수장들을 불러 모은다"
 tu_kzd_ev.7.b:0 "혈통 징집을 잠시 보류한다"
 tu_kzd_ev.8.t:0 "뱀파이어 혈통의 각성"
 tu_kzd_ev.8.d:0 "밤마다 야영지에 낯선 그림자가 드나든다는 보고가 올라왔다. 뱀파이어 혈통을 이은 병사들은 어둠 속에서 빠르게 움직인다. 그 힘을 전선에 쓸지, 피의 계약을 거부할지 정해야 한다."
 tu_kzd_ev.8.a:0 "야간 습격대를 편성한다"
 tu_kzd_ev.8.b:0 "피의 계약을 거부한다"
 tu_kzd_ev.9.t:0 "웬디고 혈통의 각성"
 tu_kzd_ev.9.d:0 "설원의 바람이 바뀌었다는 보고와 함께 웬디고 혈통의 병사들이 깨어났다. 그들은 눈 속에서 며칠을 버티며 적의 보급선을 끊는다. 씨족의 사냥꾼들이 기꺼이 전술을 가르치겠다고 나섰다."
 tu_kzd_ev.9.a:0 "설원 전술을 병사들에게 가르친다"
 tu_kzd_ev.9.b:0 "사냥꾼들을 변방 초소에 배치한다"
 tu_kzd_ev.10.t:0 "밴시의 신호"
 tu_kzd_ev.10.d:0 "황무지의 폐탑에서 규칙적인 울음소리가 들린다. 밴시 혈통의 병사들은 그 소리를 해독할 수 있다고 믿는다. 신호가 무엇을 뜻하는지는 아직 아무도 모른다."
 tu_kzd_ev.10.a:0 "밴시의 신호를 해독한다"
 tu_kzd_ev.10.b:0 "신호를 봉인하고 잊는다"
 tu_kzd_ev.11.t:0 "제국 재건 선언"
 tu_kzd_ev.11.d:0 "카즈델이 옥좌 아래 제국의 재건을 선언했다. 대륙 곳곳의 전령들이 이 소식을 실어 나르고, 각국 궁정이 움직이기 시작한다. 카즈델은 더 이상 흩어진 왕국이 아니다."
 tu_kzd_ev.11.a:0 "소식을 확인한다"
 tu_kzd_ev.12.t:0 "육왕의 재가"
 tu_kzd_ev.12.d:0 "여섯 왕이 서약을 완성하고 육왕의 재가를 받았다. 산성의 깃발이 일제히 올라가고, 주변 나라들은 카즈델의 방패가 굳건해졌다는 소식을 듣는다."
 tu_kzd_ev.12.a:0 "소식을 확인한다"
 tu_kzd_ev.13.t:0 "바벨 재건 완료"
 tu_kzd_ev.13.d:0 "옛 바벨의 공방과 기록고가 다시 불을 밝혔다. 이 소식은 로도스 아일랜드를 포함한 여러 나라의 학자들을 카즈델로 불러들일 것이다."
 tu_kzd_ev.13.a:0 "소식을 확인한다"
 tu_kzd_ev.14.t:0 "용병 계약 분쟁"
 tu_kzd_ev.14.d:0 "두 용병단이 같은 계약을 두고 다투다 도시 광장에서 맞붙었다. 헌장에 따르면 계약 분쟁은 왕국이 중재해야 한다. 중재가 늦어지면 다른 용병단도 계약을 깨고 떠날 것이다."
 tu_kzd_ev.14.a:0 "계약 분쟁을 중재한다"
 tu_kzd_ev.14.b:0 "승자 용병단에게 보너스를 지급한다"
 tu_kzd_ev.15.t:0 "요새를 덮친 모래폭풍"
 tu_kzd_ev.15.d:0 "사막 바람이 몰아쳐 요새 성벽의 일부가 무너졌다. 공병들은 모래에 묻힌 망루를 파내고 있다. 보수를 서두르면 병력을 빼야 하지만, 기다리면 방어선에 틈이 생긴다."
 tu_kzd_ev.15.a:0 "요새 보수를 서두른다"
 tu_kzd_ev.15.b:0 "폭풍이 지나가기를 기다린다"
 tu_kzd_ev.16.t:0 "론디니움 피난민"
 tu_kzd_ev.16.d:0 "론디니움에서 피난민 행렬이 국경으로 몰려들었다. 그중에는 숙련된 장인과 상인이 섞여 있다. 받아들이면 인력이 늘지만, 식량과 치안의 부담도 함께 커진다."
 tu_kzd_ev.16.a:0 "피난민을 받아들인다"
 tu_kzd_ev.16.b:0 "국경을 봉쇄한다"
 tu_kzd_ev.17.t:0 "혈통의 속삭임"
 tu_kzd_ev.17.d:0 "징집된 사르카즈 병사들이 꿈에서 같은 목소리를 듣는다고 호소하고 있다. 장로들은 혈통이 오래된 서약을 기억하는 것이라 말한다. 병사들의 불안을 어떻게 다룰지 결정해야 한다."
 tu_kzd_ev.17.a:0 "장로들과 함께 의식을 치른다"
 tu_kzd_ev.17.b:0 "병사들에게 휴식을 주고 불안을 달랜다"
 tu_kzd_ev.18.t:0 "바벨의 유물"
 tu_kzd_ev.18.d:0 "발굴단이 바벨 시대의 금속 상자를 찾아냈다. 상자 안에는 아직 작동하는 장치의 설계도가 들어 있을지도 모른다. 연구소로 옮길지, 원래 자리에 다시 묻을지 정해야 한다."
 tu_kzd_ev.18.a:0 "유물을 연구소로 옮긴다"
 tu_kzd_ev.18.b:0 "유물을 원래 자리에 다시 묻는다"
 tu_kzd_ev.19.t:0 "바벨 기록고의 문"
 tu_kzd_ev.19.d:0 "발굴단이 기록고의 봉인된 문을 열었다. 안에는 수백 개의 석판이 쌓여 있고, 일부는 공방의 설계를 적고 있다. 문을 계속 열어 둘지, 다시 봉인할지 결정해야 한다."
 tu_kzd_ev.19.a:0 "문을 열고 기록을 옮긴다"
 tu_kzd_ev.19.b:0 "문을 다시 봉인한다"
 tu_kzd_ev.20.t:0 "바벨의 설계도"
 tu_kzd_ev.20.d:0 "석판 몇 장을 해독하자 공방의 배치와 동력 장치의 그림이 드러났다. 학자들은 이 설계를 따르면 옛 공방을 다시 돌릴 수 있다고 말한다. 다만 해독에는 시간이 걸린다."
 tu_kzd_ev.20.a:0 "설계도를 따라 공방을 세운다"
 tu_kzd_ev.20.b:0 "설계도를 보관하고 해독을 미룬다"
 tu_kzd_ev.21.t:0 "바벨 공방의 점화"
 tu_kzd_ev.21.d:0 "복원된 공방의 굴뚝에서 처음으로 연기가 올라왔다. 카즈델의 장인들이 바벨의 설계를 따라 기계를 돌리고 있다. 이 불꽃은 제국의 산업이 다시 시작되었음을 알린다."
 tu_kzd_ev.21.a:0 "공방을 가동한다"
