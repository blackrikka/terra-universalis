l_korean:
 TU_REU_uprising:0 "감염자 봉기"
 TU_REU_uprising_desc:0 "감염자들이 일어섰다. 리유니온의 독립을 선언하고 첫 깃발을 세운다."
 TU_REU_militia_call:0 "민병대 동원"
 TU_REU_militia_call_desc:0 "감염자 민병대를 불러 모은다. 인력이 크게 늘어난다."
 TU_REU_black_serpent:0 "불사의 검은 뱀"
 TU_REU_black_serpent_desc:0 "탈룰라가 검은 뱀의 이름으로 정복을 선언한다. 정치력이 오른다."
 TU_REU_serpent_army:0 "검은 뱀 군단"
 TU_REU_serpent_army_desc:0 "정복을 위해 군단을 재편한다. 군 경험이 쌓인다."
 TU_REU_ursus_claims:0 "우르수스 영토 요구"
 TU_REU_ursus_claims_desc:0 "체르노보그 인접 우르수스 주 세 곳의 영유권을 주장한다."
 TU_REU_serpent_march:0 "검은 뱀의 행군"
 TU_REU_serpent_march_desc:0 "행군으로 전열을 다진다. 군 경험이 쌓인다."
 TU_REU_serpent_conquest:0 "정복의 개시"
 TU_REU_serpent_conquest_desc:0 "우르수스를 향한 정복 전쟁을 시작한다. 공격 교리를 얻는다. 동토 요새와 함께 선택할 수 없다."
 TU_REU_frost_nova:0 "프로스트노바"
 TU_REU_frost_nova_desc:0 "프로스트노바가 동토의 전선을 맡는다. 정치력이 오른다."
 TU_REU_infected_zones:0 "감염자 자치구"
 TU_REU_infected_zones_desc:0 "감염자 자치구를 세운다. 인력이 늘고 사회가 안정된다."
 TU_REU_patriot_call:0 "패트리어트의 부름"
 TU_REU_patriot_call_desc:0 "패트리어트를 새 지도자로 세운다. 그가 리유니온을 이끈다."
 TU_REU_rhodes_pact:0 "로도스 연대"
 TU_REU_rhodes_pact_desc:0 "로도스 아일랜드와 손을 잡는다. 로도스와의 관계가 좋아지고 정치력이 오른다."
 TU_REU_frost_fortress:0 "동토 요새"
 TU_REU_frost_fortress_desc:0 "얼어붙은 땅에 요새를 세운다. 방어 교리를 얻는다. 연대 기만 선택할 수 없다."
