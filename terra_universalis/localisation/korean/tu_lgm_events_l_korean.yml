l_korean:
 tu_lgm_ev.1.t:0 "자치권 협상"
 tu_lgm_ev.1.d:0 "용문 자치정부와 염국 조정 대표단이 자치권의 범위를 두고 마주 앉았다. 세금, 치안, 항만 관할 중 어디까지 넘길지가 쟁점이다. 웨이옌우는 협상을 마무리할지, 더 많은 권한을 요구할지 결정해야 한다."
 tu_lgm_ev.1.a:0 "염국의 조건을 받아들여 협상을 마무리한다"
 tu_lgm_ev.1.b:0 "자치권 전부를 요구하며 협상을 밀어붙인다"
 tu_lgm_ev.2.t:0 "자유시를 향한 목소리"
 tu_lgm_ev.2.d:0 "자치를 넘어 독립을 바라는 목소리가 용문 거리를 가득 채웠다. 근위국은 질서를 이유로 망설이고, 상인 길드는 독립이 교역을 살릴 것이라 믿는다. 이 선택은 한번 발을 내디디면 되돌리기 어렵다."
 tu_lgm_ev.2.a:0 "독립 준비를 이어간다"
 tu_lgm_ev.2.b:0 "지금은 자치에 머무르며 힘을 기른다"
 tu_lgm_ev.3.t:0 "근위국의 밤"
 tu_lgm_ev.3.d:0 "첸이 근위국을 이끌고 청사를 포위했다. 지도자는 바뀌었고 근위국은 도시의 실질적인 주인이 되었다. 상인들은 질서를 원하는 목소리와 권력 분산을 바라는 목소리 사이에서 불안해한다."
 tu_lgm_ev.3.a:0 "첸의 질서를 인정하고 근위국을 지지한다"
 tu_lgm_ev.3.b:0 "스와이어와 손잡고 권력을 나눈다"
 tu_lgm_ev.4.t:0 "근위국 증원"
 tu_lgm_ev.4.d:0 "근위국 병력을 도시 바깥 구역까지 늘리기로 했다. 신병 모집소 앞에는 빈민가 청년들이 줄을 섰다. 그러나 훈련이 부족하다는 보고가 올라오고 있다."
 tu_lgm_ev.4.a:0 "모집소를 열어 빠르게 증원한다"
 tu_lgm_ev.4.b:0 "훈련을 먼저 끝내고 병력을 늘린다"
 tu_lgm_ev.5.t:0 "국경의 첫 교전"
 tu_lgm_ev.5.d:0 "리유니온 국경에서 첫 교전 보고가 올라왔다. 체르노보그에서 흘러든 감염자 무리가 국경 초소를 두드리고 있다. 방어선을 지킬지, 병력을 뒤로 물릴지 정해야 한다."
 tu_lgm_ev.5.a:0 "방어선을 지키고 적의 다음 움직임을 기다린다"
 tu_lgm_ev.5.b:0 "병력을 뒤로 물리고 도시 안을 지킨다"
 tu_lgm_ev.6.t:0 "생존 협약"
 tu_lgm_ev.6.d:0 "용문은 수도를 지켜냈다. 이제 자치정부는 시민과 군이 같은 방향을 바라보도록 협약을 맺어야 한다. 전쟁 뒤의 피로를 어떻게 다스릴지가 다음 시대를 결정한다."
 tu_lgm_ev.6.a:0 "시민과 군이 함께하는 협약에 서명한다"
 tu_lgm_ev.6.b:0 "군 중심의 비상 체제를 유지한다"
 tu_lgm_ev.7.t:0 "용문 자유시 선언"
 tu_lgm_ev.7.d:0 "용문 자치정부가 자유시 선언을 발표했다. 염국은 이를 반란으로 규정했고, 주변국들은 저울을 든 채 지켜보고 있다. 교역로의 방향도 이 선언과 함께 바뀌기 시작했다."
 tu_lgm_ev.7.a:0 "소식을 확인한다"
 tu_lgm_ev.8.t:0 "용문과 리유니온의 휴전"
 tu_lgm_ev.8.d:0 "용문과 리유니온이 국경 휴전에 합의했다. 그러나 체르노보그의 그림자는 여전히 국경에 걸려 있다. 휴전이 평화로 이어질지는 아직 알 수 없다."
 tu_lgm_ev.8.a:0 "휴전 소식을 확인한다"
 tu_lgm_ev.20.t:0 "국경 너머의 소문"
 tu_lgm_ev.20.d:0 "상인들이 체르노보그 쪽에서 이상한 소식이 들려온다고 수군거린다. 정찰병은 아직 확인되지 않은 움직임을 보았다고 한다. 정보를 모을지, 소문으로 넘길지 정해야 한다."
 tu_lgm_ev.20.a:0 "정보를 모아 보고받는다"
 tu_lgm_ev.20.b:0 "소문을 무시하고 일상을 지킨다"
 tu_lgm_ev.21.t:0 "전선의 긴장"
 tu_lgm_ev.21.d:0 "국경 초소의 병력이 밤마다 교대를 거듭하고 있다. 장교들은 증원을 요청하고 재무관은 예산을 걱정한다. 지금 병력을 더 보낼지, 아껴 둘지 결정해야 한다."
 tu_lgm_ev.21.a:0 "전선에 병력을 더 보낸다"
 tu_lgm_ev.21.b:0 "병력을 아껴 방어에만 쓴다"
 tu_lgm_ev.22.t:0 "재건의 첫 해"
 tu_lgm_ev.22.d:0 "수도를 지킨 뒤 용문은 무너진 항만과 주택가를 다시 세워야 한다. 재건 기금을 편성할지, 시장의 자율에 맡길지 정해야 한다. 어느 쪽을 택하든 도시의 기억에 남을 것이다."
 tu_lgm_ev.22.a:0 "재건 기금을 편성해 국가가 앞장선다"
 tu_lgm_ev.22.b:0 "시장의 자율에 맡기고 세금만 거둔다"
 tu_lgm_ev.31.t:0 "국경 추격전"
 tu_lgm_ev.31.d:0 "방어선을 지킨 뒤 감염자 무리가 다시 국경을 넘어왔다. 이번에는 추격대를 보낼지, 여기서 멈출지 결정해야 한다. 추격이 길어질수록 용문의 병력은 지친다."
 tu_lgm_ev.31.a:0 "추격대를 보내 국경 너머의 적을 몰아낸다"
 tu_lgm_ev.31.b:0 "여기서 멈추고 국경을 굳게 닫는다"
