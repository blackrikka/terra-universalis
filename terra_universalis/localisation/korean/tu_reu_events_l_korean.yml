l_korean:
 tu_reu_ev.1.t:0 "검은 뱀의 깃발"
 tu_reu_ev.1.d:0 "탈룰라가 검은 뱀의 이름으로 정복을 선언할 준비를 마쳤다. 감염자들은 그녀를 따를지, 동토의 방어를 택할지 기다린다. 리유니온의 첫 노선이 이 연설에서 정해진다."
 tu_reu_ev.1.a:0 "정복 노선을 택해 검은 뱀의 깃발을 든다"
 tu_reu_ev.1.b:0 "동토의 방어를 우선하며 민심을 다독인다"
 tu_reu_ev.2.t:0 "우르수스를 향한 진격"
 tu_reu_ev.2.d:0 "정복의 개시 명령이 떨어지자 검은 뱀 군단이 북쪽 국경을 향해 움직인다. 우르수스 대공들은 아직 제국의 명령을 기다리고 있다. 전면전을 택할지, 교섭으로 시간을 벌지 결정해야 한다."
 tu_reu_ev.2.a:0 "우르수스 북부로 진격한다"
 tu_reu_ev.2.b:0 "진격을 늦추고 교섭을 연다"
 tu_reu_ev.3.t:0 "동토의 보루"
 tu_reu_ev.3.d:0 "얼어붙은 땅에 세운 요새가 완공을 앞두고 있다. 로도스 아일랜드의 구호 기술자들이 성벽을 함께 세웠다. 요새를 완공한 뒤 어떤 얼굴을 보일지 정해야 한다."
 tu_reu_ev.3.a:0 "요새를 완공하고 방어선을 굳힌다"
 tu_reu_ev.3.b:0 "로도스와의 연대를 공개적으로 다진다"
 tu_reu_ev.4.t:0 "체르노보그의 심장"
 tu_reu_ev.4.d:0 "이동도시 체르노보그의 중심 엔진이 깨어났다. 감염자 기술자들은 이것을 리유니온의 심장이라 부른다. 엔진을 가동해 도시를 완성할지, 봉인하고 지켜볼지 결정해야 한다."
 tu_reu_ev.4.a:0 "심장을 가동해 이동도시를 완성한다"
 tu_reu_ev.4.b:0 "심장을 봉인하고 감시한다"
 tu_reu_ev.5.t:0 "끝나지 않는 게릴라전"
 tu_reu_ev.5.d:0 "산간과 폐허 곳곳에서 게릴라 부대가 밤마다 매복을 벌인다. 민병대는 지쳤지만 어떤 도시도 완전히 장악되지 않았다. 게릴라를 계속 키울지, 숨을 고르게 할지 정해야 한다."
 tu_reu_ev.5.a:0 "게릴라를 계속 키워 전선을 흔든다"
 tu_reu_ev.5.b:0 "싸움을 멈추고 숨을 고른다"
 tu_reu_ev.6.t:0 "총동원령"
 tu_reu_ev.6.d:0 "리유니온 전역에 총동원령이 내려졌다. 감염자들은 저마다 무기를 들고 집결지로 향한다. 전 인구를 동원할지, 규모를 조절할지 결정해야 한다."
 tu_reu_ev.6.a:0 "전 인구를 동원한다"
 tu_reu_ev.6.b:0 "동원 규모를 조절하고 생산을 지킨다"
 tu_reu_ev.7.t:0 "리유니온 봉기"
 tu_reu_ev.7.d:0 "감염자들이 리유니온의 깃발 아래 일어섰다. 독립을 선언한 봉기군은 첫 깃발을 세웠다. 주변국들은 이 소식을 두고 저마다 다른 계산을 시작했다."
 tu_reu_ev.7.a:0 "소식을 확인한다"
 tu_reu_ev.8.t:0 "패트리어트, 새 지도자"
 tu_reu_ev.8.d:0 "패트리어트가 리유니온의 새 지도자로 추대되었다. 감염자 사회는 그의 이름 아래 하나로 묶이고 있다. 우르수스와 로도스 아일랜드 모두 그의 다음 행보를 주시한다."
 tu_reu_ev.8.a:0 "소식을 확인한다"
 tu_reu_ev.20.t:0 "구호 행렬"
 tu_reu_ev.20.d:0 "체르노보그 인근에서 피난민 행렬이 리유니온 국경으로 몰려든다. 식량과 약품이 턱없이 모자란다. 행렬을 받아들일지, 도시 밖에 세울지 결정해야 한다."
 tu_reu_ev.20.a:0 "행렬을 받아들여 구호를 시작한다"
 tu_reu_ev.20.b:0 "도시 밖에 임시 천막을 세우고 거리를 둔다"
 tu_reu_ev.21.t:0 "체르노보그의 기록"
 tu_reu_ev.21.d:0 "체르노보그에 남은 연구 기록이 발견되었다. 감염자 사회의 과거와 봉기의 시작이 적혀 있다. 기록을 공개할지, 봉인할지 결정해야 한다."
 tu_reu_ev.21.a:0 "기록을 공개해 투명성을 보인다"
 tu_reu_ev.21.b:0 "기록을 봉인하고 내부에서만 본다"
 tu_reu_ev.22.t:0 "해방구 평의회"
 tu_reu_ev.22.d:0 "해방구마다 감염자 평의회가 세워지고 있다. 평의회들은 중앙의 명령보다 자신들의 생존을 우선한다. 평의회에 권한을 줄지, 중앙 아래 둘지 결정해야 한다."
 tu_reu_ev.22.a:0 "평의회에 권한을 넘긴다"
 tu_reu_ev.22.b:0 "평의회를 중앙의 지휘 아래 둔다"
 tu_reu_ev.31.t:0 "우르수스의 응답"
 tu_reu_ev.31.d:0 "우르수스 제국이 북부 국경의 공격에 응답해 대군을 움직였다. 대공들은 제국의 명령에 따를지 자신의 영지를 지킬지 갈린다. 국경을 넘어 응수할지, 교섭을 열지 결정해야 한다."
 tu_reu_ev.31.a:0 "국경을 넘어 응수한다"
 tu_reu_ev.31.b:0 "진격을 멈추고 협상을 연다"
