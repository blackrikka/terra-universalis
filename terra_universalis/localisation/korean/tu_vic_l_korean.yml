l_korean:
 TU_VIC_dukes_council:0 "대공 의회 의장"
 TU_VIC_siege:0 "시즈"
 TU_VIC_siege_leader:0 "시즈 국왕"
 TU_VIC_dublinn_leader:0 "더블린 지도자"
 TU_VIC_steam_knight_commander:0 "스팀 나이트 사령관"
 TU_VIC_industrial_titan:0 "산업 거인"
 TU_VIC_industrial_titan_desc:0 "론디니움의 공장이 생산을 끌어올리고 건설 속도도 빨라진다."
 TU_VIC_vacant_throne:0 "공석인 왕좌"
 TU_VIC_vacant_throne_desc:0 "왕좌가 비어 있어 안정도가 떨어지고 정치력 획득이 줄어든다."
 TU_VIC_steam_knights:0 "스팀 나이트"
 TU_VIC_steam_knights_desc:0 "증기 갑주를 입은 정예가 기갑과 보병의 공격과 방어를 강화한다."
 TU_VIC_bop:0 "아슬란 대 대공 의회"
 TU_VIC_bop_desc:0 "왕위 복위를 노리는 아슬란파와 대공 의회 사이의 권력 다툼."
 TU_VIC_bop_aslan:0 "아슬란파"
 TU_VIC_bop_aslan_desc:0 "왕통의 정당성을 내세우는 세력. 정치력 획득이 늘어난다."
 TU_VIC_bop_dukes:0 "대공 의회"
 TU_VIC_bop_dukes_desc:0 "대공들의 영지 산업을 지키는 세력. 생산이 늘지만 안정도가 떨어진다."
 TU_VIC_focus:0 "빅토리아 중점"
 TU_VIC_crown_focus:0 "왕위 공석"
 TU_VIC_crown_focus_desc:0 "왕좌가 비어 있다. 대공들은 각자 자기 몫을 노린다."
 TU_VIC_dukes_summit:0 "대공 회의 소집"
 TU_VIC_dukes_summit_desc:0 "론디니움에 대공들을 불러 모은다."
 TU_VIC_status_quo:0 "현상 유지"
 TU_VIC_status_quo_desc:0 "대공 의회 체제를 그대로 지킨다. BoP가 대공 의회 쪽으로 조금 기운다."
 TU_VIC_industrial_expansion:0 "산업 확장"
 TU_VIC_industrial_expansion_desc:0 "대공 영지에 산업 단지를 하나 더 세운다."
 TU_VIC_ducal_arsenal:0 "대공 공방"
 TU_VIC_ducal_arsenal_desc:0 "대공들이 사병 공방을 열어 병력을 단련한다."
 TU_VIC_london_fortress:0 "론디니움 요새화"
 TU_VIC_london_fortress_desc:0 "수도를 요새로 만들어 안정도를 되찾는다."
 TU_VIC_dukes_order:0 "대공 의회 체제 확립"
 TU_VIC_dukes_order_desc:0 "대공 의회가 권력을 쥔다. BoP가 크게 대공 의회 쪽으로 기운다. 아슬란 정통성 선포와 상호 배타."
 TU_VIC_glasgow_return:0 "글래스고 귀환"
 TU_VIC_glasgow_return_desc:0 "아슬란이 글래스고로 돌아와 왕통을 주장한다."
 TU_VIC_glasgow_volunteers:0 "글래스고 의용군"
 TU_VIC_glasgow_volunteers_desc:0 "글래스고 시민들이 의용군을 꾸린다."
 TU_VIC_rally_dukes:0 "대공 규합"
 TU_VIC_rally_dukes_desc:0 "왕통을 지지하는 대공들을 규합한다. BoP가 아슬란 쪽으로 기운다."
 TU_VIC_siege_crowned:0 "시즈 즉위"
 TU_VIC_siege_crowned_desc:0 "시즈가 왕위에 올라 지도자가 바뀌고 공석의 왕좌 아이디어가 사라진다."
 TU_VIC_aslan_legitimacy:0 "아슬란 정통성 선포"
 TU_VIC_aslan_legitimacy_desc:0 "왕통의 정당성을 선포해 안정도를 높이고 정치력을 얻는다. 대공 의회 체제 확립과 상호 배타."
 TU_VIC_dublinn_uprising:0 "더블린 봉기"
 TU_VIC_dublinn_uprising_desc:0 "더블린에서 봉기가 터져 안정도가 떨어진다. 진압과 타협 중 하나를 고른다."
 TU_VIC_dublinn_suppression:0 "더블린 진압"
 TU_VIC_dublinn_suppression_desc:0 "군을 보내 봉기를 짓누른다. 타협과 상호 배타."
 TU_VIC_suppression_garrison:0 "진압 수비대"
 TU_VIC_suppression_garrison_desc:0 "더블린에 수비대를 세워 질서를 잡는다."
 TU_VIC_public_order:0 "치안 회복"
 TU_VIC_public_order_desc:0 "치안을 되찾아 사회 안정도를 크게 회복한다."
 TU_VIC_dublinn_talks:0 "더블린 타협 협상"
 TU_VIC_dublinn_talks_desc:0 "더블린 지도자와 협상한다. 진압과 상호 배타."
 TU_VIC_dublinn_charter:0 "더블린 자치 헌장"
 TU_VIC_dublinn_charter_desc:0 "더블린에 자치 헌장을 내려 주민을 달랜다."
 TU_VIC_steam_knight_formation:0 "스팀 나이트 편성"
 TU_VIC_steam_knight_formation_desc:0 "증기 갑주 정예를 편성한다. 스팀 나이트 아이디어와 정예 사단을 얻는다."
 TU_VIC_steam_knight_training:0 "스팀 나이트 훈련"
 TU_VIC_steam_knight_training_desc:0 "스팀 나이트를 혹독하게 훈련시킨다."
 TU_VIC_crown_category:0 "왕관"
 TU_VIC_court_dukes_1:0 "대공 연회"
 TU_VIC_court_dukes_1_desc:0 "대공들을 연회에 초대해 BoP를 대공 의회 쪽으로 조금 민다. 정치력 50, 1회."
 TU_VIC_court_dukes_2:0 "대공 회담"
 TU_VIC_court_dukes_2_desc:0 "대공 회담을 열어 BoP를 대공 의회 쪽으로 조금 민다. 정치력 50, 1회."
 TU_VIC_court_dukes_3:0 "아슬란파 회유"
 TU_VIC_court_dukes_3_desc:0 "아슬란파를 달래 BoP를 아슬란 쪽으로 조금 민다. 정치력 50, 1회."
 TU_VIC_suppress_dublinn:0 "더블린 강경 진압"
 TU_VIC_suppress_dublinn_desc:0 "더블린 봉기를 강경하게 누른다. 안정도 5% 상승, 60일 쿨다운."
 TU_VIC_line_infantry:0 "빅토리아 선형 보병 사단"
 TU_VIC_steam_knight:0 "스팀 나이트 사단"
