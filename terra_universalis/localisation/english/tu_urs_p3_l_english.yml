l_english:
 TU_URS_noble_senate_law:0 "Senate Decrees"
 TU_URS_noble_senate_law_desc:0 "Set up a procedure for the Senate to approve decrees. Gain the Senate Mandate spirit."
 TU_URS_noble_senate_veto:0 "Senate Veto"
 TU_URS_noble_senate_veto_desc:0 "The Senate may veto imperial decrees."
 TU_URS_noble_regency:0 "Regency"
 TU_URS_noble_regency_desc:0 "When the emperor cannot rule, install a regency. Gain the Regent's Council spirit."
 TU_URS_noble_senate_chamber:0 "Senate Chamber"
 TU_URS_noble_senate_chamber_desc:0 "Rebuild the Senate chamber. Political power and stability rise slightly."
 TU_URS_noble_feudal_charter:0 "Estate Charters"
 TU_URS_noble_feudal_charter_desc:0 "Grant self-governing charters to the noble estates. Gain the Estate Charters spirit."
 TU_URS_noble_feudal_autonomy:0 "Estate Autonomy"
 TU_URS_noble_feudal_autonomy_desc:0 "Grant each estate self-rule. The balance shifts toward the nobility."
 TU_URS_noble_local_taxes:0 "Local Taxation"
 TU_URS_noble_local_taxes_desc:0 "Lords collect their own taxes. Political power rises, but stability falls."
 TU_URS_noble_governors:0 "Appoint Provincial Governors"
 TU_URS_noble_governors_desc:0 "Appoint governors from the noble houses."
 TU_URS_noble_estate_law:0 "Estate Law"
 TU_URS_noble_estate_law_desc:0 "Codify estate law and tax rules. A factory is built in a random state."
 TU_URS_noble_decentral_union:0 "Decentralised Union"
 TU_URS_noble_decentral_union_desc:0 "The estates form a loose union. Manpower rises and the balance shifts slightly toward the nobility."
 TU_URS_noble_cartel_charter:0 "Cartel Charter"
 TU_URS_noble_cartel_charter_desc:0 "Proclaim the charter of the noble industrial cartels. Gain the Cartel Bonds spirit."
 TU_URS_noble_cartel_monopoly:0 "Monopoly Cartel"
 TU_URS_noble_cartel_monopoly_desc:0 "The cartel monopolises the market. Political power rises, but free trade is closed off."
 TU_URS_noble_free_trade:0 "Free Trade Cartel"
 TU_URS_noble_free_trade_desc:0 "Open the cartels to free trade. Stability rises slightly."
 TU_URS_noble_trade_routes:0 "Trade Routes"
 TU_URS_noble_trade_routes_desc:0 "Open northern trade routes. A factory is built in a random state."
 TU_URS_noble_cartel_factories:0 "Cartel Factories"
 TU_URS_noble_cartel_factories_desc:0 "Build factories with cartel capital. A factory is built in a random state."
 TU_URS_noble_cartel_bank:0 "Noble Bank"
 TU_URS_noble_cartel_bank_desc:0 "The cartels found a bank. Political power rises."
 TU_URS_noble_cartel_peak:0 "Cartel Council"
 TU_URS_noble_cartel_peak_desc:0 "Cartel heads meet to set policy. Political power rises greatly and a noble marshal joins."
 TU_URS_noble_cartel_standard:0 "Cartel Standards"
 TU_URS_noble_cartel_standard_desc:0 "Standardise cartel products to advance small arms technology."
 TU_URS_noble_cartel_arsenal:0 "Cartel Arsenal"
 TU_URS_noble_cartel_arsenal_desc:0 "The cartels build an arsenal. A factory is built in a random state."
 TU_URS_noble_monopoly_law:0 "Monopoly Law"
 TU_URS_noble_monopoly_law_desc:0 "Bind the monopolies with law. Political power rises, but stability falls."
 TU_URS_noble_cartel_legacy:0 "Noble Industrial Legacy"
 TU_URS_noble_cartel_legacy_desc:0 "Consolidate noble industrial know-how to greatly advance industry."
 TU_URS_noble_estate_militia:0 "Estate Militia"
 TU_URS_noble_estate_militia_desc:0 "Organise estate militias. Gain the Private Regiments spirit and the estate warden joins."
 TU_URS_noble_armed_retainers:0 "Retainer Regiments"
 TU_URS_noble_armed_retainers_desc:0 "Form regiments from retainers. Manpower and army experience rise."
 TU_URS_noble_oath_pledge:0 "The Nobles' Pledge"
 TU_URS_noble_oath_pledge_desc:0 "Nobles swear loyalty to the throne. Stability and political power rise."
 TU_URS_noble_private_regiment:0 "Private Regiment"
 TU_URS_noble_private_regiment_desc:0 "Fold the private troops into regular regiments. Manpower rises."
 TU_URS_noble_mobile_survey:0 "Mobile Survey"
 TU_URS_noble_mobile_survey_desc:0 "Survey the mobile city routes. Motorised equipment technology advances."
 TU_URS_noble_mobile_settlement:0 "Settled City"
 TU_URS_noble_mobile_settlement_desc:0 "Settle a mobile city in one place. A factory is built in a random state."
 TU_URS_noble_caravan_route:0 "Caravan Route"
 TU_URS_noble_caravan_route_desc:0 "The mobile cities keep circulating. Gain the Mobile Estates spirit."
 TU_URS_noble_mobile_factory:0 "Mobile Factory"
 TU_URS_noble_mobile_factory_desc:0 "Build factories inside the mobile cities. A factory is built in a random state."
 TU_URS_noble_mobile_capital:0 "Mobile Capital"
 TU_URS_noble_mobile_capital_desc:0 "Establish a capital for the mobile city union. Political power rises greatly."
 TU_URS_noble_envoy_office:0 "Envoy Office"
 TU_URS_noble_envoy_office_desc:0 "Establish a noble envoy office. Gain the Noble Envoy Network spirit."
 TU_URS_noble_envoy_kazimierz:0 "Kazimierz Embassy"
 TU_URS_noble_envoy_kazimierz_desc:0 "Sign a non-aggression pact with Kazimierz (KAZ)."
 TU_URS_noble_marriage_pact:0 "Marriage Alliance"
 TU_URS_noble_marriage_pact_desc:0 "Offer a guarantee to Kazdel (KZD) under a dynastic marriage alliance."
 TU_URS_noble_puppet_kazimierz:0 "Subjugate Kazimierz"
 TU_URS_noble_puppet_kazimierz_desc:0 "Gain a puppet war goal against Kazimierz (KAZ)."
 TU_URS_noble_claim_victoria:0 "Victoria Claims"
 TU_URS_noble_claim_victoria_desc:0 "Claim the states of Victoria (VIC)."
 TU_URS_noble_lei_pressure:0 "Pressure on Leithanien"
 TU_URS_noble_lei_pressure_desc:0 "Claim the states of Leithanien (LEI)."
 TU_URS_noble_guarantee_lei:0 "Guarantee Leithanien"
 TU_URS_noble_guarantee_lei_desc:0 "Offer a guarantee to Leithanien (LEI)."
 TU_URS_noble_puppet_sam:0 "Subjugate Sami"
 TU_URS_noble_puppet_sam_desc:0 "Gain a puppet war goal against Sami (SAM)."
 TU_URS_noble_annex_kazdel:0 "Annex Kazdel"
 TU_URS_noble_annex_kazdel_desc:0 "Gain an annexation war goal against Kazdel (KZD). Political power rises."
 TU_URS_reform_path:0 "The Reform Path"
 TU_URS_reform_path_desc:0 "Students and citizens call for an overhaul of the empire. The balance shifts toward reform."
 TU_URS_reform_student_council:0 "Found the Student Council"
 TU_URS_reform_student_council_desc:0 "Found the Ursus Student Council. Gain the Student Council spirit."
 TU_URS_reform_constitution_draft:0 "Constitutional Draft"
 TU_URS_reform_constitution_draft_desc:0 "Draft a new constitution for the empire. Gain the Constitutional Order spirit."
 TU_URS_reform_constitutional_monarchy:0 "Constitutional Monarchy"
 TU_URS_reform_constitutional_monarchy_desc:0 "Keep the throne but hand power to parliament. Mutually exclusive with the republic."
 TU_URS_reform_royal_charter:0 "Royal Charter"
 TU_URS_reform_royal_charter_desc:0 "The crown proclaims a charter limiting its own powers."
 TU_URS_reform_crown_councils:0 "Crown Councils"
 TU_URS_reform_crown_councils_desc:0 "The crown councils reorganise the administration. Gain constitutional administration techniques."
 TU_URS_reform_monarch_assembly:0 "Constitutional Assembly"
 TU_URS_reform_monarch_assembly_desc:0 "A constitutional assembly is convened. A factory is built in a random state."
 TU_URS_reform_monarch_legacy:0 "Legacy of the Constitutional Crown"
 TU_URS_reform_monarch_legacy_desc:0 "The constitutional crown takes root. Political power rises greatly."
 TU_URS_reform_republic_path:0 "Republic"
 TU_URS_reform_republic_path_desc:0 "Depose the emperor and establish a republic. The balance shifts strongly toward reform. Mutually exclusive with the constitutional monarchy."
 TU_URS_reform_democratic_party:0 "Democratic Party in Power"
 TU_URS_reform_democratic_party_desc:0 "The ruling party becomes a democratic party. Democratic support rises greatly."
 TU_URS_reform_completion:0 "Completion of Reform"
 TU_URS_reform_completion_desc:0 "Complete the final stage of reform. Political power rises greatly and the balance shifts toward reform."
 TU_URS_reform_reunion_talks:0 "Talks with Reunion"
 TU_URS_reform_reunion_talks_desc:0 "Open talks with Reunion (REU). Sign a non-aggression pact."
 TU_URS_reform_reunion_treaty:0 "Reunion Reconciliation Treaty"
 TU_URS_reform_reunion_treaty_desc:0 "Sign a reconciliation treaty with Reunion. Gain the Reconciliation spirit. Mutually exclusive with the Rhodes Pact."
 TU_URS_reform_rhodes_pact:0 "Rhodes Pact"
 TU_URS_reform_rhodes_pact_desc:0 "Sign an accord with Rhodes Island (RHO). Sign a non-aggression pact. Mutually exclusive with the Reunion treaty."
 TU_URS_reform_medical_aid:0 "Medical Aid for the Infected"
 TU_URS_reform_medical_aid_desc:0 "Support treatment for the infected to restore social stability."
 TU_URS_reform_vic_partnership:0 "Victoria Guarantee"
 TU_URS_reform_vic_partnership_desc:0 "Offer a guarantee to Victoria (VIC). Mutually exclusive with the Victorian claims."
 TU_URS_reform_vic_claims:0 "Victorian Claims"
 TU_URS_reform_vic_claims_desc:0 "Claim the states of Victoria (VIC). Mutually exclusive with the Victoria guarantee."
 TU_URS_reform_kazimierz_talks:0 "Kazimierz Non-Aggression"
 TU_URS_reform_kazimierz_talks_desc:0 "Sign a non-aggression pact with Kazimierz (KAZ)."
 TU_URS_reform_lei_outreach:0 "Leithanien Claims"
 TU_URS_reform_lei_outreach_desc:0 "Claim the states of Leithanien (LEI)."
 TU_URS_reform_infected_citizenship:0 "Infected Citizenship"
 TU_URS_reform_infected_citizenship_desc:0 "Grant citizenship to the infected. The infected discrimination spirit is removed."
 TU_URS_reform_infected_labour_rights:0 "Labour Rights for the Infected"
 TU_URS_reform_infected_labour_rights_desc:0 "Guarantee labour rights for the infected. Manpower rises. Mutually exclusive with the infected labour guild."
 TU_URS_reform_infected_guild:0 "Infected Labour Guild"
 TU_URS_reform_infected_guild_desc:0 "The infected form a labour guild. Mutually exclusive with the infected labour rights."
 TU_URS_reform_infected_hospitals:0 "Infected Hospitals"
 TU_URS_reform_infected_hospitals_desc:0 "Build hospitals for the infected. A factory is built in a random state."
 TU_URS_reform_infected_representation:0 "Infected Representation"
 TU_URS_reform_infected_representation_desc:0 "Reserve seats for the infected in parliament. The balance shifts slightly toward reform."
 TU_URS_reform_citizenship_law:0 "Citizenship Law"
 TU_URS_reform_citizenship_law_desc:0 "Confirm citizenship for the infected in law. Gain the Infected Citizenship spirit."
 TU_URS_reform_modern_schools:0 "Modern Schools"
 TU_URS_reform_modern_schools_desc:0 "Build modern schools. Gain the Modern Education spirit."
 TU_URS_reform_press_freedom:0 "Freedom of the Press"
 TU_URS_reform_press_freedom_desc:0 "Guarantee freedom of the press. Gain the Free Press spirit."
 TU_URS_p3_senate_mandate:0 "Senate Mandate"
 TU_URS_p3_senate_mandate_desc:0 "The Senate receives a mandate. Political power and stability rise slightly."
 TU_URS_p3_regency:0 "Regent's Council"
 TU_URS_p3_regency_desc:0 "The regent's council runs the state. Stability rises, but war support falls."
 TU_URS_p3_feudal_charter:0 "Estate Charters"
 TU_URS_p3_feudal_charter_desc:0 "Every estate receives a charter. Construction speeds up, but central stability falls."
 TU_URS_p3_cartel_bonds:0 "Cartel Bonds"
 TU_URS_p3_cartel_bonds_desc:0 "The cartels issue bonds. Industrial complex output speeds up and political power rises."
 TU_URS_p3_private_armies:0 "Private Regiments"
 TU_URS_p3_private_armies_desc:0 "Private regiments multiply. Conscription efficiency and attack strength rise."
 TU_URS_p3_mobile_estates:0 "Mobile Estates"
 TU_URS_p3_mobile_estates_desc:0 "The mobile cities share the supply burden, so supply consumption falls."
 TU_URS_p3_envoy_network:0 "Noble Envoy Network"
 TU_URS_p3_envoy_network_desc:0 "Noble envoys widen the diplomatic network. Political power rises."
 TU_URS_p4_student_council:0 "Student Council"
 TU_URS_p4_student_council_desc:0 "The Ursus Student Council links universities and citizens. Stability rises slightly."
 TU_URS_p4_constitution:0 "Constitutional Order"
 TU_URS_p4_constitution_desc:0 "The constitution sets limits on power. Stability rises."
 TU_URS_p4_free_press:0 "Free Press"
 TU_URS_p4_free_press_desc:0 "A free press raises political power, but slightly lowers regime stability."
 TU_URS_p4_citizenship:0 "Infected Citizenship"
 TU_URS_p4_citizenship_desc:0 "The infected join as citizens. Population grows and society stabilises."
 TU_URS_p4_modern_education:0 "Modern Education"
 TU_URS_p4_modern_education_desc:0 "Modern education spreads and research speeds up."
 TU_URS_p4_reconciliation:0 "Reconciliation"
 TU_URS_p4_reconciliation_desc:0 "Reconciliation with Reunion and Rhodes Island stabilises society, but war support falls."
