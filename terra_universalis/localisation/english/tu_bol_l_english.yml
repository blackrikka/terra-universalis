 tu_bol_ev.1.t:0 "A Nation at War with Itself"
 tu_bol_ev.1.d:0 "Half a day out of the capital, villages fly other flags. Columbian and Victorian guns flow to both sides."
 tu_bol_ev.1.a:0 "We will end this war."
 tu_bol_ev.1.b:0 "First, the people must live."
