 tu_bol_ev.20.t:0 "Result of the Offensive"
 tu_bol_ev.20.d:0 "The units sent on the offensive have reported back."
 tu_bol_ev.20.a:0 "We pushed the front!"
 tu_bol_ev.20.b:0 "A stalemate."
 tu_bol_ev.20.c:0 "The offensive failed."
 tu_bol_ev.21.t:0 "Desertion"
 tu_bol_ev.21.d:0 "War-weary soldiers have deserted in groups."
 tu_bol_ev.21.a:0 "Hunt the deserters."
 tu_bol_ev.21.b:0 "Pardon them."
 tu_bol_ev.22.t:0 "Anti-War Protest"
 tu_bol_ev.22.d:0 "Protesters in the capital demand an end to the war."
 tu_bol_ev.22.a:0 "Promise talks."
 tu_bol_ev.22.b:0 "Disperse them."
 tu_bol_ev.23.t:0 "Columbia's Demands"
 tu_bol_ev.23.d:0 "Columbia demands mining rights in return for its aid."
 tu_bol_ev.23.a:0 "Accept."
 tu_bol_ev.23.b:0 "Refuse."
 tu_bol_ev.24.t:0 "Victoria's Demands"
 tu_bol_ev.24.d:0 "Victoria demands harbour rights in return for its aid."
 tu_bol_ev.24.a:0 "Accept."
 tu_bol_ev.24.b:0 "Refuse."
