 tu_bol_ev.25.t:0 "The Civil War Ends"
 tu_bol_ev.25.d:0 "The last rebel leader has laid down arms. For the first time, peace has come to Bolivar."
 tu_bol_ev.25.a:0 "Peace!"
 tu_bol_ev.26.t:0 "Rebels Offer Talks"
 tu_bol_ev.26.d:0 "A rebel leader secretly offers to negotiate."
