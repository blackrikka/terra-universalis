 tu_col_ev.1.t:0 "Morning in Columbia"
 tu_col_ev.1.d:0 "A Rhine Lab airship drifts between the towers of Trimounts. Out west, sheriffs chase outlaws again today."
 tu_col_ev.1.a:0 "A land of opportunity."
 tu_col_ev.10.t:0 "Presidential Election"
 tu_col_ev.10.d:0 "The four-yearly presidential election has come. Three candidates offer three platforms. The winner's platform will set the next four years."
 tu_col_ev.10.a:0 "The industry candidate: factories and railways!"
 tu_col_ev.10.b:0 "The defence candidate: a strong Columbia!"
 tu_col_ev.10.c:0 "The science candidate: invest in the future!"
 tu_col_ev.11.t:0 "Midterm Elections"
 tu_col_ev.11.d:0 "Halfway through the term, congressional elections are held. The administration is judged at the ballot box."
 tu_col_ev.11.a:0 "The administration wins confidence."
 tu_col_ev.11.b:0 "Congress checks the administration."
 tu_col_ev.12.t:0 "Columbia Elects a President"
 tu_col_ev.12.d:0 "Columbia has chosen a new president."
 tu_col_ev.12.a:0 "Noted."
 tu_col_ev.20.t:0 "Rhine Lab Accident"
 tu_col_ev.20.d:0 "An explosion rocks a Rhine Lab facility. The lab refuses to name the cause."
 tu_col_ev.20.a:0 "Audit the lab."
 tu_col_ev.20.b:0 "Research must go on."
 tu_col_ev.21.t:0 "Research Breakthrough"
 tu_col_ev.21.d:0 "One of Rhine Lab's divisions has delivered results ahead of schedule."
 tu_col_ev.21.a:0 "Excellent."
 tu_col_ev.22.t:0 "Ambitions of Rhine Lab"
 tu_col_ev.22.d:0 "Rhine Lab's board demands autonomy: it wants to run the sky project without state interference."
 tu_col_ev.22.a:0 "Grant autonomy."
 tu_col_ev.22.b:0 "Keep it under state control."
 tu_col_ev.23.t:0 "Beyond the Sky"
 tu_col_ev.23.d:0 "Kristen Wright's research has finally broken through the sky. No nation of Terra has gone this far."
 tu_col_ev.23.a:0 "A new age."
 tu_col_ev.24.t:0 "Outlaws of the West"
 tu_col_ev.24.d:0 "An outlaw gang in the western frontier robbed a train."
 tu_col_ev.24.a:0 "Post a bounty."
 tu_col_ev.24.b:0 "Send in the army."
 tu_col_ev.25.t:0 "A Mobile City Arrives"
 tu_col_ev.25.d:0 "A mobile city roaming the wastes asks to join Columbia."
 tu_col_ev.25.a:0 "Welcome it."
 tu_col_ev.25.b:0 "Turn it away."
 tu_col_ev.26.t:0 "Independence Day"
 tu_col_ev.26.d:0 "A parade marks independence from Victoria. Some speakers denounce Victoria harshly."
 tu_col_ev.26.a:0 "Remember our freedom."
 tu_col_ev.27.t:0 "The Bolivar Faction"
 tu_col_ev.27.d:0 "The Bolivar faction we backed has gained ground. They want more support."
 tu_col_ev.27.a:0 "Send more."
 tu_col_ev.27.b:0 "That is enough."
 tu_col_ev.28.t:0 "Guardians of the Republic"
 tu_col_ev.28.d:0 "Columbia has chosen to defend its constitution and elections."
 tu_col_ev.28.a:0 "For liberty."
 tu_col_ev.29.t:0 "The Corporate Republic"
 tu_col_ev.29.d:0 "Corporate representatives have taken seats in the cabinet."
 tu_col_ev.29.a:0 "Efficiency is prosperity."
 tu_col_ev.30.t:0 "The Frontier Federation"
 tu_col_ev.30.d:0 "The sheriffs and generals of the frontier have come to the capital."
 tu_col_ev.30.a:0 "The western way."
