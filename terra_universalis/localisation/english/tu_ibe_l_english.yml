 TU_IBE_coast_category:0 "The Coast"
 TU_IBE_coast_category_desc:0 "The sea threat rises every month, less for each intact lighthouse. At 70+ coastal towns are eroded.\nThe Deep Sea Cult grows every month, and the stronger it is the faster the threat climbs. It can never be fully rooted out.\nLighthouses can be damaged by Sea Terrors each month. Damage worsens every 45 days from stage 1 to stage 2 to collapse. Check each lighthouse's threat and damage on the map and guard it with coastal forts and garrisons. Lighthouse garrisons are sometimes ambushed and lose organisation and strength, more often while the lighthouse is damaged.\nRestore lighthouses with the buttons on coastal states on the map while this window is open."
 TU_IBE_lighthouses_m1_tt:0 "§YLighthouses Restored§! -1"
 TU_IBE_threat_5_tt:0 "§RSea Threat§! +5"
 TU_IBE_lighthouses_1_tt:0 "§YLighthouses Restored§! +1"
 TU_IBE_threat_m2_tt:0 "§RSea Threat§! -2"
 TU_IBE_restore_lighthouse:0 "Restore a Lighthouse"
 TU_IBE_restore_lighthouse_desc:0 "Restore this coastal state's lighthouse: 50 political power, 2 civilian factories for 60 days. When work ends: lighthouse +1 (max 5), threat -2, +1 infrastructure here. 120 days between restorations.\nRestored lighthouses can be damaged by Sea Terrors. Coastal forts and garrisons lower the risk."
 TU_IBE_lh_threat_vh:0 "[FROM.GetName] Lighthouse — Sea Terror threat: §RVery High§!"
 TU_IBE_lh_threat_vh_desc:0 "This lighthouse's monthly damage chance: 15% or more.\nDamage chance = Sea Threat ÷ 4 × fort factor (-15% per average coastal fort level) × garrison factor (manpower here 10k x0.8 / 20k x0.6 / 40k x0.45), at least 2%. Recalculated monthly."
 TU_IBE_lh_threat_h:0 "[FROM.GetName] Lighthouse — Sea Terror threat: §OHigh§!"
 TU_IBE_lh_threat_h_desc:0 "This lighthouse's monthly damage chance: 9-15%.\nDamage chance = Sea Threat ÷ 4 × fort factor (-15% per average coastal fort level) × garrison factor (manpower here 10k x0.8 / 20k x0.6 / 40k x0.45), at least 2%. Recalculated monthly."
 TU_IBE_lh_threat_m:0 "[FROM.GetName] Lighthouse — Sea Terror threat: §YModerate§!"
 TU_IBE_lh_threat_m_desc:0 "This lighthouse's monthly damage chance: 4-9%.\nDamage chance = Sea Threat ÷ 4 × fort factor (-15% per average coastal fort level) × garrison factor (manpower here 10k x0.8 / 20k x0.6 / 40k x0.45), at least 2%. Recalculated monthly."
 TU_IBE_lh_threat_l:0 "[FROM.GetName] Lighthouse — Sea Terror threat: §GLow§!"
 TU_IBE_lh_threat_l_desc:0 "This lighthouse's monthly damage chance: 2-4%.\nDamage chance = Sea Threat ÷ 4 × fort factor (-15% per average coastal fort level) × garrison factor (manpower here 10k x0.8 / 20k x0.6 / 40k x0.45), at least 2%. Recalculated monthly."
 TU_IBE_lh_threat_vl:0 "[FROM.GetName] Lighthouse — Sea Terror threat: §GVery Low§!"
 TU_IBE_lh_threat_vl_desc:0 "This lighthouse's monthly damage chance: 2%.\nDamage chance = Sea Threat ÷ 4 × fort factor (-15% per average coastal fort level) × garrison factor (manpower here 10k x0.8 / 20k x0.6 / 40k x0.45), at least 2%. Recalculated monthly."
 TU_IBE_lh_fort:0 "Fortify the [FROM.GetName] Lighthouse Coast"
 TU_IBE_lh_fort_desc:0 "40 political power, 2 civilian factories for 45 days, then +1 coastal fort in every coastal province of this state.\nThis lighthouse's damage chance depends on the §Yaverage§! coastal fort level across the state's coastal provinces: -15% per average level, up to 3 (each province counts at most 3 levels). Sea Terrors sometimes damage coastal forts, which are repaired through construction."
 TU_IBE_lighthouse:0 "Restored Lighthouse"
 TU_IBE_lh_damaged:0 "Damaged Lighthouse"
 TU_IBE_lh_severe:0 "Damage Stage 2"
 TU_IBE_lh_repairing:0 "Lighthouse Under Repair"
 TU_IBE_lh_building:0 "Lighthouse Under Restoration"
 TU_IBE_lh_fort_building:0 "Coastal Fort Under Construction"
 TU_IBE_lh_worsen_tt:0 "This lighthouse worsens to §Rdamage stage 2§!.\n'Lighthouse Damage Worsens' event occurs"
 TU_IBE_lh_collapse_tt:0 "This lighthouse collapses: lighthouses §R-1§!, sea threat §R+5§!\n'Lighthouse Collapsed' event occurs"
 TU_IBE_lh_stage1:0 "[FROM.GetName] Lighthouse §ODamage Stage 1§!: until it worsens"
 TU_IBE_lh_stage1_desc:0 "A lighthouse damaged by Sea Terrors. It does not hold back the sea threat. Without a response it worsens to stage 2. Repairing it or clearing it with a garrison stops this."
 TU_IBE_lh_stage2:0 "[FROM.GetName] Lighthouse §RDamage Stage 2§!: until it collapses"
 TU_IBE_lh_stage2_desc:0 "A lighthouse damaged by Sea Terrors. It does not hold back the sea threat. Without a response the lighthouse collapses (lighthouse -1, threat +5). Repairing it or clearing it with a garrison stops this."
 TU_IBE_lh_repair:0 "Repair the [FROM.GetName] Lighthouse"
 TU_IBE_lh_repair_desc:0 "Fix the damaged lighthouse: 25 political power, 2 civilian factories for 30 days. Starting repairs stops it worsening."
 TU_IBE_lh_purge_tt:0 "§Y30,000§! or more manpower deployed in this state"
 TU_IBE_lh_purge:0 "Clear the [FROM.GetName] Coast"
 TU_IBE_lh_purge_desc:0 "With 30,000+ manpower in this state, drive off the Sea Terrors and reclaim the lighthouse at once: threat -3, army experience +2."
 tu_ibe_ev.50.t:0 "Lighthouse Damaged"
 tu_ibe_ev.50.d:0 "The lighthouse at [tu_ibe_lh_state.GetName] has been damaged by a Sea Terror attack. Something is crawling up the darkened shore.\n\nThis is damage stage 1. Unless it is repaired or cleared by a garrison within 45 days it worsens to stage 2, and 45 days after that it collapses."
 tu_ibe_ev.50.a:0 "Hurry the repairs."
 TU_IBE_cult_unrest:0 "Cult Unrest"
 TU_IBE_cult_unrest_desc:0 "Cult unrest is shaking the coast."
 tu_ibe_ev.54.t:0 "The Preaching Spreads"
 tu_ibe_ev.54.d:0 "Sermons praising the deep are spreading through the fishing towns. At night, people stare out to sea."
 tu_ibe_ev.54.a:0 "Step up the crackdown."
 tu_ibe_ev.54.b:0 "We cannot let fear spread."
 tu_ibe_ev.55.t:0 "Lighthouse Sabotage"
 tu_ibe_ev.55.d:0 "Cultists slipped into a lighthouse and put out its light. A lighthouse has been damaged."
 tu_ibe_ev.55.a:0 "How did they get in?"
 tu_ibe_ev.56.t:0 "Coastal Uprising"
 tu_ibe_ev.56.d:0 "Cult banners hang over the coastal towns. Worshippers openly carry arms."
 tu_ibe_ev.56.a:0 "Order must be restored."
 tu_ibe_ev.57.t:0 "The Scars Heal"
 tu_ibe_ev.57.d:0 "Smoke rises from the factory chimneys again. For the first time since the Great Silence, Iberia's industry has found its pace."
 tu_ibe_ev.57.a:0 "At last we can breathe."
 tu_ibe_ev.58.t:0 "The Fear Lifts"
 tu_ibe_ev.58.d:0 "With the sea quiet for so long, the fishermen sail into deep water again. Lights burn all night in the coastal towns."
 tu_ibe_ev.58.a:0 "May this calm last."
 tu_ibe_ev.53.t:0 "Lighthouse Damage Worsens"
 tu_ibe_ev.53.d:0 "The lighthouse at [tu_ibe_lh_state.GetName] has worsened to damage stage 2. The tower is cracking and its light can barely be seen.\n\nUnless it is repaired or cleared by a garrison within 45 days, it will collapse."
 tu_ibe_ev.53.a:0 "Send people at once."
 tu_ibe_ev.51.t:0 "Lighthouse Collapsed"
 tu_ibe_ev.51.d:0 "The lighthouse at [tu_ibe_lh_state.GetName] has finally collapsed. The coastal villagers fear the night once more."
 tu_ibe_ev.51.a:0 "We will raise it again."
 TU_IBE_threat_m1_tt:0 "§RSea Threat§! -1"
 tu_ibe_ev.52.t:0 "Coastal Garrison Ambushed"
 tu_ibe_ev.52.d:0 "The garrison guarding the [tu_ibe_raid_state.GetName] coast was ambushed by Sea Terrors in the night. They were driven off, but not without losses.\n\nDivisions in that state lost 30% organisation and 5% strength."
 tu_ibe_ev.52.a:0 "Honour the fallen."
 TU_IBE_cult_m12_tt:0 "§RDeep Sea Cult§! -12"
 TU_IBE_cult_hunt:0 "Inquisitor Hunting Parties"
 TU_IBE_cult_hunt_desc:0 "Hunting parties that only the State of the Inquisitors can send chase the cult to its strongholds."
 TU_IBE_cult_m5_tt:0 "§RDeep Sea Cult§! -5"
 TU_IBE_cult_inquiry:0 "Heresy Inquiry"
 TU_IBE_cult_inquiry_desc:0 "Inquisitors go from village to village looking for worshippers. They cannot reach the cult's roots."
 TU_IBE_cult_raid:0 "Raid the Cellars"
 TU_IBE_cult_raid_desc:0 "Elite inquisitors storm the cult's meeting places."
 TU_IBE_cult_m30_tt:0 "§RDeep Sea Cult§! -30"
 TU_IBE_cult_tribunal:0 "The Grand Inquisition"
 TU_IBE_cult_tribunal_desc:0 "The whole country is turned over to drag out the cult's leaders, at a cost to public trust."
 TU_IBE_threat_m15_tt:0 "§RSea Threat§! -15"
 TU_IBE_coast_sweep:0 "Sweep the Coast"
 TU_IBE_coast_sweep_desc:0 "Troops trained in anti-creature tactics drive the Sea Terrors along the coast."
