 tu_ibe_ev.1.t:0 "The Silent Coast"
 tu_ibe_ev.1.d:0 "Every window in the coastal towns is shut. The inquisitors stand with their backs to the sea, watching the people."
 tu_ibe_ev.1.a:0 "Watch the sea."
 tu_ibe_ev.20.t:0 "Erosion from the Deep"
 tu_ibe_ev.20.d:0 "A coastal village emptied overnight. All that remains is the smell of the sea and strange footprints."
 tu_ibe_ev.20.a:0 "Send inquisitors."
 tu_ibe_ev.20.b:0 "Seal off the village."
 tu_ibe_ev.21.t:0 "The Cultists' Cellar"
 tu_ibe_ev.21.d:0 "Inquisitors uncovered a secret meeting place of sea worshippers."
 tu_ibe_ev.21.a:0 "Arrest them all."
 tu_ibe_ev.21.b:0 "Only watch them."
 tu_ibe_ev.22.t:0 "The Royal Heir"
 tu_ibe_ev.22.d:0 "The long-hidden heir of the royal house has stepped into the light."
 tu_ibe_ev.22.a:0 "Support the Crown."
 tu_ibe_ev.22.b:0 "Defer to the Inquisition."
 tu_ibe_ev.23.t:0 "Strangers by the Sea"
 tu_ibe_ev.23.d:0 "There are reports of oddly dressed hunters by the shore. They are said to hunt the things from the sea."
 tu_ibe_ev.23.a:0 "Look for them."
 tu_ibe_ev.25.t:0 "The Abyssal Hunters"
 tu_ibe_ev.25.d:0 "We met the hunters from Aegir. They say they have fought the things rising from the sea for a long time."
 tu_ibe_ev.25.a:0 "Cooperate."
 tu_ibe_ev.25.b:0 "Distrust them."
 tu_ibe_ev.24.t:0 "The Laterano Schism"
 tu_ibe_ev.24.d:0 "The Laterano church has long criticised Iberia's Inquisition. A Laterano envoy asks for talks."
 tu_ibe_ev.24.a:0 "Agree to talk."
 tu_ibe_ev.24.b:0 "Refuse."
 tu_ibe_ev.26.t:0 "Washed Ashore"
 tu_ibe_ev.26.d:0 "The carcass of an unknown creature washed ashore."
 tu_ibe_ev.26.a:0 "Study it."
 tu_ibe_ev.26.b:0 "Burn it."
 tu_ibe_ev.27.t:0 "The Fishermen Return"
 tu_ibe_ev.27.d:0 "With the threat receding, fishermen are sailing out again."
 tu_ibe_ev.27.a:0 "A good omen."
 tu_ibe_ev.28.t:0 "State of the Inquisitors"
 tu_ibe_ev.28.d:0 "The Inquisition has taken charge of everything in Iberia."
 tu_ibe_ev.28.a:0 "Never lower our guard."
 tu_ibe_ev.29.t:0 "The Crown Restored"
 tu_ibe_ev.29.d:0 "A coronation was held. Iberia has a king again."
 tu_ibe_ev.29.a:0 "Long live the king!"
 tu_ibe_ev.30.t:0 "Reconciliation with the Sea"
 tu_ibe_ev.30.d:0 "Iberia has chosen to understand the sea rather than fear it."
 tu_ibe_ev.30.a:0 "Toward the sea."
 tu_ibe_ev.31.t:0 "Inquisitorial Excess"
 tu_ibe_ev.31.d:0 "There is outrage that inquisitors branded innocent fishermen heretics."
 tu_ibe_ev.31.a:0 "Discipline the inquisitors."
 tu_ibe_ev.31.b:0 "The judgement was right."
