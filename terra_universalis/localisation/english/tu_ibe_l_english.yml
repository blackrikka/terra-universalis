 TU_IBE_coast_category:0 "The Coast"
 TU_IBE_coast_category_desc:0 "The sea threat rises every month, less for each intact lighthouse. At 70+ coastal towns are eroded.\nLighthouses can be damaged by Sea Terrors each month. Check each lighthouse's threat on the map and guard it with coastal forts and garrisons. Lighthouse garrisons are sometimes ambushed and lose organisation and strength, more often while the lighthouse is damaged."
 TU_IBE_lighthouses_1_tt:0 "§YLighthouses Restored§! +1"
 TU_IBE_restore_lighthouse:0 "Restore a Lighthouse"
 TU_IBE_restore_lighthouse_desc:0 "Restore this coastal state's lighthouse: lighthouse +1 (max 5), threat -5, +1 infrastructure here. 120 days between restorations.\nRestored lighthouses can be damaged by Sea Terrors. Coastal forts and garrisons lower the risk."
 TU_IBE_lh_threat_vh:0 "[FROM.GetName] Lighthouse — Sea Terror threat: §RVery High§!"
 TU_IBE_lh_threat_vh_desc:0 "This lighthouse's monthly damage chance: 15% or more.\nDamage chance = Sea Threat ÷ 4 × fort factor (-25% per average coastal fort level) × garrison factor (manpower here 10k x0.8 / 20k x0.6 / 40k x0.45), at least 2%. Recalculated monthly."
 TU_IBE_lh_threat_h:0 "[FROM.GetName] Lighthouse — Sea Terror threat: §OHigh§!"
 TU_IBE_lh_threat_h_desc:0 "This lighthouse's monthly damage chance: 9-15%.\nDamage chance = Sea Threat ÷ 4 × fort factor (-25% per average coastal fort level) × garrison factor (manpower here 10k x0.8 / 20k x0.6 / 40k x0.45), at least 2%. Recalculated monthly."
 TU_IBE_lh_threat_m:0 "[FROM.GetName] Lighthouse — Sea Terror threat: §YModerate§!"
 TU_IBE_lh_threat_m_desc:0 "This lighthouse's monthly damage chance: 4-9%.\nDamage chance = Sea Threat ÷ 4 × fort factor (-25% per average coastal fort level) × garrison factor (manpower here 10k x0.8 / 20k x0.6 / 40k x0.45), at least 2%. Recalculated monthly."
 TU_IBE_lh_threat_l:0 "[FROM.GetName] Lighthouse — Sea Terror threat: §GLow§!"
 TU_IBE_lh_threat_l_desc:0 "This lighthouse's monthly damage chance: 2-4%.\nDamage chance = Sea Threat ÷ 4 × fort factor (-25% per average coastal fort level) × garrison factor (manpower here 10k x0.8 / 20k x0.6 / 40k x0.45), at least 2%. Recalculated monthly."
 TU_IBE_lh_threat_vl:0 "[FROM.GetName] Lighthouse — Sea Terror threat: §GVery Low§!"
 TU_IBE_lh_threat_vl_desc:0 "This lighthouse's monthly damage chance: 2%.\nDamage chance = Sea Threat ÷ 4 × fort factor (-25% per average coastal fort level) × garrison factor (manpower here 10k x0.8 / 20k x0.6 / 40k x0.45), at least 2%. Recalculated monthly."
 TU_IBE_lh_fort:0 "Fortify the [FROM.GetName] Lighthouse Coast"
 TU_IBE_lh_fort_desc:0 "40 political power, 2 civilian factories for 45 days, then +1 coastal fort in every coastal province of this state.\nThis lighthouse's damage chance depends on the §Yaverage§! coastal fort level across the state's coastal provinces: -25% per average level, up to 3 (each province counts at most 3 levels). Sea Terrors sometimes damage coastal forts, which are repaired through construction."
 TU_IBE_lighthouses_m1_tt:0 "§YLighthouses Restored§! -1"
 TU_IBE_threat_5_tt:0 "§RSea Threat§! +5"
 TU_IBE_lh_crumbling:0 "[FROM.GetName] Lighthouse Crumbling"
 TU_IBE_lh_crumbling_desc:0 "A lighthouse damaged by Sea Terrors. Unless repaired or cleared by a garrison, it collapses when time runs out (lighthouse -1, threat +5)."
 TU_IBE_lh_repair:0 "Repair the [FROM.GetName] Lighthouse"
 TU_IBE_lh_repair_desc:0 "Fix the damaged lighthouse: 25 political power, 2 civilian factories for 30 days. Starting repairs stops the collapse timer."
 TU_IBE_threat_m3_tt:0 "§RSea Threat§! -3"
 TU_IBE_lh_purge:0 "Clear the [FROM.GetName] Coast"
 TU_IBE_lh_purge_desc:0 "With 30,000+ manpower in this state, drive off the Sea Terrors and reclaim the lighthouse at once: threat -3, army experience +2."
 tu_ibe_ev.50.t:0 "Lighthouse Damaged"
 tu_ibe_ev.50.d:0 "The lighthouse at [tu_ibe_lh_state.GetName] has been damaged by a Sea Terror attack. Something is crawling up the darkened shore.\n\nUnless it is repaired or cleared by a garrison within 90 days, the lighthouse will collapse."
 tu_ibe_ev.50.a:0 "Hurry the repairs."
 tu_ibe_ev.51.t:0 "Lighthouse Collapsed"
 tu_ibe_ev.51.d:0 "The lighthouse at [tu_ibe_lh_state.GetName] has finally collapsed. The coastal villagers fear the night once more."
 tu_ibe_ev.51.a:0 "We will raise it again."
 TU_IBE_threat_m2_tt:0 "§RSea Threat§! -2"
 tu_ibe_ev.52.t:0 "Coastal Garrison Ambushed"
 tu_ibe_ev.52.d:0 "The garrison guarding the [tu_ibe_raid_state.GetName] coast was ambushed by Sea Terrors in the night. They were driven off, but not without losses.\n\nDivisions in that state lost 30% organisation and 5% strength."
 tu_ibe_ev.52.a:0 "Honour the fallen."
