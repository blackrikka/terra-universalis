 TU_IBE_fear_of_the_sea:0 "Fear of the Sea"
 TU_IBE_fear_of_the_sea_desc:0 "Fishermen no longer sail into deep waters.\nThe fear lifts when the sea threat stays below 25 for 12 months. The Royal Army and the Crown Charter ease it in stages."
