 TU_IBE_tide_host_desc:0 ""
 TU_IBE_deep_kingdom:0 "Kingdom of the Deep"
 TU_IBE_deep_kingdom_desc:0 "A kingdom stands beneath the waves. Ishar-mla's kin never tire."
 TU_IBE_the_deep:0 "The Deep"
 TU_IBE_the_deep_desc:0 "All came from the sea, and all returns to it. The name Iberia now sleeps beneath the waves."
 TU_IBE_ishar_call:0 "Call of the Deep"
 TU_IBE_ishar_call_desc:0 "Ishar-mla points to the sea. Iberia no longer fears it."
