 tu_ibe_ev.32.d:0 "When the restored lighthouse was lit, villagers came out and cheered."
 tu_ibe_ev.32.a:0 "The light is back."
 tu_ibe_ev.33.t:0 "Inquisitor Irene"
 tu_ibe_ev.33.d:0 "The young inquisitor Irene distinguished herself on coastal patrol."
 tu_ibe_ev.33.a:0 "Promote her."
 tu_ibe_ev.34.t:0 "Grumbling Nobles"
 tu_ibe_ev.34.d:0 "The nobles complain loudly about the Inquisition's meddling."
