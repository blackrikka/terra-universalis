 TU_IBE_hunter_skadi_desc:0 "Decide which of the Abyssal Hunters will lead Iberia. (Leader chosen by event)"
 tu_ibe_ev.42.t:0 "Who Will Lead Iberia?"
 tu_ibe_ev.42.d:0 "The hunters gather beneath an old lighthouse. The Inquisition has stepped back, and those who have fought the sea will now hold the country. Yet even among the hunters, no one has decided who will lead."
 tu_ibe_ev.42.a:0 "Skadi. The strongest hunter stands in front."
 tu_ibe_ev.42.b:0 "Gladiia. The captain of the hunters takes command."
 tu_ibe_ev.42.c:0 "Specter. The silent blade clears the way."
 tu_ibe_ev.42.e:0 "Ulpianus. The old captain returns to guard the coast."
 tu_ibe_ev.40.t:0 "A Song"
 tu_ibe_ev.40.d:0 "On the night the last lighthouse went dark, a song drifts in from somewhere.."
 tu_ibe_ev.40.a:0 "It must be my imagination"
 tu_ibe_ev.40.b:0 "Surely I can lose myself a little.."
 tu_ibe_ev.41.t:0 "One"
 tu_ibe_ev.41.d:0 "The song draws closer. Skadi's voice blends with the waves.\n\n\"We will...become one...\""
 tu_ibe_ev.41.a:0 "The tide washes over your feet."
 TU_IBE_seaborn_kin:0 "Kin of the Sea"
 TU_IBE_seaborn_kin_desc:0 "Ishar-mla leads Iberia. The sea is no longer a threat but a home."
