l_english:
 tu_crisis.1.t:0 "Flames over Chernobog"
 tu_crisis.1.d:0 "An infected uprising has engulfed Chernobog. The city has slipped from the Ursus Empire and now flies the Reunion banner. Reunion forces have begun to march into Ursus territory."
 tu_crisis.1.a:0 "Declare an empire-wide emergency"
 tu_crisis.1.b:0 "Stand under the Reunion banner (play as Reunion)"
 tu_crisis.2.t:0 "Chernobog Has Fallen"
 tu_crisis.2.d:0 "Chernobog has passed to Reunion forces. Ursus, Reunion and Rhodes Island all hear the news."
 tu_crisis.2.a:0 "Read the report"
 tu_crisis.3.t:0 "The Mobile City Chernobog Turns to Lungmen"
 tu_crisis.3.d:0 "Reunion has converted Chernobog into a mobile city and set it on the Lungmen border. A border war with Lungmen begins."
 tu_crisis.3.a:0 "Press the advance"
 tu_crisis.4.t:0 "War Grows on the Lungmen Border"
 tu_crisis.4.d:0 "Reunion has declared war on Lungmen. The Lungmen government waits to see who will answer."
 tu_crisis.4.yan_support:0 "Support Lungmen"
 tu_crisis.4.yan_ignore:0 "Stay out of it"
 tu_crisis.4.rho_op:0 "Launch the Chernobog rescue operation"
 tu_crisis.4.lgm_ack:0 "Steady the defences"
 tu_crisis.5.t:0 "Outcome of the Lungmen Border War"
 tu_crisis.5.d:0 "The border war between Lungmen and Reunion is over. The result reaches Yan and Rhodes Island."
 tu_crisis.5.a:0 "Read the result"
 tu_crisis.6.t:0 "Lungmen Holds"
 tu_crisis.6.d:0 "Lungmen has held its capital. The trade routes of the mobile city have survived."
 tu_crisis.6.a:0 "Celebrate the victory"
 tu_crisis.7.t:0 "Lungmen Falls"
 tu_crisis.7.d:0 "The capital of Lungmen has fallen to Reunion forces. Its autonomy is gone."
 tu_crisis.7.a:0 "Accept the loss"
 tu_crisis.8.t:0 "Reunion Suppressed"
 tu_crisis.8.d:0 "The Reunion forces have collapsed and the Chernobog incident is over."
 tu_crisis.8.a:0 "The crisis is over"
 tu_crisis.20.t:0 "The Infected Rise"
 tu_crisis.20.d:0 "Reunion has risen from the flames of Chernobog. We will be trodden on no longer. Now it is you who leads the uprising."
 tu_crisis.20.a:0 "For Reunion!"
 tu_crisis.40.t:0 "Land of the Infected"
 tu_crisis.40.d:0 "The war with Ursus is over. The land we held with our blood is now the homeland of the Infected. Every state Reunion holds has become a core."
 tu_crisis.40.a:0 "This land is ours."
