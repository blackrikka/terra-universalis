l_english:
 tu_kzd_ev.1.t:0 "Banner of the New Kazdel Empire"
 tu_kzd_ev.1.d:0 "Theresis has declared that the scattered Sarkaz clans and the Kazdel lords will be bound together under one empire. Across the wasteland, the old dynasty's crests come down and the imperial banner rises in its place. Not everyone is pleased to see it fly."
 tu_kzd_ev.1.a:0 "Raise the imperial banner high"
 tu_kzd_ev.1.b:0 "Take oaths of loyalty from the clan leaders"
 tu_kzd_ev.2.t:0 "Oath of the Six"
 tu_kzd_ev.2.d:0 "The throne of the Six Kings is divided among six seals. The kings swore to be the shield of the nation, but no one knows how long that oath will hold. Sealed banners are raised again over the mountain fortresses on the frontier."
 tu_kzd_ev.2.a:0 "Swear the oath in the name of the Six"
 tu_kzd_ev.2.b:0 "Share a part of royal authority with the lords"
 tu_kzd_ev.3.t:0 "The First Stone of Babel"
 tu_kzd_ev.3.d:0 "Beneath the wasteland, a stone structure that appears to be of Babel's making has been uncovered. Scholars say that recovering the old records could revive its workshops and academies. The Rhodes Island delegation is watching the results of this excavation closely."
 tu_kzd_ev.3.a:0 "Set out to find the Babel records"
 tu_kzd_ev.3.b:0 "Open trade routes with Rhodes Island first"
 tu_kzd_ev.4.t:0 "The Ascension of Theresis"
 tu_kzd_ev.4.d:0 "Theresis has taken the throne and become the master of Kazdel. The court ministers praise her resolve, but the old noble houses remain silent. The new throne is a seat built on blood and iron."
 tu_kzd_ev.4.a:0 "Swear loyalty before the throne"
 tu_kzd_ev.4.b:0 "Redistribute the seats of the lords"
 tu_kzd_ev.5.t:0 "Charter of the Mercenary Kingdom"
 tu_kzd_ev.5.d:0 "Representatives of the mercenary guilds have brought a charter that sets out the foundations of the kingdom. Its articles establish the trust of contracts and the rules of pay. Once the seal is pressed upon it, Kazdel becomes a nation that sells war."
 tu_kzd_ev.5.a:0 "Press the royal seal on the charter"
 tu_kzd_ev.5.b:0 "Send the charter to the council of lords"
 tu_kzd_ev.6.t:0 "The March on Londinium"
 tu_kzd_ev.6.d:0 "The outer defences of Londinium have collapsed. Remnants of the Victorian army and civilians are still mixed together in the city centre. The commander must decide whether to take the city or protect its people first."
 tu_kzd_ev.6.a:0 "Take the city centre and restore order"
 tu_kzd_ev.6.b:0 "Advance slowly and protect the civilians"
 tu_kzd_ev.7.t:0 "Recruiting the Sarkaz Bloodlines"
 tu_kzd_ev.7.d:0 "The elders of the clans have offered to send soldiers of the bloodlines to the front. Their power is great, but so is the difficulty of controlling it, and the warnings follow close behind. The recruitment roll is still empty."
 tu_kzd_ev.7.a:0 "Call the bloodline heads together"
 tu_kzd_ev.7.b:0 "Hold the bloodline recruitment for now"
 tu_kzd_ev.8.t:0 "Awakening of the Vampire Bloodline"
 tu_kzd_ev.8.d:0 "Reports have come in of strange shadows slipping in and out of the camps every night. Soldiers of the vampire bloodline move quickly through the dark. The commanders must decide whether to use that power at the front or refuse the blood pact."
 tu_kzd_ev.8.a:0 "Form a night raiding force"
 tu_kzd_ev.8.b:0 "Refuse the blood pact"
 tu_kzd_ev.9.t:0 "Awakening of the Wendigo Bloodline"
 tu_kzd_ev.9.d:0 "The wind over the snowfields has changed, and soldiers of the wendigo bloodline have awakened. They hold out for days in the snow and cut the enemy supply lines. The clan hunters have offered to teach their tactics willingly."
 tu_kzd_ev.9.a:0 "Teach snowfield tactics to the soldiers"
 tu_kzd_ev.9.b:0 "Post the hunters at the border outposts"
 tu_kzd_ev.10.t:0 "The Banshee's Signal"
 tu_kzd_ev.10.d:0 "A steady wailing sound rises from an abandoned tower in the wasteland. Soldiers of the banshee bloodline believe they can decode it. No one yet knows what the signal means."
 tu_kzd_ev.10.a:0 "Decode the banshee's signal"
 tu_kzd_ev.10.b:0 "Seal the signal away and forget it"
 tu_kzd_ev.11.t:0 "Declaration of Renewal"
 tu_kzd_ev.11.d:0 "Kazdel has declared the renewal of the empire under the throne. Messengers across the continent carry the news, and the courts of every nation begin to stir. Kazdel is no longer a scattered kingdom."
 tu_kzd_ev.11.a:0 "Read the report"
 tu_kzd_ev.12.t:0 "Royal Sanction of the Six"
 tu_kzd_ev.12.d:0 "The Six Kings have completed their oath and received the royal sanction. Banners rise together over the mountain fortresses, and neighbouring nations hear that the shield of Kazdel now stands firm."
 tu_kzd_ev.12.a:0 "Read the report"
 tu_kzd_ev.13.t:0 "Babel Rebuilt"
 tu_kzd_ev.13.d:0 "The workshops and archives of old Babel are burning again. The news will draw scholars from many nations, Rhodes Island among them, to Kazdel."
 tu_kzd_ev.13.a:0 "Read the report"
 tu_kzd_ev.14.t:0 "Mercenary Contract Dispute"
 tu_kzd_ev.14.d:0 "Two mercenary companies quarrelled over the same contract and clashed in the city square. Under the charter, the kingdom must arbitrate contract disputes. If the arbitration comes too late, other companies will break their contracts and leave."
 tu_kzd_ev.14.a:0 "Arbitrate the contract dispute"
 tu_kzd_ev.14.b:0 "Pay a bonus to the winning company"
 tu_kzd_ev.15.t:0 "Sandstorm over the Fortress"
 tu_kzd_ev.15.d:0 "A desert wind has battered the fortress, and part of its walls has collapsed. Engineers are digging out watchtowers buried in sand. Hurrying the repairs means pulling troops away, but waiting leaves a gap in the defence."
 tu_kzd_ev.15.a:0 "Hurry the repairs"
 tu_kzd_ev.15.b:0 "Wait for the storm to pass"
 tu_kzd_ev.16.t:0 "Refugees from Londinium"
 tu_kzd_ev.16.d:0 "A column of refugees from Londinium has gathered at the border. Among them are skilled craftsmen and merchants. Taking them in will add manpower, but the burden on food and public order will grow with them."
 tu_kzd_ev.16.a:0 "Take in the refugees"
 tu_kzd_ev.16.b:0 "Close the border"
 tu_kzd_ev.17.t:0 "Whispers in the Sarkaz Ranks"
 tu_kzd_ev.17.d:0 "Sarkaz recruits claim they hear the same voice in their dreams. The elders say the bloodline remembers an old pact. The commanders must decide how to deal with the soldiers' unease."
 tu_kzd_ev.17.a:0 "Hold a rite together with the elders"
 tu_kzd_ev.17.b:0 "Give the soldiers rest and ease their unease"
 tu_kzd_ev.18.t:0 "A Relic of Babel"
 tu_kzd_ev.18.d:0 "The excavation team has found a metal chest from the Babel era. Inside it may lie the blueprints of a device that still works. The commanders must decide whether to move it to a laboratory or bury it again where it was found."
 tu_kzd_ev.18.a:0 "Move the relic to a laboratory"
 tu_kzd_ev.18.b:0 "Bury the relic where it was found"
 tu_kzd_ev.19.t:0 "The Gate of the Babel Archive"
 tu_kzd_ev.19.d:0 "The excavation team has opened the sealed gate of the archive. Inside, hundreds of stone tablets are stacked high, and some of them record the designs of workshops. The commanders must decide whether to keep the gate open or seal it again."
 tu_kzd_ev.19.a:0 "Open the gate and move the records"
 tu_kzd_ev.19.b:0 "Seal the gate again"
 tu_kzd_ev.20.t:0 "Blueprints of Babel"
 tu_kzd_ev.20.d:0 "Once a few tablets were deciphered, the layout of the workshops and drawings of the power mechanisms came to light. Scholars say that following these designs could bring the old workshops back to life. Deciphering them, however, will take time."
 tu_kzd_ev.20.a:0 "Build workshops after the blueprints"
 tu_kzd_ev.20.b:0 "Keep the blueprints and postpone deciphering them"
 tu_kzd_ev.21.t:0 "Babel Workshops Ignite"
 tu_kzd_ev.21.d:0 "Smoke rose for the first time from the chimney of the restored workshop. Kazdel's craftsmen are running machines built to Babel's designs. The flame announces that the empire's industry has begun again."
 tu_kzd_ev.21.a:0 "Start up the workshops"
