l_english:
 TU_YAN_p1_throne_root:0 "Imperial Direct Rule"
 TU_YAN_p1_throne_root_desc:0 "The emperor declares he will rule from above the court. The old councils are set aside and the frame of direct rule is laid."
 TU_YAN_p1_throne_court_purge:0 "Purge the Court"
 TU_YAN_p1_throne_court_purge_desc:0 "Opposing courtiers are driven out. Political power is gained, but stability suffers."
 TU_YAN_p1_throne_court_pact:0 "Bargain with the Court"
 TU_YAN_p1_throne_court_pact_desc:0 "Seats are shared with the opposition to calm the court. Stability rises slightly."
 TU_YAN_p1_throne_court_settled:0 "Court Settled"
 TU_YAN_p1_throne_court_settled_desc:0 "The seats of the court are settled and the emperor's will reaches the lower offices."
 TU_YAN_p1_throne_appoint:0 "Appoint Governors Directly"
 TU_YAN_p1_throne_appoint_desc:0 "The imperial court appoints provincial governors itself."
 TU_YAN_p1_throne_bargain:0 "Negotiate With Provinces"
 TU_YAN_p1_throne_bargain_desc:0 "Local magnates are brought in and taxes and levies are shared. War support rises slightly."
 TU_YAN_p1_throne_admin:0 "Unified Administration"
 TU_YAN_p1_throne_admin_desc:0 "Provincial administration is bound into a single system."
 TU_YAN_p1_throne_guard:0 "Form the Imperial Guard"
 TU_YAN_p1_throne_guard_desc:0 "A guard answering only to the emperor is raised. Infantry weapons technology advances one step."
 TU_YAN_p1_throne_levy:0 "Strengthen Regional Levies"
 TU_YAN_p1_throne_levy_desc:0 "More manpower is drawn from the provinces."
 TU_YAN_p1_throne_loyal:0 "Army Oath of Loyalty"
 TU_YAN_p1_throne_loyal_desc:0 "The army swears loyalty to the emperor. Army experience accumulates."
 TU_YAN_p1_throne_treasury:0 "Open the Imperial Treasury"
 TU_YAN_p1_throne_treasury_desc:0 "The imperial vault is turned over to the state treasury. A large amount of political power is gained."
 TU_YAN_p1_throne_tax:0 "Tax Farming"
 TU_YAN_p1_throne_tax_desc:0 "Tax collection is handed to private contractors. War support rises a little, but fiscal order blurs."
 TU_YAN_p1_throne_fiscal:0 "Fiscal Order"
 TU_YAN_p1_throne_fiscal_desc:0 "The books are set in order again. Stability rises."
 TU_YAN_p1_throne_codex:0 "Codex of Absolutism"
 TU_YAN_p1_throne_codex_desc:0 "Imperial edicts are bound into a single law code."
 TU_YAN_p1_throne_bureau:0 "Edict Bureau"
 TU_YAN_p1_throne_bureau_desc:0 "An office to record and deliver edicts is founded. War support rises."
 TU_YAN_p1_throne_statutes:0 "Unified Statutes"
 TU_YAN_p1_throne_statutes_desc:0 "The code and the edict bureau merge into one body of statutes."
 TU_YAN_p1_throne_palace:0 "Rebuild the Palace"
 TU_YAN_p1_throne_palace_desc:0 "Materials pour into the palace works. Industry technology advances one step."
 TU_YAN_p1_throne_academy:0 "Imperial Academy"
 TU_YAN_p1_throne_academy_desc:0 "An imperial academy is founded to support electronics research. Electronics technology advances one step."
 TU_YAN_p1_throne_plan:0 "Grand Imperial Plan"
 TU_YAN_p1_throne_plan_desc:0 "A long-term imperial plan is drawn up. Artillery technology advances one step."
 TU_YAN_p1_throne_tribute:0 "Tribute System"
 TU_YAN_p1_throne_tribute_desc:0 "Neighboring states send tribute, raising the dignity of the imperial house."
 TU_YAN_p1_throne_diplomats:0 "Envoy Diplomacy"
 TU_YAN_p1_throne_diplomats_desc:0 "Envoys are sent to strengthen ties with neighboring states."
 TU_YAN_p1_throne_envoy_settled:0 "Imperial Diplomacy Established"
 TU_YAN_p1_throne_envoy_settled_desc:0 "The principles of imperial diplomacy are settled."
 TU_YAN_p1_throne_judiciary:0 "Imperial Judicial Monopoly"
 TU_YAN_p1_throne_judiciary_desc:0 "The imperial house monopolizes judicial power. Stability rises."
 TU_YAN_p1_throne_delegated:0 "Delegated Justice"
 TU_YAN_p1_throne_delegated_desc:0 "Trials are handed to officials. War support rises slightly."
 TU_YAN_p1_throne_justice:0 "Justice System"
 TU_YAN_p1_throne_justice_desc:0 "The imperial justice system is completed."
 TU_YAN_p1_throne_absolute:0 "Absolute Mandate"
 TU_YAN_p1_throne_absolute_desc:0 "The emperor's authority stands above every council. The absolute mandate covers the nation."
 TU_YAN_p1_throne_restrained:0 "Measured Mandate"
 TU_YAN_p1_throne_restrained_desc:0 "The emperor rules shared with the court. Political power and war support rise together."
 TU_YAN_p1_throne_seal:0 "Seal of Heaven"
 TU_YAN_p1_throne_seal_desc:0 "Every edict bears the imperial seal. Political power and stability rise sharply."
 TU_YAN_p1_throne_lungmen:0 "Lungmen Direct Administration"
 TU_YAN_p1_throne_lungmen_desc:0 "Lungmen is bound into an imperial direct administration. Mutually exclusive with the Lungmen trade pact."
 TU_YAN_p1_throne_progress:0 "Imperial Progress"
 TU_YAN_p1_throne_progress_desc:0 "The emperor tours the cities and receives assurances of loyalty."
 TU_YAN_p1_throne_review:0 "Guard Review"
 TU_YAN_p1_throne_review_desc:0 "The guard is reviewed to raise army morale."
 TU_YAN_p1_throne_proclaim:0 "Proclamation to All Under Heaven"
 TU_YAN_p1_throne_proclaim_desc:0 "The statutes are proclaimed across the realm."
 TU_YAN_p1_warlord_root:0 "Brothers Divided"
 TU_YAN_p1_warlord_root_desc:0 "The three brothers split their forces and become warlords. Mutually exclusive with the brothers' unity. The court's authority wavers."
 TU_YAN_p1_warlord_nian:0 "Arsenal to Nian"
 TU_YAN_p1_warlord_nian_desc:0 "Nian takes the forges and becomes the center of the warlords. The industrial path opens."
 TU_YAN_p1_warlord_dusk:0 "Voice to Dusk"
 TU_YAN_p1_warlord_dusk_desc:0 "Dusk seizes public opinion through painting and broadcast. The propaganda path opens."
 TU_YAN_p1_warlord_ling:0 "Feasts to Ling"
 TU_YAN_p1_warlord_ling_desc:0 "Ling binds the generals with banquets. The feast path opens."
 TU_YAN_p1_warlord_chong:0 "Command to Chongyue"
 TU_YAN_p1_warlord_chong_desc:0 "Chongyue takes the armies of the front. The battlefield path opens."
 TU_YAN_p1_warlord_foundry:0 "Forge Supply Network"
 TU_YAN_p1_warlord_foundry_desc:0 "The forges build their own supply network. Infantry weapons technology advances one step."
 TU_YAN_p1_warlord_supply:0 "Monopoly on Supply Depots"
 TU_YAN_p1_warlord_supply_desc:0 "Supply depots are seized alone and the supply of other warlords is cut. Political power is gained."
 TU_YAN_p1_warlord_hold:0 "Independent Arsenal"
 TU_YAN_p1_warlord_hold_desc:0 "The arsenal is cut loose from the court and made independent."
 TU_YAN_p1_warlord_gazette:0 "Seize the Gazettes"
 TU_YAN_p1_warlord_gazette_desc:0 "The state gazettes are seized and public opinion is shifted. Stability rises."
 TU_YAN_p1_warlord_bards:0 "Traveling Troupes"
 TU_YAN_p1_warlord_bards_desc:0 "Traveling troupes spread propaganda across the front and the cities. War support rises."
 TU_YAN_p1_warlord_mandate:0 "Painted Mandate"
 TU_YAN_p1_warlord_mandate_desc:0 "Paintings soothe the people and give the warlords a cause. Stability rises."
 TU_YAN_p1_warlord_tavern:0 "Tavern League"
 TU_YAN_p1_warlord_tavern_desc:0 "A league of warlords is set up in every tavern. War support rises."
 TU_YAN_p1_warlord_feast:0 "Warlord Banquet"
 TU_YAN_p1_warlord_feast_desc:0 "Generals are called to banquets to gain experience."
 TU_YAN_p1_warlord_oath:0 "Warrior Oaths"
 TU_YAN_p1_warlord_oath_desc:0 "Warriors swear oaths to the warlords. War support rises sharply."
 TU_YAN_p1_warlord_march:0 "Forced March Drills"
 TU_YAN_p1_warlord_march_desc:0 "Long marches harden the army. Army experience accumulates."
 TU_YAN_p1_warlord_fort:0 "Border Forts"
 TU_YAN_p1_warlord_fort_desc:0 "Forts are built along the border. Artillery technology advances one step."
 TU_YAN_p1_warlord_chong_banner:0 "Warlord Banner"
 TU_YAN_p1_warlord_chong_banner_desc:0 "Armies gather beneath Chongyue's banner. Army experience accumulates."
 TU_YAN_p1_warlord_league:0 "Warlord League"
 TU_YAN_p1_warlord_league_desc:0 "Four warlords unite and confront the court."
 TU_YAN_p1_warlord_absorb:0 "Absorb Lesser Warlords"
 TU_YAN_p1_warlord_absorb_desc:0 "Lesser warlords are absorbed and the army grows."
 TU_YAN_p1_warlord_mediate:0 "Mediate Between Warlords"
 TU_YAN_p1_warlord_mediate_desc:0 "Disputes between warlords are mediated. Stability rises."
 TU_YAN_p1_warlord_order:0 "Warlord Order"
 TU_YAN_p1_warlord_order_desc:0 "Absorption and mediation are bound into one order."
 TU_YAN_p1_warlord_claim:0 "Demand the Imperial Title"
 TU_YAN_p1_warlord_claim_desc:0 "The warlords demand the imperial title. War support rises."
 TU_YAN_p1_warlord_submit:0 "Submit to the Court"
 TU_YAN_p1_warlord_submit_desc:0 "The warlords bow before the court. Stability rises."
 TU_YAN_p1_warlord_regime:0 "Warlord Regime"
 TU_YAN_p1_warlord_regime_desc:0 "The warlord regime takes hold."
 TU_YAN_p1_warlord_east:0 "Eastern Push"
 TU_YAN_p1_warlord_east_desc:0 "Power is extended into eastern lands."
 TU_YAN_p1_warlord_west:0 "Western Holdings"
 TU_YAN_p1_warlord_west_desc:0 "The western lands are held in a defensive crouch."
 TU_YAN_p1_warlord_front:0 "Front Consolidated"
 TU_YAN_p1_warlord_front_desc:0 "The eastern and western fronts are consolidated. Army experience accumulates."
 TU_YAN_p1_warlord_civil_war:0 "Start the Civil War"
 TU_YAN_p1_warlord_civil_war_desc:0 "The warlords begin a civil war among themselves. War support rises."
 TU_YAN_p1_warlord_talks:0 "Peace Talks"
 TU_YAN_p1_warlord_talks_desc:0 "The warlords sit at the negotiating table. Stability rises."
 TU_YAN_p1_warlord_partition:0 "Preparing the Partition"
 TU_YAN_p1_warlord_partition_desc:0 "A plan to divide the realm is drawn up."
 TU_YAN_p1_warlord_tax:0 "Warlord Taxation"
 TU_YAN_p1_warlord_tax_desc:0 "The warlords collect taxes in their domains. Political power is gained."
 TU_YAN_p1_warlord_governors:0 "Dispatch Regional Governors"
 TU_YAN_p1_warlord_governors_desc:0 "The warlords send governors to rule their domains."
 TU_YAN_p1_warlord_fiscal:0 "Warlord Finances"
 TU_YAN_p1_warlord_fiscal_desc:0 "The finances of the warlords are bound into one."
 TU_YAN_p1_warlord_empire:0 "Empire of the Three Brothers"
 TU_YAN_p1_warlord_empire_desc:0 "The three divided brothers aim for one realm. Political power rises sharply."
 TU_YAN_p1_guard_root:0 "Guard Reform Bureau"
 TU_YAN_p1_guard_root_desc:0 "The imperial guard bureau is reformed and the direction of bureaucratic reform is set. The modern constitutional line is chosen."
 TU_YAN_p1_guard_form:0 "Establish the Guard Bureau"
 TU_YAN_p1_guard_form_desc:0 "A new guard bureau is founded to split the military from politics."
 TU_YAN_p1_guard_civil:0 "Civil Administration First"
 TU_YAN_p1_guard_civil_desc:0 "Civil officials take charge of administration and the army steps back."
 TU_YAN_p1_guard_decree:0 "Reform Edict"
 TU_YAN_p1_guard_decree_desc:0 "The reform edict is sent down across the nation."
 TU_YAN_p1_guard_draft:0 "Draft Constitution"
 TU_YAN_p1_guard_draft_desc:0 "The draft constitution is revised many times."
 TU_YAN_p1_guard_charter:0 "Provincial Charter"
 TU_YAN_p1_guard_charter_desc:0 "Local rights of self-government are guaranteed by charter."
 TU_YAN_p1_guard_constitution:0 "Promulgate the Constitution"
 TU_YAN_p1_guard_constitution_desc:0 "The constitution is promulgated and power is divided."
 TU_YAN_p1_guard_exam:0 "Reform the Examinations"
 TU_YAN_p1_guard_exam_desc:0 "The civil service examinations are reformed to be fair."
 TU_YAN_p1_guard_merit:0 "Merit Evaluation"
 TU_YAN_p1_guard_merit_desc:0 "Officials are evaluated on merit and their posts are set accordingly."
 TU_YAN_p1_guard_civil_service:0 "Civil Service Completed"
 TU_YAN_p1_guard_civil_service_desc:0 "The civil service examination system is completed."
 TU_YAN_p1_guard_parliament:0 "Found the Parliament"
 TU_YAN_p1_guard_parliament_desc:0 "A parliament of elected members is founded."
 TU_YAN_p1_guard_senate:0 "Senate Advisory Board"
 TU_YAN_p1_guard_senate_desc:0 "An advisory board of elders stands in for a parliament."
 TU_YAN_p1_guard_session:0 "Parliament Convenes"
 TU_YAN_p1_guard_session_desc:0 "The parliament convenes for the first time."
 TU_YAN_p1_guard_election:0 "General Election"
 TU_YAN_p1_guard_election_desc:0 "A general election is held across the nation."
 TU_YAN_p1_guard_delay:0 "Postpone the Elections"
 TU_YAN_p1_guard_delay_desc:0 "Elections are put off under the pretext of an emergency. Stability falls."
 TU_YAN_p1_guard_vote:0 "Electoral Order"
 TU_YAN_p1_guard_vote_desc:0 "The order of elections is settled."
 TU_YAN_p1_guard_trade:0 "Open Free Trade"
 TU_YAN_p1_guard_trade_desc:0 "The borders open and free trade begins."
 TU_YAN_p1_guard_protect:0 "Protect State Industry"
 TU_YAN_p1_guard_protect_desc:0 "State industry is shielded behind tariffs."
 TU_YAN_p1_guard_market:0 "Market Institutions"
 TU_YAN_p1_guard_market_desc:0 "Institutions are built so that markets and state industry grow together."
 TU_YAN_p1_guard_press:0 "Guaranteed Press Freedom"
 TU_YAN_p1_guard_press_desc:0 "Freedom of the press is guaranteed by law."
 TU_YAN_p1_guard_censor:0 "Press Control"
 TU_YAN_p1_guard_censor_desc:0 "The press is controlled to prevent disorder."
 TU_YAN_p1_guard_press_settled:0 "Press Settled"
 TU_YAN_p1_guard_press_settled_desc:0 "The order of the press is put in place."
 TU_YAN_p1_guard_local_vote:0 "Local Elections"
 TU_YAN_p1_guard_local_vote_desc:0 "Local heads are chosen directly by residents."
 TU_YAN_p1_guard_local_appoint:0 "Appointed Governors Kept"
 TU_YAN_p1_guard_local_appoint_desc:0 "Provincial governors are still appointed by the centre."
 TU_YAN_p1_guard_local:0 "Local Self-Government"
 TU_YAN_p1_guard_local_desc:0 "The system of local self-government takes hold."
 TU_YAN_p1_guard_audit:0 "Establish the Audit Office"
 TU_YAN_p1_guard_audit_desc:0 "An audit office is founded to examine the finances of the offices."
 TU_YAN_p1_guard_immunity:0 "Official Immunity"
 TU_YAN_p1_guard_immunity_desc:0 "Officials are granted immunity within limits. Stability drops a little."
 TU_YAN_p1_guard_oversight:0 "Administrative Oversight"
 TU_YAN_p1_guard_oversight_desc:0 "The system of administrative oversight is completed."
 TU_YAN_p1_guard_republic:0 "Proclaim the Constitutional Republic"
 TU_YAN_p1_guard_republic_desc:0 "The constitutional republic is proclaimed and a new chancellor is installed. The ruling party changes to a democratic one."
 TU_YAN_p1_guard_lungmen:0 "Approve the Lungmen Charter"
 TU_YAN_p1_guard_lungmen_desc:0 "The Lungmen self-government charter is approved and the trade pact is secured."
 TU_YAN_p1_guard_officers:0 "Guard Officer Corps"
 TU_YAN_p1_guard_officers_desc:0 "A guard officer corps is formed to set discipline in the army."
 TU_YAN_p1_guard_forum:0 "Public Forum"
 TU_YAN_p1_guard_forum_desc:0 "Parliamentary debates are opened to the public."
 TU_YAN_p1_spirit_root:0 "Proclaim the Worship of the Spirits"
 TU_YAN_p1_spirit_root_desc:0 "The spirits are placed at the heart of the state. The theocratic, fascist line is chosen."
 TU_YAN_p1_spirit_temples:0 "Build Temples"
 TU_YAN_p1_spirit_temples_desc:0 "Temples to the spirits are built across the land."
 TU_YAN_p1_spirit_absorb:0 "Absorb the Spirit Sects"
 TU_YAN_p1_spirit_absorb_desc:0 "Scattered spirit sects are absorbed into one. War support rises slightly."
 TU_YAN_p1_spirit_blessing:0 "Blessing of the Spirits"
 TU_YAN_p1_spirit_blessing_desc:0 "The blessing of the spirits wraps the nation. Stability rises."
 TU_YAN_p1_spirit_legion:0 "Priest Legion"
 TU_YAN_p1_spirit_legion_desc:0 "Priests form a legion and take the field."
 TU_YAN_p1_spirit_property:0 "Seize Temple Property"
 TU_YAN_p1_spirit_property_desc:0 "Temple property is seized to fill the treasury. Stability drops a little."
 TU_YAN_p1_spirit_admin:0 "Priestly Administration"
 TU_YAN_p1_spirit_admin_desc:0 "Priests take over administration down to the lowest offices."
 TU_YAN_p1_spirit_oracle:0 "Oracle Courts"
 TU_YAN_p1_spirit_oracle_desc:0 "Verdicts are decided by oracle."
 TU_YAN_p1_spirit_inquisition:0 "Heresy Inquisition"
 TU_YAN_p1_spirit_inquisition_desc:0 "Heretics are questioned to bind public opinion together. War support rises slightly."
 TU_YAN_p1_spirit_judgement:0 "Devout Unity"
 TU_YAN_p1_spirit_judgement_desc:0 "The faithful bind together. Stability rises sharply."
 TU_YAN_p1_spirit_arts:0 "Arts Rite Corps"
 TU_YAN_p1_spirit_arts_desc:0 "A rite corps that uses Arts is formed."
 TU_YAN_p1_spirit_festival:0 "Folk Festivals"
 TU_YAN_p1_spirit_festival_desc:0 "Folk festivals soothe the hearts of the people."
 TU_YAN_p1_spirit_rites:0 "Spirit Rites"
 TU_YAN_p1_spirit_rites_desc:0 "Spirit rites are held across the nation. Electronics technology advances one step."
 TU_YAN_p1_spirit_censorship:0 "Doctrinal Censorship"
 TU_YAN_p1_spirit_censorship_desc:0 "Writings that depart from doctrine are censored. Stability rises."
 TU_YAN_p1_spirit_education:0 "Moral Education"
 TU_YAN_p1_spirit_education_desc:0 "Doctrine is taught in the schools."
 TU_YAN_p1_spirit_doctrine:0 "Unified Doctrine"
 TU_YAN_p1_spirit_doctrine_desc:0 "Doctrine is unified into one."
 TU_YAN_p1_spirit_army:0 "Theocratic Army"
 TU_YAN_p1_spirit_army_desc:0 "An army is formed in the name of the theocracy. Army experience accumulates."
 TU_YAN_p1_spirit_bastions:0 "Shrine Bastions"
 TU_YAN_p1_spirit_bastions_desc:0 "Shrines are turned into fortresses to guard the land. War support rises slightly."
 TU_YAN_p1_spirit_crusade_prep:0 "Preparing the Holy War"
 TU_YAN_p1_spirit_crusade_prep_desc:0 "The cause of a holy war is set and preparations are finished."
 TU_YAN_p1_spirit_crown:0 "Preparing the High Priest"
 TU_YAN_p1_spirit_crown_desc:0 "The seat of the high priest is prepared."
 TU_YAN_p1_spirit_dual:0 "Emperor Holds Both Crowns"
 TU_YAN_p1_spirit_dual_desc:0 "The emperor declares that he also holds the high priest's office. Stability rises."
 TU_YAN_p1_spirit_succession:0 "Succession Settled"
 TU_YAN_p1_spirit_succession_desc:0 "The succession of the theocracy is settled."
 TU_YAN_p1_spirit_school:0 "Priest Schools"
 TU_YAN_p1_spirit_school_desc:0 "Schools are founded to train priests."
 TU_YAN_p1_spirit_council:0 "Oracle Council"
 TU_YAN_p1_spirit_council_desc:0 "A council that delivers the oracle's word is convened."
 TU_YAN_p1_spirit_clergy:0 "Clerical Order"
 TU_YAN_p1_spirit_clergy_desc:0 "A hierarchy of clergy is established across the nation."
 TU_YAN_p1_spirit_title:0 "Title of Spirit Sovereign"
 TU_YAN_p1_spirit_title_desc:0 "The title of Spirit Sovereign is taken."
 TU_YAN_p1_spirit_envoys:0 "Sect Envoys"
 TU_YAN_p1_spirit_envoys_desc:0 "Sect envoys are sent to neighboring lands. War support rises slightly."
 TU_YAN_p1_spirit_realm:0 "Realm of the Spirits"
 TU_YAN_p1_spirit_realm_desc:0 "The realm of the spirits takes on one face."
 TU_YAN_p1_spirit_theocracy:0 "Proclaim the Theocracy"
 TU_YAN_p1_spirit_theocracy_desc:0 "The high priest is installed to lead the state in a theocracy. The ruling party becomes fascist."
 TU_YAN_p1_spirit_statues:0 "Spirit Statues"
 TU_YAN_p1_spirit_statues_desc:0 "Statues of the spirits are raised."
 TU_YAN_p1_spirit_pilgrims:0 "Wandering Priests Sent Out"
 TU_YAN_p1_spirit_pilgrims_desc:0 "Wandering priests are sent across the land. War support rises slightly."
 TU_YAN_p1_spirit_parade:0 "Procession of Blessing"
 TU_YAN_p1_spirit_parade_desc:0 "A procession honoring the blessing of the spirits passes through the cities."
 TU_YAN_p1_idea_throne_mandate:0 "Imperial Mandate"
 TU_YAN_p1_idea_throne_mandate_desc:0 "The emperor rules the nation directly. Political power gain rises and stability improves slightly."
 TU_YAN_p1_idea_throne_absolute:0 "Absolute Mandate"
 TU_YAN_p1_idea_throne_absolute_desc:0 "The emperor's authority stands above every council. Stability and conscription rise, but political power gain falls."
 TU_YAN_p1_idea_throne_restrained:0 "Measured Mandate"
 TU_YAN_p1_idea_throne_restrained_desc:0 "The emperor shares rule with the court. Political power gain and war support rise slightly."
 TU_YAN_p1_idea_throne_seal:0 "Seal of Heaven"
 TU_YAN_p1_idea_throne_seal_desc:0 "Every edict bears the imperial seal. Political power gain and war support rise sharply."
 TU_YAN_p1_idea_warlord_banner:0 "Warlord Banners"
 TU_YAN_p1_idea_warlord_banner_desc:0 "Each of the three brothers raises a banner. Conscription rises but stability falls."
 TU_YAN_p1_idea_warlord_forge:0 "Forge of Weapons"
 TU_YAN_p1_idea_warlord_forge_desc:0 "Nian's forges speed up construction."
 TU_YAN_p1_idea_warlord_press:0 "Dusk's Press Campaign"
 TU_YAN_p1_idea_warlord_press_desc:0 "Dusk's press campaign sways the people and wins war support."
 TU_YAN_p1_idea_warlord_wine:0 "Ling's Banquets"
 TU_YAN_p1_idea_warlord_wine_desc:0 "Banquets bind the generals' loyalty and raise army morale."
 TU_YAN_p1_idea_warlord_drill:0 "Chongyue's Drills"
 TU_YAN_p1_idea_warlord_drill_desc:0 "Chongyue's drills strengthen the army's attack and defence."
 TU_YAN_p1_idea_warlord_empire:0 "Empire of the Three Brothers"
 TU_YAN_p1_idea_warlord_empire_desc:0 "The divided forces aim for one realm. Political power gain and war support rise."
 TU_YAN_p1_idea_guard_reform:0 "Guard Reform"
 TU_YAN_p1_idea_guard_reform_desc:0 "The guard bureau is reformed into a central organ of state. Stability and political power gain rise."
 TU_YAN_p1_idea_guard_civil_service:0 "Civil Service Examinations"
