l_english:
 # generated by tools/focusgen/vic_acts.py (spec 80)
 TU_VIC_a1_glasgow:0 "Secure Glasgow"
 TU_VIC_a1_glasgow_desc:0 "Secure the streets and docks of the new capital. Royalist dukes gain influence."
 TU_VIC_a1_royal_guard:0 "Legacy of the Royal Guard"
 TU_VIC_a1_royal_guard_desc:0 "Rally loyalty in the name of the old Royal Guard. Royalist dukes gain much influence."
 TU_VIC_a1_mobilize:0 "Ducal Levy"
 TU_VIC_a1_mobilize_desc:0 "Call up the ducal estate armies. The nobles (Caster, Abercorn) gain power; Wellington is sidelined. (Exclusive with the other two)"
 TU_VIC_a1_selfsalv:0 "Secret Contact with the Self-Salvation Corps"
 TU_VIC_a1_selfsalv_desc:0 "Reach the Self-Salvation Corps inside Londinium. Reformists (Stafford, Godolphin) gain power and the Shard slows."
 TU_VIC_a1_wellington:0 "Win Over Wellington"
 TU_VIC_a1_wellington_desc:0 "Win over Duke Wellington and bind the military. The Tara-leaning (Wellington, Windermere) gain power; Caster takes offence."
 TU_VIC_a1_noble_levy:0 "Estate Conscription"
 TU_VIC_a1_noble_levy_desc:0 "Draft men from every estate. Manpower rises but stability dips."
 TU_VIC_a1_noble_council:0 "Seize the Noble Council"
 TU_VIC_a1_noble_council_desc:0 "Bind the votes of the noble council. Caster and Abercorn gain influence and political power."
 TU_VIC_a1_noble_army:0 "Ducal Army Organisation"
 TU_VIC_a1_noble_army_desc:0 "Bring the estate armies under one command. Gain experience and an infantry research bonus."
 TU_VIC_a1_reform_press:0 "Underground Presses"
 TU_VIC_a1_reform_press_desc:0 "Print and spread word that leaks from Londinium. Stafford gains influence; stability rises."
 TU_VIC_a1_reform_rhodes:0 "Contact the Rhodes Island Team"
 TU_VIC_a1_reform_rhodes_desc:0 "Open a line to the Rhodes Island infiltration team. The Shard slows."
 TU_VIC_a1_reform_militia:0 "Arm the Citizens"
 TU_VIC_a1_reform_militia_desc:0 "Hand out rifles to citizens. Gain manpower and infantry equipment."
 TU_VIC_a1_tara_envoy:0 "Envoy from Tara"
 TU_VIC_a1_tara_envoy_desc:0 "Exchange envoys with the Tara faction in Dublinn. Wellington and Windermere gain influence."
 TU_VIC_a1_tara_ls:0 "Overhaul the Land Battleships"
 TU_VIC_a1_tara_ls_desc:0 "Overhaul Wellington's land battleships. An artillery research bonus and Wellington loyalty."
 TU_VIC_a1_tara_junta:0 "Bind the Military"
 TU_VIC_a1_tara_junta_desc:0 "Bind the military dukes together. Windermere loyalty and army experience."
 TU_VIC_a1_siege:0 "Encircle Londinium"
 TU_VIC_a1_siege_desc:0 "Raise forts and supply lines around Londinium. Open to whichever emphasis you chose."
 TU_VIC_a1_shard_stop:0 "Operation: Halt the Shard"
 TU_VIC_a1_shard_stop_desc:0 "Launch the operation to retake Londinium. Gain a claim war goal against Kazdel and slow the Shard."
 TU_VIC_a1_end:0 "End of the Londinium Incident"
 TU_VIC_a1_end_desc:0 "Available once Londinium is retaken or the Shard has fired. The balance of factions decides the route of Act 2."
 TU_VIC_kz_head:0 "The Sarkaz Crucible"
 TU_VIC_kz_head_desc:0 "With the Shard awake, Victoria becomes a Sarkaz crucible. Theresis demands industry in return for 'protection' and the Confessor becomes the face of Victoria. Signing makes Victoria a Kazdel protectorate."
 TU_VIC_kz_levy:0 "Industrial Levy"
 TU_VIC_kz_levy_desc:0 "Kazdel seizes part of the factory output. In return, political power."
 TU_VIC_kz_governor:0 "Cooperate with the Governorate"
 TU_VIC_kz_governor_desc:0 "Cooperate with the governorate to buy breathing space. Stability rises, resistance cools."
 TU_VIC_kz_dukes:0 "Guarantee the Ducal Estates"
 TU_VIC_kz_dukes_desc:0 "Guarantee the ducal estates and buy loyalty. Every duke's loyalty rises."
 TU_VIC_kz_resist:0 "Underground Resistance"
 TU_VIC_kz_resist_desc:0 "Weave an underground resistance under the levy. Manpower and army experience."
 TU_VIC_kz_arms:0 "Secret Arsenals"
 TU_VIC_kz_arms_desc:0 "Hide weapons diverted from the levy. Infantry equipment and a military factory."
 TU_VIC_kz_strikes:0 "Organise Factory Strikes"
 TU_VIC_kz_strikes_desc:0 "Organise strikes factory by factory to slow the levy."
 TU_VIC_kz_shard:0 "Dismantle the Shard"
 TU_VIC_kz_shard_desc:0 "With the Self-Salvation Corps and Rhodes Island, dismantle the Shard. The calamity spirit is lifted."
 TU_VIC_kz_uprising:0 "Uprising for Independence"
 TU_VIC_kz_uprising_desc:0 "Rise up with everything at stake. Victoria breaks free of its Kazdel protector."
 TU_VIC_kz_free:0 "A Free Victoria"
 TU_VIC_kz_free_desc:0 "The extortion is over. The levy lifts and industry returns."
 TU_VIC_confessor_leader:0 "The Confessor"
 TU_VIC_reed_leader:0 "Reed"
 TU_VIC_faust_commander:0 "Faust"
 TU_VIC_asl_exemplars:0 "Reform into the Exemplars"
 TU_VIC_asl_exemplars_desc:0 "Reorganise the elite of the Aslan restoration army as the Exemplars. Exemplar divisions can be raised from Special Projects."
 TU_VIC_red_fog:0 "The Red Fog"
 TU_VIC_red_fog_desc:0 "Under the red fog over Londinium the throne is empty and people are uneasy. Stability -5%, political power -10%, war support -5%. It lifts when the Incident ends."
 TU_VIC_kz_extortion:0 "Kazdel's Extortion"
 TU_VIC_kz_extortion_desc:0 "Kazdel levies industry in return for protection. Factory output -25%, stability -10%."
 tu_vic_ev.41.t:0 "The End of the Londinium Incident"
 tu_vic_ev.41.d:0 "The Incident is over. Which ducal faction gained the most power decides Victoria's next road. A faction with §Y80§! or more influence can choose its route.\n\nNobles [?TU_VIC_f_noble|0] · Royalists [?TU_VIC_f_royal|0] · Tara [?TU_VIC_f_tara|0] · Reformists [?TU_VIC_f_reform|0]"
 tu_vic_ev.41.a:0 "The Iron-Blood Ducal Council. (Duke Caster)"
 tu_vic_ev.41.b:0 "The Dawn of Aslan. (Vina Victoria)"
 tu_vic_ev.41.c:0 "The Purple Flame. (Eblana / Wellington)"
 tu_vic_ev.41.e:0 "Revolution of the Self-Salvation Corps. (Clovisia / Faust)"
 tu_vic_ev.41.f:0 "Follow the strongest faction."
 tu_vic_ev.41.g:0 "The Sarkaz Crucible. (Theresis / the Confessor)"
