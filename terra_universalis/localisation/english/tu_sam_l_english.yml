 tu_sam_ev.1.t:0 "Voice of the Forest"
 tu_sam_ev.1.d:0 "A shaman returns from the forest: the spirits can hear the footsteps of outsiders."
 tu_sam_ev.1.a:0 "We guard the forest."
 tu_sam_ev.1.b:0 "We look outside."
 tu_sam_ev.20.t:0 "Wrath of the Forest"
 tu_sam_ev.20.d:0 "The blizzard will not stop and game has vanished. The shamans say the forest is angry."
 tu_sam_ev.20.a:0 "Make offerings."
 tu_sam_ev.20.b:0 "Endure."
 tu_sam_ev.21.t:0 "The Forest Relents"
 tu_sam_ev.21.d:0 "As grace returned, the blizzard lifted."
 tu_sam_ev.21.a:0 "Give thanks."
 tu_sam_ev.22.t:0 "Ursus Settlers"
 tu_sam_ev.22.d:0 "Ursus settlers have built a village at the forest's edge."
 tu_sam_ev.22.a:0 "Drive them out."
 tu_sam_ev.22.b:0 "Trade with them."
 tu_sam_ev.22.c:0 "Leave them to the forest."
 tu_sam_ev.23.t:0 "Kazimierz Merchants"
 tu_sam_ev.23.d:0 "Kazimierz merchants have come to buy furs."
 tu_sam_ev.23.a:0 "Sell."
 tu_sam_ev.24.t:0 "A Spirit Appears"
 tu_sam_ev.24.d:0 "A great spirit appeared before a village and vanished."
 tu_sam_ev.24.a:0 "A good sign."
 tu_sam_ev.25.t:0 "Tribal Feud"
 tu_sam_ev.25.d:0 "Two tribes feud over hunting grounds."
 tu_sam_ev.25.a:0 "Mediate."
 tu_sam_ev.25.b:0 "Stay out of it."
 tu_sam_ev.26.t:0 "The Polar Night"
 tu_sam_ev.26.d:0 "The sunless winter has come. Shamans perform rites beneath the aurora."
 tu_sam_ev.26.a:0 "Join the rites."
