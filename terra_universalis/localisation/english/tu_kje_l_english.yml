 tu_kje_ev.1.t:0 "Beneath the Eternal Snow"
 tu_kje_ev.1.d:0 "Karlan Trade freight trains climb the passes, and pilgrims walk beside them to the Saintess's temple."
 tu_kje_ev.1.a:0 "A new age is coming."
 tu_kje_ev.1.b:0 "We must keep the old ways."
 tu_kje_ev.10.t:0 "Winter Has Come"
 tu_kje_ev.10.d:0 "The first snow covers the passes. For five months Kjerag will be locked in snow."
 tu_kje_ev.10.a:0 "We endure."
 tu_kje_ev.11.t:0 "Spring Thaw"
 tu_kje_ev.11.d:0 "The snow melts and the passes open."
 tu_kje_ev.11.a:0 "Back to work."
 tu_kje_ev.20.t:0 "Talks of the Three Houses"
 tu_kje_ev.20.d:0 "Silverash of House Enciodas, the Saintess and the old nobility's elder sit in one room. The silence was long."
 tu_kje_ev.20.a:0 "Listen to Silverash."
 tu_kje_ev.20.b:0 "Listen to the Saintess."
 tu_kje_ev.20.c:0 "Take no side."
 tu_kje_ev.21.t:0 "Avalanche"
 tu_kje_ev.21.d:0 "A huge avalanche buried a mountain village."
 tu_kje_ev.21.a:0 "Send rescuers."
 tu_kje_ev.21.b:0 "Wait for spring."
 tu_kje_ev.22.t:0 "Karlan Trade Scandal"
 tu_kje_ev.22.d:0 "Karlan Trade is accused of selling mines to foreign capital."
 tu_kje_ev.22.a:0 "Trust Silverash."
 tu_kje_ev.22.b:0 "Investigate."
 tu_kje_ev.23.t:0 "Miracle of the Saintess"
 tu_kje_ev.23.d:0 "Rumour spreads that a long-sick child rose after the Saintess's prayer."
 tu_kje_ev.23.a:0 "Praise the god."
 TU_KJE_modern_m3_tt:0 "§YTradition§! +3 (modernisation -3)"
 tu_kje_ev.24.t:0 "Protest Against the Railway"
 tu_kje_ev.24.d:0 "Pilgrims protest a railway that would pass the sacred peaks."
 tu_kje_ev.24.a:0 "Push it through."
 tu_kje_ev.24.b:0 "Reroute it."
 tu_kje_ev.25.t:0 "The Old Nobility Grumbles"
 tu_kje_ev.25.d:0 "The old nobility complains they are squeezed out by the other two houses."
 tu_kje_ev.25.a:0 "Guarantee their estates."
 tu_kje_ev.25.b:0 "Ignore them."
 tu_kje_ev.26.t:0 "Guests from Beyond the Mountains"
 tu_kje_ev.26.d:0 "Foreign engineers have crossed the mountains."
 tu_kje_ev.26.a:0 "Welcome them."
 tu_kje_ev.27.t:0 "Festival of the Snow"
 tu_kje_ev.27.d:0 "The whole nation enjoyed winter with snow sculptures and songs."
 tu_kje_ev.27.a:0 "Joyful."
 tu_kje_ev.28.t:0 "Modern Kjerag"
 tu_kje_ev.28.d:0 "Silverash leads Kjerag into the future."
 tu_kje_ev.28.a:0 "Forward."
 tu_kje_ev.29.t:0 "Theocracy of the Saintess"
 tu_kje_ev.29.d:0 "The Saintess has taken the nation in Kjeragandr's name."
 tu_kje_ev.29.a:0 "As the god wills."
 tu_kje_ev.30.t:0 "The Houses United"
 tu_kje_ev.30.d:0 "For the first time, the three houses stand under one banner."
 tu_kje_ev.30.a:0 "Together."
