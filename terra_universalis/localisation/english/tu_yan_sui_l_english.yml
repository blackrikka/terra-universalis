 TU_YAN_idea_imperial_protection:0 "The Emperor Shall Protect Us"
 TU_YAN_idea_imperial_protection_desc:0 "Faith in the throne binds the court together. Imperial House support rises by 0.1 a week; other ideologies fall by 0.5 a week."
 TU_YAN_idea_depose:0 "Time for a New Leader"
 TU_YAN_idea_depose_desc:0 "We must drive out the emperor and choose a new leader. Imperial House support falls by 0.5 a week; Sui support rises by 0.5 a week."
 TU_YAN_idea_power_struggle:0 "Struggle Among the Siblings"
 TU_YAN_idea_power_struggle_desc:0 "The Sui siblings each insist on their own path, and the court is split."
 TU_YAN_idea_age_of_dragons:0 "Age of Dragons"
 TU_YAN_idea_age_of_dragons_desc:0 "The siblings have drawn their swords. The master of Yan will be decided by battle."
