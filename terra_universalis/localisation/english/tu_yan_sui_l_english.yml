 TU_YAN_p1_path_of_ruin:0 "The Road to Ruin..."
 TU_YAN_p1_path_of_ruin_desc:0 "No sibling could hold Yan together. Through the cracks between them, the slumbering Sui rises."
 TU_YAN_p1_ruin_awaken:0 "Sui Awakens"
 TU_YAN_p1_ruin_awaken_desc:0 "Sui is fully awake. The siblings' names are now only parts of Sui."
 TU_YAN_p1_hand_in_hand:0 "Hand in Hand"
 TU_YAN_p1_hand_in_hand_desc:0 "The estranged siblings gather again. Every one of them took the hand their eldest brother offered."
