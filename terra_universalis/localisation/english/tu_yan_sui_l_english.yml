 tu_yan_dragon.1.t:0 "Age of Dragons"
 tu_yan_dragon.1.d:0 "The sibling council has collapsed and the twelve siblings have carved up Yan. Around whom will the court rally? The chosen sibling's realm becomes ours; the others found their own realms and fight us."
 tu_yan_dragon.1.a:0 "Not even for a sibling will we yield."
 tu_yan_dragon.2.t:0 "Civil War in Yan"
 tu_yan_dragon.2.d:0 "The twelve Sui siblings of Yan have divided the realm and gone to war. The great eastern empire has split into twelve pieces."
 tu_yan_dragon.2.a:0 "The dragons are fighting."
 tu_yan_dragon.3.t:0 "Hand in Hand"
 tu_yan_dragon.3.d:0 "Victorious, Chongyue did not punish his siblings. He set the defeated free, and then asked them to come home of their own will. One by one, they took his hand."
 tu_yan_dragon.3.a:0 "Together again."
 TU_YAN_sibling_category:0 "The Sui Siblings"
 TU_YAN_sibling_category_desc:0 "Chongyue hopes to call his estranged siblings home. If he sets the defeated ones free, they may return of their own will."
 TU_YAN_free_sibling:0 "Set a Sibling Free"
 TU_YAN_free_sibling_desc:0 "Release a sibling faction we hold as a puppet."
 TU_YAN_hand_in_hand_decision:0 "Hand in Hand"
 TU_YAN_hand_in_hand_decision_desc:0 "Ask the freed siblings to come home. Every faction rejoins Yan and its lands become our core states."
 tu_yan_dragon.1.chongyue:0 "Entrust Yan to Chongyue."
 tu_yan_dragon.1.ling:0 "Entrust Yan to Ling."
 tu_yan_dragon.1.wang:0 "Entrust Yan to Wang."
 tu_yan_dragon.1.dusk:0 "Entrust Yan to Dusk."
 tu_yan_dragon.1.shu:0 "Entrust Yan to Shu."
