 TU_YAN_p1_depose_root_desc:0 "The time has come to drive out the emperor and choose a new leader."
 TU_YAN_p1_sui_seize:0 "The Sui Seize Power"
 TU_YAN_p1_sui_seize_desc:0 "The Sui siblings take the empty throne. A council of siblings now governs Yan."
 TU_YAN_p1_power_struggle:0 "The Power Struggle"
 TU_YAN_p1_power_struggle_desc:0 "The council did not last. Each of the twelve siblings has a different vision for Yan."
 TU_YAN_p1_age_of_dragons:0 "Age of Dragons"
 TU_YAN_p1_age_of_dragons_desc:0 "Words were not enough. Some siblings leave Yan with their lands and turn their blades on us. Civil war begins."
