 tu_yan_dragon.1.jun:0 "Entrust Yan to Jun."
 tu_yan_dragon.1.jie:0 "Entrust Yan to Jie."
 tu_yan_dragon.1.ji:0 "Entrust Yan to Ji."
 tu_yan_dragon.1.yi:0 "Entrust Yan to Yi."
 tu_yan_dragon.1.fang:0 "Entrust Yan to Fang."
 tu_yan_dragon.1.yu:0 "Entrust Yan to Yu."
 tu_yan_dragon.1.ruin:0 "No one. Sui will awaken."
 TU_YAN_p1_dragons_end:0 "End of the Age of Dragons"
 TU_YAN_p1_dragons_end_desc:0 "The siblings' war is over. No sibling bears arms against Yan any longer. (Requires every war with the sibling factions to be over.)"
 TU_YAN_p1_new_era:0 "Yan in a New Era"
 TU_YAN_p1_new_era_desc:0 "Having passed through the Age of Dragons, Yan enters a new era."
 TU_YAN_idea_new_era:0 "Yan in a New Era"
 TU_YAN_idea_new_era_desc:0 "The siblings' feud is over. Yan moves as one again."
