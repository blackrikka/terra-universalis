 TU_RHO_pmc_contract:0 "Sign a PMC Contract"
 TU_RHO_pmc_contract_desc:0 "Sign a 180-day contract with a nation at war. Monthly LMD income rises while the contract is active. Cost: 25 political power."
 TU_RHO_op_chernobog:0 "Operation: Rescue Chernobog"
 TU_RHO_op_chernobog_desc:0 "Send a rescue force to Chernobog. Costs 30 command power and 500 LMD. After 60 days it gives 5000 manpower, 25 army experience and +5% war support. Can be run once."
