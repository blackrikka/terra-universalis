l_english:
 TU_RHO_relocate_rho_start:0 "Return to the Starting Anchorage"
 TU_RHO_relocate_rho_start_desc:0 "Move the landship to the Rhodes Island starting anchorage. The capital moves here. The relocation gives the Recent Relocation penalty for 30 days."
 TU_RHO_relocate_victoria:0 "Move to the Victoria Anchorage"
 TU_RHO_relocate_victoria_desc:0 "Move the landship to the Victoria anchorage. The capital moves here. The relocation gives the Recent Relocation penalty for 30 days."
