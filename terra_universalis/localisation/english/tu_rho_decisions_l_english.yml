 TU_RHO_upgrade_factory:0 "Upgrade RIIC Workshop"
 TU_RHO_upgrade_factory_desc:0 "Raise the workshop level to gain one more offsite arms factory. The level cap is the power plant level + 2. Cost: 25 political power and 100 x (current level + 1) LMD."
 TU_RHO_upgrade_trade:0 "Upgrade RIIC Trading Post"
 TU_RHO_upgrade_trade_desc:0 "Raise the trading post level to gain one more offsite industrial complex and more monthly LMD income. Cost: 25 political power and 100 x (current level + 1) LMD."
 TU_RHO_upgrade_power:0 "Upgrade RIIC Power Plant"
 TU_RHO_upgrade_power_desc:0 "Raise the power plant level (maximum 3). The level cap of the other facilities rises by 1. Cost: 25 political power and 100 x (current level + 1) LMD."
 TU_RHO_upgrade_dorm:0 "Upgrade RIIC Dormitory"
 TU_RHO_upgrade_dorm_desc:0 "Raise the dormitory level to improve army organisation regain and morale. Cost: 25 political power and 100 x (current level + 1) LMD."
 TU_RHO_upgrade_reception:0 "Upgrade RIIC Reception Room"
 TU_RHO_upgrade_reception_desc:0 "Raise the reception room level to gain more political power. With La Resistance it also raises intel network gain. Cost: 25 political power and 100 x (current level + 1) LMD."
 TU_RHO_headhunting:0 "Public Recruitment"
 TU_RHO_headhunting_desc:0 "Form one operator squad in the capital. Cost: 50 political power and 300 LMD. Available again after 60 days."
 TU_RHO_safehouse_URS:0 "Establish a Relief Branch in Ursus"
 TU_RHO_safehouse_URS_desc:0 "Set up a relief branch in Ursus. Gives 300 manpower every month. Can be built once per country."
