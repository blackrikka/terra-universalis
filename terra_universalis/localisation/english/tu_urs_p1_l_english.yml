l_english:
 TU_URS_imperial_court:0 "Reorganise the Court"
 TU_URS_imperial_court_desc:0 "Replace court officials with men loyal to the throne."
 TU_URS_absolutism_codex:0 "Absolutist Codex"
 TU_URS_absolutism_codex_desc:0 "Bind imperial decrees into one law code. Local custom falls beneath it."
 TU_URS_sovereign_seal:0 "The Imperial Seal"
 TU_URS_sovereign_seal_desc:0 "Every law now bears the imperial seal."
 TU_URS_palace_rebuild:0 "Rebuild the Palace"
 TU_URS_palace_rebuild_desc:0 "Rebuild the burned palace. A factory appears at once in a random state."
 TU_URS_absolute_crown:0 "The Absolute Crown"
 TU_URS_absolute_crown_desc:0 "The emperor takes the crown. Absolute monarchy is complete and the balance swings far toward the throne."
 TU_URS_eternal_throne:0 "Eternal Throne"
 TU_URS_eternal_throne_desc:0 "The throne passes down forever. The final goal of the emperor's faction."
 TU_URS_imperial_blades:0 "Blades of the Throne"
 TU_URS_imperial_blades_desc:0 "Forge the Imperial Guard into the emperor's blade. The guard marshal joins."
 TU_URS_guard_elite_corps:0 "Elite Guard Corps"
 TU_URS_guard_elite_corps_desc:0 "Choose only the finest soldiers for an elite guard corps."
 TU_URS_guard_imperial_cavalry:0 "Imperial Cavalry"
 TU_URS_guard_imperial_cavalry_desc:0 "Expand the imperial horse to crush rebellions with rapid maneuvers."
 TU_URS_guard_bastion:0 "Guard Bastion"
 TU_URS_guard_bastion_desc:0 "Build fortifications around the palace as a guard stronghold."
 TU_URS_surveillance_bureau:0 "Imperial Surveillance Bureau"
 TU_URS_surveillance_bureau_desc:0 "A court bureau watches officials and nobles alike."
 TU_URS_censorship_regime:0 "Censorship Regime"
 TU_URS_censorship_regime_desc:0 "Censor newspapers and sermons to silence anything unfavourable to the crown."
 TU_URS_public_trials:0 "Public Trials"
 TU_URS_public_trials_desc:0 "Try traitors in the square and make an example of them."
 TU_URS_purge_dissent:0 "Hunt for Dissidents"
 TU_URS_purge_dissent_desc:0 "Find hidden dissidents. Stability suffers."
 TU_URS_grand_dukes_summons:0 "Summon the Grand Dukes"
 TU_URS_grand_dukes_summons_desc:0 "Call the provincial grand dukes to the capital."
 TU_URS_estate_seizure:0 "Confiscate Estates"
 TU_URS_estate_seizure_desc:0 "Seize the estates of disgraced grand dukes. Noble resentment grows."
 TU_URS_grand_duke_appease:0 "Appease the Grand Dukes"
 TU_URS_grand_duke_appease_desc:0 "Share titles and privileges to win over the grand dukes. The balance drifts slightly toward the nobles."
 TU_URS_ducal_courts:0 "Ducal Courts"
 TU_URS_ducal_courts_desc:0 "Imperial courts take over the grand dukes' lawsuits."
 TU_URS_local_customs:0 "Respect Local Custom"
 TU_URS_local_customs_desc:0 "Recognise local custom and delay codification. The old nobility trusts you more."
 TU_URS_direct_rule_lands:0 "Crown Lands"
 TU_URS_direct_rule_lands_desc:0 "Fold the grand duchies into crown lands."
 TU_URS_unification_vision:0 "Vision of Unification"
 TU_URS_unification_vision_desc:0 "Draw up a plan to bind the scattered lands of Ursus into one."
 TU_URS_kazdel_claims:0 "Claim Kazdel"
 TU_URS_kazdel_claims_desc:0 "Assert claims on Kazdel's former Ursine lands. Its states join the claim list."
 TU_URS_kazimir_war_plans:0 "Plan War on Kazimir"
 TU_URS_kazimir_war_plans_desc:0 "Build a casus belli against Kazimir. A war goal opens."
 TU_URS_kazimir_diplomacy:0 "Kazimir Trade Pact"
 TU_URS_kazimir_diplomacy_desc:0 "Bind Kazimir with a trade pact instead of war. The balance drifts toward the nobles."
 TU_URS_leithanien_claims:0 "Claim Leithanien"
 TU_URS_leithanien_claims_desc:0 "Revive old rights over Leithanien's border states."
 TU_URS_sami_claims:0 "Claim Sami"
 TU_URS_sami_claims_desc:0 "Press a claim to the northern Sami lands."
 TU_URS_yan_war_plans:0 "Plan War on Yan"
 TU_URS_yan_war_plans_desc:0 "Prepare the pretext for war against southern Yan."
 TU_URS_unification_complete:0 "Ursus Unification"
 TU_URS_unification_complete_desc:0 "The scattered Ursine lands are bound into one empire."
 TU_URS_capital_railway_plan:0 "Capital Railway Plan"
 TU_URS_capital_railway_plan_desc:0 "Plan a railway linking every province to the imperial capital."
 TU_URS_capital_railway_build:0 "Build the Capital Railway"
 TU_URS_capital_railway_build_desc:0 "Lay track to the capital and open a factory slot in a random state."
 TU_URS_rail_gauge:0 "Standard Gauge"
 TU_URS_rail_gauge_desc:0 "Standardise the rail gauge across the empire."
 TU_URS_rail_heavy_industry:0 "Rail Heavy Industry"
 TU_URS_rail_heavy_industry_desc:0 "Turn rail works into heavy industry and gain industrial know-how."
 TU_URS_imperial_express:0 "Imperial Express"
 TU_URS_imperial_express_desc:0 "Run a train reserved for the emperor and display the crown's majesty."
 TU_URS_capital_factory_belt:0 "Capital Industrial Belt"
 TU_URS_capital_factory_belt_desc:0 "Build an industrial belt along the railway. Factories appear in two random states."
 TU_URS_frozen_supply_line:0 "Frozen Supply Line"
 TU_URS_frozen_supply_line_desc:0 "Keep the front fed by opening supply lines across the frozen land."
 TU_URS_steel_network:0 "Steel Network"
 TU_URS_steel_network_desc:0 "Link steel mills by rail to speed up production."
 TU_URS_eastern_rail_link:0 "Eastern Rail Link"
 TU_URS_eastern_rail_link_desc:0 "Complete the railway between the eastern frontier and the capital."
 TU_URS_capital_terminal:0 "Capital Terminal"
 TU_URS_capital_terminal_desc:0 "The central station of the capital is finished and becomes the heart of the empire."
 TU_URS_military_junta:0 "Military Junta"
 TU_URS_military_junta_desc:0 "Hardline generals seize the real power of the empire. The balance tips toward centralisation."
 TU_URS_hardline_generals:0 "Hardline Generals"
 TU_URS_hardline_generals_desc:0 "After Chernobog, hardline generals take control of the council."
 TU_URS_chernobog_response:0 "Response to the Chernobog Incident"
 TU_URS_chernobog_response_desc:0 "Declare an emergency using the Chernobog incident. War support rises and stability falls."
 TU_URS_fascist_turn:0 "Turn to Fascism"
 TU_URS_fascist_turn_desc:0 "Remake the ruling party as fascist and suspend elections. Popular support swings to fascism."
 TU_URS_total_war_economy:0 "Total War Economy"
 TU_URS_total_war_economy_desc:0 "Cut civilian consumption and stake everything on war production."
 TU_URS_war_production:0 "War Production"
 TU_URS_war_production_desc:0 "Build an arms factory at once in a random state."
 TU_URS_purge_generals:0 "Purge the Generals"
 TU_URS_purge_generals_desc:0 "Remove generals who will not obey. Hardliners take the vacancies."
 TU_URS_total_mobilisation:0 "Total Mobilisation Decree"
 TU_URS_total_mobilisation_desc:0 "Bring the whole nation into the mobilisation system."
 TU_URS_iron_regime:0 "Iron Military Regime"
 TU_URS_iron_regime_desc:0 "Military rule becomes law and law becomes iron. The balance swings strongly toward centralisation."
 TU_URS_standing_junta:0 "Standing Junta"
 TU_URS_standing_junta_desc:0 "Make military rule a permanent body rather than a temporary one."
 TU_URS_militarise_state:0 "Militarise the State"
 TU_URS_militarise_state_desc:0 "Fold civilian factories into the war system."
 TU_URS_endless_junta:0 "Endless Junta"
 TU_URS_endless_junta_desc:0 "Military rule never ends. Even the throne leans on the army."
 TU_URS_junta_caretaker:0 "Keep the Junta"
 TU_URS_junta_caretaker_desc:0 "Keep military rule without changing ideology. Stability rises a little."
 TU_URS_frost_conscription:0 "Frost Conscription"
 TU_URS_frost_conscription_desc:0 "Send recruiters to the frozen villages to gather men."
 TU_URS_war_bonds:0 "War Bonds"
 TU_URS_war_bonds_desc:0 "Sell war bonds to the people to fill the treasury."
 TU_URS_arms_factories:0 "Expand Arms Factories"
 TU_URS_arms_factories_desc:0 "Build arms factories in two random states."
 TU_URS_rationing:0 "Rationing"
 TU_URS_rationing_desc:0 "Ration food and fuel. Public mood steadies but output falls."
 TU_URS_steel_quota:0 "Steel Quota"
 TU_URS_steel_quota_desc:0 "Give military production first claim on steel."
 TU_URS_mobile_divisions:0 "Mechanised Divisions"
 TU_URS_mobile_divisions_desc:0 "Form mechanised divisions and appoint a mobilisation marshal."
 TU_URS_armored_rail:0 "Armoured Trains"
 TU_URS_armored_rail_desc:0 "Run armoured trains to guard the rails."
 TU_URS_city_patrols:0 "City Patrols"
 TU_URS_city_patrols_desc:0 "Patrols walk the streets of the mobile cities. Order improves, freedom shrinks."
 TU_URS_siege_engines:0 "Siege Engines"
 TU_URS_siege_engines_desc:0 "Load siege engines onto the mobile cities to break walls."
 TU_URS_mobile_factory_city:0 "Mobile Factory City"
 TU_URS_mobile_factory_city_desc:0 "Build a factory inside a mobile city so it moves with the front."
 TU_URS_black_regiment:0 "Black Regiment"
 TU_URS_black_regiment_desc:0 "A regiment in black uniforms hunts down those who oppose the regime."
 TU_URS_border_purge:0 "Border Purge"
 TU_URS_border_purge_desc:0 "Weed out opposition in the border regions."
 TU_URS_lei_war_plans:0 "Plan Invasion of Leithanien"
 TU_URS_lei_war_plans_desc:0 "Build a casus belli against Leithanien. A war goal opens."
 TU_URS_lei_diplomacy:0 "Negotiate with Leithanien"
 TU_URS_lei_diplomacy_desc:0 "Win concessions from Leithanien through talks instead of war."
 TU_URS_kazdel_border_claims:0 "Kazdel Border Claims"
 TU_URS_kazdel_border_claims_desc:0 "Demand that the Kazdel border return to its old line."
 TU_URS_sami_war_plans:0 "Plan Invasion of Sami"
 TU_URS_sami_war_plans_desc:0 "Build a casus belli against the Sami in the north."
 TU_URS_loyalty_oath:0 "Loyalty Oath"
 TU_URS_loyalty_oath_desc:0 "Every officer swears loyalty to the throne and the junta."
 TU_URS_p1_absolute_crown:0 "Absolute Crown"
 TU_URS_p1_absolute_crown_desc:0 "All power gathers beneath the crown. Political power gain and stability rise."
 TU_URS_p1_unification_mandate:0 "Unification Mandate"
 TU_URS_p1_unification_mandate_desc:0 "An edict binding the Ursine lands into one. War support and attack rise."
 TU_URS_p1_grand_duke_fear:0 "Fear of the Grand Dukes"
 TU_URS_p1_grand_duke_fear_desc:0 "The grand dukes fear the emperor. Political power grows but regional stability falls."
 TU_URS_p1_surveillance_state:0 "Surveillance State"
 TU_URS_p1_surveillance_state_desc:0 "Eyes everywhere guard the empire. Stability rises and war support slips slightly."
 TU_URS_p1_imperial_blades:0 "Blades of the Throne"
 TU_URS_p1_imperial_blades_desc:0 "The guard is forged into the emperor's blade. Morale and organisation rise."
 TU_URS_p1_crown_lands:0 "Crown Lands"
 TU_URS_p1_crown_lands_desc:0 "Crown lands bring revenue and settlers. Building speed rises."
 TU_URS_p1_eternal_throne:0 "Eternal Throne"
 TU_URS_p1_eternal_throne_desc:0 "The throne passes on forever. Political power gain rises and stability slowly recovers."
 TU_URS_p1_capital_rail:0 "Capital Rail Network"
 TU_URS_p1_capital_rail_desc:0 "Railways to the capital shorten supply lines. Supply use falls and industry speeds up."
 TU_URS_p2_total_war_economy:0 "Total War Economy"
 TU_URS_p2_total_war_economy_desc:0 "Consumer goods shrink and factory output rises."
 TU_URS_p2_iron_regime:0 "Iron Regime"
 TU_URS_p2_iron_regime_desc:0 "The military regime hardens like iron. Attack rises but stability falls."
 TU_URS_p2_black_regiment:0 "Shadow of the Black Regiment"
 TU_URS_p2_black_regiment_desc:0 "The black regiment watches the cities. Defence rises but stability falls."
 TU_URS_p1_war_office_tech:0 "War Office Advisers"
 TU_URS_p1_academy_tech:0 "Imperial Academy Research"
 TU_URS_p1_guard_tech:0 "Guard Infantry Research"
 TU_URS_p1_royal_tech:0 "Royal Mechanisation Research"
 TU_URS_p1_rail_tech:0 "Rail Heavy Industry Know-how"
 TU_URS_p1_steel_tech:0 "Steel Network Know-how"
 TU_URS_p2_siege_tech:0 "Siege Engineering"
 TU_URS_p2_armor_tech:0 "Armour Breakthrough Tactics"
 TU_URS_p2_quota_tech:0 "Military Steel Practice"
 TU_URS_p2_barrage_tech:0 "Barrage Techniques"
 TU_URS_p2_corps_tech:0 "Armoured Corps Methods"
 TU_URS_p2_armored_rail_tech:0 "Armoured Rail Engineering"
 TU_URS_p1_guard_marshal:0 "Guard Marshal Vladislav"
 TU_URS_p2_hardline_general:0 "Hardline General Dmitri"
 TU_URS_p2_mobilisation_marshal:0 "Mobilisation Marshal Yaroslav"
