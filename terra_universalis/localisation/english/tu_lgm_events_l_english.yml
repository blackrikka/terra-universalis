l_english:
 tu_lgm_ev.1.t:0 "Autonomy Talks"
 tu_lgm_ev.1.d:0 "The Lungmen self-government and a Yan court delegation have sat down to settle the scope of autonomy. The sticking points are taxes, public order and control of the harbours. Wei Yenwu must decide whether to close the deal or press for more authority."
 tu_lgm_ev.1.a:0 "Accept Yan's terms and conclude the talks"
 tu_lgm_ev.1.b:0 "Demand full autonomy and press the talks"
 tu_lgm_ev.2.t:0 "A Voice for a Free City"
 tu_lgm_ev.2.d:0 "Calls for independence beyond autonomy now fill the streets of Lungmen. The Guard hesitates in the name of order, while the merchant guilds believe independence will revive trade. Once this step is taken, there is no easy way back."
 tu_lgm_ev.2.a:0 "Continue preparing for independence"
 tu_lgm_ev.2.b:0 "Stay autonomous for now and build strength"
 tu_lgm_ev.3.t:0 "The Night of the Guard"
 tu_lgm_ev.3.d:0 "Chen has led the Guard in surrounding the government house. The leadership has changed, and the Guard is now the real master of the city. Merchants are uneasy, torn between those who want order and those who want power shared."
 tu_lgm_ev.3.a:0 "Recognise Chen's order and back the Guard"
 tu_lgm_ev.3.b:0 "Share power with Swire"
 tu_lgm_ev.4.t:0 "Expanding the Guard"
 tu_lgm_ev.4.d:0 "The Guard will expand its forces into districts beyond the city. Young men from the slums have lined up outside the recruiting offices. Reports warn, however, that the new recruits lack training."
 tu_lgm_ev.4.a:0 "Open the recruiting offices and expand quickly"
 tu_lgm_ev.4.b:0 "Finish training first, then grow the force"
 tu_lgm_ev.5.t:0 "First Clash at the Border"
 tu_lgm_ev.5.d:0 "Reports of the first clash on the Reunion border have reached the capital. Infected bands drifting from Chernobog are battering the border posts. The commanders must decide whether to hold the line or pull the troops back."
 tu_lgm_ev.5.a:0 "Hold the line and wait for the enemy's next move"
 tu_lgm_ev.5.b:0 "Pull the troops back and guard the city"
 tu_lgm_ev.6.t:0 "The Survival Pact"
 tu_lgm_ev.6.d:0 "Lungmen has held its capital. The self-government must now bind citizens and the army to one purpose. How the city deals with the weariness of war will shape the years to come."
 tu_lgm_ev.6.a:0 "Sign a pact that binds citizens and the army together"
 tu_lgm_ev.6.b:0 "Keep an emergency order centred on the army"
 tu_lgm_ev.7.t:0 "Lungmen Declares a Free City"
 tu_lgm_ev.7.d:0 "The Lungmen self-government has declared a free city. Yan has branded the move a rebellion, and the neighbouring powers are watching with their scales in hand. The trade routes begin to shift with this declaration."
 tu_lgm_ev.7.a:0 "Read the report"
 tu_lgm_ev.8.t:0 "Border Truce Between Lungmen and Reunion"
 tu_lgm_ev.8.d:0 "Lungmen and Reunion have agreed to a border truce. Yet the shadow of Chernobog still hangs over the frontier. Whether the truce leads to peace is not yet known."
 tu_lgm_ev.8.a:0 "Read the report"
 tu_lgm_ev.20.t:0 "Rumours From Beyond the Border"
 tu_lgm_ev.20.d:0 "Merchants whisper that strange news is coming from the direction of Chernobog. A scout claims to have seen movements that no one has confirmed. The city must decide whether to gather intelligence or let the rumours pass."
 tu_lgm_ev.20.a:0 "Gather intelligence and receive reports"
 tu_lgm_ev.20.b:0 "Ignore the rumours and keep daily life going"
 tu_lgm_ev.21.t:0 "Tension at the Front"
 tu_lgm_ev.21.d:0 "The garrisons at the border posts rotate their troops through the night. Officers ask for reinforcements while the treasury worries about the budget. The government must decide whether to send more troops now or keep them in reserve."
 tu_lgm_ev.21.a:0 "Send more troops to the front"
 tu_lgm_ev.21.b:0 "Keep the troops in reserve and use them only for defence"
 tu_lgm_ev.22.t:0 "The First Year of Rebuilding"
 tu_lgm_ev.22.d:0 "Having held its capital, Lungmen must now rebuild its wrecked harbour and housing districts. The government must decide whether to fund the rebuilding or leave it to the market. Whichever path is chosen, the city will remember it."
 tu_lgm_ev.22.a:0 "Fund the rebuilding and let the state lead"
 tu_lgm_ev.22.b:0 "Leave it to the market and only collect taxes"
 tu_lgm_ev.31.t:0 "Pursuit Across the Border"
 tu_lgm_ev.31.d:0 "After the defence line held, the infected bands crossed the border again. The commanders must now decide whether to send a pursuit force or stop here. The longer the chase goes on, the more Lungmen's troops will tire."
 tu_lgm_ev.31.a:0 "Send a pursuit force to drive the enemy beyond the border"
 tu_lgm_ev.31.b:0 "Stop here and close the border tight"
