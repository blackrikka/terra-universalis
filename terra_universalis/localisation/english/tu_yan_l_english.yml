l_english:
 TU_YAN_focus:0 "Yan Focus Tree"
 TU_YAN_emperor:0 "Emperor of Yan"
 TU_YAN_chongyue:0 "Chongyue"
 TU_YAN_chongyue_desc:0 "The eldest of the Sui brothers. He leads the army in the field."
 TU_YAN_nian:0 "Nian"
 TU_YAN_nian_desc:0 "The brother who keeps the forge. An industry-minded advisor."
 TU_YAN_dusk:0 "Dusk"
 TU_YAN_dusk_desc:0 "The brother who moves the people with painting and words. A propaganda advisor."
 TU_YAN_ling:0 "Ling"
 TU_YAN_ling_desc:0 "The brother who gathers war support over wine. A stability advisor."
 TU_YAN_sleeping_giant:0 "Sleeping Giant"
 TU_YAN_sleeping_giant_desc:0 "Like a sleeping giant, industry moves slowly. Industrial output falls and conscription rises a little."
 TU_YAN_imperial_bureaucracy:0 "Imperial Bureaucracy"
 TU_YAN_imperial_bureaucracy_desc:0 "The court bureaucracy raises political power gain and holds up stability."
 TU_YAN_sui_legacy:0 "Legacy of Sui"
 TU_YAN_sui_legacy_desc:0 "Knowledge left by the fragments of Sui speeds research a little."
 TU_YAN_lungmen_levy:0 "Lungmen Trade Levy"
 TU_YAN_lungmen_levy_desc:0 "The tax on Lungmen trade reduces consumer goods demand."
 TU_YAN_court_category:0 "Court"
 TU_YAN_lungmen_trade_levy:0 "Levy Lungmen Trade"
 TU_YAN_lungmen_trade_levy_desc:0 "Tax the trade of Lungmen. Costs 50 political power, consumer goods reduction for 180 days."
 TU_YAN_imperial_reform:0 "Court Reform"
 TU_YAN_imperial_reform_desc:0 "Repair the old order of the court and set the direction of the nation."
 TU_YAN_rail_network:0 "Rail Network"
 TU_YAN_rail_network_desc:0 "Lay new rails and infrastructure in the capital."
 TU_YAN_bureaucratic_modernization:0 "Bureaucratic Modernization"
 TU_YAN_bureaucratic_modernization_desc:0 "Modernise the bureaucracy to raise political power and stability."
 TU_YAN_civil_inspection:0 "Civil Inspection"
 TU_YAN_civil_inspection_desc:0 "Inspect provincial officials and restore discipline."
 TU_YAN_industrial_awakening:0 "Industrial Awakening"
 TU_YAN_industrial_awakening_desc:0 "The sleeping giant wakes. The Sleeping Giant idea is removed and an industrial complex is built."
 TU_YAN_lungmen_policy:0 "Lungmen Policy"
 TU_YAN_lungmen_policy_desc:0 "Decide how to handle Lungmen. Choose between guaranteeing autonomy and direct annexation."
 TU_YAN_lungmen_autonomy:0 "Guarantee Lungmen Autonomy"
 TU_YAN_lungmen_autonomy_desc:0 "Guarantee the autonomy of Lungmen to improve relations and help its factories. Mutually exclusive with annexation."
 TU_YAN_lungmen_annex:0 "Annex Lungmen"
 TU_YAN_lungmen_annex_desc:0 "Annex Lungmen as direct Yan territory. Mutually exclusive with guaranteeing autonomy."
 TU_YAN_lungmen_trade_pact:0 "Lungmen Trade Pact"
 TU_YAN_lungmen_trade_pact_desc:0 "Sign a trade pact with Lungmen to gain political power."
 TU_YAN_lungmen_factories:0 "Absorbed Factories"
 TU_YAN_lungmen_factories_desc:0 "After annexing Lungmen, build one more industrial complex."
 TU_YAN_infantry:0 "Yan Infantry Division"
