l_english:
 TU_URS_w1_border_readiness:0 "Border Readiness"
 TU_URS_w1_border_readiness_desc:0 "Border forts and troops are ready to move at a moment's notice."
 TU_URS_w1_mercenary_levy:0 "Mercenary Levy"
 TU_URS_w1_mercenary_levy_desc:0 "Mercenaries from Kazdel are slowly growing used to Ursine discipline."
 TU_URS_w1_war_footing:0 "War Footing"
 TU_URS_w1_war_footing_desc:0 "Factories and units move quickly under a war footing."
 TU_URS_w1_occupation_strain:0 "Occupation Strain"
 TU_URS_w1_occupation_strain_desc:0 "Both the occupied population and our soldiers feel the weight of occupation."
 TU_URS_w1_cultural_absorption:0 "Cultural Absorption"
 TU_URS_w1_cultural_absorption_desc:0 "The traditions and language of integrated states slowly blend into Ursine life."
 TU_URS_w2_sleeping_giant:0 "The Sleeping Giant Stirs"
 TU_URS_w2_sleeping_giant_desc:0 "The vast population of the continent wakes and begins to appear in conscription rolls."
 TU_URS_w2_merchant_fleet:0 "Merchant Fleet"
 TU_URS_w2_merchant_fleet_desc:0 "Lungmen's merchant ships fly the Ursine flag as they come and go from port."
 TU_URS_w2_naval_blockade:0 "Naval Blockade"
 TU_URS_w2_naval_blockade_desc:0 "Higashi's harbours are shut tight and trade has fallen sharply."
 TU_URS_w2_reunion_front:0 "Reunion Front"
 TU_URS_w2_reunion_front_desc:0 "Morale rises among soldiers in the zone of dispute with Reunion."
 TU_URS_w2_occupation_strain:0 "Southern Occupation Strain"
 TU_URS_w2_occupation_strain_desc:0 "Keeping order in the southern occupied lands wears down both troops and public morale."

 TU_URS_w1_kzd_envoy:0 "Kazdel Envoy"
 TU_URS_w1_kzd_envoy_desc:0 "Send an envoy to the mercenary cities of Kazdel. They trust contracts, but they want to see faces first."
 TU_URS_w1_kzd_trade_talks:0 "Mercenary Trade Pact"
 TU_URS_w1_kzd_trade_talks_desc:0 "Turn mercenary contracts into a trade agreement. The merchants of Theresis count quickly and keep their word."
 TU_URS_w1_kzd_border_claims:0 "Border Villages Claim"
 TU_URS_w1_kzd_border_claims_desc:0 "Officially claim the border villages held by Kazdel as former Ursine land."
 TU_URS_w1_kzd_cultural_exchange:0 "Mercenary Cultural Exchange"
 TU_URS_w1_kzd_cultural_exchange_desc:0 "Publish a booklet with Kazdel's battle songs and Ursine poetry side by side."
 TU_URS_w1_kzd_border_buildup:0 "Border Troop Concentration"
 TU_URS_w1_kzd_border_buildup_desc:0 "Gather troops at the border forts. To Kazdel, this looks like a warning."
 TU_URS_w1_kzd_mobilization:0 "Reserve Corps Mobilisation"
 TU_URS_w1_kzd_mobilization_desc:0 "Wake the reserve forces and reorganise the officer corps."
 TU_URS_w1_kzd_non_aggression:0 "Kazdel Non-Aggression Pact"
 TU_URS_w1_kzd_non_aggression_desc:0 "Sign a treaty to halt border clashes. Once signed, war plans go into the drawer."
 TU_URS_w1_kzd_border_ultimatum:0 "Border Ultimatum"
 TU_URS_w1_kzd_border_ultimatum_desc:0 "Send an ultimatum demanding the villages and passage rights. If refused, Kazdel pays the price."
 TU_URS_w1_kzd_war_doctrine:0 "Anti-Mercenary Doctrine"
 TU_URS_w1_kzd_war_doctrine_desc:0 "Study tactics against mercenary units. Soldiers whose contracts have ended scatter easily."
 TU_URS_w1_kzd_guarantee:0 "Kazdel Security Guarantee"
 TU_URS_w1_kzd_guarantee_desc:0 "Guarantee Kazdel's independence. A guarantee can be a weapon, or a chain."
 TU_URS_w1_kzd_imperial_levy:0 "Imperial Mercenary Levy"
 TU_URS_w1_kzd_imperial_levy_desc:0 "By imperial decree, fold Kazdel's mercenaries into the Ursine army."
 TU_URS_w1_kzd_war_declaration:0 "Declaration on Kazdel"
 TU_URS_w1_kzd_war_declaration_desc:0 "Declare total war on Theresis. The contracts are torn, and the war begins."
 TU_URS_w1_kzd_occupation:0 "Occupation of Theresis"
 TU_URS_w1_kzd_occupation_desc:0 "Establish order in the occupied land. Mercenary remnants hide, but the gates are already ours."
 TU_URS_w1_kzd_core_integration:0 "Kazdel Core Integration"
 TU_URS_w1_kzd_core_integration_desc:0 "Incorporate Kazdel's core states into the Ursine core territory."
 TU_URS_w1_kzd_long_term:0 "Mercenary Companies Reformed"
 TU_URS_w1_kzd_long_term_desc:0 "Build factories and infrastructure in the integrated states. Mercenary gold is now recorded in our ledgers."

 TU_URS_w1_vic_envoy:0 "Londinium Envoy"
 TU_URS_w1_vic_envoy_desc:0 "Send an envoy to Victoria, where the throne stands empty. First find which regent holds real power."
 TU_URS_w1_vic_trade_talks:0 "Harbour Trade Accord"
 TU_URS_w1_vic_trade_talks_desc:0 "Agree on port fees with the regents. Any seal stamped on paper has force."
 TU_URS_w1_vic_border_claims:0 "Claims on the Vacant Throne"
 TU_URS_w1_vic_border_claims_desc:0 "Claim the border lands of Victoria, now without a king, as Ursine."
 TU_URS_w1_vic_cultural_exchange:0 "Londinium Scholarly Exchange"
 TU_URS_w1_vic_cultural_exchange_desc:0 "Exchange records from the parliamentary library to learn each other's law and history."
 TU_URS_w1_vic_border_buildup:0 "Border Fortress Reinforcement"
 TU_URS_w1_vic_border_buildup_desc:0 "Reinforce the forts along the Victorian border and lay supply roads to the front."
 TU_URS_w1_vic_mobilization:0 "Gap in the Throne Mobilisation"
 TU_URS_w1_vic_mobilization_desc:0 "Form mobile units to exploit the gap left by the empty throne."
 TU_URS_w1_vic_non_aggression:0 "Victorian Non-Aggression Pact"
 TU_URS_w1_vic_non_aggression_desc:0 "Conclude a non-aggression pact with the regency council. One sheet of paper quiets the border for a time."
 TU_URS_w1_vic_border_ultimatum:0 "Ultimatum to the Regency"
 TU_URS_w1_vic_border_ultimatum_desc:0 "Send an ultimatum demanding border villages and harbour passage."
 TU_URS_w1_vic_war_doctrine:0 "Supply-First Doctrine"
 TU_URS_w1_vic_war_doctrine_desc:0 "Adopt a doctrine that secures supply lines before advancing."
 TU_URS_w1_vic_guarantee:0 "Victorian Independence Guarantee"
 TU_URS_w1_vic_guarantee_desc:0 "Guarantee Victoria's independence to keep other great powers' hands off."
 TU_URS_w1_vic_junta_intervention:0 "Military Government Intervention"
 TU_URS_w1_vic_junta_intervention_desc:0 "On the junta's orders, intervene in Victoria's internal affairs. Order comes quickly, legitimacy slowly."
 TU_URS_w1_vic_war_declaration:0 "Declaration on Victoria"
 TU_URS_w1_vic_war_declaration_desc:0 "Declare war on Londinium. The empty throne is ours now."
 TU_URS_w1_vic_occupation:0 "Occupation of Londinium"
 TU_URS_w1_vic_occupation_desc:0 "Seize the harbour and parliament, and restore public order."
 TU_URS_w1_vic_core_integration:0 "Victorian Core Integration"
 TU_URS_w1_vic_core_integration_desc:0 "Incorporate Victoria's core states into the Ursine core territory."
 TU_URS_w1_vic_long_term:0 "Harbour Industrial District"
 TU_URS_w1_vic_long_term_desc:0 "Build factories and infrastructure in the integrated harbour states."

 TU_URS_w1_lei_envoy:0 "Twin Empresses Envoy"
 TU_URS_w1_lei_envoy_desc:0 "First decide which empress to greet first. Send an Arts scholar along."
 TU_URS_w1_lei_trade_talks:0 "Arts Research Trade"
 TU_URS_w1_lei_trade_talks_desc:0 "Lower tariffs in exchange for Arts research materials."
 TU_URS_w1_lei_border_claims:0 "Former Estates of the Empresses"
 TU_URS_w1_lei_border_claims_desc:0 "Claim the border estates once ruled by the empresses' ancestors as Ursine land."
 TU_URS_w1_lei_cultural_exchange:0 "Court Exchange of the Empresses"
 TU_URS_w1_lei_cultural_exchange_desc:0 "Swap court dance troupes and orchestras to soften noble feelings on both sides."
 TU_URS_w1_lei_border_buildup:0 "Arts Barrier Reinforcement"
 TU_URS_w1_lei_border_buildup_desc:0 "Raise Arts-enhanced barriers along the border."
 TU_URS_w1_lei_mobilization:0 "Empresses' Guard Mobilisation"
 TU_URS_w1_lei_mobilization_desc:0 "Send the empresses' household guard to the front."
 TU_URS_w1_lei_non_aggression:0 "Non-Aggression with the Twin Empresses"
 TU_URS_w1_lei_non_aggression_desc:0 "Promise, together with both empresses, to respect the border."
 TU_URS_w1_lei_border_ultimatum:0 "Ultimatum to the Empresses"
 TU_URS_w1_lei_border_ultimatum_desc:0 "Send an ultimatum demanding the return of the border estates."
 TU_URS_w1_lei_war_doctrine:0 "Arts Artillery Doctrine"
 TU_URS_w1_lei_war_doctrine_desc:0 "Codify how Arts artillery units are employed."
 TU_URS_w1_lei_guarantee:0 "Leithanien Security Guarantee"
 TU_URS_w1_lei_guarantee_desc:0 "Guarantee Leithanien's borders to earn the empresses' trust."
 TU_URS_w1_lei_reform_mediation:0 "Reform Faction Mediation"
 TU_URS_w1_lei_reform_mediation_desc:0 "Accept the reform faction's compromise and carry it to Leithanien's assembly."
 TU_URS_w1_lei_war_declaration:0 "Declaration on Leithanien"
 TU_URS_w1_lei_war_declaration_desc:0 "Declare war on the palaces of the twin empresses."
 TU_URS_w1_lei_occupation:0 "Occupation of the Imperial Palaces"
 TU_URS_w1_lei_occupation_desc:0 "Occupy the palaces and take over the Arts institutes."
 TU_URS_w1_lei_core_integration:0 "Leithanien Core Integration"
 TU_URS_w1_lei_core_integration_desc:0 "Incorporate Leithanien's core states into the Ursine core territory."
 TU_URS_w1_lei_long_term:0 "Arts Industrial Complex"
 TU_URS_w1_lei_long_term_desc:0 "Build factories and infrastructure in the integrated states."

 TU_URS_w2_yan_envoy:0 "Yan Envoy"
 TU_URS_w2_yan_envoy_desc:0 "Send an envoy to the sleeping giant of Yan. First find which of the Sui siblings speaks for the land."
 TU_URS_w2_yan_trade_talks:0 "Silk Road Passage Accord"
 TU_URS_w2_yan_trade_talks_desc:0 "Settle the tolls on the old silk road."
 TU_URS_w2_yan_border_claims:0 "Borders of the Sleeping Land"
 TU_URS_w2_yan_border_claims_desc:0 "Restore the blurred border to the Ursine records while Yan sleeps."
 TU_URS_w2_yan_border_buildup:0 "Border Garrison Reinforcement"
 TU_URS_w2_yan_border_buildup_desc:0 "Expand the border garrisons and raise watchtowers."
 TU_URS_w2_yan_mobilization:0 "War Mobilisation Preparations"
 TU_URS_w2_yan_mobilization_desc:0 "Summon reserves and begin stockpiling ammunition."
 TU_URS_w2_yan_non_aggression:0 "Yan Non-Aggression Pact"
 TU_URS_w2_yan_non_aggression_desc:0 "Sign a border non-aggression pact with the Yan court."
 TU_URS_w2_yan_border_ultimatum:0 "Yan Ultimatum"
 TU_URS_w2_yan_border_ultimatum_desc:0 "Demand the return of the lost border line. If refused, Yan bears the consequences."
 TU_URS_w2_yan_war_doctrine:0 "Continental War Doctrine"
 TU_URS_w2_yan_war_doctrine_desc:0 "Adopt a doctrine for commanding large armies across open plains."
 TU_URS_w2_yan_military_access:0 "Yan Passage Agreement"
 TU_URS_w2_yan_military_access_desc:0 "Secure military passage through Yan's territory."
 TU_URS_w2_yan_awakening:0 "Awakening of the Sleeping Giant"
 TU_URS_w2_yan_awakening_desc:0 "By imperial command, wake the continent's sleeping giant. Conscription grows easy, and unrest grows with it."
 TU_URS_w2_yan_guarantee:0 "Yan Security Guarantee"
 TU_URS_w2_yan_guarantee_desc:0 "Guarantee Yan's independence and set it as one pillar of the continental order."
 TU_URS_w2_yan_war_declaration:0 "Declaration on Yan"
 TU_URS_w2_yan_war_declaration_desc:0 "Declare the war that wakes the sleeping giant."
 TU_URS_w2_yan_occupation:0 "Occupation of the Yan Heartland"
 TU_URS_w2_yan_occupation_desc:0 "Occupy Yan's central cities and drive out the resistance."
 TU_URS_w2_yan_core_integration:0 "Yan Core Integration"
 TU_URS_w2_yan_core_integration_desc:0 "Incorporate Yan's core states into the Ursine core territory."
 TU_URS_w2_yan_long_term:0 "Continental Railway Network"
 TU_URS_w2_yan_long_term_desc:0 "Build factories and infrastructure in the integrated states. Rails now run across the land that once slept."

 TU_URS_w2_lgm_envoy:0 "Lungmen Trade Envoy"
 TU_URS_w2_lgm_envoy_desc:0 "Send an envoy to the merchant guilds of trade city Lungmen. The Reunion dispute makes an easy opening."
 TU_URS_w2_lgm_trade_talks:0 "Lungmen Free Trade Zone"
 TU_URS_w2_lgm_trade_talks_desc:0 "Agree to a duty-free zone in the Lungmen harbour."
 TU_URS_w2_lgm_border_claims:0 "Old Boundary of the Outskirts"
 TU_URS_w2_lgm_border_claims_desc:0 "Claim the outer suburban states as lying within Ursus's old boundary."
 TU_URS_w2_lgm_reunion_pressure:0 "Pressure on the Reunion Front"
 TU_URS_w2_lgm_reunion_pressure_desc:0 "Use the Reunion dispute to station troops around Lungmen's borders."
 TU_URS_w2_lgm_mobilization:0 "Dispute Zone Mobilisation"
 TU_URS_w2_lgm_mobilization_desc:0 "Call up reserve units in preparation for the Reunion dispute."
 TU_URS_w2_lgm_non_aggression:0 "Lungmen Non-Aggression Pact"
 TU_URS_w2_lgm_non_aggression_desc:0 "Promise the guilds of Lungmen a border non-aggression pact."
 TU_URS_w2_lgm_border_ultimatum:0 "Ultimatum to the Guilds"
 TU_URS_w2_lgm_border_ultimatum_desc:0 "Demand the return of the outer states and the abolition of transit tolls."
 TU_URS_w2_lgm_war_doctrine:0 "Long Supply Line Doctrine"
 TU_URS_w2_lgm_war_doctrine_desc:0 "Adopt a doctrine for holding a front along long supply lines."
 TU_URS_w2_lgm_noble_gate:0 "Persuading the Merchant-Noble Coalition"
 TU_URS_w2_lgm_noble_gate_desc:0 "With the old nobility's support, persuade Lungmen's merchant coalition. Their workshops join our side."
 TU_URS_w2_lgm_guarantee:0 "Lungmen Trade Route Guarantee"
 TU_URS_w2_lgm_guarantee_desc:0 "Guarantee the safety of the Lungmen trade routes to win the merchants' trust."
 TU_URS_w2_lgm_war_declaration:0 "Declaration on Lungmen"
 TU_URS_w2_lgm_war_declaration_desc:0 "Declare war on the trade city. We will open its harbour gates ourselves."
 TU_URS_w2_lgm_core_integration:0 "Lungmen Core Integration"
 TU_URS_w2_lgm_core_integration_desc:0 "Incorporate Lungmen's core states into the Ursine core territory."
 TU_URS_w2_lgm_long_term:0 "Harbour Factory Zone"
 TU_URS_w2_lgm_long_term_desc:0 "Build factories and infrastructure in the integrated harbour states."

 TU_URS_w2_hig_envoy:0 "Higashi Envoy"
 TU_URS_w2_hig_envoy_desc:0 "Send an envoy to the isolated island nation of Higashi. Opening a few harbours is enough to start talking."
 TU_URS_w2_hig_trade_talks:0 "Maritime Trade Accord"
 TU_URS_w2_hig_trade_talks_desc:0 "Agree on sea lanes for Higashi's fishing and merchant ships."
 TU_URS_w2_hig_border_claims:0 "Claims over Surrounding Waters"
 TU_URS_w2_hig_border_claims_desc:0 "Claim the islands offshore of Higashi as Ursine waters."
 TU_URS_w2_hig_naval_buildup:0 "Strait Fleet Build-up"
 TU_URS_w2_hig_naval_buildup_desc:0 "Add patrol boats at the strait entrance to watch Higashi's sea lanes."
 TU_URS_w2_hig_mobilization:0 "Landing Force Formation"
 TU_URS_w2_hig_mobilization_desc:0 "Reorganise coastal defence units into landing forces."
 TU_URS_w2_hig_non_aggression:0 "Higashi Non-Aggression Pact"
 TU_URS_w2_hig_non_aggression_desc:0 "Conclude a maritime non-aggression pact with Higashi."
 TU_URS_w2_hig_ultimatum:0 "Ultimatum to Higashi's Navy"
 TU_URS_w2_hig_ultimatum_desc:0 "Demand passage and fishing rights in the waters around the islands."
 TU_URS_w2_hig_war_doctrine:0 "Naval Landing Doctrine"
 TU_URS_w2_hig_war_doctrine_desc:0 "Adopt a doctrine for landing troops on the coast under fleet cover."
 TU_URS_w2_hig_junta_landing:0 "Naval Blockade by the Junta"
 TU_URS_w2_hig_junta_landing_desc:0 "On the junta's orders, blockade Higashi's harbours. The blockade is quick, but public anger cools slowly."
 TU_URS_w2_hig_guarantee:0 "Higashi Security Guarantee"
 TU_URS_w2_hig_guarantee_desc:0 "Guarantee Higashi's independence and end its isolation."
 TU_URS_w2_hig_war_declaration:0 "Declaration on Higashi"
 TU_URS_w2_hig_war_declaration_desc:0 "Declare war on the island nation. A war across the sea begins."
 TU_URS_w2_hig_core_integration:0 "Higashi Core Integration"
 TU_URS_w2_hig_core_integration_desc:0 "Incorporate Higashi's core islands into the Ursine core territory."
 TU_URS_w2_hig_long_term:0 "Maritime Shipyard Complex"
 TU_URS_w2_hig_long_term_desc:0 "Build shipyards and factories on the integrated islands."
