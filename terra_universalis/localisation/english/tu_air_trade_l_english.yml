 TU_air_trade_category:0 "Air Imports"
 TU_air_trade_category_desc:0 "We cannot cross the sea, so we fly it in. Commit §Y10§! transport airships and one civilian factory for 180 days to bring §G+8§! of a resource to the capital. 8 airships return when the contract ends."
