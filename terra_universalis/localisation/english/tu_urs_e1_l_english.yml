l_english:
 TU_URS_rail_standard:0 "Standard Gauge"
 TU_URS_rail_standard_desc:0 "Unify the gauge of the old railways so trains run faster. Political power rises."
 TU_URS_originium_survey:0 "Originium Survey"
 TU_URS_originium_survey_desc:0 "Find originium veins in the frozen mountains."
 TU_URS_rail_bridges:0 "Rebuild the Bridges"
 TU_URS_rail_bridges_desc:0 "Repair the broken rail bridges and reconnect the cities. Infrastructure is built in one town state."
 TU_URS_frozen_road:0 "Frozen Road"
 TU_URS_frozen_road_desc:0 "Lay roads over the ice to keep the northern supply lines open. Manpower rises."
 TU_URS_originium_mines:0 "Originium Mines"
 TU_URS_originium_mines_desc:0 "Dig the veins and start mining. Gains tungsten in one rural state and an industrial complex is built there."
 TU_URS_northern_survey:0 "Northern Survey"
 TU_URS_northern_survey_desc:0 "Survey the northern strata for steel deposits. Gains steel in one rural state."
 TU_URS_state_planning:0 "State Planning"
 TU_URS_state_planning_desc:0 "The state plans production. Cannot be taken with market opening."
 TU_URS_market_reform:0 "Market Opening"
 TU_URS_market_reform_desc:0 "Open the markets to grow private production. Cannot be taken with state planning."
 TU_URS_mobile_plan:0 "Mobile City Design"
 TU_URS_mobile_plan_desc:0 "Draw the plans for a city that moves on rails. Political power rises."
 TU_URS_northern_frontier:0 "Northern Frontier"
 TU_URS_northern_frontier_desc:0 "Found frontier settlements in the north to draw in people. Manpower rises."
 TU_URS_frost_supply:0 "Frost Supply Depot"
 TU_URS_frost_supply_desc:0 "Build supply depots on frozen ground. Supply consumption falls."
 TU_URS_consumer_goods:0 "Consumer Goods Output"
 TU_URS_consumer_goods_desc:0 "Expand consumer goods factories to calm the people. Stability rises and consumer goods demand falls. Cannot be taken with the war economy."
 TU_URS_mobile_city:0 "Build the Mobile City"
 TU_URS_mobile_city_desc:0 "Build a mobile city on rails. One city state gains shared building slots and infrastructure."
 TU_URS_war_economy:0 "War Economy"
 TU_URS_war_economy_desc:0 "Turn all production to war. War support rises. Cannot be taken with consumer goods output."
 TU_URS_originium_refine:0 "Originium Refining"
 TU_URS_originium_refine_desc:0 "Refine the mined ore into material for research."
 TU_URS_mobile_civil:0 "Civilian Districts"
 TU_URS_mobile_civil_desc:0 "Expand the civilian districts in the mobile city. Stability rises. Cannot be taken with the mobile fortress."
 TU_URS_mobile_fort:0 "Mobile Fortress"
 TU_URS_mobile_fort_desc:0 "Turn the mobile city into a fortress. Army experience rises. Cannot be taken with civilian districts."
 TU_URS_northern_settlers:0 "Settler Migration"
 TU_URS_northern_settlers_desc:0 "Send settlers north. One frontier state gains shared building slots. Cannot be taken with the northern garrison."
 TU_URS_northern_garrison:0 "Northern Garrison"
 TU_URS_northern_garrison_desc:0 "Build a defence line on the northern border. Army experience and manpower rise. Cannot be taken with settler migration."
 TU_URS_originium_export:0 "Originium Export Pact"
 TU_URS_originium_export_desc:0 "Sell refined originium abroad. Political power rises sharply."
 TU_URS_mobile_housing:0 "Housing Expansion"
 TU_URS_mobile_housing_desc:0 "Expand housing in the mobile city. One city state gains shared building slots."
 TU_URS_mobile_arsenal:0 "Mobile Arsenal"
 TU_URS_mobile_arsenal_desc:0 "Build an arms factory on the mobile city. An arms factory is completed in one small town state."
 TU_URS_permafrost_mines:0 "Permafrost Mines"
 TU_URS_permafrost_mines_desc:0 "Drill into the permafrost and open mines. Gains tungsten in one rural state and manpower rises."
 TU_URS_frost_road2:0 "Northern Railway"
 TU_URS_frost_road2_desc:0 "Lay rail across the frozen land. Political power rises."
 TU_URS_originium_plant:0 "Originium Refinery"
 TU_URS_originium_plant_desc:0 "Expand the originium refinery. An industrial complex is built in one rural state and political power rises."
 TU_URS_mobile_market:0 "Mobile Market"
 TU_URS_mobile_market_desc:0 "Open a market on the mobile city. Stability and political power rise."
 TU_URS_mobile_siege_rail:0 "Siege Rail Battery"
 TU_URS_mobile_siege_rail_desc:0 "Attach a siege rail battery to the mobile city. Gains a construction technology bonus and army experience rises."
 TU_URS_permafrost_rail:0 "Permafrost Rail Net"
 TU_URS_permafrost_rail_desc:0 "Connect a rail network across the permafrost. Manpower rises and stability rises slightly."
 TU_URS_originium_grid:0 "Originium Power Grid"
 TU_URS_originium_grid_desc:0 "Link the mines and the refinery with a power grid. Political power rises."
 TU_URS_mobile_network:0 "Mobile City Network"
 TU_URS_mobile_network_desc:0 "Link the mobile market and the siege rail. Political power rises sharply and infrastructure is built in one city state."
 TU_URS_originium_stockpile:0 "Originium Stockpile"
 TU_URS_originium_stockpile_desc:0 "Stockpile the mined ore. One rural state gains more tungsten."
 TU_URS_mobile_terminal:0 "Mobile City Terminal"
 TU_URS_mobile_terminal_desc:0 "Build the terminal of the mobile city. Political power and manpower rise."
 TU_URS_originium_deep:0 "Deep Originium Mining"
 TU_URS_originium_deep_desc:0 "Dig the veins deeper. One rural state gains tungsten and an industrial complex is built."
 TU_URS_mobile_expansion:0 "Mobile City Expansion"
 TU_URS_mobile_expansion_desc:0 "Expand the mobile city. One city state gains shared building slots and infrastructure."
 TU_URS_originium_core:0 "Originium Core Mines"
 TU_URS_originium_core_desc:0 "Develop the deepest vein. Political power rises sharply but stability falls."
 TU_URS_mobile_core:0 "Mobile City Core"
 TU_URS_mobile_core_desc:0 "Build the core facilities of the mobile city. Political power rises sharply and building production speeds up."
 TU_URS_originium_secure:0 "Originium Monopoly"
 TU_URS_originium_secure_desc:0 "Take hold of the originium supply. Political power rises and research speed rises slightly."
 TU_URS_mobile_final:0 "Mobile City Complete"
 TU_URS_mobile_final_desc:0 "Complete the mobile city. Political power rises sharply and stability rises."
 TU_URS_final_grid:0 "Northern Industry Complete"
 TU_URS_final_grid_desc:0 "Complete the northern industry system. Political power rises greatly and stability rises."
 TU_URS_army_mass_draft:0 "Mass Conscription"
 TU_URS_army_mass_draft_desc:0 "Draft the whole population. Manpower rises sharply and the mass conscription idea is gained. Cannot be taken with elite selection."
 TU_URS_army_elite_draft:0 "Elite Selection"
 TU_URS_army_elite_draft_desc:0 "Select a small, elite force. Army experience and political power rise. Cannot be taken with mass conscription."
 TU_URS_army_frost_drill:0 "Frost Drill"
 TU_URS_army_frost_drill_desc:0 "Train soldiers in the frozen training grounds. Army experience rises."
 TU_URS_army_arts_trials:0 "Arts Trial Units"
 TU_URS_army_arts_trials_desc:0 "Form trial units of soldiers who use Arts. Gains the Arts units idea."
 TU_URS_army_conscript_camps:0 "Conscript Camps"
 TU_URS_army_conscript_camps_desc:0 "Build barracks for conscripts. Manpower rises but stability falls."
 TU_URS_army_guard_selection:0 "Guard Selection"
 TU_URS_army_guard_selection_desc:0 "Select the guard candidates. Army experience rises sharply and stability rises."
 TU_URS_army_winter_doctrine:0 "Winter Doctrine"
 TU_URS_army_winter_doctrine_desc:0 "Establish a doctrine for fighting in the cold. Gains the frozen warfare idea."
 TU_URS_army_arts_assault:0 "Arts Assault Units"
 TU_URS_army_arts_assault_desc:0 "Form Arts assault units. Gains an infantry weapons research bonus."
 TU_URS_army_artillery_school:0 "Artillery School"
 TU_URS_army_artillery_school_desc:0 "Train artillery officers. Army experience and political power rise."
 TU_URS_army_conscript_levy:0 "Conscript Levy"
 TU_URS_army_conscript_levy_desc:0 "Mobilise conscripts in large numbers. Manpower rises sharply."
 TU_URS_army_armour_school:0 "Armour School"
 TU_URS_army_armour_school_desc:0 "Teach tank officers. Gains an armour research bonus."
 TU_URS_army_frost_entrench:0 "Frozen Entrenchments"
 TU_URS_army_frost_entrench_desc:0 "Dig in on the frozen ground. Army experience and manpower rise. Cannot be taken with frost mobile tactics."
 TU_URS_army_frost_mobile:0 "Frost Mobile Tactics"
 TU_URS_army_frost_mobile_desc:0 "Move quickly in the cold. Army experience rises. Cannot be taken with frozen entrenchments."
 TU_URS_army_arts_legion:0 "Arts Legion"
 TU_URS_army_arts_legion_desc:0 "Grow the Arts assault units into a legion. Army experience and political power rise."
 TU_URS_army_artillery_doctrine:0 "Artillery Doctrine"
 TU_URS_army_artillery_doctrine_desc:0 "Establish a doctrine centred on artillery. Gains the artillery attack idea."
 TU_URS_army_mass_mobilisation:0 "Total Mobilisation"
 TU_URS_army_mass_mobilisation_desc:0 "Mobilise the whole society. War support rises and stability falls. Cannot be taken with the professional army."
 TU_URS_army_professional:0 "Professional Army"
 TU_URS_army_professional_desc:0 "Raise a professional officer corps. Army experience rises. Cannot be taken with total mobilisation."
 TU_URS_army_artillery_barrage:0 "Artillery Barrage"
 TU_URS_army_artillery_barrage_desc:0 "Concentrate the artillery in one place. Army experience rises."
 TU_URS_army_frost_raid:0 "Frost Raiders"
 TU_URS_army_frost_raid_desc:0 "Run raiding units in the cold. Army experience rises sharply."
 TU_URS_army_armour_division:0 "Armour Division"
 TU_URS_army_armour_division_desc:0 "Form a tank division. The armour research bonus rises sharply."
 TU_URS_army_reserve:0 "Reserve Formation"
 TU_URS_army_reserve_desc:0 "Form the reserves. Army experience and manpower rise."
 TU_URS_army_artillery_corps:0 "Artillery Corps"
 TU_URS_army_artillery_corps_desc:0 "Group the artillery into corps. The artillery research bonus rises sharply."
 TU_URS_army_combined_arms:0 "Combined Arms Doctrine"
 TU_URS_army_combined_arms_desc:0 "Establish a doctrine merging infantry and artillery. Gains a land doctrine research bonus."
 TU_URS_army_armour_doctrine:0 "Armour Doctrine"
 TU_URS_army_armour_doctrine_desc:0 "Set the tank tactics. Gains the armour doctrine idea."
 TU_URS_army_general_staff:0 "General Staff"
 TU_URS_army_general_staff_desc:0 "Establish the general staff. Army experience and political power rise sharply. Requires the military junta."
 TU_URS_army_total_war:0 "Total War Organisation"
 TU_URS_army_total_war_desc:0 "Set up total war organisation. Manpower rises sharply."
 TU_URS_army_grand:0 "Grand Army"
 TU_URS_army_grand_desc:0 "Organise a large army. Army experience and political power rise."
 TU_URS_army_final:0 "Final Offensive Preparation"
 TU_URS_army_final_desc:0 "Prepare the final offensive. Army experience, stability and war support rise."
 TU_URS_army_supreme:0 "Supreme Command"
 TU_URS_army_supreme_desc:0 "Establish the supreme command. Army experience and political power rise sharply."
 TU_URS_army_marshal:0 "Marshal's Rank"
 TU_URS_army_marshal_desc:0 "Grant the rank of field marshal. Political power rises greatly and stability rises."
 TU_URS_arts_engineering:0 "Arts Engineering Research"
 TU_URS_arts_engineering_desc:0 "Research Arts as engineering. Gains an electronics research bonus. Cannot be taken with conventional aviation research."
 TU_URS_arts_conventional:0 "Conventional Aviation Research"
 TU_URS_arts_conventional_desc:0 "Research existing aviation technology. Gains an air doctrine research bonus. Cannot be taken with Arts engineering research."
 TU_URS_arts_lab:0 "Arts Laboratory"
 TU_URS_arts_lab_desc:0 "Open an Arts laboratory. Gains a radar research bonus and the research acceleration idea. Requires the reform path."
 TU_URS_frozen_airfield:0 "Frozen Airfield"
 TU_URS_frozen_airfield_desc:0 "Open an airfield on the frozen ground. Air experience and political power rise."
 TU_URS_frozen_hangar:0 "Frozen Hangar"
 TU_URS_frozen_hangar_desc:0 "Build an air base in one rural state. Air experience rises."
 TU_URS_frozen_pilots:0 "Frozen Pilot Training"
 TU_URS_frozen_pilots_desc:0 "Train pilots who can endure the cold. Air experience rises sharply and the frozen air idea is gained. Requires the Emperor's rule."
 TU_URS_frozen_air_doctrine:0 "Frozen Air Doctrine"
 TU_URS_frozen_air_doctrine_desc:0 "Establish a doctrine for air combat in the cold. Gains an air doctrine research bonus."
 TU_URS_frost_interceptors:0 "Frost Interceptors"
 TU_URS_frost_interceptors_desc:0 "Form interceptor units for the cold. Air experience rises."
 TU_URS_frost_supremacy:0 "Frost Air Supremacy"
 TU_URS_frost_supremacy_desc:0 "Take control of the skies over the frozen land. Gains the frost air supremacy idea and air experience rises."
 TU_URS_frost_legacy:0 "Frost Air Legacy"
 TU_URS_frost_legacy_desc:0 "Leave the tradition of frozen air power. Air experience and political power rise."
 TU_URS_frost_end:0 "Frozen Air Force Complete"
 TU_URS_frost_end_desc:0 "Complete the frozen air force. Air experience, political power and stability rise."
 TU_URS_northern_expedition:0 "Northern Expedition Research"
 TU_URS_northern_expedition_desc:0 "Research air equipment for the northern expedition. Gains an air equipment research bonus and political power rises. Requires the military junta."
 TU_URS_northern_recon:0 "Northern Reconnaissance"
 TU_URS_northern_recon_desc:0 "Research northern reconnaissance aircraft. Gains a light air research bonus."
 TU_URS_northern_bomber:0 "Northern Bomber Research"
 TU_URS_northern_bomber_desc:0 "Research long-range bombers. Gains a tactical bomber research bonus. Cannot be taken with northern fighter research."
 TU_URS_northern_fighter:0 "Northern Fighter Research"
 TU_URS_northern_fighter_desc:0 "Research northern fighters. Gains an air equipment research bonus and the northern range idea. Cannot be taken with northern bomber research."
 TU_URS_reu_suppression:0 "Suppress Reunion"
 TU_URS_reu_suppression_desc:0 "Crush the Reunion uprising by force. Reunion's stability and war support fall. Cannot be taken with Reunion negotiation."
 TU_URS_reu_negotiation:0 "Negotiate with Reunion"
 TU_URS_reu_negotiation_desc:0 "Open a channel of talks with Reunion. Reunion's stability rises slightly. Cannot be taken with suppression."
 TU_URS_reu_front:0 "Reunion Front"
 TU_URS_reu_front_desc:0 "Establish a front against Reunion. Army experience and manpower rise."
 TU_URS_reu_talks:0 "Negotiating Delegation"
 TU_URS_reu_talks_desc:0 "Send a negotiating delegation. Political power rises and stability rises slightly."
 TU_URS_reu_occupation:0 "Reunion Occupation Plan"
 TU_URS_reu_occupation_desc:0 "Draw up a plan to occupy Reunion's territory. Army experience rises and war support rises slightly."
 TU_URS_reu_peace:0 "Reunion Peace Treaty"
 TU_URS_reu_peace_desc:0 "Sign a peace treaty after the Chernobog incident. Political power and stability rise."
 TU_URS_lungmen_aid:0 "Aid to Lungmen"
 TU_URS_lungmen_aid_desc:0 "Help Lungmen, which survived. Lungmen's stability rises and political power rises."
 TU_URS_reu_siege:0 "Siege of Reunion"
 TU_URS_reu_siege_desc:0 "Besiege Reunion. Army experience rises sharply and Reunion's war support falls."
 TU_URS_reu_final:0 "Final Offensive on Reunion"
 TU_URS_reu_final_desc:0 "Launch the final offensive on Reunion. Army experience and political power rise sharply."
 TU_URS_labour_expansion:0 "Expand Forced Labour"
 TU_URS_labour_expansion_desc:0 "Expand forced labour. Manpower rises but stability falls. Gains the labour quota idea. Requires the Emperor's rule."
 TU_URS_quarantine_patrol:0 "Quarantine Surveillance"
 TU_URS_quarantine_patrol_desc:0 "Set up surveillance in the quarantine zones. Stability and political power rise."
 TU_URS_chernobog_reconstruction:0 "Chernobog Reconstruction"
 TU_URS_chernobog_reconstruction_desc:0 "Rebuild Chernobog. An arms factory is built there and shared building slots rise."
 TU_URS_rho_cooperation:0 "Cooperation with Rhodes Island"
 TU_URS_rho_cooperation_desc:0 "Cooperate with Rhodes Island on treating the infected. Stability rises and the medical cooperation idea is gained."
 TU_URS_chernobog_defence:0 "Chernobog Defence Line"
 TU_URS_chernobog_defence_desc:0 "Draw a defence line around Chernobog. Army experience and political power rise."
 TU_URS_chernobog_fortress:0 "Chernobog Fortress"
 TU_URS_chernobog_fortress_desc:0 "Turn Chernobog into a fortress. Army experience, stability and manpower rise."
 TU_URS_chernobog_core:0 "Chernobog Core Facilities"
 TU_URS_chernobog_core_desc:0 "Build the core facilities of Chernobog. An industrial complex and infrastructure are built there."
 TU_URS_chernobog_seal:0 "Seal Chernobog"
 TU_URS_chernobog_seal_desc:0 "Seal off Chernobog. Political power and army experience rise."
 TU_URS_chernobog_legacy:0 "Legacy of Chernobog"
 TU_URS_chernobog_legacy_desc:0 "Record the end of the Chernobog incident. Political power and stability rise."
 TU_URS_infected_quota:0 "Infected Labour Quota"
 TU_URS_infected_quota_desc:0 "Set labour quotas for the infected. Manpower rises and stability falls."
 TU_URS_e1_state_planning:0 "State Planning Economy"
 TU_URS_e1_state_planning_desc:0 "The state plans production, so building speed rises but stability falls."
 TU_URS_e1_market_economy:0 "Market Economy"
 TU_URS_e1_market_economy_desc:0 "Markets open, so political power gain rises and consumer goods demand falls."
 TU_URS_e1_war_economy:0 "War Economy"
 TU_URS_e1_war_economy_desc:0 "All factories serve the war. Building speed and war support rise, and consumer goods demand rises slightly."
 TU_URS_e1_consumer_goods:0 "Consumer Goods Supply"
 TU_URS_e1_consumer_goods_desc:0 "Consumer goods are supplied enough to calm the people. Consumer goods demand falls and stability rises."
 TU_URS_e1_mobile_civil:0 "Mobile City Life"
 TU_URS_e1_mobile_civil_desc:0 "The population of the mobile city grows. Monthly population and stability rise."
 TU_URS_e1_mobile_fort:0 "Mobile Fortress"
 TU_URS_e1_mobile_fort_desc:0 "The defence of the mobile city rises. Defence rises and digging in speeds up."
 TU_URS_e1_frost_supply:0 "Frost Supply System"
 TU_URS_e1_frost_supply_desc:0 "Supply consumption on frozen ground falls and frost losses decline."
 TU_URS_e1_mobile_core:0 "Mobile City Core Function"
 TU_URS_e1_mobile_core_desc:0 "The core function of the mobile city speeds building production and grows the population."
 TU_URS_e1_originium_monopoly:0 "Originium Monopoly"
 TU_URS_e1_originium_monopoly_desc:0 "Monopolising originium raises research speed but mining accidents lower stability."
 TU_URS_e2_mass_conscription:0 "Mass Conscription"
 TU_URS_e2_mass_conscription_desc:0 "The conscription rate rises but conscripts gain less experience."
 TU_URS_e2_arts_units:0 "Arts Units"
 TU_URS_e2_arts_units_desc:0 "Units that use Arts gain attack power and gain experience quickly."
 TU_URS_e2_frozen_warfare:0 "Frozen Warfare"
 TU_URS_e2_frozen_warfare_desc:0 "Losses from the cold decline and defence rises on frozen ground."
 TU_URS_e2_artillery_doctrine:0 "Artillery Doctrine"
 TU_URS_e2_artillery_doctrine_desc:0 "Artillery attack rises."
 TU_URS_e2_armour_doctrine:0 "Armour Doctrine"
 TU_URS_e2_armour_doctrine_desc:0 "Tank attack rises and training time falls."
 TU_URS_e2_general_staff:0 "General Staff System"
 TU_URS_e2_general_staff_desc:0 "The general staff reduces training time."
 TU_URS_e2_total_war:0 "Total War Organisation"
 TU_URS_e2_total_war_desc:0 "War support rises but stability falls."
 TU_URS_e3_frozen_air:0 "Frozen Air Technology"
 TU_URS_e3_frozen_air_desc:0 "The air penalty from the cold falls."
 TU_URS_e3_arts_research:0 "Accelerated Arts Research"
 TU_URS_e3_arts_research_desc:0 "Research speed rises."
 TU_URS_e3_frost_supremacy:0 "Frost Air Supremacy Technology"
 TU_URS_e3_frost_supremacy_desc:0 "Interception efficiency and air superiority efficiency rise."
 TU_URS_e3_northern_range:0 "Northern Range"
 TU_URS_e3_northern_range_desc:0 "The operating range of aircraft rises."
 TU_URS_e4_labour_quota:0 "Labour Quota"
 TU_URS_e4_labour_quota_desc:0 "Building production speed rises but stability falls."
 TU_URS_e4_rho_medical:0 "Medical Cooperation"
 TU_URS_e4_rho_medical_desc:0 "Stability rises and monthly population grows."
 TU_URS_e1_mobile_rail_bonus:0 "Siege Rail Technology"
 TU_URS_e2_arts_bonus:0 "Arts Assault Equipment"
 TU_URS_e2_armour_bonus:0 "Armour School Equipment"
 TU_URS_e2_armour_division_bonus:0 "Armour Division Equipment"
 TU_URS_e2_artillery_corps_bonus:0 "Artillery Corps Equipment"
 TU_URS_e2_combined_bonus:0 "Combined Arms Doctrine"
 TU_URS_e3_arts_engineering_bonus:0 "Arts Engineering Technology"
 TU_URS_e3_conventional_bonus:0 "Conventional Aviation Technology"
 TU_URS_e3_arts_lab_bonus:0 "Arts Laboratory Technology"
 TU_URS_e3_frozen_doctrine_bonus:0 "Frozen Air Doctrine Technology"
 TU_URS_e3_expedition_bonus:0 "Northern Expedition Equipment"
 TU_URS_e3_recon_bonus:0 "Northern Reconnaissance Technology"
 TU_URS_e3_bomber_bonus:0 "Northern Bomber Technology"
 TU_URS_e3_fighter_bonus:0 "Northern Fighter Technology"
