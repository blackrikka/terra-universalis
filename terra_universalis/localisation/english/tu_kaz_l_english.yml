 tu_kaz_ev.1.t:0 "Morning in Kazimierz"
 tu_kaz_ev.1.d:0 "The giant screens of the capital alternate between tournament ads and soft drink ads. Old order crests are sold in souvenir shops. Yet some knights still remember their oaths."
 tu_kaz_ev.1.a:0 "The Union keeps this country running."
 tu_kaz_ev.1.b:0 "Knighthood is not dead yet."
 tu_kaz_ev.10.t:0 "The Major Opens"
 tu_kaz_ev.10.d:0 "The grand arena is packed. Knights wearing corporate logos and knights in worn armour share the same bracket. How shall this Major be run?"
 tu_kaz_ev.10.a:0 "Put the sponsors front and centre."
 tu_kaz_ev.10.b:0 "Put the knights' honour first."
 tu_kaz_ev.11.t:0 "Upset at the Semi-Finals"
 tu_kaz_ev.11.d:0 "Trouble erupts before the semi-finals. One favourite turns out to be infected, and another match is accused of being fixed."
 tu_kaz_ev.11.a:0 "Let the infected knight compete."
 tu_kaz_ev.11.b:0 "Disqualify by the rules."
 tu_kaz_ev.11.c:0 "Investigate the fixing first."
 tu_kaz_ev.12.t:0 "The Major Final"
 tu_kaz_ev.12.d:0 "An infected knight won!"
 tu_kaz_ev.12.a:0 "A corporate knight won."
 tu_kaz_ev.12.b:0 "A wandering knight won."
 tu_kaz_ev.12.c:0 "A great knightly house won."
 tu_kaz_ev.13.t:0 "After the Major"
 tu_kaz_ev.13.d:0 "The festival ends and the arena lights go dark. The next Major is a year away."
 tu_kaz_ev.13.a:0 "Until next year."
 tu_kaz_ev.20.t:0 "The Infected Knights Protest"
 tu_kaz_ev.20.d:0 "Infected knights gather before the arena, carrying banners that read 'We are knights too'."
 tu_kaz_ev.20.a:0 "Hear their voices."
 tu_kaz_ev.20.b:0 "Disperse them."
 tu_kaz_ev.21.t:0 "Petition of the Nearl Family"
 tu_kaz_ev.21.d:0 "A knight of the old Nearl family petitions parliament: recognise a knight's worth regardless of infection."
 tu_kaz_ev.21.a:0 "Accept the petition."
 tu_kaz_ev.21.b:0 "Leave it to further debate."
 tu_kaz_ev.22.t:0 "Northern Border Incident"
 tu_kaz_ev.22.d:0 "An Ursus patrol crossed the border and clashed with Kazimierz knights. There were casualties."
 tu_kaz_ev.22.a:0 "Protest loudly and raise the alert."
 tu_kaz_ev.22.b:0 "Hush it up."
 tu_kaz_ev.23.t:0 "Manufactured News"
 tu_kaz_ev.23.d:0 "Union-owned networks praised the government in identical words on the same day. Citizens are starting to notice."
 tu_kaz_ev.23.a:0 "No problem here."
 tu_kaz_ev.23.b:0 "Warn the networks."
 tu_kaz_ev.24.t:0 "Death After a Duel"
 tu_kaz_ev.24.d:0 "A young knight died in an honour duel. There are calls to ban duels again."
 tu_kaz_ev.24.a:0 "Duelling is a knight's right."
 tu_kaz_ev.24.b:0 "Tighten the rules."
 tu_kaz_ev.25.t:0 "Corporate Knight Scandal"
 tu_kaz_ev.25.d:0 "A popular corporate knight is exposed for doping. The sponsor claims it knew nothing."
 tu_kaz_ev.25.a:0 "Punish the corporation."
 tu_kaz_ev.25.b:0 "Call it one knight's misconduct."
 tu_kaz_ev.26.t:0 "The Nomadic Knights Arrive"
 tu_kaz_ev.26.d:0 "A band of nomadic knights pitches tents near the capital. They are looking for work."
 tu_kaz_ev.26.a:0 "Hire them."
 tu_kaz_ev.26.b:0 "Send them on."
 tu_kaz_ev.27.t:0 "Return of a Lightless Knight"
 tu_kaz_ev.27.d:0 "A nameless knight appeared at the Major qualifiers, defeated every opponent and vanished. No one knows who it was."
 tu_kaz_ev.27.a:0 "A legend returns."
 tu_kaz_ev.28.t:0 "The Shareholder State"
 tu_kaz_ev.28.d:0 "Parliament now meets like a shareholders' meeting. Kazimierz has become efficient. The knights read their contracts."
 tu_kaz_ev.28.a:0 "Profit is the national interest."
 tu_kaz_ev.29.t:0 "Kingdom of Knights"
 tu_kaz_ev.29.d:0 "The billboards come down and the old orders' banners rise again. The knights swear anew."
 tu_kaz_ev.29.a:0 "We keep our oaths."
 tu_kaz_ev.30.t:0 "Knighthood for All"
 tu_kaz_ev.30.d:0 "Infected knights marched through the capital in armour. Citizens stepped aside and saluted."
 tu_kaz_ev.30.a:0 "Knighthood lies in the heart."
 TU_KAZ_focus:0 "Kazimierz Focus"
