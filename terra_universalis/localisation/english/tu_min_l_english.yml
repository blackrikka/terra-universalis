 tu_min_ev.1.t:0 "Morning of the Five Cities"
 tu_min_ev.1.d:0 "Citizens gather in the assembly square. At the temple a priest prepares the oracle; in the harbour, merchant ships raise sail."
 tu_min_ev.1.a:0 "As the assembly wills."
 tu_min_ev.1.b:0 "To the sea."
 tu_min_ev.20.t:0 "The Oracle Speaks"
 tu_min_ev.20.d:0 "Through the smoke, the priestess speaks."
 tu_min_ev.20.a:0 "A good omen!"
 tu_min_ev.20.b:0 "A bad omen..."
 tu_min_ev.20.c:0 "An unreadable riddle."
 tu_min_ev.21.t:0 "The Omen Fades"
 tu_min_ev.21.d:0 "The omen's power has faded."
 tu_min_ev.21.a:0 "Time to consult again."
 TU_MIN_routes_m1_tt:0 "§GSea Trade Routes§! -1"
 tu_min_ev.22.t:0 "Pirate Raid"
 tu_min_ev.22.d:0 "Pirates have severed one of our trade routes."
 tu_min_ev.22.a:0 "Accept the loss."
 tu_min_ev.22.b:0 "Send the fleet."
 TU_MIN_assembly_m5_tt:0 "§YAssembly Support§! -5"
 tu_min_ev.23.t:0 "The Philosophers Debate"
 tu_min_ev.23.d:0 "The philosophers' debate in the square enters its third day."
 tu_min_ev.23.a:0 "Hear it out."
 tu_min_ev.23.b:0 "Disperse them."
 tu_min_ev.24.t:0 "The Ostracism Vote"
 tu_min_ev.24.d:0 "The citizens vote to exile an overly powerful politician."
 tu_min_ev.24.a:0 "Respect the vote."
 tu_min_ev.24.b:0 "Annul the vote."
 tu_min_ev.25.t:0 "Hero of the Games"
 tu_min_ev.25.d:0 "A young athlete swept every event at the Great Games."
 tu_min_ev.25.a:0 "Honour the hero."
 tu_min_ev.26.t:0 "Return of the Merchant Fleet"
 tu_min_ev.26.d:0 "Merchant ships returned from a long voyage, laden with rare goods."
 tu_min_ev.26.a:0 "Sell them at market."
 tu_min_ev.27.t:0 "Elders Clash with Citizens"
 tu_min_ev.27.d:0 "When the elders tried to overturn the assembly, citizens filled the square."
 tu_min_ev.27.a:0 "Side with the citizens."
 tu_min_ev.27.b:0 "Side with the elders."
 tu_min_ev.28.t:0 "Democratic Polis"
 tu_min_ev.28.d:0 "Minos has become a nation of citizens."
 tu_min_ev.28.a:0 "Long live the assembly."
 tu_min_ev.29.t:0 "Rule of the Elders"
 tu_min_ev.29.d:0 "The elders have taken charge of Minos."
 tu_min_ev.29.a:0 "Follow wisdom."
 tu_min_ev.30.t:0 "Thalassocracy"
 tu_min_ev.30.d:0 "There is no sea Minos's ships do not reach."
 tu_min_ev.30.a:0 "Masters of the sea."
 tu_min_ev.31.t:0 "Storm at Sea"
 tu_min_ev.31.d:0 "A great storm swallowed several merchant ships."
 tu_min_ev.31.a:0 "Mourn them."
 tu_min_ev.32.t:0 "Miracle at the Temple"
 tu_min_ev.32.d:0 "The temple's sacred flame lit itself."
 tu_min_ev.32.a:0 "The gods are with us."
 tu_min_ev.33.t:0 "Foreign Students"
 tu_min_ev.33.d:0 "Students from many nations have come to Minos's schools."
 tu_min_ev.33.a:0 "Welcome them."
