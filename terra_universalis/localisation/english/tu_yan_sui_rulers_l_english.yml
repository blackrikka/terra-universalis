l_english:
 TU_YAN_p1_chongyue_halls:0 "The Martial Halls"
 TU_YAN_p1_chongyue_halls_desc:0 "Open martial halls in every city to teach the young the spear and the fist."
 TU_YAN_p1_chongyue_spear:0 "The Guarding Spear"
 TU_YAN_p1_chongyue_spear_desc:0 "The spear is raised only to guard the siblings' land."
 TU_YAN_p1_chongyue_open_hand:0 "The Open Palm"
 TU_YAN_p1_chongyue_open_hand_desc:0 "Sheathe the blade and hold out a hand. Even the siblings who left may return."
 TU_YAN_p1_chongyue_reign:0 "Reign of Martial Virtue"
 TU_YAN_p1_chongyue_reign_desc:0 "Chongyue's Yan stands by martial virtue and is guarded by it."
 TU_YAN_idea_rule_chongyue_2:0 "Reign of Martial Virtue"
 TU_YAN_idea_rule_chongyue_2_desc:0 "Chongyue's Yan stands by martial virtue and is guarded by it."
 TU_YAN_p1_ling_tavern:0 "Taverns of All Under Heaven"
 TU_YAN_p1_ling_tavern_desc:0 "The taverns everywhere become places where news and public feeling gather."
 TU_YAN_p1_ling_wanderer:0 "The Wandering Poet"
 TU_YAN_p1_ling_wanderer_desc:0 "Ling takes to the road and listens to every village."
 TU_YAN_p1_ling_dream_army:0 "An Army in the Dream"
 TU_YAN_p1_ling_dream_army_desc:0 "Those who woke from the garden of dreams volunteer to fight for Ling."
 TU_YAN_p1_ling_reign:0 "Reign of the Drunken Immortal"
 TU_YAN_p1_ling_reign_desc:0 "Wine, verse and dreams. Ling's Yan is unhurried but unshaken."
 TU_YAN_idea_rule_ling_2:0 "Reign of the Drunken Immortal"
 TU_YAN_idea_rule_ling_2_desc:0 "Wine, verse and dreams. Ling's Yan is unhurried but unshaken."
 TU_YAN_p1_wang_board:0 "The Board of All Under Heaven"
 TU_YAN_p1_wang_board_desc:0 "To Wang, all under heaven is a single game of go."
 TU_YAN_p1_wang_academy:0 "Observatories and Academies"
 TU_YAN_p1_wang_academy_desc:0 "Build academies beside the observatories that watch the stars."
 TU_YAN_p1_wang_records:0 "Records of the Battlefield"
 TU_YAN_p1_wang_records_desc:0 "Replay past battles move by move, like the record of a go game."
 TU_YAN_p1_wang_reign:0 "Reign of the Grandmaster"
 TU_YAN_p1_wang_reign_desc:0 "Wang's Yan is always one move ahead of its opponent."
 TU_YAN_idea_rule_wang_2:0 "Reign of the Grandmaster"
 TU_YAN_idea_rule_wang_2_desc:0 "Wang's Yan is always one move ahead of its opponent."
 TU_YAN_p1_dusk_studio:0 "The Studio of Propaganda"
 TU_YAN_p1_dusk_studio_desc:0 "A single painting travels further than a hundred speeches."
 TU_YAN_p1_dusk_soldiers:0 "Painted Soldiers"
 TU_YAN_p1_dusk_soldiers_desc:0 "Soldiers drawn with the brush take their place in the line."
 TU_YAN_p1_dusk_retreat:0 "Retreat into the Painting"
 TU_YAN_p1_dusk_retreat_desc:0 "Those weary of war rest for a while in a village inside the painting."
 TU_YAN_p1_dusk_reign:0 "Reign of the Canvas"
 TU_YAN_p1_dusk_reign_desc:0 "Dusk's Yan is as still and as solid as a painted scroll."
 TU_YAN_idea_rule_dusk_2:0 "Reign of the Canvas"
 TU_YAN_idea_rule_dusk_2_desc:0 "Dusk's Yan is as still and as solid as a painted scroll."
 TU_YAN_p1_shu_canals:0 "Irrigation Canals"
 TU_YAN_p1_shu_canals_desc:0 "Dig channels out to the dry land."
 TU_YAN_p1_shu_farmer_soldiers:0 "Farmer-Soldiers"
 TU_YAN_p1_shu_farmer_soldiers_desc:0 "They till the fields in peace and take up spears in war."
 TU_YAN_p1_shu_granaries:0 "Granary Reserves"
 TU_YAN_p1_shu_granaries_desc:0 "Store surplus grain in granaries against lean years."
 TU_YAN_p1_shu_reign:0 "Reign of Plenty"
 TU_YAN_p1_shu_reign_desc:0 "No one goes hungry in Shu's Yan."
 TU_YAN_idea_rule_shu_2:0 "Reign of Plenty"
 TU_YAN_idea_rule_shu_2_desc:0 "No one goes hungry in Shu's Yan."
 TU_YAN_p1_nian_alloys:0 "New Alloys"
 TU_YAN_p1_nian_alloys_desc:0 "Nian hammers out new alloys laced with originium."
 TU_YAN_p1_nian_arsenal:0 "The Arsenal Workshops"
 TU_YAN_p1_nian_arsenal_desc:0 "Expand the forges into arsenal workshops."
 TU_YAN_p1_nian_modern:0 "Modern Factories"
 TU_YAN_p1_nian_modern_desc:0 "Nian has no prejudice between old and new. Build factories."
 TU_YAN_p1_nian_reign:0 "Reign of the Forge Flame"
 TU_YAN_p1_nian_reign_desc:0 "Nian's Yan begins every day with the sound of hammers."
 TU_YAN_idea_rule_nian_2:0 "Reign of the Forge Flame"
 TU_YAN_idea_rule_nian_2_desc:0 "Nian's Yan begins every day with the sound of hammers."
 TU_YAN_p1_jun_works:0 "Public Works"
 TU_YAN_p1_jun_works_desc:0 "Spend the surplus on roads and factories."
 TU_YAN_p1_jun_canal:0 "Repair the Grand Canal"
 TU_YAN_p1_jun_canal_desc:0 "Repair the Grand Canal between north and south and lay rail beside it."
 TU_YAN_p1_jun_tax:0 "Tax Reform"
 TU_YAN_p1_jun_tax_desc:0 "Fold the tangle of taxes into one."
 TU_YAN_p1_jun_reign:0 "Reign of Prosperity"
 TU_YAN_p1_jun_reign_desc:0 "Jun's Yan is full of the noise of markets."
 TU_YAN_idea_rule_jun_2:0 "Reign of Prosperity"
 TU_YAN_idea_rule_jun_2_desc:0 "Jun's Yan is full of the noise of markets."
 TU_YAN_p1_jie_march:0 "Gale Marches"
 TU_YAN_p1_jie_march_desc:0 "Jie's army covers two days' march in one."
 TU_YAN_p1_jie_mobile:0 "Mobile Divisions"
 TU_YAN_p1_jie_mobile_desc:0 "Gather the fast units into a single fist."
 TU_YAN_p1_jie_cities:0 "Escort the Mobile Cities"
 TU_YAN_p1_jie_cities_desc:0 "Form armoured escorts for the moving cities."
 TU_YAN_p1_jie_reign:0 "Reign of the Gale"
 TU_YAN_p1_jie_reign_desc:0 "Jie's Yan never stands still."
 TU_YAN_idea_rule_jie_2:0 "Reign of the Gale"
 TU_YAN_idea_rule_jie_2_desc:0 "Jie's Yan never stands still."
 TU_YAN_p1_ji_airfields:0 "Dragon Airfields"
 TU_YAN_p1_ji_airfields_desc:0 "Level airfields on every mountain."
 TU_YAN_p1_ji_fighters:0 "Fighter Wings"
 TU_YAN_p1_ji_fighters_desc:0 "Expand the fighters that guard the sky."
 TU_YAN_p1_ji_bombers:0 "Bomber Wings"
 TU_YAN_p1_ji_bombers_desc:0 "Break enemy positions from above."
 TU_YAN_p1_ji_reign:0 "Reign of the Open Sky"
 TU_YAN_p1_ji_reign_desc:0 "Only dragon wings fly in the sky over Ji's Yan."
 TU_YAN_idea_rule_ji_2:0 "Reign of the Open Sky"
 TU_YAN_idea_rule_ji_2_desc:0 "Only dragon wings fly in the sky over Ji's Yan."
 TU_YAN_p1_yi_talks:0 "The Sibling Talks"
 TU_YAN_p1_yi_talks_desc:0 "Send envoys even to the siblings who broke away."
 TU_YAN_p1_yi_horizontal:0 "The Horizontal Alliance"
 TU_YAN_p1_yi_horizontal_desc:0 "Ally with the strong and deal with the rest one by one."
 TU_YAN_p1_yi_vertical:0 "The Vertical Alliance"
 TU_YAN_p1_yi_vertical_desc:0 "Gather the weak to stand against the strong."
 TU_YAN_p1_yi_reign:0 "Reign of Concord"
 TU_YAN_p1_yi_reign_desc:0 "Yi's Yan wins with words and holds with words."
 TU_YAN_idea_rule_yi_2:0 "Reign of Concord"
 TU_YAN_idea_rule_yi_2_desc:0 "Yi's Yan wins with words and holds with words."
 TU_YAN_p1_fang_passes:0 "Iron Gate Passes"
 TU_YAN_p1_fang_passes_desc:0 "Rebuild the fortresses at every pass."
 TU_YAN_p1_fang_engineers:0 "Trench Engineers"
 TU_YAN_p1_fang_engineers_desc:0 "Engineers dig trenches and positions."
 TU_YAN_p1_fang_militia:0 "Militia of the Walls"
 TU_YAN_p1_fang_militia_desc:0 "Everyone within the walls becomes a soldier."
 TU_YAN_p1_fang_reign:0 "Reign of the Iron Fortress"
 TU_YAN_p1_fang_reign_desc:0 "No one breaches Fang's Yan."
 TU_YAN_idea_rule_fang_2:0 "Reign of the Iron Fortress"
 TU_YAN_idea_rule_fang_2_desc:0 "No one breaches Fang's Yan."
 TU_YAN_p1_yu_field_kitchens:0 "Field Kitchens"
 TU_YAN_p1_yu_field_kitchens_desc:0 "Carry hot meals all the way to the front."
 TU_YAN_p1_yu_supply:0 "Supply Columns"
 TU_YAN_p1_yu_supply_desc:0 "Build unbroken supply lines of carts and trucks."
 TU_YAN_p1_yu_feast:0 "A Feast for the People"
 TU_YAN_p1_yu_feast_desc:0 "Lay out a feast across the whole land."
 TU_YAN_p1_yu_reign:0 "Reign of the Banquet"
 TU_YAN_p1_yu_reign_desc:0 "In Yu's Yan, neither soldier nor citizen goes hungry."
 TU_YAN_idea_rule_yu_2:0 "Reign of the Banquet"
 TU_YAN_idea_rule_yu_2_desc:0 "In Yu's Yan, neither soldier nor citizen goes hungry."
