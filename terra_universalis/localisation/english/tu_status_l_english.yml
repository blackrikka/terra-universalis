 TU_STATUS_TU_SIR_bellone_value:0 "[?TU_SIR_bellone|Y0] / 100"
 TU_STATUS_TU_SIR_bellone_tt:0 "§YBellone Family§!: [?TU_SIR_bellone|Y0] / 100\nThe Bellone Family's influence. It rises every month, grows with deals and shrinks with crackdowns.\n\n§gThe marks on the bar (60) are turning points.§!"
