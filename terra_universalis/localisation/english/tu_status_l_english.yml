 TU_STATUS_TU_SIR_gambino_tt:0 "§YGambino Family§!: [?TU_SIR_gambino|Y0] / 100\nThe Gambino Family's influence. It rises every month, grows with deals and shrinks with crackdowns.\n\n§gThe marks on the bar (60) are turning points.§!"
