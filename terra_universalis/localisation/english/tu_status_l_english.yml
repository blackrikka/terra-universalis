l_english:
 TU_STATUS_TU_BOL_control_label:0 "Government Control"
 TU_STATUS_TU_BOL_control_value:0 "[?TU_BOL_control|Y0] / 100"
 TU_STATUS_TU_BOL_control_tt:0 "§YGovernment Control§!: [?TU_BOL_control|Y0] / 100\nThe land and people the government truly holds. At §Y100§! the civil war ends.\n\n§gThe marks on the bar (40 · 50 · 70) are turning points.§!"
 TU_STATUS_TU_BOL_weariness_label:0 "War Weariness"
 TU_STATUS_TU_BOL_weariness_value:0 "[?TU_BOL_weariness|Y0] / 100"
 TU_STATUS_TU_BOL_weariness_tt:0 "§YWar Weariness§!: [?TU_BOL_weariness|Y0] / 100\nRises every month the civil war drags on. People now say they no longer care who wins.\n\n§gThe marks on the bar (60 · 70 · 80) are turning points.§!"
 TU_STATUS_TU_BOL_victoria_label:0 "Victorian Dependence"
 TU_STATUS_TU_BOL_victoria_value:0 "[?TU_BOL_victoria|Y0] / 100"
 TU_STATUS_TU_BOL_victoria_tt:0 "§YVictorian Dependence§!: [?TU_BOL_victoria|Y0] / 100\nGrows with every Victorian aid package. Above §Y60§! the patron starts making demands.\n\n§gThe marks on the bar (30 · 40 · 60 · 70) are turning points.§!"
 TU_STATUS_TU_BOL_columbia_label:0 "Columbian Dependence"
 TU_STATUS_TU_BOL_columbia_value:0 "[?TU_BOL_columbia|Y0] / 100"
 TU_STATUS_TU_BOL_columbia_tt:0 "§YColumbian Dependence§!: [?TU_BOL_columbia|Y0] / 100\nGrows with every Columbian aid package. Above §Y60§! the patron starts making demands.\n\n§gThe marks on the bar (30 · 40 · 60 · 70) are turning points.§!"
 TU_BOL_status_category:0 "Scales of the Civil War"
 TU_BOL_status_category_desc:0 "Bolivar's guns have not fallen silent for a generation. The government claws back the land inch by inch, and patrons across the sea attach an invoice to every inch."
 TU_STATUS_TU_COL_science_label:0 "Scientific Capacity"
 TU_STATUS_TU_COL_science_value:0 "[?TU_COL_science|Y0] / 200"
 TU_STATUS_TU_COL_science_tt:0 "§YScientific Capacity§!: [?TU_COL_science|Y0] / 200\nThe scientific strength built up by national research projects and the administration.\n\n§gThe marks on the bar (30 · 40 · 60 · 100) are turning points.§!"
 TU_COL_status_category:0 "Rhine Lab Research Report"
 TU_COL_status_category_desc:0 "The lights in Columbia's laboratories never go out. Today's lab notes become tomorrow's national projects, and their results become the Federation's strength."
 TU_STATUS_TU_HIG_foreign_label:0 "Foreign Influence"
 TU_STATUS_TU_HIG_foreign_value:0 "[?TU_HIG_foreign|Y0] / 100"
 TU_STATUS_TU_HIG_foreign_tt:0 "§YForeign Influence§!: [?TU_HIG_foreign|Y0] / 100\nOutside influence that seeps in through every open port. Above §Y60§! the expel-the-foreigners uprising breaks out.\n\n§gThe marks on the bar (20 · 40 · 60) are turning points.§!"
 TU_STATUS_TU_HIG_ports_label:0 "Treaty Ports"
 TU_STATUS_TU_HIG_ports_value:0 "[?TU_HIG_ports|Y0] / 4"
 TU_STATUS_TU_HIG_ports_tt:0 "§YTreaty Ports§!: [?TU_HIG_ports|Y0] / 4\nHarbours opened to foreign ships. Each gives §G+0.5§! political power and §R+2§! foreign influence per month.\n\n§gThe marks on the bar (1 · 2 · 3) are turning points.§!"
 TU_STATUS_TU_HIG_shinobi_label:0 "Shinobi"
 TU_STATUS_TU_HIG_shinobi_value:0 "[?TU_HIG_shinobi|Y0] / 10"
 TU_STATUS_TU_HIG_shinobi_tt:0 "§YShinobi§!: [?TU_HIG_shinobi|Y0] / 10\nThe shadows the Shogunate can call upon. Each operation takes §Y2§! shinobi.\n\n§gThe marks on the bar (1 · 4 · 5 · 9) are turning points.§!"
 TU_HIG_status_category:0 "Cracks in the Shogunate's Gate"
 TU_HIG_status_category_desc:0 "Through the cracks of the closed gate, the shadows of foreign ships seep in. The Shogunate must choose: open the harbours, or sharpen its blades in the dark."
 TU_STATUS_TU_IBE_threat_label:0 "Threat from the Sea"
 TU_STATUS_TU_IBE_threat_value:0 "[?TU_IBE_threat|Y0] / 100"
 TU_STATUS_TU_IBE_threat_tt:0 "§YThreat from the Sea§!: [?TU_IBE_threat|Y0] / 100\nSigns of what rises from the deep. It grows every month, more slowly with each lighthouse. At §Y70§! or more, coastal towns are eroded.\n\n§gThe marks on the bar (20 · 25 · 30 · 40 · 50 · 70) are turning points.§!"
 TU_STATUS_TU_IBE_lighthouses_label:0 "Lighthouses Rekindled"
 TU_STATUS_TU_IBE_lighthouses_value:0 "[?TU_IBE_lighthouses|Y0] / 5"
 TU_STATUS_TU_IBE_lighthouses_tt:0 "§YLighthouses Rekindled§!: [?TU_IBE_lighthouses|Y0] / 5\nCoastal lighthouses lit once more. Each one slows the rise of the threat from the sea.\n\n§gThe marks on the bar (2) are turning points.§!"
 TU_IBE_status_category:0 "Coastal Watch Log"
 TU_IBE_status_category_desc:0 "Since the Great Silence, Iberia's night sea has never been quiet. The Inquisition holds the coastline with lighthouse fires and the memories of those who remain."
 TU_STATUS_TU_KAZ_fame_label:0 "Knightly Fame"
 TU_STATUS_TU_KAZ_fame_value:0 "[?TU_KAZ_fame|Y0] / 100"
 TU_STATUS_TU_KAZ_fame_tt:0 "§YKnightly Fame§!: [?TU_KAZ_fame|Y0] / 100\nThe renown Kazimierz's knights have earned in the arena and on the battlefield.\n\n§gThe marks on the bar (20 · 30 · 40 · 50 · 60 · 80) are turning points.§!"
 TU_KAZ_status_category:0 "Knights' Almanac"
 TU_KAZ_status_category_desc:0 "In Kazimierz, fame is a commodity. The louder the arena roars, the thicker the corporate contracts grow, and old chivalry loses its way in between."
 TU_STATUS_TU_KJE_modern_label:0 "Modernization"
 TU_STATUS_TU_KJE_modern_value:0 "[?TU_KJE_modern|Y0] / 100"
 TU_STATUS_TU_KJE_modern_tt:0 "§YModernization§!: [?TU_KJE_modern|Y0] / 100\nHow far factories and research have reached the snow mountains. Modernity brings industry and research; tradition brings faith and stability.\n\n§gThe marks on the bar (30 · 40 · 50 · 60 · 70) are turning points.§!"
 TU_KJE_status_category:0 "Beneath the Eternal Snow"
 TU_KJE_status_category_desc:0 "Change comes to Kjerag as slowly as the snow melts. The three houses have long weighed factory smoke against the incense of the shrines."
 TU_STATUS_TU_KZD_contracts_label:0 "Active Mercenary Contracts"
 TU_STATUS_TU_KZD_contracts_value:0 "[?TU_KZD_contracts|Y0] / 3"
 TU_STATUS_TU_KZD_contracts_tt:0 "§YActive Mercenary Contracts§!: [?TU_KZD_contracts|Y0] / 3\nMercenary contracts currently in force. Up to §Y3§! can run at once."
 TU_KZD_status_category:0 "Mercenary Ledger"
 TU_KZD_status_category_desc:0 "A Sarkaz blade always has a price. Kazdel buys and sells wars with a single contract, and with that coin it rebuilds a nation on the ruins."
 TU_STATUS_TU_LAT_pilgrims_label:0 "Pilgrims"
 TU_STATUS_TU_LAT_pilgrims_value:0 "[?TU_LAT_pilgrims|Y0] / 200"
 TU_STATUS_TU_LAT_pilgrims_tt:0 "§YPilgrims§!: [?TU_LAT_pilgrims|Y0] / 200\nPilgrims who have come to the Holy City. They grow every month and dwindle in wartime. They can be spent on offerings, volunteers and festivals.\n\n§gThe marks on the bar (10 · 20 · 30 · 50 · 80 · 100) are turning points.§!"
 TU_STATUS_TU_LAT_influence_label:0 "Papal Influence"
 TU_STATUS_TU_LAT_influence_value:0 "[?TU_LAT_influence|Y0] / 100"
 TU_STATUS_TU_LAT_influence_tt:0 "§YPapal Influence§!: [?TU_LAT_influence|Y0] / 100\nHow far the voice of the Papal See reaches across Terra.\n\n§gThe marks on the bar (20 · 30) are turning points.§!"
 TU_LAT_status_category:0 "Pilgrim Register of the Holy City"
 TU_LAT_status_category_desc:0 "A city where gunfire rings out like festival salutes beneath the halos. The footsteps of pilgrims and the voice of the Papal See carry this small holy city across Terra."
 TU_STATUS_TU_LEI_resonance_label:0 "Arts Resonance"
 TU_STATUS_TU_LEI_resonance_value:0 "[?TU_LEI_resonance|Y0] / 100"
 TU_STATUS_TU_LEI_resonance_tt:0 "§YArts Resonance§!: [?TU_LEI_resonance|Y0] / 100\nThe resonance of Arts built up through concerts. §Y30§! resonance lets you stage a symphony.\n\n§gThe marks on the bar (30 · 50 · 90) are turning points.§!"
 TU_STATUS_TU_LEI_electors_label:0 "Loyal Electors"
 TU_STATUS_TU_LEI_electors_value:0 "[?TU_LEI_electors|Y0] / 7"
 TU_STATUS_TU_LEI_electors_tt:0 "§YLoyal Electors§!: [?TU_LEI_electors|Y0] / 7\nElectors who stand with the Empresses. With §Y5§! or more, an Imperial Edict can be issued.\n\n§gThe marks on the bar (2 · 3 · 4) are turning points.§!"
 TU_STATUS_TU_LEI_relics_label:0 "Relics of the Demon King"
 TU_STATUS_TU_LEI_relics_value:0 "[?TU_LEI_relics|Y0] / 3"
 TU_STATUS_TU_LEI_relics_tt:0 "§YRelics of the Demon King§!: [?TU_LEI_relics|Y0] / 3\nRelics of the Demon King's era scattered across the empire.\n\n§gThe marks on the bar (1 · 2) are turning points.§!"
 TU_LEI_status_category:0 "The Imperial Score"
 TU_LEI_status_category_desc:0 "The twin Empresses' Arts resound as music. The deeper the melody runs, the harder it becomes for the Electors to defy its harmony."
 TU_STATUS_TU_MIN_assembly_label:0 "Assembly Support"
 TU_STATUS_TU_MIN_assembly_value:0 "[?TU_MIN_assembly|Y0] / 100"
 TU_STATUS_TU_MIN_assembly_tt:0 "§YAssembly Support§!: [?TU_MIN_assembly|Y0] / 100\nHow much the Assembly trusts the government. Spent to pass bills.\n\n§gThe marks on the bar (10 · 15 · 30 · 70) are turning points.§!"
 TU_STATUS_TU_MIN_routes_label:0 "Sea Trade Routes"
 TU_STATUS_TU_MIN_routes_value:0 "[?TU_MIN_routes|Y0] / 6"
 TU_STATUS_TU_MIN_routes_tt:0 "§YSea Trade Routes§!: [?TU_MIN_routes|Y0] / 6\nSea lanes linking the five cities to the wider world.\n\n§gThe marks on the bar (1 · 2 · 3 · 4 · 5) are turning points.§!"
 TU_MIN_status_category:0 "Minutes of the Assembly"
 TU_MIN_status_category_desc:0 "The citizens of five cities gather on the stone steps. The oracle lights the path; the Assembly decides whether to walk it."
 TU_STATUS_TU_lmd_label:0 "LMD on Hand"
 TU_STATUS_TU_lmd_value:0 "[?TU_lmd|Y0] LMD"
 TU_STATUS_TU_lmd_tt:0 "§YLMD on Hand§!: [?TU_lmd|Y0] LMD\nRhodes Island's operating funds, spent on RIIC upgrades and operations."
 TU_STATUS_TU_RHO_lmd_income_label:0 "Monthly Income"
 TU_STATUS_TU_RHO_lmd_income_value:0 "[?TU_RHO_lmd_income|Y0] LMD"
 TU_STATUS_TU_RHO_lmd_income_tt:0 "§YMonthly Income§!: [?TU_RHO_lmd_income|Y0] LMD\nLMD coming in every month. Rises with the Trading Post level."
 TU_STATUS_TU_RHO_riic_power_label:0 "RIIC Power Plant"
 TU_STATUS_TU_RHO_riic_power_value:0 "[?TU_RHO_riic_power|Y0] / 3"
 TU_STATUS_TU_RHO_riic_power_tt:0 "§YRIIC Power Plant§!: [?TU_RHO_riic_power|Y0] / 3\nUp to level §Y3§!. Each level raises the other facilities' level cap by 1."
 TU_STATUS_TU_RHO_riic_factory_label:0 "RIIC Factory"
 TU_STATUS_TU_RHO_riic_factory_value:0 "[?TU_RHO_riic_factory|Y0] / [?TU_RHO_riic_cap|0]"
 TU_STATUS_TU_RHO_riic_factory_tt:0 "§YRIIC Factory§!: [?TU_RHO_riic_factory|Y0] / [?TU_RHO_riic_cap|0]\nEach level grants another offsite arms factory.\nLevel cap: Power Plant level + 2."
 TU_STATUS_TU_RHO_riic_trade_label:0 "RIIC Trading Post"
 TU_STATUS_TU_RHO_riic_trade_value:0 "[?TU_RHO_riic_trade|Y0] / [?TU_RHO_riic_cap|0]"
 TU_STATUS_TU_RHO_riic_trade_tt:0 "§YRIIC Trading Post§!: [?TU_RHO_riic_trade|Y0] / [?TU_RHO_riic_cap|0]\nEach level grants another offsite industrial complex and raises monthly LMD income.\nLevel cap: Power Plant level + 2."
 TU_STATUS_TU_RHO_riic_dorm_label:0 "RIIC Dormitory"
 TU_STATUS_TU_RHO_riic_dorm_value:0 "[?TU_RHO_riic_dorm|Y0] / [?TU_RHO_riic_cap|0]"
 TU_STATUS_TU_RHO_riic_dorm_tt:0 "§YRIIC Dormitory§!: [?TU_RHO_riic_dorm|Y0] / [?TU_RHO_riic_cap|0]\nImproves army organisation recovery and morale.\nLevel cap: Power Plant level + 2."
 TU_STATUS_TU_RHO_riic_reception_label:0 "RIIC Reception Room"
 TU_STATUS_TU_RHO_riic_reception_value:0 "[?TU_RHO_riic_reception|Y0] / [?TU_RHO_riic_cap|0]"
 TU_STATUS_TU_RHO_riic_reception_tt:0 "§YRIIC Reception Room§!: [?TU_RHO_riic_reception|Y0] / [?TU_RHO_riic_cap|0]\nIncreases political power gain. With La Résistance, it also boosts intelligence network gain.\nLevel cap: Power Plant level + 2."
 TU_STATUS_TU_RHO_pmc_count_label:0 "PMC Contracts"
 TU_STATUS_TU_RHO_pmc_count_value:0 "[?TU_RHO_pmc_count|Y0]"
 TU_STATUS_TU_RHO_pmc_count_tt:0 "§YPMC Contracts§!: [?TU_RHO_pmc_count|Y0]\nPMC contracts Rhodes Island currently holds."
 TU_RHO_status_category:0 "Landship Operations Report"
 TU_RHO_status_category_desc:0 "The regular report from the landship's office. Without LMD there is no medicine, no operation, no relief. Once again, papers awaiting the Doctor's signature pile up on the desk."
 TU_STATUS_TU_RIM_infection_label:0 "Oripathy Infection Rate"
 TU_STATUS_TU_RIM_infection_value:0 "[?TU_RIM_infection|Y0] / 100"
 TU_STATUS_TU_RIM_infection_tt:0 "§YOripathy Infection Rate§!: [?TU_RIM_infection|Y0] / 100\nOripathy spreading among miners and residents. Above §Y60§!, strikes and mass infections break out.\n\n§gThe marks on the bar (30 · 40 · 60 · 75) are turning points.§!"
 TU_STATUS_TU_RIM_ore_label:0 "Stockpiled Ore"
 TU_STATUS_TU_RIM_ore_value:0 "[?TU_RIM_ore|Y0] / 500"
 TU_STATUS_TU_RIM_ore_tt:0 "§YStockpiled Ore§!: [?TU_RIM_ore|Y0] / 500\nOre dug from the shafts. §G+5§! per shaft each month.\n\n§gThe marks on the bar (20 · 30 · 50 · 60 · 100 · 150) are turning points.§!"
 TU_STATUS_TU_RIM_shafts_label:0 "Originium Shafts"
 TU_STATUS_TU_RIM_shafts_value:0 "[?TU_RIM_shafts|Y0] / 8"
 TU_STATUS_TU_RIM_shafts_tt:0 "§YOriginium Shafts§!: [?TU_RIM_shafts|Y0] / 8\nOperating Originium shafts. Each gives §G+5§! ore and §R+1§! infection per month.\n\n§gThe marks on the bar (3 · 5) are turning points.§!"
 TU_STATUS_TU_RIM_settlements_label:0 "Settlements"
 TU_STATUS_TU_RIM_settlements_value:0 "[?TU_RIM_settlements|Y0] / 5"
 TU_STATUS_TU_RIM_settlements_tt:0 "§YSettlements§!: [?TU_RIM_settlements|Y0] / 5\nSettlements raised on the wasteland.\n\n§gThe marks on the bar (1 · 3) are turning points.§!"
 TU_RIM_status_category:0 "Mine Report"
 TU_RIM_status_category_desc:0 "Originium feeds Rim Billiton, and the same Originium eats away at the miners. With every new shaft, two numbers in the ledger rise together."
 TU_STATUS_TU_SAM_grace_label:0 "Grace of the Forest"
 TU_STATUS_TU_SAM_grace_value:0 "[?TU_SAM_grace|Y0] / 100"
 TU_STATUS_TU_SAM_grace_tt:0 "§YGrace of the Forest§!: [?TU_SAM_grace|Y0] / 100\nThe grace the forest grants the Sami. Each spirit pact costs §R-1§! per month. Below §Y20§!, the forest grows wrathful.\n\n§gThe marks on the bar (20 · 40 · 50 · 60 · 80) are turning points.§!"
 TU_STATUS_TU_SAM_contact_label:0 "Contact with the Outside"
 TU_STATUS_TU_SAM_contact_value:0 "[?TU_SAM_contact|Y0] / 100"
 TU_STATUS_TU_SAM_contact_tt:0 "§YContact with the Outside§!: [?TU_SAM_contact|Y0] / 100\nHow far the Sami have come into contact with the outside world.\n\n§gThe marks on the bar (60) are turning points.§!"
 TU_STATUS_TU_SAM_councils_label:0 "Tribal Councils"
 TU_STATUS_TU_SAM_councils_value:0 "[?TU_SAM_councils|Y0] / 3"
 TU_STATUS_TU_SAM_councils_tt:0 "§YTribal Councils§!: [?TU_SAM_councils|Y0] / 3\nTribal councils that have been convened.\n\n§gThe marks on the bar (2) are turning points.§!"
 TU_STATUS_TU_SAM_pacts_label:0 "Spirit Pacts"
 TU_STATUS_TU_SAM_pacts_value:0 "[?TU_SAM_pacts|Y0] / 2"
 TU_STATUS_TU_SAM_pacts_tt:0 "§YSpirit Pacts§!: [?TU_SAM_pacts|Y0] / 2\nSpirit pacts in force. Up to §Y2§! at once."
 TU_SAM_status_category:0 "Voice of the Forest"
 TU_SAM_status_category_desc:0 "The snow-covered forest speaks no words, but the shamans read its silence. The footsteps of the outside world have already reached the forest's edge."
 TU_STATUS_TU_SAR_gold_label:0 "Gold"
 TU_STATUS_TU_SAR_gold_value:0 "[?TU_SAR_gold|Y0] / 200"
 TU_STATUS_TU_SAR_gold_tt:0 "§YGold§!: [?TU_SAR_gold|Y0] / 200\nGold brought home by the caravans, which return 60 days after setting out.\n\n§gThe marks on the bar (20 · 25 · 30 · 40 · 50 · 60 · 100) are turning points.§!"
 TU_STATUS_TU_SAR_loyalty_label:0 "Loyalty of the Lords"
 TU_STATUS_TU_SAR_loyalty_value:0 "[?TU_SAR_loyalty|Y0] / 100"
 TU_STATUS_TU_SAR_loyalty_tt:0 "§YLoyalty of the Lords§!: [?TU_SAR_loyalty|Y0] / 100\nHow faithfully the lords serve the Padishah. Below §Y30§!, rebellion may break out.\n\n§gThe marks on the bar (30 · 40 · 45 · 50 · 70) are turning points.§!"
 TU_SAR_status_category:0 "The Padishah's Treasury"
 TU_SAR_status_category_desc:0 "Even beneath the palace's golden domes, the lords of desert and jungle behave like kings. Gold buys loyalty, and loyalty guards the gold."
 TU_STATUS_TU_SIR_law_label:0 "Authority of Law"
 TU_STATUS_TU_SIR_law_value:0 "[?TU_SIR_law|Y0] / 100"
 TU_STATUS_TU_SIR_law_tt:0 "§YAuthority of Law§!: [?TU_SIR_law|Y0] / 100\nThe weight the law still carries in the cities. Dealing with the Families weakens it; crackdowns strengthen it.\n\n§gThe marks on the bar (40 · 50 · 70) are turning points.§!"
 TU_STATUS_TU_SIR_bellone_label:0 "Bellone Family"
 TU_STATUS_TU_SIR_bellone_value:0 "[?TU_SIR_bellone|Y0] / 100"
 TU_STATUS_TU_SIR_bellone_tt:0 "§YBellone Family§!: [?TU_SIR_bellone|Y0] / 100\nThe Bellone Family's influence. It rises every month, grows with deals and shrinks with crackdowns.\n\n§gThe marks on the bar (50 · 60) are turning points.§!"
 TU_STATUS_TU_SIR_gambino_label:0 "Gambino Family"
 TU_STATUS_TU_SIR_gambino_value:0 "[?TU_SIR_gambino|Y0] / 100"
 TU_STATUS_TU_SIR_gambino_tt:0 "§YGambino Family§!: [?TU_SIR_gambino|Y0] / 100\nThe Gambino Family's influence. It rises every month, grows with deals and shrinks with crackdowns.\n\n§gThe marks on the bar (50 · 60) are turning points.§!"
 TU_STATUS_TU_SIR_saluzzo_label:0 "Saluzzo Family"
 TU_STATUS_TU_SIR_saluzzo_value:0 "[?TU_SIR_saluzzo|Y0] / 100"
 TU_STATUS_TU_SIR_saluzzo_tt:0 "§YSaluzzo Family§!: [?TU_SIR_saluzzo|Y0] / 100\nThe Saluzzo Family's influence. It rises every month, grows with deals and shrinks with crackdowns.\n\n§gThe marks on the bar (50 · 60) are turning points.§!"
 TU_SIR_status_category:0 "Ledger of the Wolves"
 TU_SIR_status_category_desc:0 "On Siracusa's streets the law is just paper on a wall; the real code lives in the fangs of the Families. Who you shake hands with decides the city's tomorrow."
