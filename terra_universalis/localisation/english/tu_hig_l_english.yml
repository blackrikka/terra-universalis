 tu_hig_ev.1.t:0 "The Island at the Edge of the Sea"
 tu_hig_ev.1.d:0 "Cherry blossoms drift over the shogun's castle. Rumour speaks of strange smoke beyond the horizon."
 tu_hig_ev.1.a:0 "The door stays shut."
 tu_hig_ev.1.b:0 "Time to look outside."
 tu_hig_ev.20.t:0 "Arrival of the Black Ships"
 tu_hig_ev.20.d:0 "Foreign ships belching black smoke have anchored before the harbour. They demand we open our ports."
 tu_hig_ev.20.a:0 "Accept."
 tu_hig_ev.20.b:0 "Stall for time."
 tu_hig_ev.21.t:0 "Revere the Emperor"
 tu_hig_ev.21.d:0 "Young samurai cry: 'Revere the emperor, expel the barbarians!'"
 tu_hig_ev.21.a:0 "Sympathise with them."
 tu_hig_ev.21.b:0 "Suppress them."
 TU_HIG_foreign_m25_tt:0 "§RForeign Influence§! -25"
 TU_HIG_foreign_m15_tt:0 "§RForeign Influence§! -15"
 tu_hig_ev.22.t:0 "Loyalist Uprising"
 tu_hig_ev.22.d:0 "Samurai enraged by foreign influence attack the foreign quarter and denounce the shogunate."
 tu_hig_ev.22.a:0 "Crush the uprising."
 tu_hig_ev.22.b:0 "Join the uprising."
 tu_hig_ev.22.c:0 "Send the foreigners away."
 tu_hig_ev.23.t:0 "Gifts from Foreign Merchants"
 tu_hig_ev.23.d:0 "Foreign merchants present curious machines as gifts."
 tu_hig_ev.23.a:0 "Study them."
 tu_hig_ev.24.t:0 "A Shinobi Betrays"
 tu_hig_ev.24.d:0 "A shinobi sold our secrets abroad."
 tu_hig_ev.24.a:0 "Hunt him down."
 tu_hig_ev.24.b:0 "Reorganise the network."
 tu_hig_ev.25.t:0 "Unemployed Samurai"
 tu_hig_ev.25.d:0 "Samurai who lost their stipends wander the streets."
 tu_hig_ev.25.a:0 "Take them into the army."
 tu_hig_ev.25.b:0 "Leave them."
 tu_hig_ev.26.t:0 "Earthquake"
 tu_hig_ev.26.d:0 "A great earthquake shook the capital."
 tu_hig_ev.26.a:0 "Begin relief."
 tu_hig_ev.27.t:0 "Trouble in the Foreign Quarter"
 tu_hig_ev.27.d:0 "Drunken foreign sailors brawled with townspeople."
 tu_hig_ev.27.a:0 "Protest to the consul."
 tu_hig_ev.27.b:0 "Let it pass."
 tu_hig_ev.28.t:0 "The Shogunate"
 tu_hig_ev.28.d:0 "The shogunate stands firm once more."
 tu_hig_ev.28.a:0 "Long live the shogunate."
 tu_hig_ev.29.t:0 "The Opened Far East"
 tu_hig_ev.29.d:0 "The Far East has joined the world."
 tu_hig_ev.29.a:0 "Onward."
 tu_hig_ev.30.t:0 "Imperial Restoration"
 tu_hig_ev.30.d:0 "The shogun has returned rule to the emperor."
 tu_hig_ev.30.a:0 "Long live the emperor."
