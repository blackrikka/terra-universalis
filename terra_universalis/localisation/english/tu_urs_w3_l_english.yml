l_english:
 TU_URS_w3_kaz_entry:0 "Contact with Kazimierz"
 TU_URS_w3_kaz_entry_desc:0 "Make first contact with the sporting nation of Kazimierz. Political power rises slightly."
 TU_URS_w3_kaz_envoy:0 "Knightly Envoys"
 TU_URS_w3_kaz_envoy_desc:0 "Send envoys to Kazimierz to strengthen ties. Relations improve and political power rises."
 TU_URS_w3_kaz_claims:0 "Claims on Kazimierz"
 TU_URS_w3_kaz_claims_desc:0 "Declare Ursine rights over the Kazimierzian provinces. War support rises."
 TU_URS_w3_kaz_trade:0 "Commercial Accord"
 TU_URS_w3_kaz_trade_desc:0 "Sign a non-aggression pact with the Kazimierzian trade league. Political power rises."
 TU_URS_w3_kaz_wargoal:0 "Casus Belli in Kazimierz"
 TU_URS_w3_kaz_wargoal_desc:0 "Set the war aims to reclaim the claimed territory."
 TU_URS_w3_kaz_access:0 "Transit Rights"
 TU_URS_w3_kaz_access_desc:0 "Gain military access through Kazimierzian territory. Political power rises."
 TU_URS_w3_kaz_offensive:0 "Winged Pegasus Deployment"
 TU_URS_w3_kaz_offensive_desc:0 "Send the rapid strike cavalry to the front and gain army experience. War support rises slightly."
 TU_URS_w3_kaz_guarantee:0 "Kazimierzian Guarantee"
 TU_URS_w3_kaz_guarantee_desc:0 "Sign a treaty guaranteeing Kazimierz's independence. Requires the Emperor's assent. Political power rises greatly."
 TU_URS_w3_kaz_protectorate:0 "Kazimierzian Protectorate"
 TU_URS_w3_kaz_protectorate_desc:0 "Bring Kazimierz under a protectorate. Stability rises and a dedicated idea is gained."
 TU_URS_w3_kaz_occupation:0 "Occupation of Kazimierz"
 TU_URS_w3_kaz_occupation_desc:0 "Bind the occupied Kazimierzian provinces to an administration. Army experience rises and stability falls."
 TU_URS_w3_kje_entry:0 "Contact with Kjerag"
 TU_URS_w3_kje_entry_desc:0 "Open a line of communication with the mountain nation of Kjerag. Political power rises slightly."
 TU_URS_w3_kje_pact:0 "Mountain Non-Aggression"
 TU_URS_w3_kje_pact_desc:0 "Sign a non-aggression pact with Kjerag and steady the border. Political power rises."
 TU_URS_w3_kje_claims:0 "Claims on the Mountains"
 TU_URS_w3_kje_claims_desc:0 "Declare rights over the Kjerag mountain provinces. War support rises slightly. Requires the Emperor's personal rule."
 TU_URS_w3_kje_trade:0 "Kjerag Trade Road"
 TU_URS_w3_kje_trade_desc:0 "Open a trade road over the mountains. Political power rises greatly and a trade road idea is gained."
 TU_URS_w3_kje_wargoal:0 "Casus Belli in the Mountains"
 TU_URS_w3_kje_wargoal_desc:0 "Set the war aims to take the claimed mountain provinces."
 TU_URS_w3_kje_access:0 "Mountain Pass Rights"
 TU_URS_w3_kje_access_desc:0 "Gain military access to the Kjerag mountain passes. Political power rises."
 TU_URS_w3_kje_offensive:0 "Breaking the Ridge"
 TU_URS_w3_kje_offensive_desc:0 "Send mountain troops to break through the Kjerag ridge. Army experience and manpower rise. Requires the military junta path."
 TU_URS_w3_kje_union:0 "Kjerag Defence Guarantee"
 TU_URS_w3_kje_union_desc:0 "Sign a defence guarantee with Kjerag. Gains the mountain garrison idea."
 TU_URS_w3_sami_entry:0 "Contact with the Sami"
 TU_URS_w3_sami_entry_desc:0 "Make first contact with the Sami, the survivors of the tundra. Political power rises slightly."
 TU_URS_w3_sami_aid:0 "Sami Relief Supplies"
 TU_URS_w3_sami_aid_desc:0 "Send food and medicine to the Sami on the ice fields. Relations improve and stability rises slightly."
 TU_URS_w3_sami_annex_plan:0 "Sami Territorial Plan"
 TU_URS_w3_sami_annex_plan_desc:0 "Draw up a plan to bring the Sami snowfields into Ursine territory. War support rises. Requires the military junta path."
 TU_URS_w3_sami_ski:0 "Ski Infantry Corps"
 TU_URS_w3_sami_ski_desc:0 "Form Sami ski infantry. Gains a dedicated idea and army experience."
 TU_URS_w3_sami_puppet:0 "Pretext for a Sami Puppet"
 TU_URS_w3_sami_puppet_desc:0 "Set the war aims to turn the Sami into a puppet state."
 TU_URS_w3_sami_protocol:0 "Sami Transit Protocol"
 TU_URS_w3_sami_protocol_desc:0 "Gain military access across the Sami snowfields. Political power rises."
 TU_URS_w3_sami_control:0 "Control of the Snowfields"
 TU_URS_w3_sami_control_desc:0 "Occupy and control the Sami snowfield provinces. Army experience and war support rise."
 TU_URS_w3_sami_autonomy:0 "Sami Autonomy Guarantee"
 TU_URS_w3_sami_autonomy_desc:0 "Sign a treaty guaranteeing Sami self-rule. Political power and stability rise."
 TU_URS_w3_sami_administration:0 "Snowfield Administration"
 TU_URS_w3_sami_administration_desc:0 "Fold the occupied snowfields into the administrative system. Gains a dedicated idea and manpower."
 TU_URS_w3_infi_entry:0 "Begin Ice Field Survey"
 TU_URS_w3_infi_entry_desc:0 "Prepare to explore the unknown northern reaches of the Infi ice field. Political power rises."
 TU_URS_w3_infi_survey:0 "Ice Field Survey Research"
 TU_URS_w3_infi_survey_desc:0 "Survey the terrain of the ice field. Gains an electronics technology bonus and political power rises."
 TU_URS_w3_infi_drilling:0 "Ice Field Drilling"
 TU_URS_w3_infi_drilling_desc:0 "Drill for the resources beneath the ice. A random core state gains manganese."
 TU_URS_w3_infi_cold_lab:0 "Cryogenic Laboratory"
 TU_URS_w3_infi_cold_lab_desc:0 "Research equipment that can survive the cold. Gains a dedicated idea and political power rises."
 TU_URS_w3_infi_mining:0 "Glacier Mine"
 TU_URS_w3_infi_mining_desc:0 "A random core state gains aketon."
 TU_URS_w3_infi_frost_gear:0 "Frost Gear"
 TU_URS_w3_infi_frost_gear_desc:0 "Supply troops with cold-weather gear. Losses to the cold fall and army experience rises. Requires the reform path."
 TU_URS_w3_infi_pipeline:0 "Glacier Supply Road"
 TU_URS_w3_infi_pipeline_desc:0 "Build a road across the glacier. Supply consumption falls and political power rises."
 TU_URS_w3_infi_mine_vein:0 "Underground Vein"
 TU_URS_w3_infi_mine_vein_desc:0 "A random core state gains oriron. Political power rises."
 TU_URS_w3_infi_resource_mobilization:0 "Total Mobilisation of the Ice Field"
 TU_URS_w3_infi_resource_mobilization_desc:0 "A random core state gains originium. War support rises slightly."
 TU_URS_w3_infi_survey_bonus:0 "Ice Field Survey Bonus"
 TU_URS_w3_infi_polar_bonus:0 "Polar Tactics Bonus"
 TU_URS_w4_northern_pact:0 "Northern Pact"
 TU_URS_w4_pact_entry:0 "Concept of the Northern Pact"
 TU_URS_w4_pact_entry_desc:0 "Conceive a pact to bind the northern nations. Political power rises."
 TU_URS_alliance_search:0 "Search for Allies"
 TU_URS_alliance_search_desc:0 "Sound out nations for alliances and open the path to alliance diplomacy. Political power rises."
 TU_URS_w4_pact_charter:0 "Found the Northern Pact"
 TU_URS_w4_pact_charter_desc:0 "Found the Northern Pact and bring neighbouring nations into it. Neighbours not yet in a faction join automatically."
 TU_URS_w4_pact_neutral:0 "Tundra Neutrality Treaty"
 TU_URS_w4_pact_neutral_desc:0 "Refuse a pact and sign only non-aggression treaties with the neighbours. Stability rises slightly."
 TU_URS_w4_pact_defence:0 "Pact Defence Line"
 TU_URS_w4_pact_defence_desc:0 "Share the defence of the pact members. Gains the Northern Unity idea."
 TU_URS_w4_pact_common_army:0 "Pact Joint Army"
 TU_URS_w4_pact_common_army_desc:0 "Form a joint army with pact members. Army experience and war support rise. Requires the military junta path."
 TU_URS_w4_pact_secretariat:0 "Pact Secretariat"
 TU_URS_w4_pact_secretariat_desc:0 "Establish a secretariat for the pact. Political power and stability rise. Requires the reform path."
 TU_URS_w4_order_entry:0 "Concept of the Terra Order"
 TU_URS_w4_order_entry_desc:0 "Decide the direction for an order across Terra. Political power rises."
 TU_URS_w4_order_doctrine:0 "Doctrine of Force"
 TU_URS_w4_order_doctrine_desc:0 "Establish a doctrine for imposing order by force. War support and army experience rise. Requires the Emperor's personal rule."
 TU_URS_w4_order_council:0 "Order Council"
 TU_URS_w4_order_council_desc:0 "Bind several nations into a council to build order. Political power and stability rise."
 TU_URS_w4_order_mandate:0 "Mandate of Terra Order"
 TU_URS_w4_order_mandate_desc:0 "Issue a mandate to punish nations that undermine order. Gains a dedicated idea."
 TU_URS_w4_order_enforcement:0 "Enforcement of Order"
 TU_URS_w4_order_enforcement_desc:0 "Set the war aims to make Kazdel a puppet for defying order. Requires the military junta path."
 TU_URS_w4_order_hegemony:0 "Terran Hegemony"
 TU_URS_w4_order_hegemony_desc:0 "Set the war aims for a full war to bring Victoria to heel. Political power rises."
 TU_URS_w4_rho_entry:0 "Contact with Rhodes Island"
 TU_URS_w4_rho_entry_desc:0 "Make first contact with Rhodes Island, the land-ship company. Political power rises."
 TU_URS_w4_rho_coop:0 "Cooperation with Rhodes Island"
 TU_URS_w4_rho_coop_desc:0 "Form a cooperative relationship with Rhodes Island. Relations improve and military access is gained. Political power rises."
 TU_URS_w4_rho_hostile:0 "Pressure on Rhodes Island"
 TU_URS_w4_rho_hostile_desc:0 "Apply hard diplomatic pressure on Rhodes Island. Relations worsen; political power and war support rise slightly."
 TU_URS_w4_rho_trade_pact:0 "Rhodes Trade Accord"
 TU_URS_w4_rho_trade_pact_desc:0 "Sign a trade accord with the Rhodes Island merchants. Gains a dedicated idea and political power rises."
 TU_URS_w4_rho_blockade:0 "Rhodes Blockade Line"
 TU_URS_w4_rho_blockade_desc:0 "Build a blockade line around Rhodes Island. Army experience and war support rise."
 TU_URS_w4_rho_joint_op:0 "Joint Operation with Rhodes Island"
 TU_URS_w4_rho_joint_op_desc:0 "Run a joint operation with Rhodes Island. Gains a guarantee and political power."
 TU_URS_w4_reu_entry:0 "Response to the Reunion Crisis"
 TU_URS_w4_reu_entry_desc:0 "Confront Reunion after the Chernobog incident. Political power rises."
 TU_URS_w4_reu_crush:0 "Crushing Reunion"
 TU_URS_w4_reu_crush_desc:0 "Set the war aims to crush Reunion by force."
 TU_URS_w4_reu_negotiate:0 "Negotiating with Reunion"
 TU_URS_w4_reu_negotiate_desc:0 "Open a negotiating table with Reunion. Relations improve and stability rises slightly."
 TU_URS_w4_reu_army:0 "Suppression Army"
 TU_URS_w4_reu_army_desc:0 "Form a suppression army and send it to the front. Army experience and manpower rise."
 TU_URS_w4_reu_autonomy:0 "Recognise Reunion's Autonomy"
 TU_URS_w4_reu_autonomy_desc:0 "Recognise Reunion's autonomy. Gains a dedicated idea and political power rises. Requires the reform path."
 TU_URS_w4_reu_rebuild:0 "Rebuilding Chernobog"
 TU_URS_w4_reu_rebuild_desc:0 "After the Chernobog incident is resolved, rebuild the city. Stability and political power rise slightly."
 TU_URS_w4_reu_union_pact:0 "Reunion Union Pact"
 TU_URS_w4_reu_union_pact_desc:0 "Sign a guarantee treaty with Reunion and gain a large amount of political power."
 TU_URS_w3_idea_kaz_protectorate:0 "Kazimierzian Protectorate"
 TU_URS_w3_idea_kaz_protectorate_desc:0 "The protectorate calms the population. Stability rises."
 TU_URS_w3_idea_kaz_occupation:0 "Occupation Regime in Kazimierz"
 TU_URS_w3_idea_kaz_occupation_desc:0 "The occupation regime fuels resentment. War support rises."
 TU_URS_w3_idea_kje_trade_road:0 "Kjerag Trade Road"
 TU_URS_w3_idea_kje_trade_road_desc:0 "The mountain trade road speeds civilian construction."
 TU_URS_w3_idea_kje_mountain_garrison:0 "Mountain Garrisons"
 TU_URS_w3_idea_kje_mountain_garrison_desc:0 "Mountain garrisons raise Ursine defence."
 TU_URS_w3_idea_sami_ski_troops:0 "Snowfield Ski Infantry"
 TU_URS_w3_idea_sami_ski_troops_desc:0 "Ski infantry raises attack on the snowfields."
 TU_URS_w3_idea_sami_administration:0 "Sami Administration"
 TU_URS_w3_idea_sami_administration_desc:0 "Sami self-government administration raises stability."
 TU_URS_w3_idea_infi_survey_team:0 "Ice Field Survey Team"
 TU_URS_w3_idea_infi_survey_team_desc:0 "The survey team speeds up research."
 TU_URS_w3_idea_infi_frost_gear:0 "Frost Gear"
 TU_URS_w3_idea_infi_frost_gear_desc:0 "Cold-weather gear reduces losses to the cold."
 TU_URS_w3_idea_infi_supply_road:0 "Glacier Supply Road"
 TU_URS_w3_idea_infi_supply_road_desc:0 "The supply road reduces supply consumption."
 TU_URS_w4_idea_pact_unity:0 "Northern Unity"
 TU_URS_w4_idea_pact_unity_desc:0 "The unity of the Northern Pact members raises war support and stability."
 TU_URS_w4_idea_order_mandate:0 "Mandate of Order"
 TU_URS_w4_idea_order_mandate_desc:0 "The mandate of order raises political power gain."
 TU_URS_w4_idea_rho_partner:0 "Rhodes Merchant Partnership"
 TU_URS_w4_idea_rho_partner_desc:0 "Partnership with the Rhodes merchants speeds production."
 TU_URS_w4_idea_reu_autonomy:0 "Reunion Autonomy"
 TU_URS_w4_idea_reu_autonomy_desc:0 "Recognised autonomy for Reunion raises stability."
