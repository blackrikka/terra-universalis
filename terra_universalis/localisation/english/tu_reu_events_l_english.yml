l_english:
 tu_reu_ev.1.t:0 "The Black Serpent's Banner"
 tu_reu_ev.1.d:0 "Talulah stands ready to declare conquest in the name of the Black Serpent. The infected wait to see whether they will follow her or choose the defence of the frozen lands. Reunion's first course is set by this speech."
 tu_reu_ev.1.a:0 "Take the path of conquest and raise the Black Serpent's banner"
 tu_reu_ev.1.b:0 "Put the defence of the frozen lands first and calm the people"
 tu_reu_ev.2.t:0 "The March on Ursus"
 tu_reu_ev.2.d:0 "With the order to begin conquest, the Black Serpent Legion moves toward the northern border. The Ursus dukes are still waiting for the Empire's command. The commanders must decide between an all-out war and buying time through negotiation."
 tu_reu_ev.2.a:0 "March into northern Ursus"
 tu_reu_ev.2.b:0 "Slow the advance and open negotiations"
 tu_reu_ev.3.t:0 "The Frozen Bastion"
 tu_reu_ev.3.d:0 "The fortress raised on the frozen ground is nearing completion. Relief engineers from Rhodes Island helped build its walls. The leadership must decide what face to show once the fortress is finished."
 tu_reu_ev.3.a:0 "Complete the fortress and harden the defence line"
 tu_reu_ev.3.b:0 "Openly strengthen the alliance with Rhodes"
 tu_reu_ev.4.t:0 "The Heart of Chernobog"
 tu_reu_ev.4.d:0 "The central engine of the mobile city Chernobog has awakened. Infected engineers call it the heart of Reunion. The leadership must decide whether to run the engine and complete the city, or seal it away and keep watch."
 tu_reu_ev.4.a:0 "Run the heart and complete the mobile city"
 tu_reu_ev.4.b:0 "Seal the heart and keep it under watch"
 tu_reu_ev.5.t:0 "The War Without End"
 tu_reu_ev.5.d:0 "Guerrilla units stage ambushes every night in the mountains and ruins. The militias are worn down, yet no city has been fully taken. The leadership must decide whether to keep the guerrillas growing or let them rest."
 tu_reu_ev.5.a:0 "Keep the guerrillas growing and shake the front"
 tu_reu_ev.5.b:0 "End the fighting and let the forces recover"
 tu_reu_ev.6.t:0 "Total Mobilisation"
 tu_reu_ev.6.d:0 "A total mobilisation order has gone out across Reunion. The infected take up their weapons and head for the assembly points. The leadership must decide whether to mobilise the entire population or scale the call back."
 tu_reu_ev.6.a:0 "Mobilise the entire population"
 tu_reu_ev.6.b:0 "Scale back the call and protect production"
 tu_reu_ev.7.t:0 "The Infected Uprising"
 tu_reu_ev.7.d:0 "The infected have risen under the banner of Reunion. The rebel force that declared independence has raised its first flag. Neighbouring powers have begun to weigh the news in their own calculations."
 tu_reu_ev.7.a:0 "Read the report"
 tu_reu_ev.8.t:0 "Patriot, New Leader"
 tu_reu_ev.8.d:0 "Patriot has been raised as the new leader of Reunion. Infected society is uniting under his name. Ursus and Rhodes Island are both watching to see what he does next."
 tu_reu_ev.8.a:0 "Read the report"
 tu_reu_ev.20.t:0 "Refugee Caravans"
 tu_reu_ev.20.d:0 "Caravans of refugees from the area around Chernobog are pouring toward the Reunion border. Food and medicine are far short of what is needed. The leadership must decide whether to let the caravans in or set them up outside the cities."
 tu_reu_ev.20.a:0 "Let the caravans in and begin relief"
 tu_reu_ev.20.b:0 "Set up temporary camps outside the cities and keep distance"
 tu_reu_ev.21.t:0 "The Chernobog Records"
 tu_reu_ev.21.d:0 "Research records left behind in Chernobog have been found. They describe the history of the infected and the start of the uprising. The leadership must decide whether to publish the records or seal them."
 tu_reu_ev.21.a:0 "Publish the records to show transparency"
 tu_reu_ev.21.b:0 "Seal the records and keep them within the leadership"
 tu_reu_ev.22.t:0 "The Liberated Councils"
 tu_reu_ev.22.d:0 "Infected councils are being formed in every liberated district. The councils put their own survival ahead of orders from the centre. The leadership must decide whether to give the councils real authority or place them under central command."
 tu_reu_ev.22.a:0 "Hand real authority to the councils"
 tu_reu_ev.22.b:0 "Place the councils under central command"
 tu_reu_ev.31.t:0 "Ursus Answers"
 tu_reu_ev.31.d:0 "The Ursus Empire has moved a great army in answer to the attack on its northern border. The dukes are divided between obeying the Empire and defending their own domains. The leadership must decide whether to strike back across the border or open talks."
 tu_reu_ev.31.a:0 "Strike back across the border"
 tu_reu_ev.31.b:0 "Halt the advance and open negotiations"
