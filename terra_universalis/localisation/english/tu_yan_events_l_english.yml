l_english:
 TU_YAN_ev_idea_court_unity:0 "Court Unity"
 TU_YAN_ev_idea_court_unity_desc:0 "The court's ministers move as one. Stability rises slightly and political power gain is faster."
 TU_YAN_ev_idea_court_unrest:0 "Court Unrest"
 TU_YAN_ev_idea_court_unrest_desc:0 "Factional strife spreads among the ministers. Stability falls and political power gain is slower."
 TU_YAN_ev_idea_spirit_fervor:0 "Fervor of the Spirits"
 TU_YAN_ev_idea_spirit_fervor_desc:0 "Every temple is filled with fervor for the spirits. War support rises."

 tu_yan_ev.1.t:0 "Edict of Court Reform"
 tu_yan_ev.1.d:0 "A draft edict to overhaul the old order of the court has reached the throne. The ministers are watching one another, and the provinces doubt that any reform will truly be carried out. The emperor must set the course of the realm with this decree."
 tu_yan_ev.1.a:0 "Promulgate the edict at once"
 tu_yan_ev.1.b:0 "Revise the edict with the ministers"
 tu_yan_ev.1.c:0 "Postpone the reform for now"

 tu_yan_ev.2.t:0 "Memorials on Bureaucratic Modernization"
 tu_yan_ev.2.d:0 "Since the modernization of the bureaucracy began, memorials from the provinces have piled up like mountains. The throne must decide whether to abandon the old paper system for a new review office or leave it in the hands of the existing clerks. Either way, the balance of power among the officials will be decided."
 tu_yan_ev.2.a:0 "Found a new review office"
 tu_yan_ev.2.b:0 "Handle provincial reports first"
 tu_yan_ev.2.c:0 "Keep the old clerical system"

 tu_yan_ev.3.t:0 "The Return of Chongyue"
 tu_yan_ev.3.d:0 "Chongyue, the eldest brother, has returned from the front, passed through the capital gate and entered the court. The soldiers hail him as a hero, while the ministers watch the military power he holds with suspicion. The paths of the three brothers begin to diverge here."
 tu_yan_ev.3.a:0 "Hold a welcome banquet to lift morale"
 tu_yan_ev.3.b:0 "Hear the front reports in person"
 tu_yan_ev.3.c:0 "Bring the army's command under the court"

 tu_yan_ev.4.t:0 "Declaration of Personal Rule"
 tu_yan_ev.4.d:0 "The emperor has declared that he will personally stand above the court and govern the realm. The old advisory council is doomed to dissolution, and the great lords have yet to decide how to answer. The first decree of personal rule will soon be issued."
 tu_yan_ev.4.a:0 "Issue a proclamation to assert authority"
 tu_yan_ev.4.b:0 "Summon the great lords and state the will"
 tu_yan_ev.4.c:0 "Dissolve the advisory council at once"

 tu_yan_ev.5.t:0 "The Division of the Three Brothers"
 tu_yan_ev.5.d:0 "The three brothers have split their forces and become warlords. The court's orders no longer reach beyond the border, and the soldiers wonder which brother's banner to follow. The emperor must decide whether to mend this division or let it stand."
 tu_yan_ev.5.a:0 "Divide the army among the brothers"
 tu_yan_ev.5.b:0 "Win the brothers over and bind them to the court"
 tu_yan_ev.5.c:0 "Crush the warlords by force"

 tu_yan_ev.6.t:0 "Memorial of the Guard Bureau"
 tu_yan_ev.6.d:0 "The Imperial Guard Bureau has submitted a memorial asking for reorganization. It proposes binding the guard's powers in law and drafting a charter. Conservative ministers regard this as a blow to the authority of the throne."
 tu_yan_ev.6.a:0 "Approve the reorganization and draft a charter"
 tu_yan_ev.6.b:0 "Review the draft first"
 tu_yan_ev.6.c:0 "Calm the conservative backlash"

 tu_yan_ev.7.t:0 "The Temples of the Spirits"
 tu_yan_ev.7.d:0 "Temples to the spirits have opened at once in the capital and in the countryside. The priests use their oracles to rally the people, and the court's officials fear how far that power may grow. The throne must choose whether to nurture the faith or hold it in check."
 tu_yan_ev.7.a:0 "Open the temples and nurture the faith"
 tu_yan_ev.7.b:0 "Keep watch over the priests"
 tu_yan_ev.7.c:0 "Seek an oracle on matters of state"

 tu_yan_ev.8.t:0 "The Council of the Three Brothers"
 tu_yan_ev.8.d:0 "The three brothers have gathered in one place. Their long-divided talk filled the hall with tales of the hunt and reports from the front. What is decided at this council will shape how the brothers stay bound together."
 tu_yan_ev.8.a:0 "Share authority among the three brothers"
 tu_yan_ev.8.b:0 "Give Nian the workshops"
 tu_yan_ev.8.c:0 "Grant Chongyue full authority"

 tu_yan_ev.9.t:0 "Debate on the Lungmen Policy"
 tu_yan_ev.9.d:0 "Merchants and officials of Lungmen have sent envoys asking for self-rule. The ministers at court are divided over whether to grant autonomy or bring the city under direct rule. The direction chosen here will decide relations between Yan and Lungmen."
 tu_yan_ev.9.a:0 "Guarantee autonomy"
 tu_yan_ev.9.b:0 "Consider direct rule"
 tu_yan_ev.9.c:0 "Begin with a trade pact"

 tu_yan_ev.10.t:0 "Direct Rule over Lungmen"
 tu_yan_ev.10.d:0 "Lungmen has become a direct territory of Yan. Citizens who lost their self-rule gather before the city gates in protest, and documents from the new governor's office pass back and forth through the night. How this discontent is handled will shape public opinion for months to come."
 tu_yan_ev.10.a:0 "Suppress the protests"
 tu_yan_ev.10.b:0 "Govern through dialogue"
 tu_yan_ev.10.c:0 "Waive taxes for a time"

 tu_yan_ev.11.t:0 "The Lungmen Trade Pact"
 tu_yan_ev.11.d:0 "A draft trade pact with Lungmen is complete. Customs officers at the harbor dispute the tariff rates, and once the pact is signed, political influence and trade routes will open together. How the terms are set is up to the court."
 tu_yan_ev.11.a:0 "Sign the pact"
 tu_yan_ev.11.b:0 "Raise tariffs for profit"
 tu_yan_ev.11.c:0 "Hold the pact in abeyance"

 tu_yan_ev.12.t:0 "The Lungmen Autonomy Charter"
 tu_yan_ev.12.d:0 "The Lungmen autonomy charter has reached the court. It leaves the city's courts and customs as they are, yet it does not clearly state how far imperial oversight may reach. Ratifying the charter will bring the two cities closer together."
 tu_yan_ev.12.a:0 "Ratify the charter"
 tu_yan_ev.12.b:0 "Approve with conditions"
 tu_yan_ev.12.c:0 "Tear up the charter"

 tu_yan_ev.13.t:0 "The Sui Accord"
 tu_yan_ev.13.d:0 "An accord reviving an old promise among the three brothers has come forward. If signed, distrust among the brothers will ease and the court may catch its breath. Some clauses, however, divide the brothers' authority among them."
 tu_yan_ev.13.a:0 "Sign the accord"
 tu_yan_ev.13.b:0 "Approve with conditions"
 tu_yan_ev.13.c:0 "Annul the accord"

 tu_yan_ev.14.t:0 "The Sleeping Giant Stirs"
 tu_yan_ev.14.d:0 "Industry that had long slumbered has awakened. Factory chimneys rise one after another, and the court must decide where to put this momentum. Expanding the industrial estates is at once a question of labor and of tax revenue."
 tu_yan_ev.14.a:0 "Build more factories"
 tu_yan_ev.14.b:0 "Draft rural labor"
 tu_yan_ev.14.c:0 "Reorganize industrial guilds"

 tu_yan_ev.15.t:0 "An Envoy to Lungmen"
 tu_yan_ev.15.d:0 "With personal rule taking firm hold, the emperor wishes to send an envoy to Lungmen and demand obedience. Lungmen's merchants are already preparing to resist, citing their trade routes. Whom the envoy travels with will decide how this conflict ends."
 tu_yan_ev.15.a:0 "Send a formal embassy"
 tu_yan_ev.15.b:0 "Refuse to send an envoy"
 tu_yan_ev.15.c:0 "Send only a retinue"

 tu_yan_ev.16.t:0 "The Seal of Heaven's Mandate"
 tu_yan_ev.16.d:0 "The imperial seal now stamps every edict. News that personal rule has been completed has spread across the capital, and officials from every province have memorialized, pledging to serve the emperor's will."
 tu_yan_ev.16.a:0 "The mandate rests with the Emperor"

 tu_yan_ev.17.t:0 "The Realm of the Three Brothers"
 tu_yan_ev.17.d:0 "Word has spread that the three brothers, once divided, have joined hands again and set their eyes on the realm. Neighboring states are watching closely to see where this alliance will go."
 tu_yan_ev.17.a:0 "The realm gathers as one"

 tu_yan_ev.18.t:0 "The Constitutional Republic Proclaimed"
 tu_yan_ev.18.d:0 "Yan has proclaimed a constitutional republic and installed a new chancellor. Parties have been re-formed, and citizens poured into the streets on hearing that elections will soon be held."
 tu_yan_ev.18.a:0 "A new era has begun"

 tu_yan_ev.19.t:0 "Proclamation of the Spirit Theocracy"
 tu_yan_ev.19.d:0 "The Grand High Priest has declared the establishment of a spirit theocracy. Temple bells rang over the capital, and neighboring states fear how far Yan's faith will extend."
 tu_yan_ev.19.a:0 "Serve the will of the spirits"

 tu_yan_ev.20.t:0 "Rumors at Court"
 tu_yan_ev.20.d:0 "Rumors circulating at court will not die down. One minister is said to have denounced an imperial favorite, and others speak of intrigue over a vacant post. The throne must decide whether to probe the truth of these rumors or ignore them."
 tu_yan_ev.20.a:0 "Investigate the truth"
 tu_yan_ev.20.b:0 "Ignore the rumors"
 tu_yan_ev.20.c:0 "Punish those who spread them"

 tu_yan_ev.21.t:0 "Merchants of the Grand Canal"
 tu_yan_ev.21.d:0 "Merchant ships line up along the Grand Canal. The traders petition for lower lock tolls, while the officials guarding the sluices insist that tax revenue must not fall. Since the canal is the lifeblood of the realm, the decision must be made with care."
 tu_yan_ev.21.a:0 "Lower the tolls"
 tu_yan_ev.21.b:0 "Keep the current tolls"
 tu_yan_ev.21.c:0 "Tighten the sluices and collect more"

 tu_yan_ev.22.t:0 "The Caravan of the Mobile City"
 tu_yan_ev.22.d:0 "A caravan of the mobile city is moving along the railway near the border. It asks every village it passes for food and medicine, and the soldiers escorting it keep silent. The throne must decide how to receive the caravan."
 tu_yan_ev.22.a:0 "Support it with supplies"
 tu_yan_ev.22.b:0 "Let the caravan pass without aid"
 tu_yan_ev.22.c:0 "Block the escort"

 tu_yan_ev.23.t:0 "A New Originium Vein"
 tu_yan_ev.23.d:0 "An originium vein has been discovered in a mountain village. Miners have already flocked to it, and the research institutes demand personnel to test the ore's properties. The throne must decide whether the state takes the vein or leaves it to private hands."
 tu_yan_ev.23.a:0 "The state takes the monopoly"
 tu_yan_ev.23.b:0 "Open it to private miners"
 tu_yan_ev.23.c:0 "Entrust it to the research institutes"

 tu_yan_ev.24.t:0 "A Governor's Memorial"
 tu_yan_ev.24.d:0 "A governor on the frontier has submitted a memorial asking for both tax relief and reinforcements. It records the hunger of the people alongside the abuses of the officials. How the court answers will sway the loyalty of the frontier."
 tu_yan_ev.24.a:0 "Grant tax relief and accept the memorial"
 tu_yan_ev.24.b:0 "Send reinforcements only"
 tu_yan_ev.24.c:0 "Dismiss the memorial"

 tu_yan_ev.25.t:0 "Festival of the Spirits"
 tu_yan_ev.25.d:0 "A festival honoring the spirits has opened in the capital. Lanterns and songs continued through the night, and the priests claim the festival brings peace to the realm. The throne must decide how far the court should take part."
 tu_yan_ev.25.a:0 "The court attends in person"
 tu_yan_ev.25.b:0 "Leave the festival to the officials"
 tu_yan_ev.25.c:0 "Ban the festival"

 tu_yan_ev.26.t:0 "Rumors of Infection"
 tu_yan_ev.26.d:0 "Rumors are spreading that infected people have appeared in a frontier village. Their truth is unknown, and the villagers have barred their gates. The throne must decide whether to quell the rumors or impose a blockade."
 tu_yan_ev.26.a:0 "Verify and publish the truth"
 tu_yan_ev.26.b:0 "Impose a blockade on the village"
 tu_yan_ev.26.c:0 "Ignore the rumors"

 tu_yan_ev.27.t:0 "Letters from the Three Brothers"
 tu_yan_ev.27.d:0 "Each of the three brothers has sent a letter to the court. One speaks of loyalty, one of grievance, and one of negotiation. Which letter the throne answers will shape how the warlords move."
 tu_yan_ev.27.a:0 "Answer the letter of loyalty"
 tu_yan_ev.27.b:0 "Accept the letter of grievance"
 tu_yan_ev.27.c:0 "Take up the letter of negotiation"

 tu_yan_ev.28.t:0 "The Truth Behind the Rumors"
 tu_yan_ev.28.d:0 "The investigators have found a thread leading to the rumors. Records show that a minister struck a private bargain with an imperial favorite. The throne must decide whether to publish the records and punish the minister, or bury them to keep the court calm."
 tu_yan_ev.28.a:0 "Publish the records and punish him"
 tu_yan_ev.28.b:0 "Bury them and keep the peace"
 tu_yan_ev.28.c:0 "Summon both men for questioning"

 tu_yan_ev.29.t:0 "The Trial of Lungmen's Autonomy"
 tu_yan_ev.29.d:0 "Under the guaranteed autonomy, Lungmen's merchant guild has begun a strike over taxes. Citizens defending their self-rule face officials demanding order. The court's response to this trial will set the true weight of that autonomy."
 tu_yan_ev.29.a:0 "Respect autonomy and yield on taxes"
 tu_yan_ev.29.b:0 "Crush the strike for the sake of order"
 tu_yan_ev.29.c:0 "Form a mediation panel"
