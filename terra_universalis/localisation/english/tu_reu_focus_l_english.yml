l_english:
 TU_REU_uprising:0 "Infected Uprising"
 TU_REU_uprising_desc:0 "The infected have risen. Declare Reunion's independence and raise the first banner."
 TU_REU_militia_call:0 "Militia Call-up"
 TU_REU_militia_call_desc:0 "Call the infected militias together. Manpower rises sharply."
 TU_REU_black_serpent:0 "The Undying Black Serpent"
 TU_REU_black_serpent_desc:0 "Talulah declares conquest in the name of the Black Serpent. Political power rises."
 TU_REU_serpent_army:0 "Black Serpent Corps"
 TU_REU_serpent_army_desc:0 "Reorganise the corps for conquest. Army experience builds up."
 TU_REU_ursus_claims:0 "Claims on Ursus"
 TU_REU_ursus_claims_desc:0 "Claim three Ursus states that border Chernobog."
 TU_REU_serpent_march:0 "March of the Black Serpent"
 TU_REU_serpent_march_desc:0 "Steel the line on the march. Army experience builds up."
 TU_REU_serpent_conquest:0 "Begin the Conquest"
 TU_REU_serpent_conquest_desc:0 "Start the war of conquest against Ursus. Gain the attacking doctrine. Cannot be taken with Frost Fortress."
 TU_REU_frost_nova:0 "Frostnova"
 TU_REU_frost_nova_desc:0 "Frostnova takes command of the frozen front. Political power rises."
 TU_REU_infected_zones:0 "Infected Autonomous Zones"
 TU_REU_infected_zones_desc:0 "Set up autonomous zones for the infected. Manpower rises and society steadies."
 TU_REU_patriot_call:0 "Call of the Patriot"
 TU_REU_patriot_call_desc:0 "Make Patriot the new leader. He leads Reunion from now on."
 TU_REU_rhodes_pact:0 "Rhodes Alliance"
 TU_REU_rhodes_pact_desc:0 "Join hands with Rhodes Island. Relations with Rhodes improve and political power rises."
 TU_REU_frost_fortress:0 "Frost Fortress"
 TU_REU_frost_fortress_desc:0 "Build a fortress on the frozen ground. Gain the defensive doctrine. Cannot be taken with the Black Serpent conquest."
