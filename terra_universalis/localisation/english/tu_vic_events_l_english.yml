l_english:
 tu_vic_ev.1.t:0 "The Vacant Throne"
 tu_vic_ev.1.d:0 "Since King Siege left the throne, the crown has stood empty. The dukes watch each other across the council chamber, and in Glasgow the name of Aslan is whispered. Someone must now decide who will hold the crown."
 tu_vic_ev.1.a:0 "Entrust power to the Dukes' Council"
 tu_vic_ev.1.b:0 "Prepare Aslan's return"
 tu_vic_ev.1.c:0 "Hold on with the throne empty"
 tu_vic_ev.2.t:0 "The Dukes' Choice"
 tu_vic_ev.2.d:0 "The Dukes' Council has adopted noble self-rule as official policy. The great houses regain their provincial taxes and private guards in exchange for ceding central power. The age of the nobles begins."
 tu_vic_ev.2.a:0 "Make noble self-rule official"
 tu_vic_ev.2.b:0 "Negotiate with the houses to limit the terms"
 tu_vic_ev.3.t:0 "The Crown of Glasgow"
 tu_vic_ev.3.d:0 "Aslan has declared his claim to the throne from the square in Glasgow. The gangs and the Church stand behind him, but the nobles remain silent. The old royal banner rises again above the docks."
 tu_vic_ev.3.a:0 "Hold a royal rite to establish authority"
 tu_vic_ev.3.b:0 "Push ahead with the gangs' strength"
 tu_vic_ev.4.t:0 "The Flame of Tara"
 tu_vic_ev.4.d:0 "The Tara insurgents have carried the Dublinn flame forward and declared the Flame Line. Street marches and youth mobilisation have begun, and the moderates have lost their seats. The state must decide how far this line will go."
 tu_vic_ev.4.a:0 "Adopt the Flame Line as national policy"
 tu_vic_ev.4.b:0 "Calm the moderates and slow the pace"
 tu_vic_ev.5.t:0 "The Parliamentary Banner"
 tu_vic_ev.5.d:0 "Parliament has used the royal vacancy to demand the restoration of the constitution and free elections. The London Exchange and the free press have sided with it. The state must judge whether parliamentary politics will return or become another power struggle."
 tu_vic_ev.5.a:0 "Make the parliamentary line official"
 tu_vic_ev.5.b:0 "Hand power to Parliament but keep royal honours"
 tu_vic_ev.6.t:0 "The Dublinn and Tara Uprising"
 tu_vic_ev.6.d:0 "The dock workers of Dublinn and the farmers of Tara have risen together. The insurgents have seized the customs houses and shut the government offices. The state must decide now whether to crush the rising or negotiate."
 tu_vic_ev.6.a:0 "Send troops to crush it"
 tu_vic_ev.6.b:0 "Open talks with the insurgent delegates"
 tu_vic_ev.6.c:0 "Stand aside and watch"
 tu_vic_ev.7.t:0 "The Steam Knights' Founding"
 tu_vic_ev.7.d:0 "The first Steam Knight armour platoon held its founding ceremony in the capital square. The roar of steam engines shook the city and crowds came out to watch. The state must decide where this iron order will be used."
 tu_vic_ev.7.a:0 "Station them to defend the capital"
 tu_vic_ev.7.b:0 "Form them into an overseas expeditionary force"
 tu_vic_ev.8.t:0 "Glasgow Returns"
 tu_vic_ev.8.d:0 "The Glasgow gangs have returned to the city and reclaimed the harbour guilds. Cheers and unease run through the streets together. The state must choose whether to deal with the gangs or bind them with ordinances."
 tu_vic_ev.8.a:0 "Make a deal with the gangs"
 tu_vic_ev.8.b:0 "Bind them with ordinances"
 tu_vic_ev.9.t:0 "The Claim on Londinium"
 tu_vic_ev.9.d:0 "Kazdel still holds Londinium and shows no sign of leaving. Our lawyers and diplomats are assembling the case for its return. The state must decide whether to press the claim through formal demands or prepare to take the city by force."
 tu_vic_ev.9.a:0 "Send a formal demand to Kazdel"
 tu_vic_ev.9.b:0 "Prepare to retake the city by force"
 tu_vic_ev.10.t:0 "The Londinium Parade"
 tu_vic_ev.10.d:0 "With the occupation administration in place, preparations for a victory parade in Londinium have begun. Citizens cheer the banners of the recovered city. The state must decide whether to hold a grand parade or quietly win the trust of the people first."
 tu_vic_ev.10.a:0 "Hold a grand parade"
 tu_vic_ev.10.b:0 "Hold a quiet ceremony and sound out public opinion"
 tu_vic_ev.11.t:0 "The Purge of Dublinn"
 tu_vic_ev.11.d:0 "The Draco leader has ordered the purge of Dublinn's opposition. Arrest lists circulate and a deep silence has fallen over the docks. The state must judge whether fear will bring order or provoke revolt."
 tu_vic_ev.11.a:0 "Continue the purge"
 tu_vic_ev.11.b:0 "Halt the purge and grant amnesty"
 tu_vic_ev.12.t:0 "The Free Press Act"
 tu_vic_ev.12.d:0 "Once the free press law took effect, the newspapers printed every bargain struck between the crown and the dukes. People crowd around the news-stands to read each new article. The state must decide how to handle the uproar."
 tu_vic_ev.12.a:0 "Keep the press free"
 tu_vic_ev.12.b:0 "Smooth the coverage to calm the uproar"
 tu_vic_ev.13.t:0 "Edict of the Empty Throne"
 tu_vic_ev.13.d:0 "An expansion edict has been proclaimed in the name of the empty throne. Citizens cheer the promise of reclaiming lost lands. Yet it is unclear whether the treasury and the army can keep pace with those words."
 tu_vic_ev.13.a:0 "Enforce the edict"
 tu_vic_ev.13.b:0 "Hold the edict and prepare first"
 tu_vic_ev.14.t:0 "The Gang Pact"
 tu_vic_ev.14.d:0 "The Glasgow gang bosses met at one table and signed a pact recognising each other's districts. Gunfire in the streets has fallen, but the price is plain. The state must decide whether to make the pact official."
 tu_vic_ev.14.a:0 "Officially recognise the pact"
 tu_vic_ev.14.b:0 "Ignore the pact and watch the streets"
 tu_vic_ev.15.t:0 "Proclamation of the Flame State"
 tu_vic_ev.15.d:0 "The Draco leader has proclaimed the founding of the Flame State. Elections are suspended and youth marches cover the city. Foreign capitals are watching this declaration closely."
 tu_vic_ev.15.a:0 "Consolidate the regime"
 tu_vic_ev.15.b:0 "Promise elections to ease foreign criticism"
 tu_vic_ev.16.t:0 "King Siege's Coronation"
 tu_vic_ev.16.d:0 "Siege has taken the empty throne, received the oaths of the dukes, and worn the crown. His accession was welcomed as a sign of royal restoration. News of the coronation spread across the continent."
 tu_vic_ev.16.a:0 "Read the report"
 tu_vic_ev.17.t:0 "Aslan's Coronation"
 tu_vic_ev.17.d:0 "Aslan was crowned in the cathedral of Glasgow. The Church gave its blessing and the gangs filled the streets. The crown of Victoria has once again been placed on a head."
 tu_vic_ev.17.a:0 "Read the report"
 tu_vic_ev.18.t:0 "The Draco Leader Takes Power"
 tu_vic_ev.18.d:0 "The Draco leader has seized power and suspended elections. Foreign opinion has turned cold. The first leader of the Flame State is now known to the world."
 tu_vic_ev.18.a:0 "Read the report"
 tu_vic_ev.19.t:0 "Parliament Elects a Prime Minister"
 tu_vic_ev.19.d:0 "Parliament has elected a prime minister. Speeches promising a constitution and free elections followed. Victoria's democracy is once again being put to the test."
 tu_vic_ev.19.a:0 "Read the report"
 tu_vic_ev.20.t:0 "Dock Riot in Glasgow"
 tu_vic_ev.20.d:0 "Dock workers in Glasgow have seized the piers to protest unpaid wages. Ships loaded with cargo are stuck in the harbour, and the guilds demand talks. The state must decide how to respond."
 tu_vic_ev.20.a:0 "Crush the riot"
 tu_vic_ev.20.b:0 "Open talks with the guilds"
 tu_vic_ev.20.c:0 "Side with the workers and open the docks"
 tu_vic_ev.21.t:0 "Steam Knights' Test March"
 tu_vic_ev.21.d:0 "A Steam Knight unit has asked for permission to hold a test march through the city centre. Citizens gather along the roads to see the armoured procession. The state must decide whether to permit the march or hold it back."
 tu_vic_ev.21.a:0 "Permit the march"
 tu_vic_ev.21.b:0 "Hold it back for now"
 tu_vic_ev.22.t:0 "Tax Revolt"
 tu_vic_ev.22.d:0 "A tax revolt has spread through the countryside. A tax collector's carriage was burned and local officials have gone into hiding. The state must decide whether to lower the rates or push the collection through."
 tu_vic_ev.22.a:0 "Lower the tax rate"
 tu_vic_ev.22.b:0 "Enforce the tax collection"
 tu_vic_ev.23.t:0 "Grumbling Dukes"
 tu_vic_ev.23.d:0 "The dukes have openly complained about the vacancy on the throne. Some houses in the council chamber are preparing to leave. The state must decide whether to share out seats or ignore them."
 tu_vic_ev.23.a:0 "Share out seats among the dukes"
 tu_vic_ev.23.b:0 "Ignore the complaints"
 tu_vic_ev.24.t:0 "Smugglers on the Thames"
 tu_vic_ev.24.d:0 "Smuggling boats were found in large numbers at the mouth of the Thames. Rumours say customs officers closed their eyes in return for bribes. The state must decide whether to take control of the customs or tolerate the smuggling."
 tu_vic_ev.24.a:0 "Take control of the customs"
 tu_vic_ev.24.b:0 "Tolerate the smuggling"
 tu_vic_ev.25.t:0 "Refugees from Londinium"
 tu_vic_ev.25.d:0 "Refugees driven out of Londinium are pouring into our border towns. Those fleeing Kazdel's occupation arrive hungry and exhausted. The state must decide whether to accept them or close the border."
 tu_vic_ev.25.a:0 "Close the border"
 tu_vic_ev.25.b:0 "Open temporary camps to receive them"
 tu_vic_ev.26.t:0 "Petition to the Commons"
 tu_vic_ev.26.d:0 "Members of the Commons have filed a joint petition. It calls for free elections and the publication of the royal accounts. The state must decide whether to accept the petition or ignore it."
 tu_vic_ev.26.a:0 "Accept the petition"
 tu_vic_ev.26.b:0 "Ignore the petition"
 tu_vic_ev.27.t:0 "Counterfeit Notes from the Mint"
 tu_vic_ev.27.d:0 "Counterfeit notes, identical to those printed at the royal mint, have flooded the markets. Merchants have begun to doubt every note they receive. The state must decide whether to hunt down the forgers or let the matter pass quietly."
 tu_vic_ev.27.a:0 "Hunt down the forgers"
 tu_vic_ev.27.b:0 "Let the matter pass quietly"
 tu_vic_ev.28.t:0 "The Gangs' Reply"
 tu_vic_ev.28.d:0 "The Glasgow gangs have sent their answer. They demand customs rights in return for handing over the harbour districts. The state must decide whether to accept their terms or put the gangs on trial."
 tu_vic_ev.28.a:0 "Accept the gangs' terms"
 tu_vic_ev.28.b:0 "Put the gangs on trial"
 tu_vic_ev.29.t:0 "The Reality of the Refugee Camps"
 tu_vic_ev.29.d:0 "The temporary camps are overflowing and food and medicine are running short. Reports say disease is spreading inside the camps. The state must decide whether to expand aid or disband the camps."
 tu_vic_ev.29.a:0 "Expand aid and recruit young volunteers"
 tu_vic_ev.29.b:0 "Disband the camps"
 TU_VIC_ev_smuggling_trade:0 "Smuggling Profits"
 TU_VIC_ev_smuggling_trade_desc:0 "Goods and hidden funds from the smuggling boats feed political activity. Political power gain increases."
 TU_VIC_ev_parade_pride:0 "Pride of the Parade"
 TU_VIC_ev_parade_pride_desc:0 "The victory parade in Londinium has raised the pride of the nation. Stability increases."
 tu_vic_ev.40.t:0 "The Fate of the Throne"
 tu_vic_ev.40.d:0 "The dukes have gathered in Londinium, but the throne is still empty. There are four roads.\n\n[Ducal Council] The landed dukes seize the council and rule as an oligarchy. Leader: Chairman of the Ducal Council.\n[Aslan's Restoration] Glasgow's streets and loyal nobles raise Aslan to the throne. Leader: King Siege.\n[Draco and Tara] The Flame of Tara leads an uprising and founds a military dictatorship. Leader: Draco.\n[Victorian Parliament] Free press and elections open a constitutional parliament. Leader: the Prime Minister.\n\nOnly the chosen route appears in the focus tree."
 tu_vic_ev.40.a:0 "The Ducal Council leads."
 tu_vic_ev.40.b:0 "Aslan takes the throne."
 tu_vic_ev.40.c:0 "The Flame of Tara burns."
 tu_vic_ev.40.e:0 "Parliament convenes."
