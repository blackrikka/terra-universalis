l_english:
 TU_VIC_eco_industry_charter:0 "Industrial Charter"
 TU_VIC_eco_industry_charter_desc:0 "Sign an industrial charter with the London guilds to lay the foundation of the greatest industrial power."
 TU_VIC_eco_london_foundries:0 "London Foundries"
 TU_VIC_eco_london_foundries_desc:0 "Expand the foundries along the Thames into the centre of private industry."
 TU_VIC_eco_coal_fields:0 "Coalfield Development"
