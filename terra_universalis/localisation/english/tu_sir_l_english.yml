 TU_SIR_root:0 "Land of Wolves"
 TU_SIR_root_desc:0 "Siracusa's cities are ruled by families, not the government. Completing this focus lets you choose one of five routes in the §YCrossroads of Siracusa§! event.\n\n§YBellone§!: Bellone — Construction and industry. The most factories.\n§YGambino§!: Don Gambino — Army and mobilisation. Strong attack and manpower.\n§YSaluzzo§!: Don Saluzzo — Money and diplomacy. Fast political power and research.\n§YLaw§!: Penance (Lavinia) — Rule of law against the families. Stability and research.\n§YWolf§!: Lappland the Decadenza — The power of the Wolf Lord. Attack and conquest."
