 tu_sir_ev.1.t:0 "Crossroads of Siracusa"
 tu_sir_ev.1.d:0 "The streets of Siracusa are quiet, because the families are watching.\nNow decide who will lead these cities. Only the chosen route appears in the focus tree, and the leader changes at once.\n\n[Bellone] Bellone — Construction and industry. The most factories.\n[Gambino] Don Gambino — Army and mobilisation. Strong attack and manpower.\n[Saluzzo] Don Saluzzo — Money and diplomacy. Fast political power and research.\n[Law] Penance (Lavinia) — Rule of law against the families. Stability and research.\n[Wolf] Lappland the Decadenza — The power of the Wolf Lord. Attack and conquest."
 tu_sir_ev.1.a:0 "Bellone — industry"
 tu_sir_ev.1.b:0 "Gambino — army"
 tu_sir_ev.1.c:0 "Saluzzo — money"
 tu_sir_ev.1.e:0 "Penance — law"
 tu_sir_ev.1.f:0 "Lappland — conquest"
 tu_sir_ev.20.t:0 "Tale of the Wolf Lord"
 tu_sir_ev.20.d:0 "Old folk still tell of the Wolf Lord, who ruled all of Siracusa's wolves, and who they say will return one day."
 tu_sir_ev.20.a:0 "The story is true."
 tu_sir_ev.21.t:0 "Night of the Rite"
 tu_sir_ev.21.d:0 "Under the full moon the Wolf Rite was held. Thousands of wolves faced the same direction."
 tu_sir_ev.21.a:0 "The pack is one."
 tu_sir_ev.22.t:0 "Lappland Returns"
 tu_sir_ev.22.d:0 "Lappland, who chased the Wolf Lord's trail, has returned. The old lord's light shines in her eyes."
 tu_sir_ev.22.a:0 "The pack follows her."
 tu_sir_ev.23.t:0 "The Silence Breaks"
 tu_sir_ev.23.d:0 "A family member testified to everything in court. Omerta is broken."
 tu_sir_ev.23.a:0 "The law prevails."
 tu_sir_ev.24.t:0 "A Don Arrested"
 tu_sir_ev.24.d:0 "A family's don is in handcuffs. His men take to the streets."
 tu_sir_ev.24.a:0 "Hold the line."
 tu_sir_ev.25.t:0 "Sign of the Wolf"
 tu_sir_ev.25.d:0 "Something has woken in the old Wolf Lord's citadel. Every wolf in Siracusa heard its howl."
 tu_sir_ev.25.a:0 "The Lord returns."
 tu_sir_ev.26.t:0 "Family War"
 tu_sir_ev.26.d:0 "Two families have taken up arms over each other's turf. Gunfire never stops in the streets."
 tu_sir_ev.26.a:0 "Send in the army."
 tu_sir_ev.26.b:0 "Take a side."
 tu_sir_ev.26.c:0 "Wait for it to burn out."
 tu_sir_ev.27.t:0 "Texas Comes Home"
 tu_sir_ev.27.d:0 "Texas, once heir to a family, has come home. Those who recognise her whisper. She says nothing, and does not put down her swords."
 tu_sir_ev.27.a:0 "Welcome her."
 tu_sir_ev.27.b:0 "Let her pass quietly."
 tu_sir_ev.28.t:0 "Siracusa of the Family"
 tu_sir_ev.28.d:0 "One family stands at the top of Siracusa. The others bow their heads."
 tu_sir_ev.28.a:0 "Family comes first."
 tu_sir_ev.29.t:0 "Siracusa of Law"
 tu_sir_ev.29.d:0 "For the first time in Siracusa's history, the courts are stronger than the families."
 tu_sir_ev.29.a:0 "Justice stands."
 tu_sir_ev.30.t:0 "Return of the Wolf Lord"
 tu_sir_ev.30.d:0 "The Wolf Lord descended from the citadel. Dons and judges alike knelt."
 tu_sir_ev.30.a:0 "Age of the wolf."
 tu_sir_ev.32.t:0 "Attempt on a Judge"
 tu_sir_ev.32.d:0 "A judge handling a family case was attacked but survived."
 tu_sir_ev.32.a:0 "Increase protection."
 tu_sir_ev.32.b:0 "Replace the judge."
 tu_sir_ev.33.t:0 "A Wave of Tourists"
 tu_sir_ev.33.d:0 "Foreigners flock to the casinos and beaches."
 tu_sir_ev.33.a:0 "Welcome them."
 tu_sir_ev.34.t:0 "Howling at Night"
 tu_sir_ev.34.d:0 "Reports of wolf howls from the citadel on moonlit nights are increasing."
 tu_sir_ev.34.a:0 "Send investigators."
 TU_SIR_bellone_5_tt:0 "§YBellone Family Influence§! +5"
 TU_SIR_bellone_m8_tt:0 "§YBellone Family Influence§! -8"
 TU_SIR_gambino_m8_tt:0 "§YGambino Family Influence§! -8"
 tu_sir_ev.40.t:0 "Blueprints of a New City"
 tu_sir_ev.40.d:0 "The Bellone Construction Company presents blueprints for a new city: a dream of a city beyond any family's reach."
 tu_sir_ev.40.a:0 "Build fast."
 tu_sir_ev.40.b:0 "Build to last."
 tu_sir_ev.41.t:0 "Death of the Construction Minister"
 tu_sir_ev.41.d:0 "Before the industrial district tender, the construction minister was shot. Everyone can guess who did it; no one says."
 tu_sir_ev.41.a:0 "Find the killer."
 tu_sir_ev.41.b:0 "Bury it quietly."
 tu_sir_ev.42.t:0 "Turf Dispute"
 tu_sir_ev.42.d:0 "As the enforcers grow, a quarrel breaks out with the next turf. Both sides draw blades over a single street."
 tu_sir_ev.42.a:0 "Settle it by force."
 tu_sir_ev.42.b:0 "Negotiate."
 tu_sir_ev.43.t:0 "A Captain's Ambition"
 tu_sir_ev.43.d:0 "The captain in charge of the militia has begun flying his own colours. His name is heard more often than the Don's."
 tu_sir_ev.43.a:0 "Purge him."
 tu_sir_ev.43.b:0 "Give him a seat."
 tu_sir_ev.44.t:0 "The Saluzzo Banquet"
 tu_sir_ev.44.d:0 "Don Saluzzo invites the other dons to a banquet. Beside every glass lies a note of debt."
 tu_sir_ev.44.a:0 "Call in the debts."
 tu_sir_ev.44.b:0 "Forgive the debts and sell the favour."
 tu_sir_ev.45.t:0 "A Hole in the Ledger"
 tu_sir_ev.45.d:0 "A large sum has vanished from the casino ledgers. The accountant says the numbers were merely wrong."
 tu_sir_ev.45.a:0 "Replace the accountant."
 tu_sir_ev.45.b:0 "Look the other way."
 tu_sir_ev.46.t:0 "Lavinia's Verdict"
 tu_sir_ev.46.d:0 "Twelve family men stand in the dock at once. The whole city waits for Judge Lavinia's verdict."
 tu_sir_ev.46.a:0 "The full weight of the law."
 tu_sir_ev.46.b:0 "Mercy for the repentant."
 tu_sir_ev.47.t:0 "Death of a Witness"
 tu_sir_ev.47.d:0 "A witness guarded by the bureau is found dead in the safe house. The door was locked from the inside."
 tu_sir_ev.47.a:0 "Widen the investigation."
 tu_sir_ev.47.b:0 "Hide the remaining witnesses deeper."
 tu_sir_ev.48.t:0 "Whisper of the Wolf Lord"
 tu_sir_ev.48.d:0 "On the night the relics are unearthed, Lappland hears a beast's voice: power, in exchange for becoming its fang."
 tu_sir_ev.48.a:0 "Take the power."
 tu_sir_ev.48.b:0 "A wolf is no one's fang."
 tu_sir_ev.49.t:0 "Order of the Pack"
 tu_sir_ev.49.d:0 "As the pack legion gathers, they begin to snarl over who shall run at the front."
 tu_sir_ev.49.a:0 "The strongest leads."
 tu_sir_ev.49.b:0 "All run together."
 tu_sir_ev.50.t:0 "Chiave's Gang Comes Home"
 tu_sir_ev.50.d:0 "Chiave, Aosta and Broca, who had left for Lungmen, are back in Siracusa. They heard the army command is hiring."
 tu_sir_ev.50.a:0 "Take all three."
 tu_sir_ev.50.b:0 "Send them away."
 tu_sir_ev.35.t:0 "An Unknown Family"
 tu_sir_ev.35.d:0 "A strange name has slipped onto the roster at the unification talks.\n\n\"What family is this? Thu...what..? Never heard of them..\""
 tu_sir_ev.35.a:0 "Look into it."
 tu_sir_ev.36.t:0 "The Thumb"
 tu_sir_ev.36.d:0 "The report is in: strict discipline, absolute obedience, not a single bullet wasted.\n\n\"The Thumb..? Looks like a decent family\""
 tu_sir_ev.36.a:0 "Welcome them as a family"
 tu_sir_ev.36.b:0 "Look for another family"
 tu_sir_ev.37.t:0 "Valencina"
 tu_sir_ev.37.d:0 "The commander sent by the Thumb kicks the meeting-room door open. She bows to no one.\n\n\"I'm sick of it. You, the family, all of it!!!\""
 tu_sir_ev.37.a:0 "...Welcome aboard, Valencina."
 TU_SIR_focus:0 "Siracusa Focus"
