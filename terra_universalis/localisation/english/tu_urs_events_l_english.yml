l_english:
 tu_urs_ev.1.t:0 "Imperial Direct Rule"
 tu_urs_ev.1.d:0 "The emperor has folded the grand council's powers and will issue every order from the throne himself. Guardsmen fill the palace corridors, and no grand duke dares to object in public. Long-suppressed grievances, however, grow in the quietest places. The fate of Ursus now rests on one man's judgment."
 tu_urs_ev.1.a:0 "I am the law"
 tu_urs_ev.1.b:0 "Grant one grand duke a seat"
 tu_urs_ev.1.c:0 "Quietly withdraw the decree"
 tu_urs_ev.2.t:0 "The Junta Council Formed"
 tu_urs_ev.2.d:0 "Exhausted by the court's paralysis, the war ministers have formed a junta council. Mobilisation orders go out to every barracks, and the mobile cities turn toward the front. Civil officials are losing their posts one by one. The junta promises order, but no one yet knows whom that order will be aimed at."
 tu_urs_ev.2.a:0 "Put the whole state on a war footing"
 tu_urs_ev.2.b:0 "Allow civilian administrators a voice"
 tu_urs_ev.2.c:0 "Call up only the reserves"
 tu_urs_ev.3.t:0 "The Chair of the Nobles"
 tu_urs_ev.3.d:0 "The dukes and counts convened the senate and accepted the compromise. Hereditary estates keep their autonomy, and the crown is left with only the chair. The nobles celebrate the deal as a victory. Yet a throne that leans on the senate must watch their faces with every decree that follows."
 tu_urs_ev.3.a:0 "Respect the senate's decision"
 tu_urs_ev.3.b:0 "Back the noble alliance"
 tu_urs_ev.3.c:0 "Take the chair and step back"
 tu_urs_ev.4.t:0 "The Reform Charter Signed"
 tu_urs_ev.4.d:0 "Student council members and reformist officials have finally signed the draft charter. The throne promises to share power, though no one can guarantee how far that promise will hold. The capital's newspapers have begun printing criticism of the court for the first time. Reform has begun, and it is already too late to turn back."
 tu_urs_ev.4.a:0 "Proclaim the charter as written"
 tu_urs_ev.4.b:0 "Proclaim it with clauses trimmed"
 tu_urs_ev.4.c:0 "Hold the charter back"
 tu_urs_ev.5.t:0 "A Hardline General Takes Command"
 tu_urs_ev.5.d:0 "A hardline general who commanded the border garrisons has been summoned back to the capital. Since the Chernobog disaster he has declared every force that opposes the throne an enemy. His officers already obey his orders alone inside the barracks. Those who defend him and those who fear him are beginning to split the court."
 tu_urs_ev.5.a:0 "Order war preparations"
 tu_urs_ev.5.b:0 "Woo him into the negotiating room"
 tu_urs_ev.6.t:0 "Chernobog Response Plan"
 tu_urs_ev.6.d:0 "The aftermath of the Chernobog disaster has not settled. Plans to seal the infected zone and plans to shelter refugees clash in the imperial council. The front command demands a cordon, but public opinion in the capital calls for relief. The decision will soon change the face of Ursus."
 tu_urs_ev.6.a:0 "Seal the infected zone"
 tu_urs_ev.6.b:0 "Shelter the refugees"
 tu_urs_ev.7.t:0 "A Marshal for the Mobile Divisions"
 tu_urs_ev.7.d:0 "A marshal has been named to raise the mobile divisions. He is designing new tactics that bind railways and armoured trains together. The soldiers call him the general on the rails and follow him gladly. Rapid movement promises victory, but when the supply line is cut, the promise is cut with it."
 tu_urs_ev.7.a:0 "Commit the mobile divisions to the front"
 tu_urs_ev.7.b:0 "Expand industry first"
 tu_urs_ev.8.t:0 "The Light of the Absolute Crown"
 tu_urs_ev.8.d:0 "The palace workshops have finished setting the new crown. It is displayed as the treasure of imperial authority, and even the grand dukes must bow as they pass it. Crowds flock to the squares to see it. At court, people say the brighter the light, the darker the shadow."
 tu_urs_ev.8.a:0 "Display the crown to the public"
 tu_urs_ev.8.b:0 "Keep the crown deep in the palace"
 tu_urs_ev.9.t:0 "The Eternal Throne"
 tu_urs_ev.9.d:0 "The succession law of the throne has been rewritten. The heir is bound by blood and ritual, and every decree from now on is proclaimed in the throne's name. Aged ministers signed with tears in their eyes. The word eternal is beautiful, but history shows how rarely any throne has lasted that long."
 tu_urs_ev.9.a:0 "Hold the succession rites with pomp"
 tu_urs_ev.9.b:0 "Refine the law for practical use"
 tu_urs_ev.9.c:0 "Sign quietly and say nothing"
 tu_urs_ev.10.t:0 "The Blades of the Guard"
 tu_urs_ev.10.d:0 "The guard's elite blades have received a new commander. He says that guarding the palace gates is the same as guarding the empire. The blades resumed training before their edges could dull. Outside the palace, though, voices ask whom exactly they are guarding."
 tu_urs_ev.10.a:0 "Drill the blades harshly"
 tu_urs_ev.10.b:0 "Expand the guard's ranks"
 tu_urs_ev.11.t:0 "The Junta That Would Not End"
 tu_urs_ev.11.d:0 "The junta refuses to give up power even though the war is over. Orders from the barracks now replace those of the civil administration. Generals at the front say they trust their own men more than the emperor. Anyone who asks when the junta will end is now called a traitor."
 tu_urs_ev.11.a:0 "Keep the junta in place"
 tu_urs_ev.11.b:0 "Dissolve the junta and recover the civil service"
 tu_urs_ev.12.t:0 "The Estate Warden"
 tu_urs_ev.12.d:0 "The grand dukes are raising militias on each of their estates. The most loyal militia warden has been given an official title with imperial approval. He promises to exempt the peasants from taxes in return for their conscription. The militias grow quickly, and it is unclear whether the throne can control them."
 tu_urs_ev.12.a:0 "Authorise the militia conscription"
 tu_urs_ev.12.b:0 "Bring the militia under imperial command"
 tu_urs_ev.13.t:0 "The Mobile Capital"
 tu_urs_ev.13.d:0 "The nobles' mobile city has settled on its first destination. The court and merchant guilds travel together along the rail and caravan routes. The city mayors demand autonomy, but who collects taxes while the city moves remains disputed. A joke is spreading through the markets that the capital has grown wheels."
 tu_urs_ev.13.a:0 "Grant the mobile city tax powers"
 tu_urs_ev.13.b:0 "Tie the trade routes to tolls"
 tu_urs_ev.14.t:0 "The Capital Terminal"
 tu_urs_ev.14.d:0 "The capital's new rail terminal has been completed. Military supplies pile up beneath the station, and workers haul coal day and night. Citizens marvel at the grandeur of the hall, but wages have not changed. The terminal may become the heart of the empire, or the first place to stop."
 tu_urs_ev.14.a:0 "Expand the arsenal warehouses at the terminal"
 tu_urs_ev.14.b:0 "Raise the workers' wages"
 tu_urs_ev.15.t:0 "The Cartel's Legacy"
 tu_urs_ev.15.d:0 "The cartel alliance now holds one pillar of the imperial economy. The factories and banks they left behind still run, and their contracts hang in every harbour. The throne needs their capital but fears their power may outgrow imperial orders. To whom will this legacy belong?"
 tu_urs_ev.15.a:0 "Absorb the cartel capital into state projects"
 tu_urs_ev.15.b:0 "Share taxes with the cartels"
 tu_urs_ev.16.t:0 "Ursus Reunited"
 tu_urs_ev.16.d:0 "The northern duchies and the southern lords have finally rallied under one banner. The emperor has proclaimed the unification edict, and the sound of the bells carries across the borders. Neighbours hear it as a warning. Ursus now enters history as one nation."
 tu_urs_ev.16.a:0 "Celebrate the unification"
 tu_urs_ev.17.t:0 "The Charter Completed"
 tu_urs_ev.17.d:0 "The final article of the reform charter has been proclaimed. The newspapers cry for freedom and students sing in the squares. Yet the old nobles and the army quietly wait for their next chance. On the day the charter was completed, Ursus asked itself a question for the first time."
 tu_urs_ev.17.a:0 "Watch the reform take shape"
 tu_urs_ev.18.t:0 "The Cartel Marshal Rises"
 tu_urs_ev.18.d:0 "The cartel alliance has raised a marshal of its own. He appeared at the parade in a merchant's coat instead of a uniform. Factory chimneys puffed smoke in unison, and harbour cranes raised flags. It is the moment the cartels' strength matched that of the army."
 tu_urs_ev.18.a:0 "Officially recognise the cartel marshal"
 tu_urs_ev.19.t:0 "The Iron Regime"
 tu_urs_ev.19.d:0 "The junta has taken the name of the Iron Regime. Broadcasts repeat the victories at the front, and watch posts appear in every city. Citizens speak less, and children learn marching songs. Iron is hard, but no one says that it shatters when gripped too tightly."
 tu_urs_ev.19.a:0 "Officially proclaim the Iron Regime"
 tu_urs_ev.20.t:0 "The Grand Dukes Quarrel"
 tu_urs_ev.20.d:0 "The grand dukes quarrelled bitterly behind the imperial council chamber. A rumour says one duke seized another's estate revenue. The court must decide whose side to take. How this quarrel is handled will shape the next vote."
 tu_urs_ev.20.a:0 "Mediate by paying the debt"
 tu_urs_ev.20.b:0 "Confiscate the property as an example"
 tu_urs_ev.20.c:0 "Ignore the council"
 tu_urs_ev.21.t:0 "Discontent in the Guard"
 tu_urs_ev.21.d:0 "Imperial guard pay has been late for two months. Soldiers gather in front of the barracks and argue, and some shout that they will leave the palace gates. The officers try to hide the situation, but the rumours have already reached the capital. The guard's loyalty rests on the pay ledger."
 tu_urs_ev.21.a:0 "Restore their pay"
 tu_urs_ev.21.b:0 "Disband the discontented units"
 tu_urs_ev.22.t:0 "Refugees from the Infected Zone"
 tu_urs_ev.22.d:0 "Refugees driven out of the Chernobog infected zone have begun pitching tents on the outskirts of border towns. Children go hungry, and the sick search for medicine. The army fears the spread of infection and demands the crossings be closed. Whichever way the court chooses, history will remember it."
 tu_urs_ev.22.a:0 "Open refugee camps"
 tu_urs_ev.22.b:0 "Close the border"
 tu_urs_ev.22.c:0 "Quietly cover it up"
 tu_urs_ev.23.t:0 "The Student Council Marches"
 tu_urs_ev.23.d:0 "The student council fills the university square, demanding that the charter be enforced. Their speaker reads out the throne's promises line by line and asks for proof. The police say they will not give way, and the students answer that they will not give way either. The tension depends on who steps back first."
 tu_urs_ev.23.a:0 "Promise to enforce the charter"
 tu_urs_ev.23.b:0 "Break up the march by force"
 tu_urs_ev.23.c:0 "Ignore the march"
 tu_urs_ev.24.t:0 "Preparations for the Northern Expedition"
 tu_urs_ev.24.d:0 "A plan for an expedition into the northern lands beyond the winter front has reached the imperial staff. The planners insist the railways must depart before they freeze over. The soldiers fear the unfamiliar snowfields, while the officers speak of the chance for victory. Success would bring glory, and failure would bring disaster."
 tu_urs_ev.24.a:0 "Approve the expedition"
 tu_urs_ev.24.b:0 "Postpone the expedition"
 tu_urs_ev.25.t:0 "Envoys from Reunion"
 tu_urs_ev.25.d:0 "Reunion has sent envoys to the throne to ask for a truce. Their spokesman says the infected of Chernobog were also citizens of Ursus. Hardliners demand the envoys be sent away, but the soldiers at the front are weary of war. Whether to receive the envoys will soon set the direction of the war."
 tu_urs_ev.25.a:0 "Send a negotiating mission"
 tu_urs_ev.25.b:0 "Send the envoys away"
 tu_urs_ev.25.c:0 "Delay the reply"
 tu_urs_ev.26.t:0 "A Court Scandal"
 tu_urs_ev.26.d:0 "Evidence has surfaced that a senior official diverted public funds during the court reshuffle. Several figures inside the palace had protected him. If the inquiry begins, the names caught in the net may include close relatives of the imperial house. Should it be covered up, or dug into?"
 tu_urs_ev.26.a:0 "Cover up the scandal"
 tu_urs_ev.26.b:0 "Purge those involved"
 tu_urs_ev.27.t:0 "The Infected Citizenship Petition"
 tu_urs_ev.27.d:0 "The infected community has submitted a petition demanding citizenship and labour rights. It bears thousands of signatures, including those of factory workers and students. Local officials are painting it as dangerous agitation. Whether the petition is accepted will show who Ursus considers its people."
 tu_urs_ev.27.a:0 "Accept the petition"
 tu_urs_ev.27.b:0 "Reject the petition"
 tu_urs_ev.28.t:0 "Rumours from the Camps"
 tu_urs_ev.28.d:0 "Rumours have spread to the capital that a suspected infection has emerged inside a refugee camp. Newspapers demand answers, and opposition journalists accuse the court of hiding the truth. The camp doctors say they only have unconfirmed reports. Whether the rumours prove true or false now depends on what the throne says."
 tu_urs_ev.28.a:0 "Publish the truth"
 tu_urs_ev.28.b:0 "Suppress the rumours"
 tu_urs_ev.29.t:0 "Enforcing the Student Charter"
 tu_urs_ev.29.d:0 "The time has come for the throne to answer the student council's demand that the charter be enforced. Several articles guarantee university autonomy and freedom of the press. Officials argue over how to carry them out, and student representatives demand a date for the promise. If the charter is enforced, Ursus will enter a new era."
 tu_urs_ev.29.a:0 "Enforce the charter"
 tu_urs_ev.29.b:0 "Tear up the charter"
 TU_URS_ev_chernobog_shadow:0 "Shadow of Chernobog"
 TU_URS_ev_chernobog_shadow_desc:0 "Refugees and rumours from the infected zone cast a shadow over the capital. Stability falls and war support rises slightly."
 TU_URS_ev_student_charter:0 "Student Charter"
 TU_URS_ev_student_charter_desc:0 "The promises won by the student council move universities and newspapers. Political power gain rises and stability improves."
