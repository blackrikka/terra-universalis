l_english:
 recon:0 "Vanguard Recon Company"
 recon_desc:0 "Scouts ahead to read the ground and the enemy, opening the way for the division to take the initiative."
 mot_recon:0 "Vanguard Mobile Recon Company"
 mot_recon_desc:0 "Moves fast by vehicle to find the ground the line should seize first."
 motorized:0 "Vanguard Mobile Battalion"
 motorized_desc:0 "Vanguards who arrive first by vehicle and take the line before the enemy does."
 mechanized:0 "Vanguard Armoured Mobile Battalion"
 mechanized_desc:0 "Takes the line even under fire, carried by armoured vehicles."
 infantry:0 "Guard Battalion"
 infantry_desc:0 "The main body of operators who meet the enemy on the line."
 mountaineers:0 "Mountain Guard Battalion"
 mountaineers_desc:0 "Guards trained to fight in rough country."
 marine:0 "Landing Guard Battalion"
 marine_desc:0 "Guards trained to cross water and take a shore."
 light_armor:0 "Light Defender Battalion"
 light_armor_desc:0 "Defenders in light armour. Quick, but they cannot hold for long."
 medium_armor:0 "Defender Battalion"
 medium_armor_desc:0 "The main Defender force, holding the line behind heavy plating."
 heavy_armor:0 "Heavy Defender Battalion"
 heavy_armor_desc:0 "Defenders in the thickest armour. Slow, and very hard to break."
 artillery:0 "Support Sniper Company"
 artillery_brigade:0 "Sniper Battalion"
 mot_artillery_brigade:0 "Mobile Sniper Battalion"
 rocket_artillery_brigade:0 "Rocket Sniper Battalion"
 anti_air:0 "Support Anti-Air Sniper Company"
 anti_air_brigade:0 "Anti-Air Sniper Battalion"
 mot_anti_air_brigade:0 "Mobile Anti-Air Sniper Battalion"
 anti_tank:0 "Support Caster Company"
 anti_tank_brigade:0 "Caster Battalion"
 mot_anti_tank_brigade:0 "Mobile Caster Battalion"
 field_hospital:0 "Medic Company"
 field_hospital_desc:0 "Treats the fallen and sends them back to the line."
 signal_company:0 "Supporter Signal Company"
 signal_company_desc:0 "Keeps the division in contact and speeds up its plans."
 logistics_company:0 "Supporter Logistics Company"
 logistics_company_desc:0 "Plans and distributes materiel to reduce supply use."
 paratrooper:0 "Specialist Airborne Battalion"
 paratrooper_desc:0 "Slips behind enemy lines and shakes the front."
 military_police:0 "Specialist Military Police Company"
 military_police_desc:0 "Keeps occupied ground quiet and hunts threats in the rear."
 tu_arts_caster:0 "Arts Caster Battalion"
 tu_arts_caster_desc:0 "Casters whose Originium Arts pierce armour and sweep infantry alike. Wider than regular Casters and slower to train."
