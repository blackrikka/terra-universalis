l_english:
 # generated by tools/unit_names.py (spec 73)
 cavalry:0 "Vanguard Charger Battalion"
 cavalry_desc:0 "Vanguards who ride in first and shake the enemy line."
 motorized:0 "Vanguard Pioneer Battalion"
 motorized_desc:0 "Vanguards who arrive first by vehicle and take the line before the enemy does."
 mechanized:0 "Vanguard Standard Bearer Battalion"
 mechanized_desc:0 "Carried by armoured vehicles, they plant the standard and hold the line under fire."
 recon:0 "Vanguard Agent Company"
 recon_desc:0 "Scouts ahead to read the ground and the enemy, opening the way for the division to take the initiative."
 mot_recon:0 "Vanguard Tactician Company"
 mot_recon_desc:0 "Moves fast by vehicle to find the ground the line should seize first, and calls in reinforcements."
 infantry:0 "Guard Dreadnought Battalion"
 infantry_desc:0 "The main body of operators who meet the enemy on the line."
 mountaineers:0 "Guard Swordmaster Battalion"
 mountaineers_desc:0 "Elite Guards trained to fight in rough country."
 light_armor:0 "Defender Protector Battalion"
 light_armor_desc:0 "Defenders in light armour. Quick, but they cannot hold for long."
 medium_armor:0 "Defender Juggernaut Battalion"
 medium_armor_desc:0 "The main Defender force, holding the line behind heavy plating."
 heavy_armor:0 "Defender Fortress Battalion"
 heavy_armor_desc:0 "Defenders in the thickest armour who bombard from afar. Slow, and very hard to break."
 artillery_brigade:0 "Sniper Artilleryman Battalion"
 artillery_brigade_desc:0 "Bombards a wide area from afar."
 artillery:0 "Sniper Artilleryman Support Company"
 artillery_desc:0 "Supports the division with bombardment."
 mot_artillery_brigade:0 "Sniper Artilleryman Mobile Battalion"
 mot_artillery_brigade_desc:0 "Tows its guns by vehicle to shift position quickly."
 anti_air_brigade:0 "Sniper Marksman Battalion"
 anti_air_brigade_desc:0 "Aims at enemies in the air first."
 anti_air:0 "Sniper Marksman Support Company"
 anti_air_desc:0 "Guards the sky above the division."
 mot_anti_air_brigade:0 "Sniper Marksman Mobile Battalion"
 mot_anti_air_brigade_desc:0 "Moves by vehicle and aims at enemies in the air."
 anti_tank_brigade:0 "Core Caster Battalion"
 anti_tank_brigade_desc:0 "Pierces armour with Arts."
 anti_tank:0 "Core Caster Support Company"
 anti_tank_desc:0 "Pierces the armour in front of the division with Arts."
 mot_anti_tank_brigade:0 "Core Caster Mobile Battalion"
 mot_anti_tank_brigade_desc:0 "Moves by vehicle and pierces armour with Arts."
 tu_arts_caster:0 "Splash Caster Battalion"
 tu_arts_caster_desc:0 "Casters whose Originium Arts pierce armour and sweep infantry alike. Wider than regular Casters and slower to train."
 rocket_artillery_brigade:0 "Blast Caster Battalion"
 rocket_artillery_brigade_desc:0 "Sweeps a long line with Arts rockets."
 field_hospital:0 "Multi-target Medic Company"
 field_hospital_desc:0 "Treats many of the fallen at once and sends them back to the line."
 signal_company:0 "Supporter Bard Company"
 signal_company_desc:0 "Keeps the division in contact, lifts its spirits and speeds up its plans."
 maintenance_company:0 "Supporter Artificer Company"
 maintenance_company_desc:0 "Repairs equipment and handles support devices."
 paratrooper:0 "Specialist Executor Battalion"
 paratrooper_desc:0 "Slips behind enemy lines, shakes the front and redeploys fast."
 military_police:0 "Specialist Ambusher Company"
 military_police_desc:0 "Keeps occupied ground quiet and hunts threats in the rear."
 engineer:0 "Specialist Trapmaster Company"
 engineer_desc:0 "Builds traps and works so the division can hold."
 logistics_company:0 "Specialist Merchant Company"
 logistics_company_desc:0 "Finds and distributes materiel to reduce supply use."
 marine:0 "Landing Guard Battalion"
 marine_desc:0 "Guards trained to cross water and take a shore."
