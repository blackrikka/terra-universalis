l_english:
 # generated by tools/vic_dukes.py (spec 80)
 TU_VIC_dukes_category:0 "Ducal Council"
 TU_VIC_dukes_category_desc:0 "Victoria proper is split among eight ducal estates. A duke whose loyalty falls below §Y40§! loses his estate's share of factory output, costs stability and cannot raise his elite division. Backing one duke angers his rival."
 TU_VIC_shard_category:0 "The Shard"
 TU_VIC_shard_category_desc:0 "The Kazdel Military Commission holding Londinium is awakening the artificial calamity weapon, the Shard. At §R100%§! the eastern front is devastated and the Kazdel Extortion route opens. Retaking Londinium stops it."
 TU_VIC_shard_mission:0 "Shard Countdown"
 TU_VIC_shard_mission_desc:0 "When the days run out the Shard fires. Slow it with Self-Salvation Corps aid, Rhodes Island infiltrators or sabotage. Retaking Londinium cancels it."
 TU_VIC_dec_shard_corps:0 "Aid the Self-Salvation Corps"
 TU_VIC_dec_shard_corps_desc:0 "Send §Y20§! command power and §Y1000§! infantry equipment to the Corps inside Londinium. Shard -8%, +48 days."
 TU_VIC_dec_shard_rhodes:0 "Support the Rhodes Island Team"
 TU_VIC_dec_shard_rhodes_desc:0 "Back the Rhodes Island infiltrators. §Y10§! command power. Shard -16%."
 TU_VIC_dec_shard_sabotage:0 "Sabotage the Shard"
 TU_VIC_dec_shard_sabotage_desc:0 "Strike the Shard's power plants. §Y40§! command power, stability -2%. Shard -24%. (Shard 40%+)"
 TU_VIC_dec_muster_wellington:0 "Raise Wellington's Land Battleship Division"
 TU_VIC_dec_muster_wellington_desc:0 "Raise one land battleship division of Duke Wellington at the capital. (Wellington loyalty §Y40§!+)"
 TU_VIC_dec_muster_windermere:0 "Raise Windermere's Breakthrough Corps"
 TU_VIC_dec_muster_windermere_desc:0 "Raise one breakthrough corps of Duke Windermere at the capital. (Windermere loyalty §Y40§!+)"
 TU_VIC_shard_aftermath:0 "Calamity of the Shard"
 TU_VIC_shard_aftermath_desc:0 "The Shard has awakened. Infrastructure on the eastern front is collapsing and the army is in disarray. Organisation -50%, stability -15%, war support -10%."
 TU_VIC_dukes_unrest:0 "Ducal Discontent"
 TU_VIC_dukes_unrest_desc:0 "Factories on the estates of disloyal dukes stand idle."
 tu_vic_shard.1.t:0 "The Shard Fires"
 tu_vic_shard.1.d:0 "The sky over Londinium has turned red. The Kazdel Military Commission has woken the Shard, and the infrastructure of the eastern front is failing one stretch after another. The army's organisation has halved. Now Kazdel offers its hand to 'protect' Victorian industry."
 tu_vic_shard.1.a:0 "...Too late."
 TU_VIC_dec_support_caster:0 "Back Duke Caster"
 TU_VIC_dec_support_caster_desc:0 "Duke Caster: loyalty +12, influence +8. His rival, Duke Wellington: loyalty -8, influence -5."
 TU_VIC_dec_appease_caster:0 "Appease Duke Caster"
 TU_VIC_dec_appease_caster_desc:0 "Duke Caster loyalty +6. Shown only while his loyalty is below 55."
 tu_vic_dukes.1.t:0 "Duke Caster Is Unhappy"
 tu_vic_dukes.1.d:0 "Duke Caster has stopped attending the council and shut the gates of his estate. The factories there are going quiet. (Estate share 29%, factory output -14%)"
 tu_vic_dukes.1.a:0 "Send gifts to calm him."
 tu_vic_dukes.1.b:0 "Hold firm."
