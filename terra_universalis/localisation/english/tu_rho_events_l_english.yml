l_english:
 tu_rho_ev.1.t:0 "Ark Mission Launched"
 tu_rho_ev.1.d:0 "The Ark convoy has set out deep into the infected zone. Amiya wants the survivors rescued first, while the Doctor insists the Ark must secure resources to endure. The command must decide whose voice carries more weight."
 tu_rho_ev.1.a:0 "Follow Amiya: rescue comes first"
 tu_rho_ev.1.b:0 "Follow the Doctor: secure resources first"
 tu_rho_ev.1.c:0 "Propose a compromise that satisfies both"
 tu_rho_ev.2.t:0 "The Terra Charter"
 tu_rho_ev.2.d:0 "Ark delegates and envoys from nearby cities gathered over the draft of the Terra Charter. It guarantees the rights of the infected and the uninfected alike, but who holds final signing authority is still disputed."
 tu_rho_ev.2.a:0 "Sign the Charter at once"
 tu_rho_ev.2.b:0 "Revise the clauses, then sign"
 tu_rho_ev.2.c:0 "Delay signing and keep an independent course"
 tu_rho_ev.3.t:0 "Declaration of the Contractors"
 tu_rho_ev.3.d:0 "Rhodes Island has resolved to fund its survival as a contractor force. Amiya insists every contract must make clear whose side it serves. The Doctor replies that survival means taking any client who pays."
 tu_rho_ev.3.a:0 "Open contracts to every continent"
 tu_rho_ev.3.b:0 "Accept only trustworthy clients"
 tu_rho_ev.3.c:0 "Hold the contractor policy for now"
 tu_rho_ev.4.t:0 "The Demon King Returns"
 tu_rho_ev.4.d:0 "A power that had slept for ages has stirred. Reports speak of a being from Babel's memory returning, and the Ark is split on whether it is salvation or ruin. Amiya warns that no one should trust that power lightly."
 tu_rho_ev.4.a:0 "Harness the returning power to grow"
 tu_rho_ev.4.b:0 "Seal the return and guard the Ark"
 tu_rho_ev.4.c:0 "Gather intelligence and keep watching"
 tu_rho_ev.5.t:0 "The Doctor's War"
 tu_rho_ev.5.d:0 "The Doctor has declared total war. The stated cause is protecting contract clients, but many infected have been dragged onto the front lines. Amiya warns that this choice will shatter the Ark's trust."
 tu_rho_ev.5.a:0 "Approve the total war"
 tu_rho_ev.5.b:0 "Limit the war and put lives first"
 tu_rho_ev.5.c:0 "Draw up a plan to expand the front"
 tu_rho_ev.6.t:0 "The Ethics of Enhancement"
 tu_rho_ev.6.d:0 "The enhancement trials have reached ethics review. The research team reports success, but reviewers say consent and side-effect records are incomplete. Amiya demands the work stop, while the Doctor calls it the only means of saving the infected."
 tu_rho_ev.6.a:0 "Tighten ethics review and continue the research"
 tu_rho_ev.6.b:0 "Halt the enhancement research immediately"
 tu_rho_ev.6.c:0 "Expand the trials for results"
 tu_rho_ev.7.t:0 "A Cure for the World"
 tu_rho_ev.7.d:0 "The Oripathy cure has entered mass production, and opinions divide over how to handle its patent. Releasing it freely would save countless infected, but the Ark's finances would be badly shaken."
 tu_rho_ev.7.a:0 "Release the cure free of charge"
 tu_rho_ev.7.b:0 "Keep the patent and secure revenue"
 tu_rho_ev.7.c:0 "Stage the release in phases"
 tu_rho_ev.8.t:0 "Legends of the Elite Operators"
 tu_rho_ev.8.d:0 "The names of the elite operators are spreading across the Ark. Their feats give people hope, yet rumors say the legends are wearing down. Kal'tsit asks that they be given rest."
 tu_rho_ev.8.a:0 "Use the legends in propaganda"
 tu_rho_ev.8.b:0 "Guarantee rest and rotation for the elite"
 tu_rho_ev.8.c:0 "Commit more elite operators to the front"
 tu_rho_ev.9.t:0 "The Landship's Leap"
 tu_rho_ev.9.d:0 "The Landship has completed its final leap trial. The giant vessel can now cross deserts and wastelands. Engineers celebrate, but fuel supply and route planning remain unsolved."
 tu_rho_ev.9.a:0 "Open expedition routes at once"
 tu_rho_ev.9.b:0 "Repair the fleet and set up crew rotation"
 tu_rho_ev.9.c:0 "Sell the leap technology abroad"
 tu_rho_ev.10.t:0 "Industry Back in Operation"
 tu_rho_ev.10.d:0 "The factories of the RIIC industrial plants are running again. Weapon lines and civilian plants operate together, and jobs are returning to the Ark. Yet who will take the profits remains undecided."
 tu_rho_ev.10.a:0 "Prioritize weapons production"
 tu_rho_ev.10.b:0 "Prioritize civilian production"
 tu_rho_ev.10.c:0 "Send the factory profits to the Ark fund"
 tu_rho_ev.11.t:0 "The Eternal Route of the Ark"
 tu_rho_ev.11.d:0 "The Ark has finally secured an eternal route. Ships carrying refugees are once again reaching ports across the world. The name Rhodes Island is now spoken as a symbol of relief."
 tu_rho_ev.11.a:0 "Read the report"
 tu_rho_ev.12.t:0 "The Accord of Contracts Complete"
 tu_rho_ev.12.d:0 "Rhodes Island has signed the final accord of the contractor league. The mercenary market now moves across borders. Governments worldwide are wrestling with how to deal with this vast private military force."
 tu_rho_ev.12.a:0 "Read the report"
 tu_rho_ev.13.t:0 "Return to Kazdel"
 tu_rho_ev.13.d:0 "The shadow of the Demon King has risen again over the wastes of Kazdel. The Rhodes Island banner now flies above the desert, and neighboring nations watch its every move with unease."
 tu_rho_ev.13.a:0 "Read the report"
 tu_rho_ev.14.t:0 "Night Clinic at the Ark"
 tu_rho_ev.14.d:0 "The clinic lights stay on late into the night. Infected and residents queue for care, but medicine is running low. A decision must be made on whether to extend or cut clinic hours."
 tu_rho_ev.14.a:0 "Extend clinic hours"
 tu_rho_ev.14.b:0 "Ration the medicine and cut hours"
 tu_rho_ev.15.t:0 "Infected Desertion"
 tu_rho_ev.15.d:0 "Some infected have slipped past the Ark's control lines and scattered into the cities. Residents are growing uneasy. The command must decide whether to send pursuit teams or to negotiate."
 tu_rho_ev.15.a:0 "Send pursuit teams"
 tu_rho_ev.15.b:0 "Negotiate and protect them first"
 tu_rho_ev.16.t:0 "The Doctor's Memo"
 tu_rho_ev.16.d:0 "A memo left by the Doctor has reached the command room. It lists contract clients and negotiation terms in dense detail. Amiya demands that the document be made public."
 tu_rho_ev.16.a:0 "Publish the memo for transparency"
 tu_rho_ev.16.b:0 "Keep it secret and use it in negotiations"
 tu_rho_ev.17.t:0 "Kal'tsit's Interim Report"
 tu_rho_ev.17.d:0 "Kal'tsit has submitted an interim report on Oripathy research. Several candidate treatments have passed the early stages, but side-effect data remains thin. The command must decide how far to push the research."
 tu_rho_ev.17.a:0 "Increase the research budget"
 tu_rho_ev.17.b:0 "Keep the pace and gather more data"
 tu_rho_ev.18.t:0 "Donation to the Relief Office"
 tu_rho_ev.18.d:0 "An anonymous donor has sent a large sum to the relief office. Rumor says the gift comes with strings attached. The office must decide whether to accept it."
 tu_rho_ev.18.a:0 "Accept it and spend it on relief"
 tu_rho_ev.18.b:0 "Review the terms and decline"
 tu_rho_ev.19.t:0 "Plans for the Expanded Front"
 tu_rho_ev.19.d:0 "Front command has sent up a plan to expand operations. New strongholds would improve supply, but the defensive line grows longer. Amiya demands that the Ark's internal trust be protected before the front."
 tu_rho_ev.19.a:0 "Approve the plan and advance"
 tu_rho_ev.19.b:0 "Hold the plan and focus on defense"
 tu_rho_ev.20.t:0 "First Reports From the Expanded Front"
 tu_rho_ev.20.d:0 "The first reports from the expanded front have arrived. Some strongholds fell easily, but commanders disagree over the infected prisoners taken. The outcome will shape the Ark's next steps."
 tu_rho_ev.20.a:0 "Treat the prisoners within the Ark"
 tu_rho_ev.20.b:0 "Put the prisoners to work at the front"
