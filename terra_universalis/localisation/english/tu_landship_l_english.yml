l_english:
 TU_landship_category:0 "Landships and Mobile Cities"
 TU_landship_category_desc:0 "With the seas lost, Terra's fleets sail over land. Commission landships, move the mobile city, switch between cruising and anchoring."
 TU_landship_commission:0 "Commission a Landship"
 TU_landship_commission_desc:0 "Launch one landship squadron in the capital (light, heavy or city-class by tech). Cap: Landship Design 2, Heavy Landships 4, City-Class 6."
 TU_landship_relocate:0 "Relocate the Mobile City"
 TU_landship_relocate_desc:0 "Move the capital to this state. Infrastructure +1. §RCity in Transit§! for 90 days (less production and construction)."
 TU_city_mode_cruise:0 "City Cruising"
 TU_city_mode_cruise_desc:0 "The mobile city rolls on: army speed +5%, supply use -10%, construction -15%."
 TU_city_mode_anchor:0 "City Anchored"
 TU_city_mode_anchor_desc:0 "The mobile city drops anchor: construction +10%, factory output +5%, army speed -5%."
 TU_city_in_transit:0 "City in Transit"
 TU_city_in_transit_desc:0 "The whole city is moving to its new site."
 TU_city_cruising:0 "Cruising City"
 TU_city_cruising_desc:0 "The mobile city crosses the wastes."
 TU_city_anchored:0 "Anchored City"
 TU_city_anchored_desc:0 "The mobile city has dropped anchor and runs its factories."
