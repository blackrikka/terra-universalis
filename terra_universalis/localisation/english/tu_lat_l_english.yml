 tu_lat_ev.1.t:0 "Morning in the Holy City"
 tu_lat_ev.1.d:0 "Bells and gunshots ring together. In Laterano a gun is like a prayer. Pilgrims line up at the gates again today."
 tu_lat_ev.1.a:0 "May the light be with you."
 tu_lat_ev.20.t:0 "A Name in the Registry"
 tu_lat_ev.20.d:0 "A notary sorting the registry of the Fallen finds a famous name. That Sankta now works as a mercenary abroad."
 tu_lat_ev.20.a:0 "Send a summons."
 tu_lat_ev.20.b:0 "Watch quietly."
 tu_lat_ev.21.t:0 "End of the Pursuit"
 tu_lat_ev.21.d:0 "The Notarial Hall has caught several Fallen and brought them back. Citizens are divided."
 tu_lat_ev.21.a:0 "Law is law."
 tu_lat_ev.21.b:0 "Show mercy."
 tu_lat_ev.22.t:0 "Those Who Returned"
 tu_lat_ev.22.d:0 "Hearing of the pardon, Sankta who lost their halos return one by one."
 tu_lat_ev.22.a:0 "Welcome home."
 tu_lat_ev.23.t:0 "Pilgrim Rush"
 tu_lat_ev.23.d:0 "More pilgrims than the city can handle have arrived this year."
 tu_lat_ev.23.a:0 "Take them all in."
 tu_lat_ev.23.b:0 "Limit entry."
 tu_lat_ev.24.t:0 "The Silence of Iberia"
 tu_lat_ev.24.d:0 "Iberia's Inquisition revisits its old split from the Laterano church. A chance for reconciliation, or the start of conflict?"
 tu_lat_ev.24.a:0 "Send an envoy of reconciliation."
 tu_lat_ev.24.b:0 "Stand on doctrine."
 tu_lat_ev.25.t:0 "The Blessing Debate"
 tu_lat_ev.25.d:0 "Young priests ask whether blessing guns is right."
 tu_lat_ev.25.a:0 "Guns are tools of protection."
 tu_lat_ev.25.b:0 "Allow the debate."
 tu_lat_ev.26.t:0 "Refugees at the Gate"
 tu_lat_ev.26.d:0 "Refugees fleeing war gather at the gate. Most of them are not Sankta."
 tu_lat_ev.26.a:0 "Let them in."
 tu_lat_ev.26.b:0 "Turn them away."
 tu_lat_ev.28.t:0 "Papal Theocracy"
 tu_lat_ev.28.d:0 "The Pope's word has become law."
 tu_lat_ev.28.a:0 "One under the light."
 tu_lat_ev.29.t:0 "Notarial Republic"
 tu_lat_ev.29.d:0 "Laterano is now ruled by its codex and its notaries."
 tu_lat_ev.29.a:0 "Contracts will be kept."
 tu_lat_ev.30.t:0 "The Open Holy City"
 tu_lat_ev.30.d:0 "The gates have opened to all. For the first time, non-Sankta citizens exist."
 tu_lat_ev.30.a:0 "Light for everyone."
