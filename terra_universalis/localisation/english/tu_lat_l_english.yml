 tu_lat_ev.31.t:0 "The Conclave"
 tu_lat_ev.31.d:0 "The cardinals have locked the doors and convened. The whole city watches the chimney smoke."
 tu_lat_ev.31.a:0 "White smoke rises."
 tu_lat_ev.32.t:0 "Firearm Accident in the City"
 tu_lat_ev.32.d:0 "A celebratory shot went astray during a festival and injured bystanders."
 tu_lat_ev.32.a:0 "Tighten firearm rules."
 tu_lat_ev.32.b:0 "The festival goes on."
 tu_lat_ev.33.t:0 "A Foreign Pilgrim Delegation"
 tu_lat_ev.33.d:0 "Dignitaries from a distant land have come on pilgrimage, hoping to grow closer to Laterano."
 tu_lat_ev.33.a:0 "Welcome them."
 tu_lat_ev.34.t:0 "Miracle of the Halo"
 tu_lat_ev.34.d:0 "Rumour says the light has returned above the head of a Sankta who had lost their halo."
 tu_lat_ev.34.a:0 "A miracle!"
